title = "Harden the findings API↔SPA contract (census gap F3)"
updated_at = "2026-06-08 13:51:36"

[children.attributes]
execution_strategy = "Default the three fields at the read/serialization boundary (kind→'review' or a sentinel, severity→a default, status→'open') so existing rows and API-created findings always satisfy the SPA contract; add a regression test asserting a minimally-specified finding round-trips through the SPA-shaped read; note the contract in the SPA api layer."
problem_statement = """The census found that POST /work-items/{id}/findings permits null kind/severity/status, but the SPA's read-contract requires them as non-null strings/enums — so a finding created via the API (without those fields) breaks the SPA findings refresh ("Stale data — last refresh failed: findings.0.kind/severity/status invalid"). Guarantee these fields on the finding read path (default kind, severity, status) — or relax the SPA contract — so every API-created finding renders in the SPA."""

