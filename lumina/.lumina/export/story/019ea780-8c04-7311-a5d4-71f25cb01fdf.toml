[item]
created_at = "2026-06-08 13:51:20"
id = "019ea780-8c04-7311-a5d4-71f25cb01fdf"
kind = "story"
origin = "human"
parent_id = "019ea780-3a64-7f00-842e-35be3b466c67"
relevance = "backlog"
status = "open"
title = "Harden the findings API↔SPA contract (census gap F3)"
updated_at = "2026-06-08 13:51:36"

[item.attributes]
execution_strategy = "Default the three fields at the read/serialization boundary (kind→'review' or a sentinel, severity→a default, status→'open') so existing rows and API-created findings always satisfy the SPA contract; add a regression test asserting a minimally-specified finding round-trips through the SPA-shaped read; note the contract in the SPA api layer."
problem_statement = """The census found that POST /work-items/{id}/findings permits null kind/severity/status, but the SPA's read-contract requires them as non-null strings/enums — so a finding created via the API (without those fields) breaks the SPA findings refresh ("Stale data — last refresh failed: findings.0.kind/severity/status invalid"). Guarantee these fields on the finding read path (default kind, severity, status) — or relax the SPA contract — so every API-created finding renders in the SPA."""

[[research_notes]]
body = "The SPA contract break is a read-shape problem: callers may legitimately omit kind/severity/status on create. Guaranteeing them on the read/serialization side (a default-on-None projection) fixes every finding the SPA reads — including rows already in the DB — without tightening the write API or requiring a migration."
confidence = "medium"
created_at = "2026-06-08 13:56:00"
id = "019ea784-d428-7a43-9803-feaaced4e8cb"
lens = "design"
origin = "human"
rationale = "Read-boundary defaulting fixes existing rows and avoids a write-API/migration change; accepted as the approach."
seq = 1
state = "accepted"
summary = "Default at the finding read/serialization boundary (not the write path) so pre-existing rows are fixed too, and the API stays permissive on write."
work_item_id = "019ea780-8c04-7311-a5d4-71f25cb01fdf"
