# cargo-nextest configuration (scaffolded by /test-bootstrap, 2026-05-25).
# See https://nexte.st/docs/configuration/ for full schema.

[profile.default]
# Retries off for local runs — flaky tests should fail visibly.
retries = 0

[profile.ci]
# One automatic retry in CI to absorb transient infra flakes.
retries = 1
# Surface failure output immediately rather than buffering until the end.
failure-output = "immediate-final"
# Emit JUnit XML for CI dashboards / GitHub Actions test-summary action.
# Path is relative to `target/nextest/<profile>/`.

[profile.ci.junit]
path = "junit.xml"

# Fast inner-loop profile for agents / the `cargo check + lint + narrow test`
# flow. Excludes the two e2e binaries that spawn a REAL nested `claude` from
# PATH (very slow — see CLAUDE.md). Narrow further on the command line with
# `-E 'test(<area>)'`. The orchestrator's full verification keeps using
# `--profile ci`, which runs everything including these.
#   cargo nextest run --manifest-path lumina/Cargo.toml --profile quick
[profile.quick]
retries = 0
default-filter = "not (binary(pty_e2e) | binary(conpty_minimal_repro))"
