[package]
name = "lumina"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Ross Anderson"]
description = "Flow-tracking platform: SQLite-canonical store with MCP + axum + Vue, git-export audit trail"
license = "MIT OR Apache-2.0"

# Library target: lib.rs is the composition root's module graph; the e2e test
# (Task 10) imports the crate as a library. The binary is the thin entrypoint.
[lib]
name = "lumina"
path = "src/lib.rs"

[[bin]]
name = "lumina"
path = "src/main.rs"

[dependencies]
# --- web / runtime ---
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
tokio-util = "0.7" # CancellationToken for the export-loop shutdown seam (Task 6)

# --- persistence ---
# PINNED to 0.9, NOT the plan's 0.8: the installed sqlx-cli is 0.9.0 and the
# .sqlx offline-cache format must match between the CLI (`cargo sqlx prepare`)
# and the macro crate. Recorded deviation from plan Task 1 ("0.8.x"); the plan's
# own research note says "confirm latest at pin time". No TLS feature: sqlite is
# a local file, no transport security needed.
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }

# --- MCP server (rmcp, Streamable-HTTP transport) ---
rmcp = { version = "1.7", features = [
    "server",
    "transport-streamable-http-server",
    "macros",
] }
schemars = "1" # tool-parameter JSON schemas for rmcp #[tool] methods

# --- CLI (Task 7: the `import-flow` subcommand; bare invocation still serves) ---
clap = { version = "4", features = ["derive"] }

# --- serialization / domain support ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
jiff = "0.2"
tempfile = "3"
uuid = { version = "1", features = ["v7", "serde"] }

# --- SPA embedding (release builds bake web/dist into the binary) ---
rust-embed = "8"
# axum-embed is the tower adapter for serving a RustEmbed bundle through axum.
# Pinned at scaffold; if a future axum bump breaks it, Task 4 may hand-roll a
# handler over rust-embed directly (the assets.rs seam isolates this choice).
axum-embed = "0.1"

[dev-dependencies]
# Task 10 e2e drives the running server over HTTP.
reqwest = { version = "0.13", features = ["json"] }
# `ServiceExt::oneshot` drives the router in-process (no socket bind) for the
# health smoke test and downstream handler tests.
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Compile-time sqlx macros are expensive; bump their opt-level for faster
# incremental builds (mirrors the sqlx project's own recommendation).
[profile.dev.package.sqlx-macros]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
