<!doctype html>
<html><head><meta charset="utf-8"><title>stacked-rows</title><style>
:root { --ink:#1a1a1a; --muted:#6f6a63; --line:#d9d5cf; --chip:#e7e4e0; --page:#ffffff; }
* { box-sizing: border-box; }
body { margin: 24px; background: var(--page); color: var(--ink); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
.panel { width: 100%; max-width: 480px; border: 1px solid var(--line); border-radius: 5px; background: #fff; }
.head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.head h2 { margin: 0; font-size: 14px; font-weight: 600; }
.count { color: var(--muted); }
.add { margin-left: auto; font: inherit; font-size: 13px; padding: 2px 10px; border: 1px solid var(--ink); border-radius: 3px; background: #fff; color: var(--ink); }
.row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.fold { flex: none; width: 12px; color: var(--muted); font-size: 12px; }
.label { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sw { flex: none; display: flex; gap: 3px; }
.sw i { display: block; width: 18px; height: 18px; border-radius: 3px; }
.notice { padding: 8px 12px; border-top: 1px solid var(--line); background: var(--chip); color: var(--ink); font-size: 13px; }
</style></head>
<body>
<section class="panel">
  <div class="head"><h2>Series</h2><span class="count">4</span><button class="add">Add</button></div>
  <div class="row"><span class="fold">&#9656;</span><span class="label">Primary</span><span class="sw"><i style="background:#7e92be"></i><i style="background:#6a80b0"></i><i style="background:#5a6f9e"></i><i style="background:#4a5d88"></i><i style="background:#3a4b72"></i></span></div>
  <div class="row"><span class="fold">&#9656;</span><span class="label">Alternate</span><span class="sw"><i style="background:#739f7c"></i><i style="background:#62906c"></i><i style="background:#537f5d"></i><i style="background:#446d4e"></i><i style="background:#365a3f"></i></span></div>
  <div class="row"><span class="fold">&#9656;</span><span class="label">Accent warm</span><span class="sw"><i style="background:#e5715a"></i><i style="background:#d5604a"></i><i style="background:#c0513c"></i><i style="background:#a8432f"></i><i style="background:#8d3624"></i></span></div>
  <div class="row"><span class="fold">&#9656;</span><span class="label">Neutral</span><span class="sw"><i style="background:#e7e4e0"></i><i style="background:#c9c4bd"></i><i style="background:#a29c94"></i><i style="background:#6f6a63"></i><i style="background:#3d3a36"></i></span></div>
  <div class="notice">Accent warm step 1 is below 3:1 on white.</div>
</section>
</body></html>
