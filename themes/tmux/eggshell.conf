# eggshell theme for tmux. `scripts/themes.sh deploy tmux` links this
# directory to ~/.config/tmux/eggshell; load it from tmux.conf:
#   source-file ~/.config/tmux/eggshell/eggshell.conf
# Colours come from themes/palette.toml. The dark palette loads first; tmux
# reports each client's background (`theme detect`), and the hooks below
# switch every style to the matching palette. With clients on different
# backgrounds the last one to switch wins, since options are global.

set -gF @eggshell_dir "#{d:current_file}"

# tmux's own named theme colours, for anything that still uses them (its
# defaults and plugins): the eggshell neutrals and accent tier.
set -g dark-theme-black "#0a0a0a"
set -g dark-theme-dark-grey "#232323"
set -g dark-theme-light-grey "#9e9e9e"
set -g dark-theme-white "#f2f2f2"
set -g dark-theme-red "#e5715a"
set -g dark-theme-yellow "#f9cb92"
set -g dark-theme-green "#72bf89"
set -g dark-theme-cyan "#c4d5ff"
set -g dark-theme-blue "#5884f8"
set -g dark-theme-magenta "#c8c8c8"
set -g light-theme-black "#171717"
set -g light-theme-dark-grey "#6b6865"
set -g light-theme-light-grey "#bab7b3"
set -g light-theme-white "#f7f5f1"
set -g light-theme-red "#8d2816"
set -g light-theme-yellow "#9c721c"
set -g light-theme-green "#0d542b"
set -g light-theme-cyan "#092382"
set -g light-theme-blue "#1a3bb3"
set -g light-theme-magenta "#4f4d49"

source-file -F "#{@eggshell_dir}/dark.conf"
source-file -F "#{@eggshell_dir}/styles.conf"

set-hook -g client-dark-theme 'source-file -F "#{@eggshell_dir}/dark.conf" ; source-file -F "#{@eggshell_dir}/styles.conf"'
set-hook -g client-light-theme 'source-file -F "#{@eggshell_dir}/light.conf" ; source-file -F "#{@eggshell_dir}/styles.conf"'
