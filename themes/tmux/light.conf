# eggshell light palette for tmux, the warm eggshell-white variant. Sourced
# whenever a client reports a light background.
set -g @eggshell_base "#f1efed"
set -g @eggshell_raised "#f7f5f1"
set -g @eggshell_cursorline "#e7e4e0"
set -g @eggshell_active "#e7e4e0"
set -g @eggshell_hairline "#dad7d3"
set -g @eggshell_edge "#cdcac6"
set -g @eggshell_faint "#a19e9a"
set -g @eggshell_dim "#6b6865"
set -g @eggshell_secondary "#4f4d49"
set -g @eggshell_soft "#302d2b"
set -g @eggshell_primary "#171717"
set -g @eggshell_selection "#c4d5ff"
set -g @eggshell_match "#dee8fd"
set -g @eggshell_focus "#092382"
set -g @eggshell_chip "#092382"
set -g @eggshell_chip_text "#ffffff"
set -g @eggshell_orange "#a66119"
set -g @eggshell_yellow "#9c721c"
