# eggshell dark palette for tmux; styles.conf reads these. Sourced by
# eggshell.conf and again whenever a client reports a dark background.
set -g @eggshell_base "#0a0a0a"
set -g @eggshell_raised "#141414"
set -g @eggshell_cursorline "#141414"
set -g @eggshell_active "#232323"
set -g @eggshell_hairline "#1c1c1c"
set -g @eggshell_edge "#2e2e2e"
set -g @eggshell_faint "#5e5e5e"
set -g @eggshell_dim "#7a7a7a"
set -g @eggshell_secondary "#9e9e9e"
set -g @eggshell_soft "#c8c8c8"
set -g @eggshell_primary "#f2f2f2"
set -g @eggshell_selection "#12276e"
set -g @eggshell_match "#0a1836"
set -g @eggshell_focus "#c4d5ff"
set -g @eggshell_chip "#c4d5ff"
set -g @eggshell_chip_text "#092382"
set -g @eggshell_orange "#fea450"
set -g @eggshell_yellow "#f9cb92"
set -g @eggshell_yellow_tint "#2a1c0b"
set -g @eggshell_bell "#e5715a"
