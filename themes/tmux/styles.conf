# eggshell styles for tmux. Style options are set with -F so they take the
# current palette's values; formats read the palette when they are drawn.
# Sourced after dark.conf or light.conf.

# The bar sits on the terminal's own background: no band, just text, the
# way the island is a clock and nothing else at rest.
set -gF status-style "bg=default,fg=#{@eggshell_secondary}"
set -g status-left-length 32
set -g status-right-length 48

# The session name is a chip while the prefix is held, and grey otherwise.
set -g status-left "#{?client_prefix,#[bg=#{@eggshell_chip} fg=#{@eggshell_chip_text}],#[fg=#{@eggshell_dim}]} #S #[default] "
set -g status-right "#{?pane_in_mode,#[fg=#{@eggshell_dim}]#{pane_mode} ,}#{?window_zoomed_flag,#[fg=#{@eggshell_dim}]zoom ,}#[fg=#{@eggshell_secondary}]%H:%M "

# The current window is a raised plate with primary text; the rest recede.
set -g window-status-separator ""
set -g window-status-format " #[fg=#{@eggshell_faint}]#I #[fg=#{@eggshell_secondary}]#W "
set -g window-status-current-format "#[bg=#{@eggshell_raised}] #[fg=#{@eggshell_dim}]#I #[fg=#{@eggshell_primary}]#W "
set -g window-status-style "default"
set -g window-status-current-style "default"
set -g window-status-last-style "default"
set -gF window-status-activity-style "fg=#{@eggshell_orange}"
set -gF window-status-bell-style "fg=#{@eggshell_bell}"

# Panes are divided by a visible edge; the active one takes the focus blue,
# yellow while it is in a mode, orange while its input goes to every pane.
set -g pane-border-lines single
set -g pane-border-indicators colour
set -gF pane-border-style "fg=#{@eggshell_edge}"
set -g pane-active-border-style "fg=#{?synchronize-panes,#{@eggshell_orange},#{?pane_in_mode,#{@eggshell_yellow},#{@eggshell_focus}}}"
set -gF pane-scrollbars-style "bg=#{@eggshell_hairline},fg=#{@eggshell_faint},width=1,pad=0"

set -gF message-style "bg=#{@eggshell_raised},fg=#{@eggshell_primary}"
set -gF message-command-style "bg=#{@eggshell_raised},fg=#{@eggshell_focus}"

# Selection is the deep blue; the match under the cursor is a chip and the
# other matches sit on the deepest blue.
set -gF mode-style "noattr,bg=#{@eggshell_selection},fg=default"
set -gF copy-mode-selection-style "noattr,bg=#{@eggshell_selection},fg=default"
set -gF copy-mode-match-style "bg=#{@eggshell_match},fg=#{@eggshell_focus}"
set -gF copy-mode-current-match-style "bg=#{@eggshell_chip},fg=#{@eggshell_chip_text}"
set -gF copy-mode-mark-style "bg=#{@eggshell_yellow_tint},fg=#{@eggshell_yellow}"
set -gF copy-mode-position-style "bg=#{@eggshell_raised},fg=#{@eggshell_secondary}"
set -gF copy-mode-line-number-style "fg=#{@eggshell_faint}"
set -gF copy-mode-current-line-number-style "fg=#{@eggshell_primary}"
set -gF copy-mode-current-line-style "bg=#{@eggshell_cursorline}"

# Menus and choosers: grey marks where you are, as in every eggshell list.
set -g menu-border-lines rounded
set -gF menu-style "bg=#{@eggshell_raised},fg=#{@eggshell_soft}"
set -gF menu-selected-style "bg=#{@eggshell_active},fg=#{@eggshell_primary}"
set -gF menu-border-style "bg=#{@eggshell_raised},fg=#{@eggshell_edge}"
set -gF tree-mode-selection-style "bg=#{@eggshell_active},fg=#{@eggshell_primary}"
set -gF tree-mode-border-style "bg=default,fg=#{@eggshell_edge}"
set -g tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},#{@eggshell_focus},#{@eggshell_edge}}"
set -gF switch-mode-match-style "bg=#{@eggshell_chip},fg=#{@eggshell_chip_text}"

set -gF display-panes-colour "#{@eggshell_faint}"
set -gF display-panes-active-colour "#{@eggshell_focus}"
set -gF display-panes-border-style "bg=#{@eggshell_raised},fg=#{@eggshell_edge}"
set -gF clock-mode-colour "#{@eggshell_primary}"
set -g fill-character "#{?is_inside,#[bg=#{@eggshell_raised}] ,#[fg=#{@eggshell_hairline}]·}"
