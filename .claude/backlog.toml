context = """OBSERVED 2026-09-03: an agent ran `tomlctl backlog list --open 2>&1 | python -c "...json.load..."` to print id/kind/area/tags/summary as a pipe-delimited table, guessing at the envelope key with d.get('items') or d.get('rows') or d.get('backlog'), then `head -60`. MEASURED ROOT CAUSE, and it is not a missing feature: `--select id,kind,area,tags,summary --ndjson` already emits exactly one compact projected object per line, which is what that python reconstructed by hand. On the 9 open rows it is 1963 bytes against 12731 for the unprojected list. The composition is real but UNDOCUMENTED - query.md's Output shapes section describes --ndjson as "one FULL item per line" and never shows it with --select, so a reader concludes ndjson means fat rows and --select means a JSON array, and that neither yields compact projected lines. That sentence is the defect. THREE FAULTS IN THE OBSERVED IDIOM: 2>&1 merges tomlctl's stderr into the stream the JSON parser reads, so one warning becomes a Python traceback instead of tomlctl's actual error - query.md:26 warns against swallowing stderr with 2>/dev/null but not against merging it into stdout, which is the more destructive variant; `head -60` truncates after tomlctl has already serialised everything, where --limit filters inside; and the envelope key-guessing is unnecessary since backlog list returns a bare array. RESEARCH, prior art: the mature pattern is two layers - a projection flag plus a formatting expression. gh has --json <fields> with --jq and --template; kubectl has -o custom-columns= and -o jsonpath=; docker and aws use --format / --output text|table|json. tomlctl already has the projection layer (--select/--exclude/--pluck) and deliberately lacks the second - query.md:26 states outright that there is no --format/--output flag. RECOMMENDATION, and the argument for it: DO NOT build the formatting layer. Those tools serve humans and shell scripts; tomlctl's consumer is an LLM agent, and for that consumer NDJSON already dominates a rendered table on every axis - it is self-describing where custom-columns discards field names, and it is immune to the delimiter-in-content problem that a --tsv or a pipe-delimited table walks straight into. That hazard is not theoretical here: B-69492ebe in this same store is doc-diff-gate truncating content on an embedded tab, and the observed python would have silently mangled any summary containing a pipe. A template mini-language is also one more thing an agent can get wrong. PROPOSED FIX, zero code: (1) rewrite the --ndjson bullet in query.md's Output shapes section to state that it composes with --select and --exclude, with the worked example `tomlctl items list ledger.toml --status open --select id,severity,summary --ndjson`; (2) add an anti-pattern block naming the three faults above, especially never piping 2>&1 into a JSON parser; (3) record in query.md:26 WHY there is no --format, so the decision stops being re-litigated by each agent that wants a table. If a formatting layer is ever wanted anyway, take gh's split - keep --select as projection and add a template for rendering - rather than a fixed --tsv/--csv, and require RFC-4180 quoting if a delimited form ships at all. VERIFY BEFORE ADOPTING: the --select + --ndjson composition was confirmed by running it against the live store on 2026-09-03; re-confirm after any query-pipeline change, since no test appears to pin the combination."""
