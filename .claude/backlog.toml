dedup_id = "4e370bb035c7e4fa"
origin = "review-apply"
flow = "whimsical-hugging-puppy"
context = "The blocked bucket names only direct predecessors. A row two hops behind a stall is skipped by first_stall because its own predecessor is pending, then fails the reachable test because that predecessor is not in the wave - so it appears in none of ready, held, next or blocked. The stall root is always reported, so the empty-frontier rule holds and implement.md's consumer rule is safe; what breaks is reconciling bucket counts against the pending row count. Do not add a count-based assertion until this is closed."
evidence = ["tomlctl/src/tasks/graph.rs:286"]
related = ["B-4aa2bbbf"]
resolved = 2026-09-08
resolution = "Fixed: the frontier's blocked bucket is now transitive - a pending row behind a stall lands in blocked naming the nearest actionable row, reached by climbing through intervening pending rows, with a cycle guard on the walk. Note the literal every-pending-row-in-exactly-one-bucket partition is NOT established and was found unsatisfiable: next is one wave deep by design, so healthy rows further out are enumerated by no bucket. Making the partition total would push healthy rows into blocked and destroy its meaning."

