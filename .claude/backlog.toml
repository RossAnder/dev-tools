origin = "implement"
flow = "tomlctl-followups-round-2"
context = '''Raised 2026-09-03 after the tomlctl-followups-round-2 harvest: every multi-row write in that run went through a staged scratchpad .ndjson rather than a pipe, and the ask is to find the efficient native path. Source reading corrects the folklore in both directions. NOT THE CAUSE: MAX_STDIN_BYTES is 32 MiB (io.rs:179), so payload size is not the constraint for any realistic batch; the earlier working assumption of a ~10 KB stdin ceiling is wrong. REAL CONSTRAINT 1, one sentinel per invocation: claim_stdin (io.rs:211) swaps a process-global flag, so exactly one of --json / --ops / --ndjson / --defaults-json may be `-` per call. A batch that wants both its rows and its shared defaults on stdin cannot have them, and the second flag must be inlined as a literal argument. That was hit directly in this run - --ndjson came from a file while --defaults-json was passed literally. REAL CONSTRAINT 2, silent truncation: both stdin readers use .take(MAX_STDIN_BYTES) (io.rs:240, :277, :318), which truncates rather than erroring. For NDJSON a cut landing on a line boundary is a silent partial add; only a cut mid-line surfaces, as a parse abort. Latent at 32 MiB but it is the failure mode that would bite a genuinely large batch. REAL CONSTRAINT 3, and the actual reason for the temp files: it is the shell, not tomlctl. Multi-line heredocs are unreliable on Windows Git Bash, and in this session the harness permission layer refused three separate multi-line-heredoc commands outright, so the heredoc idiom the tomlctl skill documents as the blessed path is not always available to an agent at all. UNTESTED CANDIDATE worth trying first in the deep dive: printf '%s\n' '<row1>' '<row2>' ... | tomlctl items add-many <file> --ndjson - is a single-line command with no heredoc and no temp file, and should carry arbitrarily many rows. It could not be measured here because the permission layer also declined it; confirm it before adopting. DEEP DIVE SHOULD ANSWER: whether the printf form is the sanctioned agent-native idiom and belongs in the tomlctl skill; whether claim_stdin's one-sentinel rule can be relaxed (for example --defaults-json accepting an @file form, or a single framed payload carrying both defaults and rows); whether .take should become a hard error on overflow; and whether items apply --ops - deserves the same treatment so batch EDITS get one lock and one rename too, which is the half of the ask that has no answer at all today. Related: B-cef33ceb covers the backlog-side gap, where no add-many exists.'''
