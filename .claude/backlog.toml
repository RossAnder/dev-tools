context = "The implementer agents are told to surface tangential discoveries and never write them, and the Phase-3 harvest mints every out-of-scope discovery into the store. Neither offers the third option: proposing an additional task for the CURRENT run. That binary makes deferral the reflex even when the fix is cheap and the file is already open. Observed in the sibling reportdesignkit repo's config-rail-graduation flow, where one implement run minted 10 items including a hook duplicated across two files, an unpublished store-barrel export that forced a hand-composed call site, a twice-spelled label map, and a bug that had to be resolved separately afterwards. Wanted: an explicit judgement call at harvest time between minting a same-run task and minting a backlog item, with a stated test for which applies (cost to fix now, blast radius, whether the plan's verification already covers the touched file). The backlog-capture skill already says in scope means fix it; the gap is that nothing licenses the orchestrator to widen the run, so out-of-scope-but-trivial has only one exit."
evidence = [
    "claude/commands/implement.md:85",
    "claude/agents/implement-deep.md:74",
]
resolved = 2026-09-03
resolution = "Fixed by flow tomlctl-followups-round-2 tasks 10 and 11, commits ec7fcaf and 00d7e1c: the Phase-4 harvest now names three dispositions with a cost/blast-radius/verification-coverage test routing into the step-3c mint machinery, and the TANGENTIAL contract gained an optional cheap-in-file field byte-identically across both implementer carriers."

