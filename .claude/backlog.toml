context = 'Measured 2026-09-03 minting the 7-item harvest of flow tomlctl-followups-round-2. SHARPEST PART FIRST, and it is bug-shaped rather than merely ergonomic: item B-7ccba7cc printed {"ok":true,"action":"added"} on stdout and exited 0 while its row never reached disk. io.rs:1586 degrades a failed persist to a stderr warning, so the success envelope is emitted independently of whether the write landed. A second item lost its write too, exiting 1. Both were found only by grepping the store for each id afterwards; a single retry of each succeeded. Any caller that trusts the envelope silently drops rows on Windows. WHY THE LOOP EXISTS: backlog add takes exactly one --json payload and there is no backlog add-many, though items add-many --ndjson does exist. So N captures means N processes, each taking the exclusive lock and doing an atomic tempfile+rename of both the TOML and its .sha256 - 14 renames for 7 rows, which is what gives the transient AV/indexer rename lock so many chances to fire. WHY THE TEMP FILE: items add-many --ndjson accepts stdin, but multi-line heredocs are unreliable on Windows Git Bash above roughly 5 rows because CRLF mangles the terminator, so the practised path is staging a scratchpad .ndjson and passing it by path. That is why agents keep writing temp files for what should be one call. WORKAROUND TODAY: after any multi-item mint, grep the store for each expected id and retry the missing ones; do not trust the per-call envelope. WHAT A FIX LOOKS LIKE: give backlog its own add-many taking the same --ndjson source as items add-many so one lock and one rename covers the batch, and make a failed persist a non-zero exit with ok:false rather than a warning beside ok:true. A batch edit path for the same reason is worth considering alongside it.'
