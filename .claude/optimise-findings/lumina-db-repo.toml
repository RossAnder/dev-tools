resolution = "Added serde skip_serializing_if = Option::is_none to every Option field on Finding (27) and WorkItem; null fields are now omitted on the MCP rmcp Content::json and axum Json wires (smaller, less null-noisy payloads for agents and the SPA; TOML export unaffected since the toml serializer already omits None). Required a coordinated SPA migration: the Vue SPA Zod WorkItemSchema/FindingSchema used bare .nullable(), which Zod v4 requires present, so an omitted key would fail parse and break the parent_id === null root-detection (treeUtils/useHierarchy). Migrated the O6-affected fields to .nullable().default(null) (the idiom the shape field already used) so an absent key normalises back to null: parsed type stays T|null, so the TS interfaces and every === null consumer are unchanged. Added lumina/web/src/__tests__/o6-skip-serializing.test.ts asserting omitted-key tolerance for both schemas. Verified: cargo build + 293 Rust tests + clippy clean; SPA vue-tsc type-check + 255 bun tests (incl. 3 new). User-confirmed wire-contract change and authorised the SPA migration."

