symbol = "init"
severity = "warning"
effort = "small"
category = "concurrency"
summary = "Pool uses sqlx defaults (max_connections=10) for a single-writer SQLite store; size it deliberately or split a 1-conn write pool + N-conn read pool"
description = "Current: db.rs:57 calls SqlitePool::connect_with without SqlitePoolOptions, so max_connections defaults to 10. For SQLite every write serialises on the single RESERVED lock (BEGIN IMMEDIATE), so extra write connections just let up to 10 tasks each grab a connection then contend on the lock — 9 sit in the 5s busy_timeout busy-loop (each on its own sqlx worker thread) rather than queueing cheaply at pool.acquire(). The documented remedy is a dedicated write pool (max_connections=1, writers queue async in acquire()) + a read pool (max_connections≈num_cpus, scales under WAL). At minimum set max_connections explicitly. This bounds O1's try_join! feasibility (a concurrent 11-read fan-out needs >=11 connections). Risk: the read/write split is invasive to the single-handle AnyPool/DbClient seam; at current low concurrency the default 10 may never contend — treat as latent-scaling, verify with a write-contention benchmark (tests/concurrency.rs N=8 is the seed). Caught by A3/A5."
evidence = [
    "https://emschwartz.me/psa-your-sqlite-connection-pool-might-be-ruining-your-write-performance/",
    "https://github.com/launchbadge/sqlx/issues/616",
    "lumina/src/db.rs:57",
]
dedup_id = "65b2af4ea664d14b"
resolved = 2026-06-02
resolution = "Restructured db::init to build the pool via SqlitePoolOptions and set max_connections=16 (new MAX_CONNECTIONS const) on the on-disk branch only; in-memory keeps the sqlx default (SqlitePoolOptions::new() equals the prior SqlitePool::connect_with). Sizes the single pool to absorb O1's ~11-way detail read fan-out plus the export drain and SPA/MCP readers; writes still serialise on SQLite's RESERVED lock and surplus readers queue on acquire() with no SQLITE_BUSY. Chose the well-sized single pool over the read/write split (user decision) to avoid the split's correctness traps: separate-connection reads missing a tx's uncommitted rows, max=1 self-deadlock via the shared sqlite() accessor, and export-drain WAL-concurrency regression. Coexists with O2's synchronous=NORMAL. Build + 293 tests + clippy green."

