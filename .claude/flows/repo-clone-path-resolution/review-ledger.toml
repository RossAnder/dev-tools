symbol = "select_longest_prefix_project"
severity = "warning"
effort = "small"
category = "quality"
summary = "Filesystem-root local_path ('/' or 'C:/') can never match any cwd"
description = "Component-boundary test (repo_links.rs:627-630) is cwd==base OR cwd.strip_prefix(base) starts_with '/'. For base='/' and cwd='/foo', strip_prefix yields 'foo' (no leading slash) and they are not equal, so no match; same for base='C:/' vs 'C:/foo'. normalise_path_for_compare deliberately preserves these roots (is_root, l.548) and is_absolute_normalised accepts them (l.481-486), so such a row CAN be stored and cwd resolution then silently returns None. Verified by reading the matcher. Low likelihood (a root clone dir is unusual) but a real correctness hole in the resolver."
dedup_id = "3968000c56d61a36"
resolved = 2026-06-04
resolution = "select_longest_prefix_project boundary check now matches a filesystem-root base (tail.starts_with('/') OR base.ends_with('/')): root '/' matches '/foo' while deeper non-root bases still win by longest-prefix. Added select_longest_prefix_project_root_base_matches test."

