summary = "Settings load failure is silent: no catch, unhandled rejection, offer-to-clone disappears"
description = "The in-flight IIFE (useSettings.ts:49-58) has only try/finally, no catch. handle() throws on a non-2xx or zod-contract violation (api/http.ts). The sole caller is `void loadSettings()` in ReposPanel.onMounted (ReposPanel.vue:68), so a failed GET /api/settings rejects with no surfacing path: no error ref (unlike useRepoLinks which captures into a Result), no UI feedback, an unhandled promise rejection, and cloneRoot stays null so the offer-to-clone affordance silently never appears (indistinguishable from LUMINA_CLONE_ROOT being unset). Capture the error into a ref or console.warn so the failure is observable."
dedup_id = "0143ef2472ff4f2b"
resolved = 2026-06-04
resolution = "loadSettings IIFE gained a catch that console.warns and leaves loaded unset (retry preserved), resolving the promise so void loadSettings() callers no longer raise an unhandled rejection. (useSettings.ts)"

[[items]]
