category = "quality"
summary = "Offer-to-clone path join is naive: double slash on trailing-slash root, mixed separators on a Windows root"
description = "suggestionFor returns `${cloneRoot.value}/${name}` (ReposPanel.vue:57). clone_root is surfaced verbatim from var_os with no normalisation (settings.rs:27). A LUMINA_CLONE_ROOT ending in a slash yields '/dev//repo'; a backslash-separated Windows root yields a mixed-separator path. handleUseSuggestion (l.124-127) commits the un-normalised form, and the stored double-slash then silently fails cwd matching because normalise_path_for_compare does not collapse internal repeated separators (see R4). Trim/normalise cloneRoot before joining, or normalise clone_root server-side. Flagged independently by the Quality, Architecture, and Completeness lenses."
related = ["R4"]
dedup_id = "bbe881db71fa92b5"
resolved = 2026-06-04
resolution = "suggestionFor normalises cloneRoot for display (folds separators to '/' and strips a trailing slash), so a trailing-slash or Windows-backslash clone root yields a clean single-separator path. (ReposPanel.vue)"

