symbol = "resolve_repo_path"
severity = "suggestion"
effort = "small"
category = "quality"
summary = "'..' is dropped, not lexically cancelled: 'a/../b' resolves to base/a/b not base/b"
description = "The ParentDir arm drops the component unconditionally (repo_links.rs:585-588) rather than popping the previously-pushed Normal. So rel='a/../etc' yields base/a/etc and 'a/b/../../c' yields base/a/b/c, diverging from how a real path resolver canonicalises. This is SAFE (the clamp invariant at l.572 holds; no escape is possible) but the result is surprising and only reached if the literal nested dirs exist. Since the path is destined for a real filesystem location once a layer-2 consumer wires it (see R11), prefer pop-on-ParentDir clamped at the base so the result matches lexical-normalisation intuition."
dedup_id = "073a37f4e753fd52"
resolved = 2026-06-04
resolution = "resolve_repo_path ParentDir now lexically cancels the last pushed component, clamped at the base via a depth counter (a/../b to base/b; ../../etc to base). Security clamp invariant preserved (never pops into base). Updated clamp test + added cancellation tests. Plan deviation: T2b pinned ..-dropped, now ..-cancelled-clamped."

