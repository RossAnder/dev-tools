id = "R4"
file = "lumina/src/repo/repo_links.rs"
line = 518
symbol = "normalise_path_for_compare"
severity = "suggestion"
effort = "small"
category = "completeness"
summary = "Internal repeated separators not collapsed; degenerate '//' popped to '/'"
description = "normalise_path_for_compare folds backslash to forward slash and strips one trailing slash, but never collapses internal repeated separators (l.529-535). A stored '/dev//foo' (e.g. from the R2 double-slash suggestion or a sloppy operator entry) and a cwd '/dev/foo/x' normalise to distinct strings, so select_longest_prefix_project silently fails to bind. Separately, a degenerate '//' is not a root (is_root knows only '/' and 'X:/', l.548-554) so the trailing-slash strip pops it to '/', conflating a UNC anchor with the unix root. The plan's pinned algorithm (T2b) does not mention '//' collapse, so this is a spec omission. Collapse repeated separators in the normalise step."
related = ["R2"]
dedup_id = "ace10b8a30553943"
resolved = 2026-06-04
resolution = "normalise now collapses runs of '/' to one (after separator fold, before trailing-slash strip), preserving a leading '//' for UNC: /dev//foo to /dev/foo, //server//share to //server/share. Added collapse tests."

