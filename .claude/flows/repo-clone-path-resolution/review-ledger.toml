severity = "suggestion"
effort = "small"
category = "security"
summary = "Absolute-path check accepts UNC and unbounded '//server/share' remote paths"
description = "is_absolute_normalised returns true for any forward-slash-rooted string (repo_links.rs:481), so a normalised UNC path like '//server/share' passes validation and is stored as a clone dir; set_repo_local_path performs no further check. No filesystem sink consumes local_path in THIS feature (resolve_repo_path has no production caller yet, see R11), so impact is latent: if a later task feeds a stored UNC path into a clone or file op, an operator-supplied value could point at an attacker-controlled remote share. Add a host-class check at the future consumer, or reject UNC at store time."
dedup_id = "d334a47d34178ead"
resolved = 2026-06-04
resolution = "Documented on is_absolute_normalised that UNC //server/share passes intentionally (valid Windows clone dir) and the future filesystem consumer (R11) must add a host-class check before using a stored path as a filesystem sink. Doc-only; no predicate change."

