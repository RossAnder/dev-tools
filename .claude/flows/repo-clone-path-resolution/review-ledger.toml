summary = "Absent key, explicit null, and a typo'd key all clear the column with no malformed-request signal"
description = "SetLocalPathBody uses #[serde(default)] local_path: Option<String> (repo_links.rs:47-50), so {}, {local_path:null}, and a misspelled field name (e.g. localPath) ALL deserialise to None and CLEAR the column via set_repo_local_path's None branch. The route doc (l.145-149) states absent/null clearing is intentional and it matches the single wire caller (repo-links.ts), so it is internally consistent, but unlike the set-or-leave convention used elsewhere (UpdateFindingRequest) a PATCH here can never be a partial no-op and a typo'd key silently wipes an absolute path. Document the route as deliberately full-replace, or reject unknown fields."
dedup_id = "df2ed0e1a943610b"
resolved = 2026-06-04
resolution = "Added serde deny_unknown_fields to SetLocalPathBody so a misspelled key returns 422 instead of silently clearing local_path; doc comments updated to full-replace + reject-unknown semantics. Legit empty/value/null bodies unaffected. (http/repo_links.rs)"

