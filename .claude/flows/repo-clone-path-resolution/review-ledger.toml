symbol = "set_repo_local_path"
severity = "suggestion"
effort = "trivial"
category = "architecture"
summary = "Lossy case-fold at store time loses operator casing in detail/export"
description = "set_repo_local_path stores the output of normalise_path_for_compare, which on cfg(windows) lowercases the whole path (l.538-541). An operator entering 'C:/Dev/HelloWorld' gets 'c:/dev/helloworld' persisted and reflected back in GET /work-items/{id} and the export snapshot: the stored value is a comparison-normal form, not the operator's literal input. Since select_longest_prefix_project already re-normalises candidates at compare time (l.624), storing the validated-RAW value instead would preserve display/audit fidelity AND still match correctly. Consider storing raw-but-validated and normalising lazily."
dedup_id = "de5b6949b1907920"
resolved = 2026-06-04
resolution = "Split normalisation into normalise_path_structural (verbatim-strip + separator-fold + collapse + trailing-strip, case-PRESERVED; used for storage and as the compare base) and normalise_path_for_compare (= structural + cfg(windows) case fold; used by matchers). set_repo_local_path stores the case-preserved structural form; matching stays correct (compare folds both sides). Plan deviation: T2b/T3 stored-form changed case-folded to case-preserved; matching semantics unchanged."

