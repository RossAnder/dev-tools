summary = "Pin `resolve_repo_path` `..`/absolute-rel semantics — 'rejected/clamped' is ambiguous and `-> PathBuf` forecloses reject"
description = "The spec says reject a rel that escapes via `..` while the signature is `-> PathBuf` (no error channel) and the parenthetical leans clamp — an executor cannot write the T5 test without guessing. Also Agent 4: PathBuf::join silently REPLACES the base when the arg is absolute, so an absolute rel must be rejected explicitly, and ALL `..` components (not just a leading one) must be dropped after lexical normalisation. Pin to one behaviour."
anchor_old = "reject a `rel` that escapes via `..` (return the un-escaped join only; document that `..`-escaping `rel` is rejected/clamped), join, return. No DB."
anchor_new = "lexically normalise `rel`, dropping every `..` component so the result can never ascend above `local_path` (CLAMP, not error — the `-> PathBuf` signature has no error channel), and reject/ignore an absolute `rel` (PathBuf::join silently REPLACES the base on an absolute arg); join onto the normalised `local_path`. Document: a `..`-escaping or absolute `rel` is clamped to `local_path`, never escapes. No DB."
dedup_id = "4e7926ac01a4221d"

