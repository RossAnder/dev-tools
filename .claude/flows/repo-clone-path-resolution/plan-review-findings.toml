plan_section = "#### T2: `RepoLink.local_path` + resolve/normalise functions"
summary = "RepoLink FromRow needs the `Option<String>: Decode + Type` bound ADDED — it is required, not optional"
description = "The plan says 'no bound change expected (add one only if the compiler demands it)'. Verified this is wrong: export.rs:66-72 PendingEvent's generic-over-R FromRow reads a nullable `Option<String>` column and explicitly bounds BOTH `String: Decode+Type` (l.71) AND `Option<String>: Decode+Type` (l.72). That second line would be redundant if the String bound implied the Option bound in this recipe. RepoLink's FromRow (repo_links.rs:115-116) bounds only String/i64, so `try_get::<Option<String>>` will fail to compile until the bound is added. Resolves the Agent-1/Agent-4 conflict in favour of Agent 4."
anchor_old = "The existing `String: Decode + Type` where-bound already satisfies `Option<String>` via sqlx's blanket `Option<T>` impls — no bound change expected (add one only if the compiler demands it)."
anchor_new = "Add `Option<String>: sqlx::Decode<'r, R::Database> + sqlx::Type<R::Database>` to the where-clause — REQUIRED, mirroring `PendingEvent` at export.rs:72 which restates the Option bound even though it already bounds String; the generic-over-R recipe does not infer it."
dedup_id = "f0b3062bc71657bf"

