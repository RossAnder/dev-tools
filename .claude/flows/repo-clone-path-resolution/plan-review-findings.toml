plan_section = "#### T2: `RepoLink.local_path` + resolve/normalise functions"
summary = "Pin the `normalise_path_for_compare` algorithm explicitly — sanitise_cwd is the WRONG precedent (it slugifies separators)"
description = '''Verified sanitise_cwd (parse.rs:196-214) replaces EVERY non-alphanumeric byte (incl. / \ :) with '-' and never lowercases — a directory-name slugifier, structurally unusable for a path normaliser that must preserve '/' as a component separator for select_longest_prefix_project's boundary match. Only the verbatim-prefix-strip idea transfers. Pin the ordered algorithm in the plan body: (1) strip a leading verbatim prefix, INCLUDING the UNC verbatim form (the bare verbatim-UNC strip must yield a leading double-slash, not a bare 'UNC\...' — Agent 4's UNC edge); (2) replace backslash with '/'; (3) strip a single trailing '/' but never reduce a root (drive-root or '/') to empty; (4) on cfg(windows) ONLY, lowercase via to_ascii_lowercase. Also pin the T3 absolute-path validation: Path::is_absolute rejects `\dev\foo` (rooted, no drive) and `C:foo` (drive-relative) on Windows, so a Linux-CI executor validating a Windows operator's path diverges — require a drive-anchored (^[A-Za-z]:/) or '/'-rooted normalised form. Advisory (T2 has multiple findings → mechanical merge will conflict-skip the section).'''
dedup_id = "4cf541985f5dbcca"

