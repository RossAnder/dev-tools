id = "E15"
type = "deviation"
date = 2026-06-04
agent = "plan-update"
task_ref = "path-resolution-functions"
summary = "resolve_repo_path now lexically cancels .. against pushed components (clamped at base) instead of dropping every .."
original_intent = "Plan T2b pinned: resolve_repo_path DROPS every .. (ParentDir) component (clamp-by-drop), so a/../b yields base/a/b"
rationale = "Review finding R5 (round 1): dropping rather than cancelling produces a surprising base/a/b for a/../b on a path destined to be a real filesystem location. Switched to pop-on-ParentDir clamped at the base so a/../b yields base/b, while the security clamp invariant (a rel can never escape the base) is strictly preserved. Verified by cargo nextest (361 pass)."
dedup_id = "f035f6f96def1443"

[[items]]
id = "E16"
type = "deviation"
date = 2026-06-04
agent = "plan-update"
task_ref = "path-resolution-functions"
summary = "Path normalisation split into structural (case-preserved, stored) vs compare (case-folded, matching); set_repo_local_path stores the structural form"
original_intent = "Plan T2b/T3 pinned: set_repo_local_path stores the normalise_path_for_compare (host-case-folded) form, with a single comparison normal form"
rationale = "Review finding R7 (round 1): storing the case-folded compare form lost operator casing in the work-item detail and git-export snapshot. Split into normalise_path_structural (verbatim-strip + separator-fold + repeated-separator collapse + trailing-strip, case-PRESERVED; used for storage and as the compare base) and normalise_path_for_compare (= structural + cfg(windows) case fold; used by matchers). Matching semantics unchanged (compare folds both sides); only the stored/exported display casing is preserved. Verified by cargo nextest (361 pass)."
dedup_id = "6312604b06095b2c"
