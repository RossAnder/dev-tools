[[items]]
id = "E8"
type = "deviation"
date = 2026-05-28
agent = "implement"
task_ref = "reshape-e2e-pty_stub-fixture-for-jsonl-flow"
summary = "pty_e2e uses side-writer for JSONL rather than PATH-shimmed stub"
original_intent = "PATH-shim claude->pty_stub on Windows so stub's stdin loop writes synthetic JSONL records exercising stdin->child->JSONL round-trip."
rationale = "portable-pty 0.9's CommandBuilder reconstructs PATH from HKLM/HKCU registry hives on Windows, discarding the process-level PATH overlay; the shim is silently ignored and the real claude.exe (or no binary) gets spawned. Switched to side-writing JSONL records from a tokio task in the test; production bind_jsonl_path->tail->bridge->pty_messages path is exercised byte-identically. pty_stub fixture retained for future Linux/macOS variant. Cleaner fixes (cmd.env(PATH,...) override or LUMINA_PTY_CLAUDE_BIN env-var) require pty_transport.rs edits out of T6 scope."
commits = ["c76dd28d5511cbed07b440861201cb50508bc773"]
dedup_id = "450faf0f61bdd16f"

