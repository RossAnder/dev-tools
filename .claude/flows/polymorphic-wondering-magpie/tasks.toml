rationale = "The watcher drives the poller. Committed before the tail work, so a failed task 12 cannot roll `glimpse/src/source.rs` back past the poller rewrite."

[[checkpoints]]
id = "E"
rationale = "The tail runs on the poller thread, glimpse's docs are current, and the mimalloc default is measured and recorded."

