id = 11
ref = "drive-the-poller-from-the-watcher"
title = "Drive the poller from the watcher"
effort = "M"
status = "done"
checkpoint = "D"
phase = ""
phase_depth = 0
heading_depth = 3
files = ["glimpse/src/source.rs"]
needs = [
