summary = "atomic_write renames via tempfile::persist (bare MoveFileExW), which fails with os error 5 while any other handle — even glimpse's access-0 metadata stat — is open on the target; std::fs::rename falls back to POSIX-semantics rename and succeeds"
description = "Now: atomic_write stages through NamedTempFile::new_in and renames with tmp.persist(path). On Windows tempfile 3.27.0 implements persist as SetFileAttributesW(NORMAL) + MoveFileExW(MOVEFILE_REPLACE_EXISTING) with no fallback, and a replace-rename fails ERROR_ACCESS_DENIED whenever another handle is open on the target (even with FILE_SHARE_DELETE). glimpse now opens such handles in-process on every poller tick (fingerprint stats all four SNAPSHOT_INPUTS; flows_fingerprint stats evicted flows' files; the fetcher reads all four), right after a wake — i.e. inside tomlctl write bursts (hook agents.toml writes during parallel subagent starts, items add + set). is_transient_rename_error treats os error 5 as transient: each collision costs a 50 ms sleep and three in a row fail the write. This is a likely cause of the intermittent 'atomic rename … Access is denied (os error 5)' previously attributed to AV. std::fs::rename on Windows (Rust 1.98.1) retries ACCESS_DENIED via SetFileInformationByHandle(FileRenameInfoEx, REPLACE_IF_EXISTS|POSIX_SEMANTICS), which succeeds over an open reader (scratch probe confirmed). Change (io.rs only): stage with tempfile::Builder::new().make_in(parent, |p| OpenOptions::new().write(true).create_new(true).open(p)) so no FILE_ATTRIBUTE_TEMPORARY is set; keep write_all + sync_data; `let staged = tmp.into_temp_path();` and in the existing retry loop `fs::rename(&staged, path)` then `staged.keep()` on success. Keep the unix parent fsync. Risks: POSIX rename needs Win10 1709+ NTFS (std falls back to the original error elsewhere, so no regression); sharing violations (32) remain possible, so keep the retry; unix behaviour unchanged (same rename(2)). Do not call std::fs::rename only after persist fails: a failed persist re-marks the source FILE_ATTRIBUTE_TEMPORARY."
evidence = [
    "~/.cargo/registry/src/*/tempfile-3.27.0/src/file/imp/windows.rs:92-115 — persist = SetFileAttributesW(NORMAL) + MoveFileExW(MOVEFILE_REPLACE_EXISTING), no POSIX fallback",
