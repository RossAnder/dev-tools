severity = "warning"
effort = "small"
category = "concurrency"
summary = "A dead Windows watch is never detected when writes are sparse: a clean safety tick resets the miss streak, and notify 8.2.0's Windows backend reports no error or rescan when it drops a watch"
description = """
Now: on_tick increments the streak on a safety tick that finds a change and resets it to 0 on a clean safety tick; the watch is abandoned only after two consecutive safety windows each hold an unreported write. On Windows the missed-change counter is glimpse's only way to learn the watch died: notify 8.2.0's ReadDirectoryChangesW backend never sends Err or a Rescan event to the handler; on any completion error other than ABORTED/ACCESS_DENIED it logs and unwatches silently (a deleted root is also unwatched silently). So Wake::Rewatch and Wake::All in watch::classify can never fire on Windows. After a silent death, flow writes more than ~10 s apart (usual between agent completions) give a streak of 1,0,0,1,0... that never reaches MISS_LIMIT, so glimpse stays in Mode::Watching with a dead watcher and every change waits for the next safety tick (up to 10 s, ~5 s mean, instead of ~50 ms) for the rest of the session, with nothing on screen to say so. Change (one file): (1) only a wake resets the streak:
  TickCause::Wake => self.streak = 0,
  TickCause::Safety if changed => self.streak = self.streak.saturating_add(1),
  TickCause::Safety | TickCause::Other => {}
(2) in Poller::run reset `misses = MissedChanges::default()` whenever the mode moves into Watching, so a new watcher does not inherit the old streak; (3) flip the 'a clean safety tick breaks the run' assertion in two_unreported_changes_abandon_the_watch_and_a_wake_resets_the_count. Safety: a healthy watch that races a safety tick is reset by the queued wake on the next pass. Tradeoff: two separate lost-event episodes with no reported change between now abandon a live watch (cost: switch to poll_ms polling). Optional: first abandonment moves to Retrying (re-create the watch), only a second is sticky. Update the source.rs module doc, glimpse/CLAUDE.md 'A silent watch falls back to polling for good', and glimpse/README.md 'two safety passes in a row' in the same change."""
evidence = [
    "~/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f/notify-8.2.0/src/windows.rs:339-368 — handle_event `_ =>` arm logs + request.unwatch() + returns; no event_handler call",
    "notify-8.2.0/src/windows.rs — grep 'Rescan' → no match (only fsevent.rs / inotify.rs set Flag::Rescan)",
    "https://learn.microsoft.com/en-us/windows/win32/api/winbase/nf-winbase-readdirectorychangesw — page updated 2025-07-01, fetched 2026-09-30: overflow discards the buffer; changes to the watched directory itself are not reported",
    "glimpse/src/source.rs:352-360 on_tick resets on a clean safety tick; run() creates `misses` once and never resets it on a mode change",
]
