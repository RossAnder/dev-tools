summary = "`glimpse hook` reads and parses the user config (and logs any config warning to hook.log) on every hook event, though since this flow only the EnsurePane arm uses it"
description = """
Now: handle() calls Config::load() (read_to_string + TOML parse + theme validation) right after parsing the payload, before the flowless early return and before recording, and appends any warning to hook.log. Before this flow config supplied the tomlctl binary path to record(&config, …); the in-process change removed that, so the only consumer is crate::pane::ensure in the HookAction::EnsurePane arm (a recorded `start` inside herdr). Stops, idles, flowless cwds and non-herdr sessions pay a file read + parse for nothing, and a stale config logs one warning line per event (hook.log shows five identical `unknown key cell_aspect` lines in three minutes). Change: delete hook.rs:218-221 and load inside the arm:
HookAction::EnsurePane { origin_pane, slug, cwd } => {
    let (config, warning) = Config::load();
    if let Some(w) = warning { log_error(&w); }
    crate::pane::ensure(&Herdr::from_env(), &origin_pane, slug.as_deref(), Some(&cwd), false, &config)
        .map(drop)
        .map_err(|e| format!("cannot open the glimpse pane: {e}"))
}
Tradeoff: a bad config is reported only when a pane opens — the only time it takes effect. No test in glimpse/tests/cli.rs asserts a per-event config warning. Flagged independently by the memory, serialization, queries and algorithm lenses."""
