id = "E74"
type = "deviation"
date = 2026-09-30
agent = "plan-update"
task_ref = "expose-the-in-process-facade"
summary = "tomlctl::snapshot is now (root, slug) with slug validation; SNAPSHOT_INPUTS is public; record_agent shares record_value with the CLI"
original_intent = "facade snapshot(slug, store_path) reading the store path as given, and record_agent mirroring dispatch_record with its own harness parse"
rationale = "/review found the in-process path had dropped the CLI's slug validation (glimpse --slug ../../x read outside .claude/flows) and that glimpse hand-copied the snapshot's input-file set. The user confirmed the signature change; the facade validates via flow::validate_slug, owns SNAPSHOT_INPUTS, and record_agent now runs the same record_value the CLI tests cover (the CLI reads the payload before rejecting an unknown harness)."
dedup_id = "232c7e4e090c53b8"

[[items]]
id = "E75"
type = "deviation"
date = 2026-09-30
agent = "plan-update"
task_ref = "add-the-watch-module"
summary = "the flows watch no longer follows symlinks below the flows root"
original_intent = "watch::start via notify::recommended_watcher with notify's default config"
rationale = "notify's default follows symlinks, so on inotify/kqueue a repo-content link under .claude/flows (e.g. to /) made the recursive watch walk the target tree, exhaust max_user_watches and retry every poll tick. The watcher now uses Config::default().with_follow_symlinks(false); canonical_root still resolves a symlinked root."
dedup_id = "18c42c890e5afbff"

[[items]]
id = "E76"
type = "deviation"
date = 2026-09-30
agent = "plan-update"
task_ref = "move-the-transcript-tail-onto-the-poller-thread"
summary = "Event::Tail carries a read-only TailView rather than the poller's TailState, and a tail for a stale path is dropped"
original_intent = "the poller sends its TailState to the runtime as Event::Tail"
rationale = "Sending the live reader let the UI thread call refresh(), leaving 'the UI thread does no file I/O' enforced only by comment; TailView (path, entries, tokens, rejected) makes it a type rule. The runtime also ignores a queued tail whose path no longer matches the selected agent, so the old transcript is never drawn under the new one."
dedup_id = "e656107f4ac24651"
