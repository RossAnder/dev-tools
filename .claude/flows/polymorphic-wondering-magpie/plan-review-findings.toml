plan_section = "### Watcher as a wake-up signal"
summary = "Coalescing drain must merge every wake and handle non-Wake messages (SetSlug/Tail/Stop), not filter them"
description = "After the plan the control channel carries Wake, SetSlug, Tail, Stop. A drain written as `while let Ok(Control::Wake(w))` drops SetSlug/Tail and a dropped Stop hangs Source::drop/stop joins (and tests); keeping only the last Wake::Flow loses earlier slugs' evictions. The research notes already flag the same trap in the halted loop. Fix: state that drained Wakes are merged (Flow slugs unioned; any All wins) and any other message is handled as in the main loop, Stop returning at once; task 11 adds a test that a SetSlug sent mid-drain is applied."
anchor_old = "A tomlctl write is ~18 raw events."
anchor_new = "A tomlctl write is ~18 raw events. The drain combines, it doesn't filter: every drained `Wake` is merged (`Flow` slugs unioned; any `All` wins), and any other message is handled as in the main loop — `SetSlug` and `Tail` retarget, `Stop` returns at once."
dedup_id = "2b26072f495a7afd"

