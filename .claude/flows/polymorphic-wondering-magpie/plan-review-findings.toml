plan_section = "### 11. Drive the poller from the watcher [M]"
summary = "next_wait is now-relative; with task 12's 1 s tail cap the safety tick either fires every second or never"
description = "Task 12 caps the wait at app::TICK while a tail is targeted. If tail timeouts count as safety ticks, tick() runs every second and the missed-change detector judges 1 s windows; if they don't, the 10 s wait is recomputed each iteration and never expires, silently disabling the safety net and detector while the activity panel is open. Task 11's pure next_wait cases pin neither. Fix: deadline-based waits — next_safety_at (reset only when a tick runs), retry deadline, and (task 12) tail_at; only reaching next_safety_at is a safety tick; a tail deadline refreshes the tail without tick(). Add a case: tail due 1 s, safety due 3 s → 1 s, and after three tail wakes the safety tick still fires."
anchor_old = "    - `Polling` gives `poll_ms`."
anchor_new = """
    - `Polling` gives `poll_ms`.
  - Make the wait deadline-based: keep `next_safety_at: Instant` (reset only when a tick runs) plus the retry deadline, and have `next_wait(now, ...)` return the time to the earliest; task 12 adds a `tail_at` deadline to the same function. Only reaching `next_safety_at` counts as a safety tick for the missed-change detector; a tail deadline refreshes the tail and runs no `tick()`."""
dedup_id = "b28dda66b232717f"

