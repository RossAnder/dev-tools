plan_section = "### Watcher as a wake-up signal"
summary = "Wake has no variant telling the poller to re-create the watcher; errors/root-removal/outside-path/rescan all collapse to All"
description = "The Approach says a Wake::All caused by a watcher error drops and re-creates the watcher, but classify returns only Flow/All so the cause is lost at task 10's interface. On macOS every non-canonical path is 'outside' → All, so re-creating on every All would restart FSEvents constantly; the research note also says Remove of the root must re-establish the watch, which the Approach omits (only the missed-change detector would catch it, ≥20 s later, then sticky polling). Fix: `enum Wake { Flow(String), All, Rewatch }` — Rewatch for Err and Remove of flows_root evicts like All and re-creates the watcher; task 10 tests and task 11 match updated."
anchor_old = "`pub(crate) enum Wake { Flow(String), All }`."
anchor_new = "`pub(crate) enum Wake { Flow(String), All, Rewatch }`. `Rewatch` (an `Err`, or a `Remove` of `flows_root` itself) evicts like `All` and also tells the poller to drop and re-create the watcher; `All` (a rescan flag, or a path outside `flows_root`) never re-creates it."
dedup_id = "36d851591f175e17"

