summary = "Live watch test fails on macOS: FSEvents reports canonical /private/var paths, so classify returns All for a /var temp root"
description = 'notify-8.2.0 src/fsevent.rs canonicalises the watch root (append_path) and builds event paths from raw FSEvents paths (PathBuf::from at ~:542), which are canonical; macOS temp_dir is under /var -> /private/var, so strip_prefix fails and the test expecting Flow("a") fails on one of the three required platforms (unseen from Windows). Same effect in production for a symlinked repo/.claude (coarse All eviction). Also the rename write and in-place write share one channel, so trailing rename events can satisfy the in-place expectation. Fix: canonicalise flows_root once (falling back to the given path), pass the same path to watch and classify; drain the channel until quiet ~500 ms between the two writes. Raised by three lenses.'
anchor_old = "Add one live test that watches a temp `flows` dir."
anchor_new = "Add one live test that watches a temp `flows` dir. `start`'s caller canonicalises `flows_root` once (keeping the given path if that fails) and passes the same path to `watch` and `classify`, and so does the test: macOS temp dirs sit under the `/var` → `/private/var` symlink and FSEvents reports canonical paths. Between the rename write and the in-place write, drain the channel until it is quiet for 500 ms, so the in-place assertion cannot be met by the rename's trailing events."
