plan_section = "#### 14. `api/sprints.ts` + `api/worktrees.ts` (+ barrel) [M]"
summary = "T14 prescribes zod .nullable() but the skip_serializing_if convention omits keys -> .nullish() needed"
description = "T14 uses .nullable() for SprintDetailSchema.worktree/predecessor_sprint_id, but SprintRecord's Option fields (title/worktree_id/predecessor_sprint_id) have no specified serialization policy; the repo convention (skip_serializing_if) omits absent keys, and zod .nullable() REJECTS an absent key (.nullish() = optional+nullable accepts both). If T11 follows convention, every SprintRecordSchema parse with a null-ish field throws -- and T14's null-emitting mocks won't catch it. Fix: pin T11/T12 to 'no skip_serializing_if', or use .nullish() uniformly."
dedup_id = "58084da6a9c0c537"

