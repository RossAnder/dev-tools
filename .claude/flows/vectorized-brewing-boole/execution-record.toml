[[items]]
date = 2026-06-11
agent = "implement"
id = "E12"
type = "deviation"
task_ref = "mount-get-api-stream-wire-appstate"
summary = "T5 WS upgrade extractor changed to Result<WebSocketUpgrade, WebSocketUpgradeRejection> so the origin gate runs before the upgrade extractor"
original_intent = "Extract the WS upgrade as `ws: WebSocketUpgrade` (mirroring the PTY ws handler) and assert the disallowed/absent-Origin 422 via a tower oneshot test."
rationale = "axum 0.8.9's WebSocketUpgrade extractor rejects under oneshot (426 ConnectionNotUpgradable, no hyper upgrade extension) BEFORE the handler body runs, making the oneshot origin test impossible as specified. Adapted to `ws: Result<WebSocketUpgrade, WebSocketUpgradeRejection>` so the handler body always runs and the origin allowlist stays the outermost check; valid real-socket upgrades behave identically (strictly tighter gating). Confirmed by the T6 real-socket e2e."
commits = ["1ccc649"]
dedup_id = "34a5421c94afd16f"

