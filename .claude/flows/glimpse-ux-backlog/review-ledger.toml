category = "security"
summary = "Titles zoom writes task titles cell by cell via Cell::set_char, bypassing ratatui's control-character filter, so ESC/BEL/TAB in a title reach the terminal"
description = "label()'s Zoom::Titles branch builds `[id title]` from task.title and render_at writes each char through put -> cell.set_char, which stores it verbatim; crossterm then Prints the symbol and render_once copies it to stdout. Every other text path goes through set_stringn/Span, which drop control graphemes. Task titles are agent-written and tomlctl does not validate them, so a title can carry OSC/CSI sequences that fire when the user switches to Titles zoom. Fix: map each c.is_control() to a one-char placeholder (U+FFFD or ' ') in the Titles branch; one-for-one keeps label_width and the titles hash consistent. Add a test beside a_titled_label_cuts_its_title_by_chars_to_fill_its_box."
evidence = [
    "glimpse/src/diagram/paint.rs:104-106 (label(..).chars() -> put)",
    "glimpse/src/diagram/paint.rs:213 (cell.set_char(ch))",
    "ratatui-core 0.1.2 src/buffer/buffer.rs:351 set_stringn filters char::is_control; src/buffer/cell.rs:170 set_char does not (version per glimpse/Cargo.lock)",
    'git log -S"Zoom::Titles" -- glimpse/src/diagram/paint.rs -> e12f579',
]
instances = ["glimpse/src/diagram/paint.rs:label"]
sweep = ['set_symbol|set_char\(|\.set_string|set_line|set_span']
enumeration = "complete"
related = ["B-29b27f75"]
