summary = "Footer height follows the 1.5 s notice in hidden and full hint modes, so each notice resizes the body twice and re-runs the diagram fit search"
description = "lines() returns one row for any live notice; otherwise Hidden is 0 rows and Full wraps to up to FULL_ROWS. view::render sizes the footer with footer::height, so the body grows/shrinks when a notice appears and again when it expires. With fit on, the body size is part of FitKey (view: fit.then_some(view)), so each change re-searches and may store a different layout (store resets scroll to (0,0)). z/Z/F/x and Ctrl+wheel all post notices, so the diagram can change its drawn tasks on a timer after every diagram key. Item/layer pages shift by the same rows. Short mode is unaffected. Fix: size the footer from the hints alone and draw the notice inside those rows; in Hidden mode draw it over the body's last row instead of adding one."
evidence = [
    "glimpse/src/view/footer.rs:83-85 (height = lines().len())",
    "glimpse/src/view/footer.rs:91-96 (live notice -> 1 row in every mode), :111-112 (Hidden -> no rows)",
    "glimpse/src/view/mod.rs:157 (Constraint::Length(footer::height(..)))",
    "glimpse/src/diagram/mod.rs:244 (view: fit.then_some(view)); :213-217 (store resets scroll)",
    "test hidden_hints_take_no_row_unless_a_notice_is_live asserts 0 -> 1",
]
instances = [
    "glimpse/src/view/footer.rs:lines",
    "glimpse/src/view/mod.rs:render",
]
dedup_id = "79589727c7e1573c"
