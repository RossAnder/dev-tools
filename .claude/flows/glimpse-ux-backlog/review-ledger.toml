file = "glimpse/src/state.rs"
line = 226
symbol = "State::capture"
severity = "warning"
effort = "small"
category = "db"
summary = "state.toml is user-global and rewritten whole from each session's start-time baseline, so a glimpse quitting later deletes a theme or hint mode another session saved"
description = "state.toml lives under claude_dir() and is shared by every repo's glimpse; several run at once (one per repo, ensure-pane ignores the presence marker). capture writes theme/hints only when baseline.saved_* was set at load or this session changed them, and save replaces the whole file. Session B picks a theme and quits; session A, started earlier and never touching the theme, quits later and writes no theme key, erasing B's choice. Other layout keys merely follow last-quit-wins; here a saved choice is deleted. save also uses one fixed state.toml.tmp, so two simultaneous quits can interleave writes into the same temp file. Fix: on save, re-read the file and keep on-disk theme/hints this run neither changed nor pinned; use a per-process temp name."
evidence = [
    "glimpse/src/state.rs:231-237 (theme/hints written only if saved_* is Some or changed)",
    "glimpse/src/state.rs:345-356 (save: fixed toml.tmp + rename over whole file)",
    "glimpse/src/state.rs:334-336 (path = claude_dir()/glimpse/state.toml)",
    "glimpse/src/runtime.rs:86 (load once at start)",
    "glimpse/README.md:388-391 (theme/hints saved once chosen in-app)",
]
instances = [
    "glimpse/src/state.rs:State::capture",
    "glimpse/src/state.rs:State::save",
]
dedup_id = "ebe50956215a8894"
resolved = 2026-10-21
resolution = "Uncommitted: State::save_session re-reads state.toml and merges via State::over_disk, keeping the on-disk theme/hints whenever this run left them unchanged. An unreadable file falls back to the run's own capture. The temp file is now state.toml.<pid>.tmp. Test a_choice_another_run_saved_since_survives_a_run_that_left_it_alone."

