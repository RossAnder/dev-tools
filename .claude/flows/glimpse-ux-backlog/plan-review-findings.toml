plan_section = "### Diagram focus, zoom and fit"
summary = "The fit predicate is undefined, the search runs every redraw, and Approach and Risks describe different searches"
description = 'paint::render runs on every redraw (input, snapshot, 1 s agent tick); with the subset hash in the cache key, layout_for must run subset::fit before it can compare keys, and each fits probe is a full layout_of (24 order sweeps, position, pack, route; order.rs:14) over up to 512 nodes. The Approach grows the radius one ring at a time then adds families greedily; Risks says "doubling, then bisect"; no task carries the "measure on the largest real flow" mitigation. What "fits" measures (width only? at which zoom? no selection?) is undefined.'
anchor_old = "- **Fit.** With focus off and the full layout fitting, there is no subset. When fit is on and the layout overflows the view, `subset::fit` is driven by `layout_of` measurements around the selection."
anchor_new = "- **Fit.** With focus off and the full layout fitting, there is no subset. When fit is on and the layout overflows the view, `subset::fit` is driven by `layout_of` measurements around the selection: a candidate fits when its layout at the current zoom has `width <= view.0` and `height <= view.1`, and with no selection there is no subset. The radius grows by doubling, then bisects; families from the next ring are then added greedily. The fit result is cached on `(topology_hash, orientation, show_implied, zoom, focus, target, view size)`, so a frame whose inputs are unchanged runs no search."
dedup_id = "488b67559677c728"

