plan_section = "### Divider drag tolerance"
summary = "The event log writes unbuffered on the UI thread for every hover move, with no size cap"
description = "Capture reports every Moved; a per-event write on a raw File adds a syscall per move on the input loop during the very capture meant to diagnose drag timing, and an env var left set grows the file unbounded. hook.rs already has LOG_CAP (1 MiB) truncation; its format_utc has one-second resolution, too coarse for drag timing."
anchor_old = "It is opened once and best-effort: a failed open is noticed once."
anchor_new = "It is opened once and best-effort: a failed open is noticed once. Lines go through a `BufWriter` flushed once per event batch, carry milliseconds since start, and the file is truncated past `hook::LOG_CAP` as `hook.log` is."
dedup_id = "84b1120cedf101ba"

