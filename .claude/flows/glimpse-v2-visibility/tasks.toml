schema_version = 2
last_updated = 2026-11-12
plan_path = ""
last_import_refs = []
audit = true

[policy]
checkpoints = "milestones"
max_parallel = 6
commit_granularity = "per-task"
origin = "plan"
note = ""

[[checkpoints]]
id = "A"
rationale = "tomlctl carries every v2 record glimpse will show: the snapshot emits specs, milestones, changes and the plan store, the library lists and reads authored files and findings, agents record cumulative usage, and the plan store holds attempts, gate rounds and reports written by new plan run leaves"

[[checkpoints]]
id = "B"
rationale = "glimpse shows a v2 flow in full: v2 task details, the Plan surface with its eleven sections, research notes with source previews, links between records with a way back, the needs-you section of the Inbox, and time and token totals"

[[checkpoints]]
id = "C"
rationale = "runs leave structured records: workers and research agents write the note blocks, the drain records attempts, gate rounds and the report, and the carrier pre-flight requires the binary that can"

