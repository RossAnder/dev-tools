detail = "source.rs gains a `Control` variant carrying `Option<DocRequest>` and an `Event` variant carrying the request and its result, beside `Control::Tail` and `Event::Tail`; runtime.rs gains a `Host` method to send it, as `set_tail` is sent, and applies the event to the app through a method the next task defines the state for: for now, hold the latest document on the screen state the way the tail view is held. source/doc.rs does the reads: `Authored` through `tomlctl::authored_read`; `Finding` through `tomlctl::review_finding`, rendered as `key: value` lines; `Commit` through `git show --stat --format=fuller <sha>`; `Source` by the rule in the design, comparing the shown text with the working tree's to set `changed since`. Run git as flows.rs already does, with the repo root as its working directory and arguments passed as separate values, never through a shell. Pass a sha only when it is 7 to 64 hex digits and a path only after it resolves inside the repo root; refuse a file over 2 MiB or not UTF-8. A new request replaces the old one and a stale answer is dropped. Tests in source/doc.rs over a temp git repo: a clean source at an older commit shows the old text and `changed since`; a dirty one shows the working tree and `read uncommitted`; no `read_at` shows `commit not recorded`; a path outside the root, a non-hex sha and an oversized file are each a one-line reason; a commit shows its stat."
