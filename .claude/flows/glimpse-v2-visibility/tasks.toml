[[specs.means]]
text = "`n` in the log file name is the command's 1-based position in the round as stored after the merge. A relative `log` path in a row resolves against the current directory."
binding = "required"
detail = "A re-record must overwrite the same file for the same command, and the orchestrator passes the verification agent's path as it received it."

[[specs.means]]
text = "Take a `--rerun` flag. Without it the call records a new run of the round, with `seq` one more than the highest recorded for that (milestone, round). With it the call merges into the latest run of the round and replaces the commands it names; `--rerun` with no run recorded for the round is refused. The kept log is named `<milestone>-r<round>-s<seq>-c<n>.log`. Where the action and detail say a call for the same round replaces commands, that holds only under `--rerun`. Test both paths."
binding = "required"
detail = "A gate run again at a later invocation reuses the round number, and a plain upsert on (milestone, round) would overwrite the earlier run's results."

[[specs.means]]
text = """Read a row's source `log` only when its canonical path lies under the canonical OS temp directory (`std::env::temp_dir()`); any other path stores `log = ""` and is listed in `unread`, and never fails the record. Add a test with a log outside the temp directory. The kept file is `<milestone>-r<round>-s<seq>-c<n>.log`, replacing the detail's name."""
binding = "required"
detail = "design/records.md, Run records: the kept tail is committed with the flow's stores, so the verb must not copy an arbitrary readable file a row names."

