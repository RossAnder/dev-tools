summary = "A gate run again at re-entry reuses the last round number, so the (milestone, round) upsert overwrites that round's recorded results"
severity = "minor"
failure_scenario = "Milestone B's gate fails after fix round 2; the drain mints nothing and leaves the milestone uncommitted. The user fixes it and re-invokes; drain.md's re-entry rule runs the gate again from step 7 with no new fix round, so `<n>` is 2 again and `plan run gate --round 2` replaces round 2's rows. The failing round's command outcomes, failed ids and logs vanish from the gate history the brief requires. A second timeout or a hook-rejected commit hits the same path."
fix = "Give a gate run its own identity beside the round: key `[[gate_round]]` on (milestone, round, seq), where a fresh step-7 dispatch takes one more than the highest seq recorded for that (milestone, round) and only the held-command or timeout re-dispatch of the same drain replaces rows in the latest seq. Update design/records.md Run records (key and a `seq` field), design/engine.md Drain changes, task 9's upsert and task 36's step-7 text; glimpse's Milestone details list every run of a round."
effort = "small"
counter = "If the re-entry path in drain.md minted a new round number before regating, no overwrite would occur; drain.md:418 says only 'runs the gate again from step 7' and the round count comes from fix-task reasons, which a re-entry adds none of."
