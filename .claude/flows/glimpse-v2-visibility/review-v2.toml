fix = "In design/engine.md, Drain changes, replace the sentence with: attempts and gate rounds land in the flow-store commit; when a milestone commits and step 10's Next rule ends the invocation there, record the report before the flow-store commit so it lands in it; otherwise all three stay uncommitted with the flow's stores, as today. Give task 36's step (3) the same placement."
effort = "small"
counter = "A drain step after step 10 that already commits plan.toml, or a rule moving step 11 before the flow-store commit; drain.md shows neither (step 10 commits, step 11 only reads today)."
grade = "high"
evidence = [
    "claude/skills/implement-v2-engine/references/drain.md:406-411 the flow-store commit is step 10",
    "drain.md:422 'Otherwise end the invocation with the report below' follows the commit; drain.md:424 step 11 is the report",
    "design/engine.md Drain changes: 'Before the report (step 11), store it' and 'All three writes land in the flow-store commit.'",
]
fix_files = [".claude/flows/glimpse-v2-visibility/tasks.toml"]
target = "design/engine.md#drain-changes"
expect = """"All three writes land in the flow-store commit. When a milestone ends without a commit, they stay uncommitted with the rest of the flow's stores, as those do today.""""
