summary = "The gate verb copies the tail of any file a row's `log` names into a committed directory, with no check that it is a verification log"
severity = "minor"
failure_scenario = "The orchestrator stages a gate row from the verification agent's model output, and the row's `log` names some other file: a hallucinated or injected path such as ~/.claude/.credentials.json or a .env file. `plan run gate` reads its last 200 lines into .claude/flows/<slug>/gates/, and the flow-store commit stages that directory. The content then enters history of a repo the .gitignore calls public. CWE-73, CWE-538."
fix = """Accept a source log only when its canonical path lies under the OS temp directory (std::env::temp_dir(), canonicalised), where verification.md's `mktemp -d` writes it. Otherwise store log = "", list the path in `unread` with the reason, and add a test for a log outside the temp directory. Carry the rule into task 9's detail and constraints."""
effort = "small"
counter = "If the orchestrator only ever copies the agent's reported `<D>/cN.log` verbatim and the agent cannot be steered, the path is always under temp. The design and task 9 constrain neither, and task 9 resolves a relative path against the current directory."
grade = "medium"
evidence = [
    'docs/flows/glimpse-v2-visibility/design/records.md:98: log tail kept for fail/timeout/flaky; an unreadable path stores ""; nothing confines which path is read',
    "docs/flows/glimpse-v2-visibility/design/engine.md:33: the verb copies each non-pass log into .claude/flows/<slug>/gates/, which the flow-store commit stages",
    "claude/agents/verification.md:40: logs live in `mktemp -d` (cygpath -m form on Windows)",
    ".gitignore backlog-evidence comment: 'this repo is public'; git check-ignore on .claude/flows/<slug>/gates/*.log exits 1",
]
fix_files = [".claude/flows/glimpse-v2-visibility/tasks.toml"]
target = "design/records.md#run-records"
expect = '''"A log path that cannot be read stores `log = \"\"` and is reported in the verb's output; it never fails the record."'''
new = '''"The verb reads a source log only when its canonical path lies under the OS temp directory, where the verification agent's `mktemp -d` puts it; a log path outside it, or one that cannot be read, stores `log = \"\"` and is reported in the verb's output; it never fails the record."'''
tier = "cited"
related = ["F16"]
anchor = "plan|docs/flows/glimpse-v2-visibility/design/records.md|run-records"
status = "resolved"
first_seen = 2026-11-12
resolution = "applied to design/records.md#run-records"
resolved = 2026-11-12

