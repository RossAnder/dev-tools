file = "docs/flows/glimpse-v2-visibility/design/engine.md"
symbol = "drain-changes"
summary = "The report is recorded at drain step 11, after step 10's flow-store commit, so 'All three writes land in the flow-store commit' is false for it"
severity = "minor"
failure_scenario = "Task 36 adds `plan run report` in step 11 as designed. drain.md runs step 10 (milestone commit, stamp, flow-store commit) before 'Next' decides to end the invocation and step 11 prints the report. So every report is written after the invocation's last flow-store commit: it rides only in a later invocation's commit, and the final milestone's report is never committed, contrary to the design's claim and D1/D8's 'flow stores in git history'."
fix = "Decide where the report's write is committed and say so in Drain changes and task 36: (a) record the report between the stamp and the flow-store commit whenever this milestone ends the invocation; (b) add a small commit of plan.toml after `plan run report` in step 11; or (c) drop the claim and say the report rides in the next invocation's flow-store commit, the last one left for the user."
effort = "small"
counter = "If step 11's report were gathered and recorded before step 10's flow-store commit, the claim would hold; drain.md's 'Next' paragraph sends the invocation to step 11 only after step 10."
grade = "high"
evidence = [
    "claude/skills/implement-v2-engine/references/drain.md:406-411 the flow-store commit is step 10",
    "drain.md:422 'Otherwise end the invocation with the report below' follows the commit; drain.md:424 step 11 is the report",
    "design/engine.md Drain changes: 'Before the report (step 11), store it' and 'All three writes land in the flow-store commit.'",
]
fix_sketch = "In design/engine.md, Drain changes, replace 'Before the report (step 11), store it' with: when step 10 committed the milestone and Next will end the invocation (a parked row, --milestone given, or no milestone left), gather step 11's inputs (plan view --for digest, parked and failed lists) and run `plan run report` before the flow-store commit, so it is staged with plan.toml; when the invocation ends without a commit, record it at step 11 and it stays uncommitted with the other stores. Keep 'All three writes land in the flow-store commit' scoped to the committed path. Task 36's drain.md edit follows the same order."
unblocked_by = "verifier"
unblocked_from = "decision"
target = "design/engine.md#drain-changes"
expect = '"All three writes land in the flow-store commit."'
