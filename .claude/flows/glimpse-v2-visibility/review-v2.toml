symbol = "fetch-documents-on-the-poller-thread"
summary = "'a path only after it resolves inside the repo root' has two readings; canonicalising refuses a source deleted or renamed since read_at"
severity = "minor"
failure_scenario = "A note cites glimpse/src/old.rs at read_at; the file is later removed. An executor who checks containment by canonicalising the working-tree path gets NotFound and refuses the request, so `git show <read_at>:<path>` never runs and the source the author saw is unreachable. An executor who checks lexically (relative, no `..`, no root or prefix) shows it. The two diverge on what the tests and users see."
fix = "Say in the Detail: for a git read, accept a path that is relative, `/`-separated and has no `..`, root or drive component; for a working-tree read, also canonicalise and require the result under the canonical repo root. A git read of a path absent from the working tree shows the old text with `changed since`."
effort = "trivial"
counter = "The design or task naming the check as canonical or lexical; neither does."
grade = "medium"
evidence = [
    "task 28 Detail: 'a path only after it resolves inside the repo root'",
    "design/glimpse.md#document-lane: Source shows 'the file as the note's author saw it' via git show when read_at is set",
]
