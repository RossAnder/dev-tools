file = "docs/flows/glimpse-v2-visibility/design/engine.md"
symbol = "drain-changes"
summary = "The report is recorded at drain step 11, after step 10's flow-store commit, so it never lands in that commit as the design claims"
severity = "minor"
failure_scenario = "Milestone C passes its gate: step 10 makes the milestone commit and the flow-store commit, then step 11 runs `plan run report`, writing [[report]] into plan.toml. The write is left uncommitted. On the last milestone nothing else commits plan.toml, so the flow ends with a dirty plan.toml; mid-flow, a report only reaches git in the next invocation's flow-store commit. engine.md says all three writes land in the flow-store commit, and task 36 puts the call in step 11."
fix = "Pick where the report write sits relative to the flow-store commit, then make engine.md and task 36's detail say the same. When the report is recorded before the commit, decide the Next rule (committed, nothing parked, no --milestone) before the flow-store commit and run `plan run report` there for an invocation that ends at a committed milestone; keep step 11's call for invocations that end without a commit."
effort = "small"
counter = "If drain.md ran the needs_human report before step 10's flow-store commit, the claim would hold. drain.md orders 10. Commit (flow-store commit at lines 406-412) before 11. The needs_human report (line 424)."
grade = "high"
evidence = [
    "claude/skills/implement-v2-engine/references/drain.md:373-412: step 10 makes the milestone commit and then the flow-store commit of .claude/flows/<slug>/",
    "claude/skills/implement-v2-engine/references/drain.md:420-426: Next goes to the next milestone without step 11; step 11 'Every invocation ends with this report' runs after the commit",
    "docs/flows/glimpse-v2-visibility/design/engine.md:35-43: 'Before the report (step 11), store it' ... 'All three writes land in the flow-store commit.'",
    "tasks show 36 detail: '(3) In step 11, before the report is printed, add the `plan run report` call'",
]
fix_files = [".claude/flows/glimpse-v2-visibility/tasks.toml"]
blocked_on = "decision"
blocked_missing = "Where the report write sits relative to the flow-store commit. The drain decides whether the invocation ends only after the commit, and step 11 also runs on error paths that never reach step 10."
blocked_options = [
    "Record the report before the flow-store commit when the invocation will end at a committed milestone, and also at step 11 for uncommitted ends: it lands in git, but the Next decision moves ahead of the commit",
    "Add a third small commit of plan.toml after step 11: it lands in git, at the cost of one more commit per invocation",
    "Leave the write at step 11 and correct engine.md: the report reaches git only with the next invocation's flow-store commit, and the last one stays uncommitted",
