[[findings]]
id = "F20"
run = "U1"
cell = "C4"
seen_in = ["U1"]
family = "plan"
kind = "defect"
lens = "feasibility"
route = "verifier"
file = "docs/flows/glimpse-v2-visibility/design/glimpse.md"
symbol = "document-lane"
summary = "Requiring a Source path to resolve inside the repo root refuses a file deleted or renamed since read_at, though git could show it as it was"
severity = "minor"
failure_scenario = "A note cites glimpse/src/old.rs:40 with read_at X, and a later task renames old.rs. Selecting the source runs the containment check first. Resolving a path that no longer exists fails, as canonicalize does, so the document is refused, even though `git show X:glimpse/src/old.rs` would print the text the author read. That breaks the success criterion 'see the source it cites, as it was when the note was written' for exactly the sources that changed most."
fix = "Split the check by read. For a `git show <read_at>:<path>` read, check the path lexically: repo-relative, `/`-separated, with no `..`, root, drive or UNC component. Git then resolves it inside the commit, and a path absent from the working tree reads as `changed since`. Canonical containment applies only to a working-tree read. Bring task 28's detail and add a test for a source deleted since read_at."
effort = "small"
counter = "An executor could read 'resolves inside the repo root' as a purely lexical check, in which case a deleted file is not refused; the design and task 28 do not say which, and the authored-file rule beside it does canonicalise."
grade = "medium"
evidence = [
    "docs/flows/glimpse-v2-visibility/design/glimpse.md:135-139: clean source shown via `git show <read_at>:<path>`; 'a path only after it resolves inside the repo root'",
    "tasks show 28 detail: 'a path only after it resolves inside the repo root'; its test list has no deleted-since case",
    "std::fs::canonicalize returns an error when the path does not exist (Rust std docs, Errors section)",
]
fix_files = [".claude/flows/glimpse-v2-visibility/tasks.toml"]
target = "design/glimpse.md#document-lane"
expect = '"and a path only after it resolves inside the repo root"'
new = '"and a path only when it is repo-relative with no `..`, root, drive or UNC component; a working-tree read also canonicalises it and refuses one that leaves the repo root, while a `git show` read leaves resolution to git, so a file deleted or renamed since `read_at` still shows as it was, marked `changed since`"'
tier = "cited"
anchor = "plan|docs/flows/glimpse-v2-visibility/design/glimpse.md|document-lane"
status = "resolved"
first_seen = 2026-11-12
resolution = "applied to design/glimpse.md#document-lane"
resolved = 2026-11-12

