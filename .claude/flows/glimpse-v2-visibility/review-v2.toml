file = "docs/flows/glimpse-v2-visibility/design/engine.md"
symbol = "milestone-order"
summary = "Milestone C's drain raises plan.toml's schema stamp while the pre-plan glimpse is still installed, so the running glimpse refuses this flow's snapshot"
severity = "minor"
failure_scenario = "The invocation commits milestone B and continues straight into C, since handovers do not stop it. H1 (reinstall glimpse) is due only after B, and it is a person's step. C's drain step 3 runs `plan run notes`, which writes [[attempt]] and stamps plan.toml above 2. The installed glimpse still links the old tomlctl, whose snapshot runs plan::schema::from_toml and refuses schema_version > 2. The user's glimpse then shows an error for this flow, and for any other v2 flow whose drain records, until H1 is done."
fix = "In engine.md's Milestone order, add a bullet: milestone C's first drain makes plan.toml unreadable to a glimpse built before milestone B, so run B with `--milestone B`, carry out H1, then run C. Change H1's `when` to 'After milestone B is committed, before milestone C runs.'"
effort = "trivial"
counter = "If the user reinstalls glimpse between B and C anyway, or does not run glimpse during C, nothing breaks. The engine continues past an undone handover (drain.md Next), so nothing forces that pause."
grade = "high"
evidence = [
    "tomlctl/src/tasks/snapshot.rs:105-108: running_milestone parses plan.toml through plan::schema::from_toml and propagates its error",
    "tomlctl/src/plan/schema.rs:380: `if schema_version > SCHEMA_VERSION` refuses the store; SCHEMA_VERSION = 2 at line 27",
    "glimpse/CLAUDE.md:28: glimpse links its own copy of tomlctl and needs `cargo install --path glimpse` after tomlctl changes",
    "plan.toml H1: reason restart, when 'After milestone B is committed.'; drain.md:422 Next continues when committed and nothing is parked",
]
fix_files = [".claude/flows/glimpse-v2-visibility/plan.toml"]
target = "design/engine.md#milestone-order"
expect = '"- Worker agents are loaded when a session starts, so workers dispatched by the session that edits their contract still write notes without the block. The note reader accepts those."'
new = '''"- Worker agents are loaded when a session starts, so workers dispatched by the session that edits their contract still write notes without the block. The note reader accepts those.\n- Milestone C's first drain stamps plan.toml above what a glimpse built before milestone B can read, so the flow runs `--milestone B`, then handover H1, then milestone C."'''
tier = "cited"
anchor = "plan|docs/flows/glimpse-v2-visibility/design/engine.md|milestone-order"
status = "resolved"
first_seen = 2026-11-12
resolution = "applied to design/engine.md#milestone-order"
