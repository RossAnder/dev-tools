symbol = "run-note-block"
summary = "A run-note block placed after any prose reads as absent with no problem, silently dropping its tangential, deviation and handover entries; no test covers it"
severity = "minor"
failure_scenario = "A worker under the new contract writes Status, a '## What changed' paragraph, then the `toml run-note` block. Task 5's parser only accepts a block with blank lines alone after Status, so the note reads block=absent; with no TANGENTIAL lines (the form is no longer written) the attempt records zero tangential and deviation entries, task 8 reports no problem, and the drain's step 8 (task 36) mints no backlog candidate and the Departures list misses it."
fix = "In design/records.md, Run-note block, treat a `toml run-note` fence anywhere but directly after the Status line as malformed, so it is reported as a problem rather than read as absent. Mirror it in task 5's detail (add: a `toml run-note` fence found elsewhere in the note is `malformed`, reason 'block not directly after the Status line') and add that case to task 5's unit tests and to task 8's plan_run_records cases (problem reported)."
effort = "small"
counter = "If the parser were specified to take the first `toml run-note` fence anywhere in the note, or task 8 reported a stray fence as a problem, nothing is lost; neither task 5's detail nor task 8's problem list says so."
grade = "high"
evidence = [
    "tasks show 5 detail: 'it must follow the Status line with only blank lines between. A note with no such block is `absent`'",
    "design/records.md Run-note block: absent reads Status and TANGENTIAL lines; malformed only for invalid TOML or unknown key",
    "task 8 detail: problem is 'the note is missing, the block is malformed and why, or the Status word differs'",
    "task 34: TANGENTIAL line form 'is no longer written'; task 36 step 8 takes candidates from the attempts' tangential entries",
]
fix_files = [".claude/flows/glimpse-v2-visibility/tasks.toml"]
