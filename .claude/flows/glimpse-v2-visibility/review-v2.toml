severity = "major"
failure_scenario = """Implementer adds `probe` to premises_json as Detail says. update.rs spec_value("premises") calls premises_json, so review_value now returns probed premises, while stored_form normalises a review expect through SpecPatch (no probe). Any `task:<ref>.spec.premises` whole-value edit on a task with a probed premise compares expect != current and returns Stale forever; the change trail's spec.premises old/new also start carrying probe JSON. update.rs is not on the Files line, so the worker cannot fix it."""
fix = """Add tomlctl/src/tasks/update.rs to the Files line and, in spec_value's "premises" arm, strip each premise's probe before calling premises_json, as the "accept" arm already does for accept entries (or keep premises_json unprobed and add a probed variant used only by show and the snapshot). Name this in the Detail and add a review_edit test over a probed premise list."""
