summary = "The document event's result type is left to the executor, yet task 29 needs its notice, line and kind apart from the text"
severity = "major"
failure_scenario = "Task 28's worker picks a result shape, say Result<String, String> with `read uncommitted`/`changed since` folded into the text as the design's 'the document says why' reads. Task 29 must then put the notice in the title, scroll to the Source line and render markdown only for an authored file, none of which it can recover from a flat string; it must rewrite source.rs/source/doc.rs, which are outside its Files, or draw the notice in the body against its own Detail."
fix = "Settle the type in task 28's Detail: source/doc.rs defines `pub(crate) struct Fetched { title: String, text: String, notices: Vec<&'static str>, line: Option<u32>, markdown: bool }`, and the event carries `(DocRequest, Result<Fetched, String>)`, the Err being the one-line reason. Notices are `read uncommitted`, `commit not recorded` and `changed since`, kept out of `text` so task 29 can title them."
effort = "small"
counter = "A contract or design section fixing the event's payload shape; plan.toml contracts C1-C5 and design/glimpse.md Document lane name only DocRequest."
grade = "high"
evidence = [
    "task 28 Detail: 'an Event variant carrying the request and its result' with no result type",
    "task 29 Detail: 'the title names the target and any notice', 'a Source starts scrolled so its line is in view', 'an authored file is rendered through the markdown renderer'",
    "design/glimpse.md#document-lane defines only `enum DocRequest`; plan.toml Contracts C1-C5 hold no document type",
]
target = "task:fetch-documents-on-the-poller-thread.detail"
