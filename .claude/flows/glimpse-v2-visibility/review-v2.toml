[[findings]]
id = "F23"
run = "U1"
cell = "C4"
seen_in = ["U1"]
family = "plan"
kind = "advisory"
lens = "contrarian"
route = "none"
file = "docs/flows/glimpse-v2-visibility/design/records.md"
symbol = "run-records"
summary = "D4 rejects a separate run-records file on cost alone; it never weighs that raising plan.toml's stamp makes every older binary refuse the whole plan"
angle = "challenge"
rationale = "D4 rejects a separate file because it would need a sixth SNAPSHOT_INPUTS slot, a wider fingerprint and its own verbs. The rival's strongest case is forward compatibility. An old binary ignores a file it does not know. A plan.toml stamped above 2 is refused whole, along with every decision, contract, run and handover in it. Every installed glimpse links its own tomlctl and refuses it in its snapshot (snapshot.rs:105-108, schema.rs:380), so does any older clone's tomlctl, and so does `plan view`. Run telemetry also grows the approved plan store on every drain round. The recorded rationale answers the build cost, not this."
alternative = "Keep attempts, gate rounds and reports in their own .claude/flows/<slug>/runs.toml, read by the snapshot as a sixth input, so plan.toml's stamp never moves."
adoption_cost = "Move the three arrays to a new flow file such as runs.toml: one more SNAPSHOT_INPUTS entry and fingerprint slot, a store module, and retargeting tasks 4, 8-10, 15 and contract C5 before milestone A runs. That is cheap now and costly after any flow records."
challenges = ".claude/flows/glimpse-v2-visibility/plan.toml decision D4, rejected option 'A new store file'; design/records.md Run records, stamp paragraph"
target = "design/records.md#run-records"
tier = "advisory"
related = ["F16"]
anchor = "plan|docs/flows/glimpse-v2-visibility/design/records.md|run-records"
status = "dismissed"
first_seen = 2026-11-12
dismiss_reason = "Kept by the user at triage: an older binary refusing a plan store that holds run records is the protection decision D4 wants, since the alternative is that binary silently dropping them."

