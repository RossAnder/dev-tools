evidence = [
    "claude/skills/implement-v2-engine/references/drain.md:418 a done, uncommitted milestone 'runs the gate again from step 7'",
    "drain.md:313 and :334 a second timeout or a failure after round 2 leaves the milestone uncommitted",
    "design/records.md Run records: gate_round 'upserted on (milestone, round)'; design/engine.md: '<n> is 0 for the milestone's first gate run and the fix round's number after that'",
]
blocked_on = "design"
blocked_missing = "The gate-round record has no field that tells a fresh gate run from a re-dispatch within the same round, so the identity change spans records.md, the gate verb (task 9, milestone A) and the drain text (task 36, milestone C)."
blocked_contract = "`[[gate_round]]` gains a `seq` key and is upserted on (milestone, round, seq); `plan run gate` takes a flag marking a fresh dispatch that opens a new seq, and the drain passes it on every first dispatch of step 7."
target = "design/engine.md#drain-changes"
expect = """"`<n>` is `0` for the milestone's first gate run and the fix round's number after that.""""
