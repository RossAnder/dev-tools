[[findings]]
id = "F36"
run = "U1"
cell = "C1"
seen_in = ["U1"]
family = "plan"
kind = "defect"
lens = "plan-grounding"
route = "verifier"
file = "docs/flows/glimpse-v2-visibility/design/glimpse.md"
symbol = "authored-feed"
summary = "A late docs/flows cannot be added 'as a flow-less ledger directory is': that path is a .claude watch event, and nothing watches docs/"
severity = "minor"
failure_scenario = "glimpse starts in a repo with no docs/flows (any repo before its first /plan-v2). /plan-v2 then writes docs/flows/<slug>/brief.md. A flow-less ledger dir is added through Wake::NewScope, which watch.rs raises only for an Arrive event directly under the watched .claude dir; no watch covers docs/ or the root, so no wake ever adds the Authored watch. The scope stays unwatched, and with its own miss streak the re-stat's finds count as misses, so two writes abandon the whole watch and glimpse polls for the session."
fix = "In Authored feed, say: while `<root>/docs/flows` is missing, each scan probes for it, as `Mode::start` probes a missing flows root, and adds the recursive watch when it appears; a change the re-stat finds while the scope has no watch counts no miss. Make the same change in task 19's Detail, which repeats 'add the watch the way Wake::NewScope adds a flow-less ledger directory'."
effort = "small"
counter = "If some existing watch reported docs/flows arriving (a root-level or docs/ watch), NewScope-style adding would work; watch.rs classifies only paths under the flows root and .claude, and Mode::start watches only .claude."
grade = "high"
evidence = [
    "glimpse/src/watch.rs:190-205 NewScope comes only from an Arrive event of an entry directly under roots.claude",
    "glimpse/src/source/mode.rs:139-156 the watch covers the .claude dir above flows_root; a missing flows_root is probed on every start call",
    "glimpse/src/source.rs:326-327 a re-stat-found change is added to `changed` for miss counting whether or not that scope woke",
]
target = "design/glimpse.md#authored-feed"
expect = '"it is added when the directory exists and late, as a flow-less ledger directory is, when it appears afterwards."'
new = '"it is added when the directory exists; while it is missing, each scan probes for it, as a missing flows root is probed, and adds the watch when it appears, since no watched directory reports its arrival. A change the re-stat finds while this scope has no watch counts no miss."'
tier = "cited"
anchor = "plan|docs/flows/glimpse-v2-visibility/design/glimpse.md|authored-feed"
status = "resolved"
first_seen = 2026-11-12
resolution = "applied to design/glimpse.md#authored-feed"
resolved = 2026-11-12

[findings.applied]
at = "2026-11-12T10:23:54.8568998Z"
tier = "cited"
target = "design/glimpse.md#authored-feed"
