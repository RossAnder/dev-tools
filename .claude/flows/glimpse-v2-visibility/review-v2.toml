fix = '''Append to each of these tasks a read-only forward entry that the task's new file carries a test, which the worker runs and the probe can see: task 20 `grep -q "#\[test\]" glimpse/src/rollup.rs`; 18 glimpse/src/authored.rs; 21 glimpse/src/plan_state.rs; 25 glimpse/src/view/task_spec.rs; 26 glimpse/src/view/plan_details.rs; 28 glimpse/src/source/doc.rs; 29 glimpse/src/view/doc_view.rs. Task 14 creates each file with only a doc line, so every one fails until its task lands.'''
effort = "small"
counter = "If libtest exited non-zero when a filter matched no test, or task 14's files already carried test modules, these entries would discriminate; neither holds (task 14's constraint allows only the module doc line)."
grade = "high"
evidence = [
    "tasks show 20: accept[1] check `cargo test --manifest-path glimpse/Cargo.toml rollup`, run_by covered, covered_by `cargo test --manifest-path glimpse/Cargo.toml`",
    "Existing glimpse #[test] names and module paths matched against each filter: authored, rollup, plan_state, task_spec, plan_details, source::doc, doc_view each match 0 of 659 tests today",
    "libtest with a filter matching nothing reports `test result: ok. 0 passed; ... N filtered out` and exits 0",
    "write-and-prove.md:161: a forward check `fails now, passes after the work` and `must exit non-zero when the behaviour does not hold`",
]
