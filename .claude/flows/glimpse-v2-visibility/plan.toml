decision = "Adopt the challenger's structure: one Target type with a single App::open and back stack, details builders that return their links, one read-only Plan surface over Tracking<R>, and a CursorList trait with App::list_mut in place of the Inbox-versus-items guard pairs."
why = "Links between ten kinds of record grow pairwise without a shared target, and a third list surface falls silently into the items branch of every guard pair."
provenance = "agent-assumed"
door = "two-way"
binds = [
    "glimpse/src/app.rs",
    "glimpse/src/surface.rs",
    "glimpse/src/view/details.rs",
    "16",
    "17",
    "21",
    "22",
    "24",
]
evidence = "Read glimpse/src/app.rs Action::Page, ScrollView, SwitchSurface, ItemMove, SelectItem, Back, has_cursor_row and copy_target; glimpse/src/surface.rs Surface, Tracking, InboxState and Tracked; glimpse/src/view/details.rs render. notes/structure-challenge.md and notes/surface-nav.md reach the same reading independently."
if_false = "Each link is its own action with its own destination-cursor code, and the Plan surface needs a guarded arm added by hand at every site notes/surface-nav.md lists."
revisit_if = ""
check = ""
surfaced = false
vetoed = false

[[decision.rejected]]
option = "Keep the present structure and add a handler per link"
because = "App::apply holds nine Inbox-versus-items guard pairs (Page, ScrollView, SwitchSurface, ItemMove, SelectItem and others) that route any third list to self.items, where items.get_mut returns None and the key does nothing"

