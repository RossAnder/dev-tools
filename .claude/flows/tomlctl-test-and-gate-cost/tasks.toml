id = 1
ref = "copy-a-git-init-template-in-the-test-sandbox"
title = "Copy a git init template in the test sandbox"
effort = "S"
status = "done"
checkpoint = "A"
phase = ""
phase_depth = 0
heading_depth = 3
files = ["tomlctl/tests/common/mod.rs"]
needs = []
coupling = []
deps_note = ""
action = "Make sandbox() copy a cached `git init` template into the new temp directory in place of running `git init` there."
detail = """Build the template once per machine under `env!("CARGO_TARGET_TMPDIR")`: run `git init -q .` through git_command in a uniquely named sibling directory, then rename it to the fixed template name; when the rename fails and the template directory now exists, another test process won: delete the loser and use the winner. When it fails and no template exists, something such as an antivirus scan holds the new directory: retry the rename a few times with a short pause before failing the test. Copy the template's `.git` tree directory by directory, creating every directory including empty ones: `git init` leaves `objects/info`, `objects/pack`, `refs/heads` and `refs/tags` empty, and git does not recognise a `.git` without `objects/` and `refs/`. Keep today's tolerance: when git cannot be started at all, sandbox() creates no `.git`, and when `git init` runs and fails the test fails with the same message. Each test is its own process under nextest, so the per-process cost left is the copy. Name the template directory after a hash of the git executable's path, size and modified time and of the modified time of the user's global git config file when one exists, found without starting a process (search PATH for the executable; the config is `.gitconfig` in the home directory), so a git upgrade or a config change builds a new template."""
acceptance = ""
agent = "plan-worker-deep"
commit = "2f22029e98b50ed348db70cd78562f78a6252e1a"

