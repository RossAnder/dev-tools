[[checkpoints]]
id = "A"
rationale = "Cheap cuts and the entry point: a sandbox without git init, a one-pass shell verifier, per-step gate stamps, and tomlctl::run_with with its per-run context."

[[checkpoints]]
id = "B"
rationale = "Tests run tomlctl in-process through one builder, and tomlctl and glimpse are one cargo workspace with one clippy."

[[checkpoints]]
id = "C"
rationale = "The suite passes in under 200 s: cut what still dominates after the in-process swap."

