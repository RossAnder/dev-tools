[[changes]]
at = 2026-11-13T12:11:51Z
ref = "cut-the-process-starts-that-still-dominate-the-suite"
field = "detail"
old = ""
new = "Three changes. (1) In tests/common/mod.rs, `Command::env_remove` of a variable outside OVERLAY_KEYS marks the command foreign only when `std::env::var_os` shows the test process has that variable; removing an absent variable changes nothing, so the command may run in-process. Setting a foreign variable still sends it to a child. Add a test beside the existing builder tests in that file for both cases. (2) In tests/output_options.rs, the five `cli(..)` commands call `.current_dir(..)` on the fixture root, which sends every one to a child process. Drop each call where the command still gives the same result: a case's argv then needs any path it names relative to the fixture root made absolute, by joining it to the run's root when the case is built for a run (the fixture root, or the isolated copy's root). The checks compare runs of one case with each other, so an absolute path is consistent between them; where a report echoes the path, mask the root as snapshot() already does. A case that cannot work without a working directory keeps its `.current_dir(..)` and is named in your note. (3) copy_tree's `fs::copy(..).unwrap()` panics when another worker thread's command removed a short-lived file between the directory listing and the copy: skip a source file that is NotFound at copy time, and keep panicking on any other error. Compile with `cargo clippy --manifest-path tomlctl/Cargo.toml --all-targets`, and run your own module with `cargo nextest run --manifest-path tomlctl/Cargo.toml -E 'test(/^(output_options|common)::/)'`."
actor = "orchestrator"
reason = "elaborating milestone C from a sampled suite run on milestone B (262 s, 3502 test-seconds): output_options is the heaviest module at 424 test-seconds because every command sets a working directory, and its plan group failed on the copy_tree race in two of three runs"

