new = """"The context's contents are in design/invocation.md#context, the accessors and their no-context fallbacks in #accessors, and ExitWith in #exit-marker. Provide an install guard that removes the context on drop, and a way to take the stdout and stderr buffers out when the run ends. An accessor whose fallback is private to another file returns an Option and leaves the fallback to its caller: `opts() -> Option<Option<&'static crate::output::OutputOpts>>` and `set_opts(&'static OutputOpts) -> bool`, `claim_stdin() -> Option<bool>` giving the previous claimed flag, and `with_stdout_buffer` returning None, each None or false with no context. Nothing calls the accessors yet; unit-test them in this file with a context installed and without one. In lib.rs add only the `mod invocation;` line. `std::io::stdout()` may not appear in this file: the `output_gate` test under src/cli/dispatch/tests allows it in output.rs only.""""
