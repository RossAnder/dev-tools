file = ".claude/flows/tomlctl-test-and-gate-cost/tasks.toml"
symbol = "copy-a-git-init-template-in-the-test-sandbox"
summary = "Task 1's rename race treats every rename failure as 'another process won'; on Windows a fresh dir's rename can also fail on an AV lock with no winner"
angle = "risk"
rationale = "On a fresh template key, every nextest process runs git init in its own sibling and races to rename it. On Windows a directory rename onto an existing one and a rename blocked by a scanner holding a just-written hook sample can both surface as os error 5, the same transient lock class CLAUDE.md records for the sidecar rename. A worker who reads the failure as 'lost the race' and opens the absent template fails the test; one who checks the template exists first and otherwise copies from its own sibling survives. Deleting the loser can fail the same way and should be ignored."
adoption_cost = "One sentence in task 1's detail: on a failed rename use the template if it exists, else copy from this process's own sibling; ignore a failed delete. Settle by running the first suite on a cleared target/tmp under Sophos and counting sandbox panics."
