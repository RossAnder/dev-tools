file = "docs/flows/tomlctl-test-and-gate-cost/design/invocation.md"
symbol = "child-tier"
summary = "Child-tier rule misses `agents record`, which calls set_current_dir, so an in-process run moves the test process into its sandbox"
severity = "minor"
failure_scenario = "After task 9, agents_record.rs's record(root, payload) runs in-process (cli() sets no current_dir). agents/record.rs calls std::env::set_current_dir(payload cwd = sandbox root), moving the test process's cwd. At test end TempDir's drop cannot delete a directory that is the process cwd on Windows (sharing violation, error ignored), so about 18 sandboxes with .git copies leak per suite run; under `cargo test --test it` the move also hits every concurrent test's cwd."
fix = "Add a fourth child-tier condition to design/invocation.md#child-tier: a command whose arguments name `agents record` starts the built binary, since that verb changes the process working directory. Implement it in task 9's builder (tests/common/mod.rs), or have the invocation context save and restore the cwd around a run."
effort = "small"
counter = "Refuted if agents record's set_current_dir is skipped when TOMLCTL_ROOT is set, or if the payload cwd in agents_record.rs tests is not the sandbox; agents/record.rs runs it whenever the payload cwd is a dir, and payload() sets cwd = root."
grade = "high"
evidence = [
    "tomlctl/src/agents/record.rs: `if !cwd.is_empty() && Path::new(cwd).is_dir() { std::env::set_current_dir(cwd)?; }`, unconditional on TOMLCTL_ROOT",
    'tomlctl/tests/agents_record.rs: payload sets "cwd": root; record() = record_with(cli(root), payload) with no current_dir; 20 tests in the file',
    "powershell: setting [Environment]::CurrentDirectory to a dir then Directory.Delete -> 'being used by another process'",
    "design/invocation.md#context: 'The context does not carry a working directory'; child tier triggers only on a command that sets one",
]
fix_files = ["tomlctl/tests/common/mod.rs"]
target = "design/invocation.md#child-tier"
expect = '"- the test asks for a process by building the command with `common::tomlctl_process()`."'
new = '''"- the test asks for a process by building the command with `common::tomlctl_process()`;\n- the command's arguments name `agents record`, which moves the process's working directory to the payload's `cwd`."'''
