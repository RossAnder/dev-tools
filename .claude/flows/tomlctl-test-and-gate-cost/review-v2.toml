summary = "Task 4 leaves the opts and claim_stdin accessor signatures open; their no-context fallbacks are private statics in files it may not touch"
severity = "major"
failure_scenario = "Task 4's executor writes invocation::opts/set_opts and claim_stdin but cannot fall back to OPTS (private, output.rs:81) or STDIN_CONSUMED (private, io.rs:255) without editing files outside its Files. It must invent signatures, e.g. set_opts(OutputOpts) storing an owned value. Task 6 then needs the context to hold a Box::leak'd &'static OutputOpts so opts() keeps returning &'static, and its constraint forbids editing invocation.rs, so it cannot land as written."
fix = "In task 4's Detail, settle the shapes: accessors whose fallback lives in another file return Option and the caller falls back. `opts() -> Option<Option<&'static crate::output::OutputOpts>>` (None with no context), `set_opts(&'static OutputOpts) -> bool` (false with no context), `claim_stdin() -> Option<bool>` (None with no context, else the previous flag), `with_stdout_buffer` returning None with no context."
effort = "trivial"
counter = "If invocation.rs were allowed to reach crate::output::OPTS and io::STDIN_CONSUMED (both would need pub(crate) edits in files task 4 does not list), the fallback could live in invocation.rs; neither is visible today."
grade = "high"
evidence = [
    "tomlctl/src/output.rs:81 `static OPTS: OnceLock<OutputOpts>` is private to output.rs",
    "tomlctl/src/io.rs:255 `static STDIN_CONSUMED` is private to io.rs",
    "task 6 detail: configure leaks one boxed OutputOpts and stores the reference in the context; task 6 files are output.rs and lib.rs only",
    "task 4 files: tomlctl/src/invocation.rs, tomlctl/src/lib.rs; constraint: touch no file outside this task's files",
]
