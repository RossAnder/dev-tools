schema_version = 2
last_updated = 2026-11-11

[binding]
branch = "main"
scope = []

[id_high_water]
D = 3

[[decision]]
id = "D1"
decision = "Cut the cause at authoring: Design guidance for few, wide milestones, a width finding in plan check and a per-plan --milestones flag. Add no lookahead to the implement-v2 engine."
why = "The idle time comes from how the plan is cut, and a cut fixed before approval costs nothing at run time."
provenance = "user-stated"
door = "two-way"
binds = [
    "claude/skills/plan-v2-engine/references/write-and-prove.md",
    "tomlctl/src/plan/check.rs",
    "claude/commands/plan-v2.md",
    "1",
    "3",
    "4",
]
evidence = "read claude/workflows/implement-v2-milestone.js, run-milestone.md and write-and-prove.md; the user's answers of 2026-11-11"
if_false = "The engine gains a lookahead launch mode with gate attribution, a larger plan"
revisit_if = ""
check = ""
surfaced = true
vetoed = false

[[decision.rejected]]
option = "Lookahead for any file-disjoint row"
because = "an earlier gate would build later-milestone source, so a later row's compile error fails a gate whose commit does not hold it"

[[decision.rejected]]
option = "Lookahead for rows that compile nothing"
because = "tomlctl's lint tests read claude/**/*.md, so even those rows can fail an earlier gate, and the user chose authoring instead"

[[decision]]
id = "D2"
decision = "Report width as one info finding per milestone, class plan/milestone-width, before the first approval only: a row is named when every milestone holding one of its direct needs comes before the milestone immediately preceding its own, or it has no needs and is not in the first milestone."
why = "The pool orders rows inside one launch by needs, so a row can join any milestone from the latest one holding a direct need; anything later is the cut's choice."
provenance = "agent-assumed"
door = "two-way"
binds = [
    "tomlctl/src/plan/check.rs",
    "1",
    "2",
]
evidence = "read file_chain_findings in tomlctl/src/plan/check.rs and the pool in claude/workflows/implement-v2-milestone.js"
if_false = "The finding would name rows that could not in fact start earlier"
revisit_if = ""
check = ""
surfaced = false
vetoed = false

[[decision.rejected]]
option = "Compare each milestone's size with the tasks batches layers"
because = "a layer count names no row to move, and rows chained inside one milestone are not the cut's fault"

[[decision.rejected]]
option = "A warning or an error"
because = "a narrow cut for a gate or a replan point is legitimate, and plan/file-only-chain set info as the class for findings a reader judges"

[[decision]]
id = "D3"
decision = "Make --milestones few|default a /plan-v2 session argument that is not stored, like --depth: few means one milestone for the whole plan, with another only where a milestone must be deferred; default follows the Design guidance."
why = "It changes only how the planner cuts at Design, and the store already holds the result."
provenance = "agent-assumed"
door = "two-way"
binds = [
    "claude/commands/plan-v2.md",
    "claude/skills/plan-v2-engine/SKILL.md",
    "3",
    "4",
]
evidence = "read the Arguments and Re-entry sections of claude/skills/plan-v2-engine/SKILL.md, where --depth, --no-review and --review are taken from the session"
if_false = "A resumed session would need the flag passed again, which is already true of --depth"
revisit_if = ""
check = ""
surfaced = false
vetoed = false

[[decision.rejected]]
option = "A stored policy field"
because = "nothing reads it after Design, and a new store key needs schema, view and render changes for no reader"

