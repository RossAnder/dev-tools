[[items]]
id = 3
ref = "say-in-the-plan-v2-design-and-prove-steps-how-to-cut-milestones"
title = "Say in the plan-v2 Design and Prove steps how to cut milestones"
effort = "S"
status = "done"
checkpoint = "A"
phase = ""
phase_depth = 0
heading_depth = 3
files = ["claude/skills/plan-v2-engine/references/write-and-prove.md"]
needs = []
coupling = []
deps_note = ""
action = "Add milestone-cut guidance to section 1's Milestones paragraph and the plan/milestone-width finding to section 4a."
detail = """
In section 1, after the `plan milestone add` command block and before the gate-probe paragraph, add a paragraph headed `**How many.**` saying, in the file's own plain style:
- `/implement-v2` launches one milestone at a time and stops at each boundary for a drain, a gate and two commits, so a row waits for its milestone even when everything it needs is done.
- Default to one milestone. Cut another only where the plan wants a gate that must pass before later work starts, a point to replan from what earlier rows produce, or a deferred milestone.
- Do not cut by theme: rows about different subjects that need nothing from each other belong in one milestone, where the pool runs them together.
- A row goes in the earliest milestone its `needs` allow.
- With `--milestones few` the plan has one milestone, and a second only where one must be deferred; say at the gate when a wanted gate or replan point was given up for it.

In section 4a, after the sentence about `plan/file-only-chain`, add: a `plan/milestone-width` info finding names rows that could start with an earlier milestone; move each to the milestone its `detail` names with `tasks update --ndjson`, or merge the two milestones, unless the boundary is one the `How many` rule calls for, and with `--milestones few` clear every one."""
acceptance = ""
agent = "plan-worker-lite"
commit = "8686bc0840a6c230713697c34258b57dac8139f2"

