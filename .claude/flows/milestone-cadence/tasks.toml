[[items]]
id = 1
ref = "report-rows-waiting-behind-a-milestone-boundary-in-plan-check"
title = "Report rows waiting behind a milestone boundary in plan check"
effort = "M"
status = "done"
checkpoint = "A"
phase = ""
phase_depth = 0
heading_depth = 3
files = [
    "tomlctl/src/plan/check.rs",
    "tomlctl/tests/plan_check.rs",
    "tomlctl/tests/plan_milestone.rs",
    "tomlctl/tests/plan_probes.rs",
]
needs = []
coupling = []
deps_note = ""
action = "Add the info class plan/milestone-width to tomlctl plan check, raised before the first approval only, beside file_chain_findings."
detail = """
Milestone order is the store's `[[checkpoints]]` order. For a row in the milestone at index i > 0, take the highest index among the milestones holding its direct `needs` (0 when it has none; a need in the row's own milestone gives i). The row waits behind a boundary when that index is below i - 1, or when it has no needs at all. Raise one finding per milestone holding such rows: `ids` the rows, sorted; `detail` naming the milestone, for each row the earliest milestone it could join, and the count of such rows against the milestone's row count. Call it from the same `plan.approvals.is_empty()` branch as `file_chain_findings`, and update the module doc line that says which classes are info.

Tests go in `tomlctl/tests/plan_check.rs`, with `milestone_width` in each test name: a two-milestone unapproved store whose second milestone holds a row with no needs is reported at info with that row's id and exit 0; a row needing a row of the milestone just before its own is not reported; an approved store gets no such finding; a one-milestone store gets none. An existing fixture in `plan_check.rs`, `plan_milestone.rs` or `plan_probes.rs` that now raises the finding is changed by giving its later row a need on the earlier milestone, or by asserting the new finding where the test is about findings. Run only `cargo nextest run --manifest-path tomlctl/Cargo.toml -E 'binary(plan_check) | binary(plan_milestone) | binary(plan_probes)'`."""
acceptance = ""
agent = "plan-worker-deep"
commit = "8686bc0840a6c230713697c34258b57dac8139f2"

