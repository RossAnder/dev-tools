summary = "Primary-key type is never specified (UUID? autoincrement? text?) — load-bearing for the export filename <id>.toml, FKs, and route parsing across Tasks 3/4/6/9"
description = "The export path ./.lumina/export/<kind>/<id>.toml needs stable IDs (an autoincrement integer is non-portable across DB rebuilds and undercuts the DB-canonical-with-git-export thesis); create_work_item 'returns id', the route is /api/work-items/{id}, and events.aggregate_id must match work_items.id's type. Recommend `id TEXT PRIMARY KEY` holding a UUIDv7 generated app-side in repo. State this once in Task 2 to de-risk Tasks 3/4/6/10."
