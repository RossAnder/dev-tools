plan_section = "#### 2. SQLite schema + migrations + db module [M]"
summary = "A SQLite CHECK constraint cannot subquery the parent's kind; 'via a parent-kind lookup or trigger' is both impossible (as a pure CHECK) and an unsettled architectural fork"
description = "SQLite CHECK can only reference columns of the row being inserted, so it cannot read work_items.parent.kind. Enforcing legal parent/child kinds requires a BEFORE INSERT/UPDATE trigger, OR a denormalised parent_kind column the repo layer populates so a pure-column CHECK works — two materially different designs. Pin the mechanism in Task 2 and state whether Task 3's hierarchy validation is the sole guard or belt-and-braces (allocate enforcement to one layer to avoid the dual-enforcement drift this project exists to eliminate)."
dedup_id = "e87de05a0339d3d3"

