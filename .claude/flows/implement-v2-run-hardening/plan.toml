[[decision]]
id = "D12"
decision = "A task store holding an effect mark is stamped schema_version 4, and a plan store holding a visual acceptance takes the next write tier, so an older binary refuses the store instead of dropping the keys."
why = "Both stores are re-emitted from their typed shape on every write, so an older binary silently drops unknown keys."
provenance = "user-confirmed"
door = "one-way"
class = "compromise"
binds = [
    "tomlctl/src/tasks/schema.rs",
    "tomlctl/src/plan/schema.rs",
    "2",
    "11",
]
rejected = []
evidence = "read tomlctl/src/tasks/schema.rs SCHEMA_VERSION and holds_v3_keys, tomlctl/src/plan/schema.rs write_version; confirmed at the second read-back"
if_false = "marks and waivers written by a new binary vanish on the next write by an old one"
revisit_if = ""
check = ""
surfaced = true
vetoed = false

