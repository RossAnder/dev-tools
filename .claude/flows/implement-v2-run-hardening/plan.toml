because = "a waiver stored as a run skip row is unstructured and reads as not run"

[[decision.rejected]]
option = "Prose only"
because = "holding, staging and transcription would stay manual, which is what failed on partnerhub_pages milestone C"

[[decision]]
id = "D2"
decision = "Cut two milestones by what runs where: A holds every tomlctl change and ends by installing the binary; B holds every engine, worker and carrier prose change, written against the installed binary."
why = "Engine prose is live the moment it is written, so prose that calls a verb must land after the binary that has it is installed."
provenance = "user-stated"
door = "two-way"
class = "structure"
binds = [
    "tomlctl/src/tasks/schema.rs",
    "tomlctl/src/plan/schema.rs",
]
evidence = "plan review U1 findings F4, F6, F8, F9 and F18; asked after the review"
if_false = "prose tasks move back beside their verbs and need a fallback for a binary that lacks them"
revisit_if = ""
check = ""
surfaced = true
vetoed = true

[[decision.rejected]]
option = "A for commit and gate work, B for the visual pass"
because = "A's own drain would follow rewritten prose on a binary without the verbs, and a failed A could not be resumed"

[[decision.rejected]]
option = "Keep that cut with capability-gated fallbacks"
because = "it leaves bootstrap-only prose in drain.md"

[[decision.rejected]]
option = "Three milestones"
because = "one more drain and full-suite gate than the work needs"

