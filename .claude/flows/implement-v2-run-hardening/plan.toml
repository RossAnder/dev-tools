[[decision]]
id = "D10"
decision = "Only fix tasks minted by the visual pass capture: the mint writes the capture command, a per-task output directory, the states and the defect into the task's spec, and the worker procedure permits that one capture and a read of its result. A capture failure naming no file of the task's own is noted and returned."
why = "A look fix that regresses a sibling look otherwise surfaces only at the next pass and can spend the last round; original UI rows would add captures against a tree siblings are still editing."
provenance = "user-confirmed"
door = "two-way"
class = "ux"
