[[items]]
id = 1
ref = "add-the-plan-emit-commit-paths-leaf"
title = "Add the plan emit commit-paths leaf"
effort = "M"
status = "pending"
checkpoint = "A"
phase = ""
phase_depth = 0
heading_depth = 3
files = [
    "tomlctl/src/plan/commit_paths.rs",
    "tomlctl/src/plan/mod.rs",
    "tomlctl/src/plan/emit.rs",
    "tomlctl/src/plan/drift.rs",
    "tomlctl/src/cli/types/plan.rs",
    "tomlctl/tests/plan_commit_paths.rs",
    "tomlctl/tests/it.rs",
    "tomlctl/tests/output_options.rs",
    "claude/skills/tomlctl/references/plan-engine.md",
    "claude/skills/tomlctl/SKILL.md",
]
needs = []
coupling = []
deps_note = ""
action = "Add `tomlctl plan emit commit-paths --slug <slug> --milestone <id> --for work|flow`, which prints the paths one of the drain's two commits stages."
detail = "Each call does its own `git status` read (porcelain v1, -z, --no-renames, --untracked-files=all, as `uncommitted_files` in drift.rs does) with NO flow-directory skip; give `uncommitted_files` a skip parameter or add a second caller of `parse_status`, and leave what `plan drift` and `plan emit lane-check` print unchanged. `--for work` prints `{paths, ignored, unmatched}`: `paths` is every changed path, in git's spelling, that a row with `checkpoint = <id>` names in `files` (matched through `normal_path`, deletions included); `unmatched` is the row files that matched no changed path; `ignored` is `[{path, rule}]` for row files the ignore rules hide, `rule` being what `git check-ignore -v` prints. `--for flow` prints `{paths, ignored}`: every changed path under `.claude/flows/<slug>/` and `docs/flows/<slug>/notes/run/`, plus `.claude/backlog.toml` and `.claude/inputs.toml` with their `.sha256` sidecars when changed, plus each review store that the `[[finding_links]]` entry of a row of this milestone (matched by `ref`) names outside the flow directory with its sidecar when changed, less any path `--for work` would print; `ignored` for this form comes from a second status read with `--ignored=matching` over the same pathspecs (the flow store directory, `docs/flows/<slug>/notes/run/`, the backlog and inputs pairs, the linked review stores), since a plain status read omits ignored files: each `!!` path is listed with its `git check-ignore -v` rule. Every list is a JSON array so `--get paths` prints one unquoted path per line. Register like `lane-check`: a `CommitPaths` variant and args struct in `PlanEmitOp` (cli/types/plan.rs), an arm in `emit::dispatch`, the `mod` line, loading through `load_milestone_store` so an unknown milestone is refused. Add the case in tests/output_options.rs beside the other emit leaves (it needs `.git()`), the new test module's `mod` line in tests/it.rs, and a `## plan emit commit-paths` section with flag table and output keys in references/plan-engine.md plus its synopsis and contents entries, and the `plan emit` routing row and reference blurb in the tomlctl SKILL.md. Tests in tests/plan_commit_paths.rs cover: a changed row file under `docs/flows/<slug>/notes/` appears in `--for work`; a row file with no change is `unmatched`; `--for flow` lists the store, a run note and the backlog pair and omits a path the work list holds; an unknown milestone is refused; `--for flow` lists a changed review store that a row's `[[finding_links]]` entry names outside the flow directory, with its sidecar, and a changed `.claude/inputs.toml` pair; a changed row file the ignore rules hide is in `ignored` with its rule and in no `paths`; a deleted row file is in `--for work`'s `paths`. Run your own narrow check with `cargo nextest run --manifest-path tomlctl/Cargo.toml -E 'test(/^plan_commit_paths::/)'`. Add a test where a gate log under the flow directory, hidden by an ignore rule, appears in `--for flow`'s `ignored` with its rule."
acceptance = ""
agent = ""
commit = ""

[[items]]
id = 2
ref = "store-the-external-effect-mark-on-accept-entries-and-milestones"
title = "Store the external-effect mark on accept entries and milestones"
effort = "M"
status = "pending"
checkpoint = "A"
phase = ""
phase_depth = 0
heading_depth = 3
files = [
    "tomlctl/src/tasks/schema.rs",
    "tomlctl/src/tasks/add.rs",
    "tomlctl/src/tasks/update.rs",
    "tomlctl/src/tasks/show.rs",
    "tomlctl/src/tasks/snapshot.rs",
    "tomlctl/src/tasks/milestones.rs",
    "tomlctl/src/plan/store.rs",
    "tomlctl/src/plan/lane.rs",
    "tomlctl/src/plan/milestone.rs",
    "tomlctl/tests/tasks_spec_add.rs",
    "claude/skills/tomlctl/references/tasks-write.md",
    "claude/skills/tomlctl/references/tasks-store.md",
]
needs = []
coupling = []
deps_note = ""
action = "Add an optional `effect` key to an accept entry and an `external_gates` list to a milestone, and stamp a store that holds either at schema_version 4."
detail = """`Accept` gains `effect` (empty or `external`), wired wherever `covered_by` is: the `ACCEPT_FIELDS` whitelist and `accept_entry` in tasks/add.rs, `accept_from_toml` and `accept_to_toml` (written only when set), the `accept_json` projection in tasks/show.rs, tasks/snapshot.rs, and `entry_matches` in plan/store.rs. An unknown `effect` value is refused naming the vocabulary. `Accept::owner_problem` gains an arm refusing `effect = "external"` unless the entry's owner is `gate`, so the parser and `plan check` both enforce it and `plan probes` can never run a marked command. `MilestoneSpec` gains `external_gates: Vec<String>`, read and written by `milestone_from_toml` and `milestone_to_toml` only when non-empty; no CLI flag sets it in this task. Every `Accept` and `MilestoneSpec` struct literal in this task's files gains the new field (plan/milestone.rs holds two more `MilestoneSpec` literals: give each the empty list and change nothing else in that file, which the next task extends). Raise `SCHEMA_VERSION` to 4 and add a `holds_v4_keys` predicate beside `holds_v3_keys` so only a store holding an `effect` or a non-empty `external_gates` is stamped 4; a store holding neither keeps the stamp it has today. Document the `effect` key in the `spec` row of references/tasks-write.md and the accept-owner section of references/tasks-store.md, and `external_gates` and the version-4 stamp in tasks-store.md's store shape. Tests: an `effect = "external"` entry with `run_by = "gate"` round-trips and stamps 4; the same mark on a worker-owned, `covered` or `look` entry is refused; a store with no mark keeps its stamp. Keep a separate constant for the version-3 stamp that `holds_v3_keys` selects, so raising `SCHEMA_VERSION` (the newest version read) to 4 does not restamp a version-3 store."""
