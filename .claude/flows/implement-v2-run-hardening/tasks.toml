detail = """The record holds `milestone`, `round`, `at` (stamped by the verb), `why`, `states`, `looks` (`[{task, accept}]`), `defects` (`[{state, class, location, detail, note}]`, `state` required and one of the record's `states`, the other four strings that may be empty) and `backlog`. The payload carries `why`, `states`, `looks`, `defects` and `backlog`; an unknown key is refused naming the accepted set. `--accept` is a required bare flag, leaving room for another mode. Refuse: a blank `why`; an empty `states`; a state that is not in the milestone's `ui_states` (a control is not a state); a `looks` entry that is not a `run_by = "look"` accept entry, by the 0-based index `gate-list`'s `visual.looks` prints as `accept`, on a row whose `checkpoint` is the milestone; a `backlog` that is not a non-blank id; an unknown milestone. The verb cannot know which states failed and does not try. A second call for the same milestone and round replaces that record. Add the array to `PlanStore`, its `from_toml` and `to_toml` and its `Default`, written only when non-empty, and give `write_version` a tier above the current highest that applies only when the array is non-empty, so a store without an acceptance keeps its stamp; fill every `PlanStore` literal in this task's files. Register the leaf in `PlanRunOp` and the plan run dispatch, with its `mod` line. Prints `{"ok":true,"milestone":"<id>","round":<n>}`. Add the case to tests/output_options.rs, a `## plan run visual` section with flag table, payload keys and output to references/plan-run.md, and the array with its keys and the new stamp to references/plan-store.md. Tests in tests/plan_run_records.rs: a valid acceptance is stored and round-trips, and a later unrelated plan write keeps it; a control named as a state, a non-look entry and a blank why are each refused; a second call for the same round replaces the first; a store without the array keeps its version. `SCHEMA_VERSION` in plan/schema.rs is both the newest stamp read and the request tier: raise the read ceiling by one for the acceptance tier and keep the request tier at its present number under its own name."""
