[[findings]]
id = "F1"
run = "U1"
cell = "C9"
seen_in = ["U1"]
family = "plan"
kind = "defect"
lens = "plan-executor"
route = "verifier"
file = ".claude/flows/implement-v2-run-hardening/tasks.toml"
symbol = "advertise-the-milestone-a-features-and-bump-tomlctl-to-0260"
summary = "Bumping to 0.26.0 breaks two version-pin tests the Detail never tells the worker to update, so the capabilities:: accept fails"
severity = "major"
failure_scenario = """The worker follows Detail (1)-(6) and the 'Add no code beyond the feature strings' constraint: Cargo.toml becomes 0.26.0, but capabilities_version_matches_cargo_toml still asserts the literal "0.25.0" and the README sample block still says "version": "0.25.0", so readme_sample_version_matches_cargo_toml fails too. The accept `cargo nextest run ... -E 'test(/^capabilities::/)'` and milestone A's suite gate fail, costing a fix round."""
fix = """In Detail (2) also change the literal in capabilities_version_matches_cargo_toml to "0.26.0" (and its message), and in (3) also change the README sample block's "version" to "0.26.0"."""
effort = "trivial"
counter = "A worker that reads the whole capabilities test file before editing might bump the pins anyway, despite the constraint; the plan text still does not ask for it."
grade = "high"
evidence = [
    """tomlctl/tests/capabilities.rs:1918 asserts version == "0.25.0" (literal, 'Bump both in lockstep')""",
    "tomlctl/tests/capabilities.rs:2667 readme_sample_version_matches_cargo_toml compares README sample version with CARGO_PKG_VERSION",
    'tomlctl/README.md:337 sample block holds "version": "0.25.0"',
]
fix_files = [
    "tomlctl/tests/capabilities.rs",
    "tomlctl/README.md",
]
