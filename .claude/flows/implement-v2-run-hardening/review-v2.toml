symbol = "let-plan-run-gate-read-the-verification-agents-blocks"
summary = "--blocks tests omit the flaky block, the pass exit 0 (D7) and a pass line ending | retried: transient, all in verification.md's format"
effort = "small"
counter = "The listed fail-block test might also hold a flaky block; the detail names only a fail block, a quoted command, a .ids file and the flag conflict."
edit = "Extend the detail's test list with the pass-then-flaky-then-fail example from verification.md (three rows: pass with exit 0 and empty summary, flaky with failed_ids, fail with tail; no key from rerun:, TANGENTIAL:, not_run:) and a pass line ending | retried: transient whose log excludes the tail."
direction = "change"
target = "task:let-plan-run-gate-read-the-verification-agents-blocks.detail"
expect = """"`--blocks` takes a file path or `-` for stdin and excludes `--ndjson`; exactly one of the two is required. The parser lives in the new plan/gate_blocks.rs and yields the same row shape `parse_row` reads, so everything after parsing (the `--rerun` merge, the kept log tail) is unchanged. The format is fixed by claude/agents/verification.md, which this task does not edit. A pass is one line `outcome: pass | command: <command> | duration: <n> | summary: <text> | log: <path>` with an optional ` | retried: transient` tail; read `command` from after `command: ` up to the last ` | duration: ` that is followed by an integer and ` | summary: `, and `summary` up to the last ` | log: `, because a command may hold a shell pipe and a vitest summary holds ` | `. A pass row gets `exit = 0`; `summary: none` is the empty summary. A fail, timeout or flaky result is a block opening with a `command: <command>` line directly followed by a line starting `outcome: `, then `exit:` (`none` means absent), `duration_s:`, `log:`, `summary:` and optional `failed_ids:`, `retried:`, `rerun:` and a final `tail:` followed by raw log lines. A tail runs until a `command: ` line directly followed by an `outcome: ` line, a line starting `outcome: pass | command: `, a line starting `not_run:`, or the end; `retried:`, `rerun:`, `tail:`, `TANGENTIAL:` and `not_run:` lines produce no row key. For `failed_ids`, when `<log>.ids` exists beside the block's log (read through the same temp-directory allowance `read_temp_log` uses), take its lines, one id each; otherwise split the block's `failed_ids:` value on spaces and drop a trailing `(+<n> more)`. A refused-command block carrying only `command`, `outcome`, `exit: none` and `tail:` parses with the verb's defaults. Text that yields no row is refused. Document the flag in the `plan run gate` flag table and synopsis of references/plan-run.md, with the failed-ids rule. Tests in tests/plan_run_records.rs: a pass line whose command holds a pipe and whose summary holds ` | `; a fail block whose tail contains a line starting `command:`; a command with both quote kinds and a backslash stored byte for byte and replaced, not duplicated, under `--rerun`; ids read from a `.ids` file with a space inside an id; `--blocks` with `--ndjson` refused.""""
new = """"`--blocks` takes a file path or `-` for stdin and excludes `--ndjson`; exactly one of the two is required. The parser lives in the new plan/gate_blocks.rs and yields the same row shape `parse_row` reads, so everything after parsing (the `--rerun` merge, the kept log tail) is unchanged. The format is fixed by claude/agents/verification.md, which this task does not edit. A pass is one line `outcome: pass | command: <command> | duration: <n> | summary: <text> | log: <path>` with an optional ` | retried: transient` tail; read `command` from after `command: ` up to the last ` | duration: ` that is followed by an integer and ` | summary: `, and `summary` up to the last ` | log: `, because a command may hold a shell pipe and a vitest summary holds ` | `. A pass row gets `exit = 0`; `summary: none` is the empty summary. A fail, timeout or flaky result is a block opening with a `command: <command>` line directly followed by a line starting `outcome: `, then `exit:` (`none` means absent), `duration_s:`, `log:`, `summary:` and optional `failed_ids:`, `retried:`, `rerun:` and a final `tail:` followed by raw log lines. A tail runs until a `command: ` line directly followed by an `outcome: ` line, a line starting `outcome: pass | command: `, a line starting `not_run:`, or the end; `retried:`, `rerun:`, `tail:`, `TANGENTIAL:` and `not_run:` lines produce no row key. For `failed_ids`, when `<log>.ids` exists beside the block's log (read through the same temp-directory allowance `read_temp_log` uses), take its lines, one id each; otherwise split the block's `failed_ids:` value on spaces and drop a trailing `(+<n> more)`. A refused-command block carrying only `command`, `outcome`, `exit: none` and `tail:` parses with the verb's defaults. Text that yields no row is refused. Document the flag in the `plan run gate` flag table and synopsis of references/plan-run.md, with the failed-ids rule. Tests in tests/plan_run_records.rs: a pass line whose command holds a pipe and whose summary holds ` | `; a fail block whose tail contains a line starting `command:`; a command with both quote kinds and a backslash stored byte for byte and replaced, not duplicated, under `--rerun`; ids read from a `.ids` file with a space inside an id; `--blocks` with `--ndjson` refused; the pass-then-flaky-then-fail example in the Output section of claude/agents/verification.md, with its log paths moved into the test's temp directory, yields three rows (the pass with `exit = 0` and an empty `summary`, the flaky with its `failed_ids` and `exit = 100`, the fail with its tail) and no row or key from the `rerun:`, `TANGENTIAL:` or `not_run:` lines; a pass line ending ` | retried: transient` stores its `log` without that tail.""""
