severity = "minor"
failure_scenario = "Writing the plan-worker-procedure carve-out, the executor must state the status for a capture that fails on a sibling's file. The worker statuses carry different drain consequences: `failed` sends the row to replan, `parked` stalls dependents and asks the user, `done` lets the visual pass recapture. Neither the Detail, D10 nor the brief picks one, so two executors write different contracts into both workers."
fix = "State in the Detail that the worker returns `done`, recording the capture failure and the file it names in the note's checks, since the edit is complete and the next visual pass recaptures; a failure naming one of its own files is fixed before returning."
effort = "trivial"
counter = "If the worker procedure already maps 'a check that fails on a file you do not own' to one status, the carve-out inherits it; plan-worker-deep.md's procedure was not found to say so for captures."
grade = "medium"
evidence = [
    "task 15 Detail: 'when the capture fails naming no file of its own task it notes the failure and returns without repairing anything'",
