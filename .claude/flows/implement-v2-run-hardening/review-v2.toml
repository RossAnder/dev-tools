[[findings]]
id = "F24"
run = "U2"
cell = "C14"
seen_in = ["U2"]
family = "plan"
kind = "defect"
lens = "plan-executor"
route = "verifier"
file = ".claude/flows/implement-v2-run-hardening/tasks.toml"
symbol = "let-a-visual-fix-tasks-worker-capture-its-own-states"
summary = "'look defect' in visual.md's vocabulary is one class; read so, the capture means skips rubric-class fixes like the clipped-descender case that motivated it"
severity = "major"
failure_scenario = "The worker edits visual.md's Fix tasks, where 'a `look` defect' (line 152, 154) is contrasted with 'any other defect' (rubric classes such as clipping). Following 'a fix task minted for a look defect' literally, it adds the capture means only to look-class fixes. A round-1 clipping fix (B-799bfc99: clipped descenders, whose fix broke an ellipsis) then gets no self-capture and the regression again surfaces only in round 2. The other reading (every non-capture fix) differs, so two workers diverge."
fix = "Settle the scope in the Detail (and the Action's 'look-defect fix task'): every fix task minted for a defect, a `look` defect or any other, carries the outcome details and the capture means; only a capture-failure task carries none. Every such task already holds one look entry (copied or new), so 'one --only per state of the task's look entry' works for both."
effort = "trivial"
counter = "If the plan meant 'look defect' as any visual-pass defect, the Constraint 'Only fix tasks minted by the visual pass capture' and 'A capture-failure task carries no such entry' imply it, but the worker edits a file where the term is a defined class."
grade = "high"
evidence = [
    "claude/skills/implement-v2-engine/references/visual.md:152 'for a `look` defect, ... For any other defect, the files of the milestone's rows that render the state'",
    "claude/skills/implement-v2-engine/references/visual.md:154 'for a `look` defect, the failed entry ... for any other defect, a new entry naming the state'",
