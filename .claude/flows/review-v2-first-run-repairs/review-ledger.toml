[[items]]
id = "R1"
first_flagged = 2026-11-10
rounds = 1
status = "fixed"
flow = "review-v2-first-run-repairs"
file = "tomlctl/src/review/runs.rs"
line = 74
symbol = "start"
severity = "warning"
effort = "small"
category = "security"
summary = "With --head, the project-lens-layer guard checks base..head but the layer is loaded from the working tree"
description = "run start refuses when the reviewed range touches .claude/review-lenses, since that config can carry a project check command the verification agent runs. With --head the guard range is base..head (runs.rs:74, passed to project_layer_changes at runs.rs:274), but catalogue::project_layer still loads the working-tree layer and require_descendant never ties head to HEAD. A commit in head..HEAD (or an uncommitted edit, even without --head) that changes the layer is loaded unguarded. Fix: diff base against the working tree (git diff --name-only <base> -- .claude/review-lenses), update review-runs.md:28 and review-v2-engine/SKILL.md:115, add a --head case beside the layer-refusal test in tests/review_runs.rs."
evidence = [
    "tomlctl/src/review/runs.rs:62-74",
    "tomlctl/src/review/runs.rs:273-274",
    "tomlctl/src/review/catalogue.rs:2227-2236",
    "repro on tomlctl 0.22.0: run start --base HEAD~2 --head HEAD~1 returned ok with a project check command=echo pwned listed by review catalogue; same start without --head was refused",
]
dedup_id = "9ef59f4a7fb7727f"
resolved = 2026-11-10
resolution = "uncommitted: project_layer_changes compares --base with the working tree (tracked diff plus untracked and ignored files), so a layer changed after --head or left uncommitted is refused; tests added in review_runs.rs; review-runs.md and review-v2-engine/SKILL.md state the rule"

