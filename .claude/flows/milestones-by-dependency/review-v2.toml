[[findings]]
id = "F16"
run = "U1"
cell = "C5"
seen_in = ["U1"]
family = "plan"
kind = "defect"
lens = "plan-dependencies"
route = "verifier"
file = "docs/flows/milestones-by-dependency/design/schedule.md"
symbol = "states"
summary = "No state for a milestone held only by an unstarted parked row: it reads `runnable`, is picked first every time, and holds independent later milestones"
severity = "minor"
failure_scenario = "Milestone M's row 1 is parked by the orchestrator before any worker ran it, and M's other rows need row 1; independent milestone N follows M in store order. No row of M is started, so M is `runnable`; rule 3 picks the first runnable, M. Re-entry re-asks, the user leaves row 1 parked, nothing launches and the invocation ends; every later invocation picks M again, so N never runs. D14 and task 15 say a parked row holds only its own milestone and those downstream of it."
fix = "Add a state between `waiting` and `runnable`: `parked` when no row is started and every row not `done` is `parked` or reaches a `parked` row of the milestone through `needs` or `coupling`. In The pick, rule 3 becomes: the first `runnable` milestone in store order; when none is, the first `parked` one, so Re-entry re-asks its rows; empty when neither exists. Add the case to task 3's unit tests."
effort = "small"
counter = "If Re-entry or the drain never parks a row before a worker has run it, every parked milestone is already `started` and D8 holds everything by design; run-milestone.md:37 names rows parked by the orchestrator before any worker ran as a real case."
grade = "medium"
evidence = [
    "design/schedule.md:18-33: no state reads `parked`; `runnable` is 'None of the above'; rule 3 picks the first runnable in store order",
    "plan.toml D14: 'a parked row holds back its own milestone and its downstream milestones'; task 15 detail repeats it",
    "claude/skills/implement-v2-engine/references/run-milestone.md:37: 'A row never started, pending or parked by the orchestrator before any worker ran it'",
    "claude/skills/implement-v2-engine/SKILL.md:113: a row the user leaves parked stays parked and the milestone cannot gate",
]
target = "design/schedule.md#states"
expect = '"| `runnable` | None of the above | — |"'
tier = "advisory"
same_as = "F19"
anchor = "plan|docs/flows/milestones-by-dependency/design/schedule.md|states"
outcome = "repeat"
status = "merged"
first_seen = 2026-11-16
merged_into = "F19"

