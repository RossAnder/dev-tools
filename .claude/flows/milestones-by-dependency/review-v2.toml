route = "verifier"
file = ".claude/flows/milestones-by-dependency/tasks.toml"
symbol = "let-the-fan-out-check-exclude-paths-and-tolerate-commits-to-them"
summary = "The HEAD-move rule passes vacuously when HEAD moves to an ancestor or rewinds: `git log <before>..HEAD` lists no paths"
severity = "major"
failure_scenario = "A cold reader running under an `--exclude` snapshot runs `git reset --hard HEAD~1`, or checks out an older commit. `git log --format= --name-only <before>..HEAD` prints nothing, so 'every path lies under an excluded path' holds for the empty list and HEAD does not count as changed. With a clean tree, status and `git diff HEAD` are empty both times, so `check` exits 0 even though the commit that touched non-excluded files was dropped. This contradicts the Outcome, which says any write outside the named paths is still caught. Probed in a temp repo: after a rewind the log range printed 0 lines."
fix = "Tolerate a HEAD move only when `git merge-base --is-ancestor <before> HEAD` holds. List paths with `git diff --name-only <before> HEAD`, which also covers content a merge commit introduces itself. Any other move reports `head changed` as today. Add a test case: a rewind past a commit that touched another file exits 1."
effort = "small"
counter = "If the fan-out callers also compare `git rev-parse HEAD` against head-before.txt on their own (write-and-prove.md:344 does so for relaunch only), a rewind would be caught there; for the post-run check it is not."
grade = "high"
evidence = [
    "Temp-repo probe, git 2.56.0: `git log --format= --name-only HEAD..<older>` printed 0 lines",
    "fanout-check.sh:39: the diff capture is `git diff HEAD`, so after `reset --hard` to a clean ancestor both captures are empty and equal",
    "task Outcome: 'while any write outside the named paths is still caught'",
]
target = "task:let-the-fan-out-check-exclude-paths-and-tolerate-commits-to-them.detail"
tier = "advisory"
anchor = "plan|.claude/flows/milestones-by-dependency/tasks.toml|let-the-fan-out-check-exclude-paths-and-tolerate-commits-to-them"
status = "resolved"
first_seen = 2026-11-16
resolution = "fixed by the plan author at triage: task details, file notes, accept checks and the schedule design revised as the finding proposed"
resolved = 2026-11-16
addressed = ["task:let-the-fan-out-check-exclude-paths-and-tolerate-commits-to-them.detail"]

