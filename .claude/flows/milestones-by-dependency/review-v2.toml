file = ".claude/flows/milestones-by-dependency/tasks.toml"
symbol = "let-the-fan-out-check-exclude-paths-and-tolerate-commits-to-them"
summary = "Tolerated paths omit .claude/backlog.toml and its sidecar, which every implement-v2 flow-store commit stages, so a concurrent cold read still fails"
severity = "major"
failure_scenario = "An elaboration's cold read runs beside /implement-v2. The milestone drains: step 8 runs `backlog add`, step 10 runs `backlog reconcile --apply`, then the flow-store commit stages `.claude/backlog.toml` and its `.sha256` (drain.md:463). The uncommitted backlog edit shows in the status capture, and the commit's paths fall outside the tolerated set, so `check` exits 1 with `head changed`. The two sessions are serialised again, which is what D2 says the excludes prevent."
fix = 'In the Detail, add `.claude/backlog.toml` and `.claude/backlog.toml.sha256` to the paths a HEAD move may touch, and exclude them from the status, diff and untracked captures whenever at least one `--exclude` is given. Add a test case for a commit that touches only the backlog store. The linked review stores of an apply milestone (apply-rows.md, section "Linked review stores in the clean-tree and lane checks") are the same class; the elaboration procedure (task 18) can pass them as `--exclude`.'
effort = "small"
counter = "If the elaboration procedure (task 18) passes the backlog store and its sidecar as `--exclude`, the script needs no built-in entry. C4 and D2 name only the pick's row files and notes/run."
grade = "high"
evidence = [
    "drain.md:463: the flow-store commit runs `git status --porcelain -- .claude/flows/<slug>/ docs/flows/<slug>/notes/run/ .claude/backlog.toml .claude/backlog.toml.sha256`",
    "drain.md:404: a write to .claude/backlog.toml goes into the flow-store commit; drain.md:455 runs `backlog reconcile --apply` before it",
    "fanout-check.sh:22-29: the only built-in exclude is .claude/flows/<slug>",
    "plan.toml C4 claim: the procedure passes the pick's row files and notes/run, nothing else",
]
target = "task:let-the-fan-out-check-exclude-paths-and-tolerate-commits-to-them.detail"
expect = """"Usage becomes `fanout-check.sh snapshot|check <scratch-dir> <slug> [--exclude <path>]... <note-path>...`. Each `--exclude` path passes the same refusal rules as a note path and adds a `:(exclude)<path>` pathspec. At snapshot, write the excludes to `<scratch-dir>/excludes.txt`; at check, exit 3 when the excludes differ from the snapshot's. When HEAD changed, list the paths the new commits touched (`git log --format= --name-only <before>..HEAD`); when every one lies under an excluded path, a note path, `.claude/flows/<slug>/` or `docs/flows/<slug>/notes/run/`, HEAD does not count as changed; otherwise report `head changed` as today. The config comparison still runs first, and a run with no `--exclude` behaves exactly as today. New `fanout-check.test.sh` beside it: in a fresh repo under `mktemp -d`, cover (1) an edit to an excluded file passes, (2) a commit touching only an excluded file passes, (3) an edit to any other file exits 1, (4) a commit touching another file exits 1, (5) a config change exits 2, (6) no `--exclude` with an edit exits 1; print one line per case and exit non-zero on any wrong result. Run it with `bash claude/skills/plan-v2-engine/scripts/fanout-check.test.sh`.""""
new = """"Usage becomes `fanout-check.sh snapshot|check <scratch-dir> <slug> [--exclude <path>]... <note-path>...`. Each `--exclude` path passes the same refusal rules as a note path and adds a `:(exclude)<path>` pathspec. When at least one `--exclude` is given, `.claude/backlog.toml` and `.claude/backlog.toml.sha256` are also added as `:(exclude)` pathspecs, since every implement-v2 flow-store commit stages them. At snapshot, write the excludes to `<scratch-dir>/excludes.txt`; at check, exit 3 when the excludes differ from the snapshot's. When HEAD changed, list the paths the new commits touched (`git log --format= --name-only <before>..HEAD`); when every one lies under an excluded path, a note path, `.claude/flows/<slug>/`, `docs/flows/<slug>/notes/run/`, `.claude/backlog.toml` or `.claude/backlog.toml.sha256`, HEAD does not count as changed; otherwise report `head changed` as today. The config comparison still runs first, and a run with no `--exclude` behaves exactly as today. New `fanout-check.test.sh` beside it: in a fresh repo under `mktemp -d`, cover (1) an edit to an excluded file passes, (2) a commit touching only an excluded file passes, (3) an edit to any other file exits 1, (4) a commit touching another file exits 1, (5) a config change exits 2, (6) no `--exclude` with an edit exits 1, (7) with an `--exclude`, a commit touching only `.claude/backlog.toml` and its sidecar passes; print one line per case and exit non-zero on any wrong result. Run it with `bash claude/skills/plan-v2-engine/scripts/fanout-check.test.sh`.""""
tier = "advisory"
anchor = "plan|.claude/flows/milestones-by-dependency/tasks.toml|let-the-fan-out-check-exclude-paths-and-tolerate-commits-to-them"
status = "resolved"
first_seen = 2026-11-16
resolution = "fixed by the plan author at triage: task details, file notes, accept checks and the schedule design revised as the finding proposed"
resolved = 2026-11-16
