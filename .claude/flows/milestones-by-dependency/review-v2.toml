severity = "major"
failure_scenario = "Milestone B (stored before independent C) is picked; at run-milestone step 3 its root row's premise fails and the orchestrator parks it before any worker ran (drain.md:148), so its other rows are stranded behind it. No row has a worker agent, so B is not `started` but `runnable`; the pick is again B on every invocation, nothing launches, and C never runs, contrary to D14 (a parked row holds only its own and downstream milestones)."
fix = "Add a state between `started` and `elaborating`: `parked` when a row is `parked` and none is started, `on` empty. It is never picked, it is not `done` so downstream milestones still wait on it, and the pick moves to the next runnable milestone. Also add `parked` to the never-overridden list under The pick, and have task 14's report name each parked milestone."
effort = "small"
counter = "If the engine never parks a row that no worker has run (drain.md:148 premise failures or replan intent changes), or launch-args counts such a row as dispatchable, the stuck pick cannot occur."
grade = "medium"
evidence = [
    "design/schedule.md:18-33: no state reads `parked`; `runnable` is 'None of the above'; rule 3 picks the first runnable in store order",
