symbol = "compute-milestone-states-and-the-pick-in-one-tasks-module"
summary = "upstream() and schedule() are specified infallible, but the graph walk they must use fails on a dangling edge, a cycle or the node cap"
severity = "major"
failure_scenario = "The executor writes upstream/schedule over Graph::build and closure_up as told. Build bails on an edge to an absent task and closure_up errors on a cycle, yet the signatures return BTreeMap and Schedule, so the executor must invent: panic, skip the edge (marking a milestone runnable it should wait on), or change the signature tasks 4, 6 and 7 consume. Task 14 moves plan check after the pick, so schedule now runs on an unchecked store."
fix = "Make both return anyhow::Result: `pub(crate) fn upstream(store: &Store) -> Result<BTreeMap<String, BTreeSet<String>>>` and `pub(crate) fn schedule(store: &Store, elaborating: &BTreeSet<String>) -> Result<Schedule>`, mapping Graph::build and closure_up errors through graph::refuse as closure.rs does, and refusing an `after` id that names no stored milestone. Say in the Detail that a refusal stops the pick."
effort = "trivial"
counter = "If plan emit schedule were only ever reached after a passing flow-wide check, the error paths would be unreachable; task 14 runs the scoped check after the pick, so they are not."
grade = "high"
evidence = [
    "tomlctl/src/tasks/graph.rs:194-213 Graph::build bails on a duplicate id or an edge to an absent task",
    "tomlctl/src/tasks/graph.rs:398-402 reach() errors 'graph contains a cycle', and closure_up (260-263) goes through it",
    "tomlctl/src/tasks/closure.rs:34-35 the precedent propagates with Graph::build(&nodes).map_err(refuse)?",
    "task 14 detail: plan check --milestone runs after the pick, replacing the pre-flight's flow-wide plan check and tasks check",
]
target = "task:compute-milestone-states-and-the-pick-in-one-tasks-module.detail"
