counter = "If plan-v2 or a check guaranteed a deferred milestone always holds rows, the case cannot arise; write-and-prove.md says deferred tasks carry outcome and files, but no tomlctl check enforces it (plan/check.rs and tasks/check.rs have no empty-milestone class)."
