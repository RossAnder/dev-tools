    "design/schedule.md:18-25: `empty` row precedes `elaborating` and `deferred`; `done` is 'Every row is done' (vacuous for no rows)",
    "design/schedule.md:24-26: `on` lists upstream 'not done or empty', so an empty upstream named by `after` is treated as met",
    "tomlctl/src/tasks/graph.rs:364-395: groups() admits a checkpoint with no members; no plan/check class reports an empty milestone",
    "claude/skills/tomlctl/references/plan.md: `plan milestone add --defer` creates the milestone with no tasks",
]
