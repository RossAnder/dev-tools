failure_scenario = "Deferred B is stored before independent C (the pdt shape the new warning leaves unqualified). Elaborating B, `tasks add-many` writes a B row needing a C row. `checkpoint/invalid-cut` fires at B with ids = C's rows; no verb reorders `[[checkpoints]]` (milestone add appends, update has no position), so the elaboration cannot reach a passing check. Meanwhile implement-v2's `plan check --milestone C` keeps that finding (its ids touch C's rows) and refuses C, a milestone that does not depend on B, against Success criterion 3."
fix = "Decide how an elaboration expresses a need on a later-stored milestone, write it into design/schedule.md#upstream-milestones and task 18's procedure, and have task 7's scope attribute `checkpoint/invalid-cut` to the failing group so it never refuses a milestone other than that group and its downstream."
effort = "small"
counter = "If elaborate.md (task 18) or write-and-prove told the planner to store every deferred milestone after all independent ones, the case could not arise; task 20 says 'A deferred milestone needs no placement rule' and task 18 allows needs on any existing id."
grade = "medium"
evidence = [
    "design/schedule.md:12 relies on invalid-cut to keep every upstream milestone stored earlier",
    "tomlctl/src/tasks/check.rs:661-700 cut_findings: invalid-cut ids are the dependencies outside the prefix, i.e. the later milestone's rows",
    "claude/skills/tomlctl/references/plan.md:282-325: milestone add appends, milestone update has no position flag; no reorder verb exists",
    "task 7 detail: keep a finding when its ids share an id with the milestone's rows; task 18 detail: add-many with needs only on existing ids",
    "task 20 detail: 'A deferred milestone needs no placement rule'",
]
blocked_on = "decision"
blocked_missing = "Which way an elaboration records a need on a milestone stored after the deferred one: no verb moves a checkpoint, and the plan's decisions (D7, D10) do not say."
blocked_options = [
    "Add a `plan milestone move --after-id` verb and have elaborate.md move the deferred milestone behind the one it now needs: one new verb, its test and flag reference",
    "elaborate.md cuts a new milestone at the end (milestone add appends) and moves the needing rows into it: no new verb, but splits the deferred milestone",
    "Forbid it: elaborate.md refuses a need on a later-stored milestone and asks the user, and write-and-prove stores deferred milestones after independent ones: no code, but restores a placement rule task 20 drops",
]
target = "design/schedule.md#upstream-milestones"
expect = '"`checkpoint/invalid-cut` keeps every milestone a row reaches earlier in store order, and `after` may name only an earlier milestone, so every upstream milestone of M is stored before M."'
