file = ".claude/flows/milestones-by-dependency/tasks.toml"
symbol = "leave-a-deferred-milestones-records-out-of-the-lane-check"
summary = "Lane-digest exclusion omits the file_notes and backlog_links an elaboration writes, so its writes still change the `rest` digest"
severity = "major"
failure_scenario = 'A second session elaborates deferred milestone B during an implement:A run and adds a row with file_notes {path: "(new)"} or closes = [B-...] (write-and-prove.md:100 names both as row keys). Task 10 as written drops only rows, specs, checkpoints, milestones and trail rows; [[file_notes]] and [[backlog_links]] are top-level keys in no SECTIONS group (lane.rs:43-48), so they hash into `rest`. lane-check prints digest `changed`, section `rest`, and the drain reports the elaboration as an out-of-lane write, the outcome the task exists to prevent.'
fix = "Extend the Detail's exclusion list: in store_digest also drop the [[file_notes]] and [[backlog_links]] (and [[finding_links]] on a row ref) entries whose `ref` is a row of an excluded milestone, and make the unit test's elaboration add a row carrying a file note and a backlog close so the test binds them."
effort = "trivial"
counter = "If an elaboration never writes file_notes or backlog links for a new row (no (new) files, no closes), the rest section stays stable; write-and-prove.md says rows carry both."
grade = "high"
evidence = [
    "tomlctl/src/plan/lane.rs:43-48 SECTIONS groups only items, specs, checkpoints+milestones, changes; every other key falls to `rest`",
    "tomlctl/src/tasks/schema.rs:107,110 Store.file_notes and Store.backlog_links are top-level; FileNote/BacklogLink keyed by `ref` (schema.rs:187-191, 231-235)",
    "tomlctl/src/tasks/add.rs:402-403 add-many pushes the row's file_notes onto store.file_notes",
    "claude/skills/plan-v2-engine/references/write-and-prove.md:100 a row's file_notes marks (new) paths and closes/refs link backlog ids",
]
target = "task:leave-a-deferred-milestones-records-out-of-the-lane-check.detail"
expect = """"In tomlctl/src/plan/lane.rs compute the excluded milestones from the store itself, so the run row needs no new field: milestones whose `elaboration` is `deferred` now, plus milestones whose `[[changes]]` trail holds an `elaboration` change stamped inside the window (at or after its open). In `store_digest`, before hashing, drop from the projection every row whose `checkpoint` is excluded, the specs of those rows, the excluded ids' `[[checkpoints]]` and `[[milestones]]` entries, and the trail rows on any of those. In `trail_writes`, skip trail rows on those rows or on an excluded milestone. Read how `plan milestone update` and `tasks add-many`/`update` key their trail rows before writing the filter. `store_digest`'s signature stays, since plan emit launch-args and plan run start call it. Add unit tests in the module's tests: an elaboration that adds rows to a deferred milestone, updates its specs and flips it to elaborated inside the window leaves the digest unchanged and no trail write; a write to a row of the running milestone's beyond status and agent is still reported.""""
new = """"In tomlctl/src/plan/lane.rs compute the excluded milestones from the store itself, so the run row needs no new field: milestones whose `elaboration` is `deferred` now, plus milestones whose `[[changes]]` trail holds an `elaboration` change stamped inside the window (at or after its open). In `store_digest`, before hashing, drop from the projection every row whose `checkpoint` is excluded, the specs of those rows, the `[[file_notes]]`, `[[backlog_links]]` and `[[finding_links]]` entries keyed on those rows' refs, the excluded ids' `[[checkpoints]]` and `[[milestones]]` entries, and the trail rows on any of those. In `trail_writes`, skip trail rows on those rows or on an excluded milestone. Read how `plan milestone update` and `tasks add-many`/`update` key their trail rows before writing the filter. `store_digest`'s signature stays, since plan emit launch-args and plan run start call it. Add unit tests in the module's tests: an elaboration that adds rows to a deferred milestone, one carrying a `(new)` file note and a backlog close, updates its specs and flips it to elaborated inside the window leaves the digest unchanged and no trail write; a write to a row of the running milestone's beyond status and agent is still reported.""""
tier = "advisory"
anchor = "plan|.claude/flows/milestones-by-dependency/tasks.toml|leave-a-deferred-milestones-records-out-of-the-lane-check"
