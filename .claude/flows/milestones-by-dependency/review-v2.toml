file = "docs/flows/milestones-by-dependency/design/schedule.md"
symbol = "states"
summary = "`empty` is tested before `deferred`, so a deferred milestone with no rows reads `empty`, counts as satisfied and lets an `after` dependent run first"
severity = "minor"
failure_scenario = 'A plan defers milestone B with no rows yet and gives D `after = ["B"]` (the only edge D can have to a rowless B). schedule() takes the first matching state: B has no rows, so it is `empty`; `waiting` treats `empty` as satisfied, so D is `runnable` and is picked before B is elaborated, and B is never reported deferred, failing brief SC1 (reports the deferred one) and SC2 (after is honoured).'
fix = "Order the States table so `elaborating` and `deferred` are tested before `empty`, `done` and `unstamped` (a rowless milestone also matches `done` vacuously, so `deferred` must precede that too). A deferred milestone then reads `deferred` or `elaborating` with or without rows, and blocks every milestone whose `after` names it. Add a matching case to task 3's unit tests: a deferred milestone with no rows is `deferred`, and a milestone after it is `waiting`."
effort = "trivial"
counter = "If the plan format or plan check required every deferred milestone to hold rows, the state could not arise; no plan check class does (check.rs lists only deferred-no-reason for deferral) and apply-v2 already keeps rowless milestones."
grade = "high"
evidence = [
    "design/schedule.md:18-25: `empty` row precedes `elaborating` and `deferred`; `done` is 'Every row is done' (vacuous for no rows)",
    "design/schedule.md:24-26: `on` lists upstream 'not done or empty', so an empty upstream named by `after` is treated as met",
    "tomlctl/src/tasks/graph.rs:364-395: groups() admits a checkpoint with no members; no plan/check class reports an empty milestone",
    "claude/skills/tomlctl/references/plan.md: `plan milestone add --defer` creates the milestone with no tasks",
]
target = "design/schedule.md#states"
expect = '"| `empty` | The milestone has no rows | — |\n| `done` | Every row is `done` with a non-empty `commit` | — |\n| `unstamped` | Every row is `done` and at least one has an empty `commit` | — |\n| `started` | A row is started and not every row is `done` | — |\n| `elaborating` | `elaboration` is `deferred` and `plan.toml` holds an open run of step `elaborate:<id>` | the upstream milestones not `done` or `empty`, in store order |\n| `deferred` | `elaboration` is `deferred` | the upstream milestones not `done` or `empty`, in store order |"'
new = '"| `elaborating` | `elaboration` is `deferred` and `plan.toml` holds an open run of step `elaborate:<id>` | the upstream milestones not `done` or `empty`, in store order |\n| `deferred` | `elaboration` is `deferred` | the upstream milestones not `done` or `empty`, in store order |\n| `empty` | The milestone has no rows | — |\n| `done` | Every row is `done` with a non-empty `commit` | — |\n| `unstamped` | Every row is `done` and at least one has an empty `commit` | — |\n| `started` | A row is started and not every row is `done` | — |"'
tier = "cited"
