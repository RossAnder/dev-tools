action = "Write plan-v2-engine/references/elaborate.md: elaborating a deferred milestone on an approved or running flow, ending with --elaborated as the last store write."
detail = """The procedure, for `/plan-v2 <slug> --elaborate <id>`, in this order. (1) Preconditions: `tomlctl plan emit schedule --slug <slug>` reports `<id>` `deferred` (refuse `elaborating`: another session holds it; ask before abandoning that run); an `on` that is not empty is put to the user, since its upstream has not built yet. Record `tomlctl plan run start --slug <slug> --step elaborate:<id> --session "$CLAUDE_CODE_SESSION_ID"` before any write. Read the defer reason, the brief, the notes and what the upstream milestones built. (2) Surface and decide: the three Surface tests from open-and-challenge.md section 5, the survivors in ONE AskUserQuestion call, `plan decide` rows, `design/<name>.md` only where a row needs prose. (3) Revise rows: `tasks add-many` with `needs` only on existing ids of this milestone or of milestones stored before it, and a `reason` on every row; a row that would need a later-stored milestone means the plan's order is wrong, so stop and put it to the user rather than write it, since `checkpoint/invalid-cut` would refuse it; `tasks update --ndjson` with `action`, `detail`, `title` and `checkpoint` under `[record.set]`, `spec` top-level and `reason` on every row (show one record of this shape); then `set.needs` edges by printed ids, decision binds and contract tasks, and the renamed-names sweep of write-and-prove.md 4a. (4) Prove while still deferred: `tomlctl plan check --slug <slug> --milestone <id>`; premises with `--milestone <id>`; the cold read through `plan-v2-prove` for this milestone only, recorded as step `cold-read:<id>`, deleting `notes/cold-read-<id>.md` first; the fan-out snapshot and check pass `--exclude` for each file of the rows of every milestone the schedule reports neither `done`, `empty`, `deferred` nor `elaborating`, for `docs/flows/<slug>/notes/run`, and, when the flow has `[[finding_links]]`, for the review stores they name, so a live /implement-v2 run, even one that moves to its next milestone during the read, does not trip it (user decision D2; the script itself tolerates the backlog store); apply the cold read's points; accept probes and gate probes with `--milestone <id>`. (5) Flip: `tomlctl plan milestone update --slug <slug> --id <id> --elaborated --reason '<what landed>'` as the last tasks.toml write, then `plan check --milestone <id>` once more. (6) `plan run finish --step elaborate:<id> --outcome ok`, then commit once, staging by name plan.toml, tasks.toml, both sidecars, the design files and the cold-read note, through commit-conventions; list the agent-assumed decisions in the close. Say that a flow-store commit from a concurrent /implement-v2 may sweep this session's rows in, which is safe because the milestone stays deferred until (5) (user decision D1). Abandon rule: an `elaborate:<id>` run from another session is asked about, never abandoned silently."""
