detail = "New module `tomlctl/src/tasks/milestones.rs`, registered in tomlctl/src/tasks/mod.rs as `pub(crate) mod milestones;`. It exposes `pub(crate) fn upstream(store: &Store) -> Result<BTreeMap<String, BTreeSet<String>>>`, each milestone id to the ids of its upstream milestones as design/schedule.md#upstream-milestones defines them, and `pub(crate) fn schedule(store: &Store, elaborating: &BTreeSet<String>) -> Result<Schedule>`, where `Schedule { pick: Option<String>, milestones: Vec<MilestoneState> }` and `MilestoneState { id, state: &'static str, on: Vec<String>, left: usize }`, following design/schedule.md#states and design/schedule.md#the-pick exactly. Walk row edges with the graph module's upward closure over `needs` and `coupling`, as `tasks closure --checkpoint` does for `dependency_closure`, mapping a `Graph::build` or closure error through `graph::refuse` as closure.rs does, and refusing an `after` id that names no stored milestone; a refusal stops the pick. Do not add milestone or commit state to graph.rs. Unit tests in the module, one `#[test]` each, at least these eleven: (1) A done, B deferred, C runnable, D needing B and C gives pick C and D waiting on B and C; (2) an `elaborating` id; (3) `after` holds a milestone with no row edge; (4) a started row holds every other milestone on it; (5) an unstamped milestone empties the pick; (6) a coupling edge makes a milestone upstream; (7) an empty milestone counts as satisfied; (8) a deferred milestone with no rows reads `deferred` and a milestone after it is `waiting`; (9) a milestone whose only unfinished row is parked and unstarted reads `parked` and the pick moves to the next runnable milestone; (10) a milestone whose unfinished rows are all row-status `deferred`, none started, reads `parked`; (11) a deferred milestone whose row needs a row of an unfinished earlier milestone reads `deferred` with that milestone in `on`."
