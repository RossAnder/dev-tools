vetoed = false

[[decision]]
id = "D3"
decision = "Give milestones an explicit `after = [ids]` field for order that carries intent, and pick any milestone whose rows' needs and coupling outside it and whose `after` milestones are done and committed, preferring store order; a deferred milestone is skipped and reported rather than stopping the engine."
why = "Store order carried intent in all three multi-milestone flows that ran (pdt review F10 risk-first order, glimpse C behind handover H1, gate-cost task 14 protecting the build), so a needs-only pick would have broken each; an explicit field keeps that intent while freeing the independent cases."
provenance = "user-confirmed"
door = "one-way"
binds = [
    "tomlctl/src/tasks/schema.rs",
    "claude/skills/implement-v2-engine/references/run-milestone.md",
    "1",
    "2",
    "3",
    "14",
]
evidence = "notes/session-friction.md (transcripts 7664d9d9, 9c1cf859, ec0edfee); notes/milestone-dag-measure.md (independent sibling milestones in 3 of 7 flows); user answer in session c372393f at 2026-11-16T04:59:34Z"
if_false = "the engine keeps store order and only the deferred stop changes"
revisit_if = "plans routinely set `after` on every milestone, which would mean store order should have stayed the default"
check = ""
surfaced = false
vetoed = false

[[decision.rejected]]
option = "Skip a deferred milestone only, with no new field"
because = "it keeps narrative order as the schedule for every upfront milestone, so glimpse C and harness D would still wait on unrelated milestones"

[[decision.rejected]]
option = "Keep store order as law and only warn at plan time"
because = "it removes no wait at run time; the user chose the explicit field on 2026-11-16 (session c372393f, 04:59Z)"

