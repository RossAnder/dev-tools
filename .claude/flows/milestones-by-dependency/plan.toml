[[decision]]
id = "D2"
decision = "Let the elaboration's cold read run beside a live implement-v2 run: fanout-check.sh takes extra excluded paths (the running implement milestone's row files and docs/flows/<slug>/notes/run/) and accepts HEAD moving through commits that touch only excluded paths or the flow's own directories."
why = "The cold read is the one Workflow in an elaboration, and without the excludes it fails whenever a worker edits or a milestone commits, which would serialise the two sessions."
provenance = "user-confirmed"
door = "two-way"
binds = [
    "claude/skills/plan-v2-engine/scripts/fanout-check.sh",
    "11",
    "18",
]
rejected = []
