[[decision]]
id = "D1"
decision = "Let the implement-v2 flow-store commit go ahead while another session's elaborate:<id> run is open; the elaborating milestone stays deferred until that procedure's last write, so any of its rows the commit sweeps in are not runnable."
why = "Elaborated-last already meets the goal the earlier refusal was for (no half-written row committed as runnable), and a refusal would hold the stamp commit for the length of the elaboration."
provenance = "user-confirmed"
door = "two-way"
binds = [
    "claude/skills/implement-v2-engine/references/drain.md",
    "16",
    "18",
]
rejected = []
evidence = "notes/concurrent-elaboration.md (flow-store commit stages all of .claude/flows/<slug>/, drain.md:463); notes/elaboration-procedure.md (deferral relaxes only accept-no-check, so premises, cold read and probes all run on a still-deferred milestone); recorded stance c372393f 04:59Z accepted a refusal as part of the full-scope option"
