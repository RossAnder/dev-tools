[[decision]]
id = "D8"
decision = "While any milestone holds a started, unstamped row (agent a plan worker, commit empty), only that milestone can be picked and every other is held on it; a done but unstamped milestone is settled by Re-entry before any pick."
why = "Every gate in the corpus is crate-wide and the clean-tree exemption and lane set cover every started row in the flow, so running another milestone over half-finished edits would gate and commit a mixed tree."
provenance = "agent-assumed"
door = "two-way"
binds = [
    "tomlctl/src/plan/lane.rs",
