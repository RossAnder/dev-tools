evidence = "notes/out-of-order-commit.md (run-milestone.md:37-45, lane.rs:328, drain.md:295-327); gates of v2-harness-tuning and v2-apply read with tomlctl"
if_false = "a gate could pass or fail on another milestone's partial edits and its commit would not be the tree the gate passed"
