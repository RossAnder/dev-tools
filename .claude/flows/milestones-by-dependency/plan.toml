[[decision]]
id = "D7"
decision = "Keep `checkpoint/invalid-cut` unchanged and let `after` name only milestones stored earlier, so store order stays a topological order of the milestone graph and the pick is the first runnable milestone in store order."
why = "valid_cut already forces every upstream milestone earlier in the store, which makes store order a deterministic tie-break, and v1 /implement commits against it so it cannot be relaxed."
