because = "it needs a new link kind, a worker-view section, both worker agents and a drain section, and still serialises everything but the reading (notes/elaboration-procedure.md)"

[[decision]]
id = "D6"
decision = "Adopt the structure challenge's draft: one milestone-schedule module in tomlctl/src/tasks/milestones.rs above graph.rs, a `plan emit schedule` leaf that overlays open elaborate runs and prints each milestone's state and the pick, lane scoping inside lane.rs, and elaboration recorded as an `elaborate:<id>` run whose milestone stays deferred until its last write."
why = "The pick needs each milestone's outside needs with status and commit, `after` edges and elaboration state in one read, which today takes a closure plus a list per milestone and emit.rs says the engine should not assemble by hand."
provenance = "agent-assumed"
door = "two-way"
binds = [
    "tomlctl/src/plan/emit.rs",
    "tomlctl/src/tasks/graph.rs",
    "tomlctl/src/plan/lane.rs",
    "3",
