decision = "Do not make elaboration a task in the implement-v2 worker pool, and do not dispatch later milestones' rows into the running milestone's pool."
why = "In the one timed elaboration only 2.1 of 20.5 minutes was agent-only reading; the user's questions came before any spec could be drafted; and pool lookahead was settled at plan time by B-1fa8d53f's cut rule."
provenance = "user-confirmed"
door = "two-way"
binds = [
    "claude/skills/implement-v2-engine/SKILL.md",
    "15",
]
