    "lumina/src/pty/jsonl_tail/parse.rs:228",
    "lumina/src/pty/jsonl_tail/parse.rs:254",
    "lumina/src/repo/sessions.rs:390",
]
dedup_id = "9c05e8c6a1edcfec"
resolved = 2026-06-05
resolution = "Hoisted record_index_fields + corpus_dedup_key + corpus_raw out of the BEGIN IMMEDIATE write loop: computed once per line into an owned rows Vec inside the spawn_blocking closure (sessions.rs:386-394), so the per-row serde_json::from_str::<Value> DOM re-parse no longer runs inside the writer-locked txn. Working tree only (no commit)."

