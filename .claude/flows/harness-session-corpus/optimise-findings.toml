summary = "The session.ingested event is written in a separate post-loop txn (extra BEGIN IMMEDIATE + fsync); for the common single-chunk transcript it could ride that one chunk's txn"
description = "After the chunk loop the event is recorded in a fresh begin()/commit() (sessions.rs:405-417) - a second RESERVED-lock acquire/release + a second WAL fsync. Net-new is only fully known after the last chunk in the general multi-chunk case, so the event genuinely cannot ride an earlier chunk there. BUT the common case is a transcript <= INGEST_CHUNK_ROWS (500 non-empty lines) => exactly one chunk, where net_new is fully accumulated within that single txn before commit. Emitting the event inside the final chunk's txn WHEN it is the only/last chunk and net_new>0 collapses two txns to one for the dominant case (one fewer lock cycle + fsync), preserving 'at most one coarse event' and the chunked-short-txn contract (rides an existing short txn, not a new unbounded one). Risk: adds an is-final-chunk branch coupling event-emit to the loop body; weigh against the readability of the current clean post-loop block on a path that runs once per session end. Graded suggestion."
evidence = [
    "https://www.sqlite.org/wal.html",
    "lumina/src/repo/sessions.rs:405",
]
dedup_id = "9f34c7b9901c5d99"
resolved = 2026-06-05
resolution = "Single-chunk transcripts (rows.len() <= INGEST_CHUNK_ROWS, the dominant case) now emit the coarse session.ingested event INSIDE the only chunk's txn (sessions.rs:486-496) instead of a separate post-loop txn, saving a RESERVED-lock cycle + WAL fsync; multi-chunk keeps the post-loop event txn (gated !single_chunk && net_new > 0). At-most-one-event + net-new>0 gate preserved. Working tree only."

