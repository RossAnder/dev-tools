severity = "warning"
effort = "small"
category = "concurrency"
summary = "Whole-transcript parse_line map + two-pass harvest_correlation run synchronously between awaits, monopolising one tokio worker for the CPU burst"
description = "Between read_to_string().await (sessions.rs:332) and the first db.begin().await (sessions.rs:371) the code runs body.lines().map(parse_line).collect() then harvest_correlation(&parsed) with no await/yield. For a multi-MiB (up to 64 MiB) transcript this is one un-yielded CPU section pinning a worker thread; tokio only preempts at await points, so it head-of-line-blocks other tasks on that worker. The 4-permit ingest semaphore bounds concurrency to <=4 but does NOT stop each admitted ingest's burst from pinning its worker. Fix: wrap read+parse+harvest in tokio::task::spawn_blocking (body is owned; Vec<(i64,JsonlRecordParsed)> + Correlation are Send) - keep the stat+64MiB cap on the async side so a hostile file is still refused without occupying a blocking thread; the DB chunk loop stays async. The spawned-tail path streams (bounded bursts) and does NOT need this. Risk: adds a thread-pool hop + moving body; verify benefit with a parse-time benchmark on a representative 5-10 MiB transcript (typical observed transcripts are single-digit MiB)."
evidence = [
    "https://docs.rs/tokio/latest/tokio/task/fn.spawn_blocking.html",
    "https://tokio.rs/blog/2020-04-preemption",
]
dedup_id = "202ca95f2b3400cf"
resolved = 2026-06-05
resolution = "Wrapped file read + per-line parse + index precompute + harvest_correlation in tokio::task::spawn_blocking (sessions.rs:362-408); stat + 64 MiB cap stay async before the closure; JoinError maps to AppError::Other then double-? on the inner Result. CPU burst no longer pins a tokio worker. Working tree only."

