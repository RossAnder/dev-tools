category = "query"
summary = "Per-line single-row INSERT loop could batch each chunk into a multi-row VALUES insert - but sqlx already caches the prepared statement, so the win is only bind/step/round-trip and is modest"
description = "Each non-blank line issues one tx.execute (sessions.rs:389->394). VERIFIED via Context7 (sqlx FAQ): sqlx caches prepared statements per-connection and a txn pins one connection, so parse/plan happens ONCE per chunk - the classic 'N re-prepares' win does NOT exist; remaining cost is N bind+step+round-trips. Batching a chunk into one multi-row INSERT ... VALUES (...) x k ON CONFLICT(session_id,dedup_key) DO NOTHING (11 cols/row => <=90 rows/stmt at the 999-var limit, <=2900 at 32766) collapses steps/round-trips ~2x in a cited benchmark - but for a once-per-session-end ingest of single-digit-MiB transcripts the absolute saving is sub-ms to low-ms, hence suggestion. GATES before applying: (a) intra-chunk dedup hazard - corpus_dedup_key returns u:<record_uuid> when present; two lines sharing a record_uuid produce identical (session_id,dedup_key) within ONE multi-row statement, which ON CONFLICT DO NOTHING may not rescue intra-statement, so batching must first dedup the chunk's keys in Rust (keep-first); the synthetic o:<ordinal> key is always unique - confirm whether real transcripts ever repeat a record_uuid. (b) net-new gate survives: a multi-row insert's rows_affected is the total inserted, so net_new += batch_rows_affected still gates the event correctly given the Rust-side dedup. (c) seam friction: db execute takes &'static str; a variable-length batched SQL string fights that signature. Benchmark ingest on a real 5 MiB transcript before applying - under ~2k rows this is noise."
evidence = [
    "https://github.com/launchbadge/sqlx/blob/main/FAQ.md",
    "https://zerowidthjoiner.net/2021/02/21/sqlite-bulk-insert-benchmarking-and-optimization",
]
dedup_id = "707272d76662fe0a"

