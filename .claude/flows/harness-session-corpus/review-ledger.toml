id = "R9"
file = "lumina/src/pty/spawn.rs"
line = 375
symbol = "spawn corpus consumer"
severity = "warning"
effort = "medium"
category = "architecture"
summary = "The lossless spawned corpus rides a lossy bounded broadcast: a Lagged drop is unrecoverable, and the per-record write tx maximises lag risk"
description = "The corpus consumer shares the bounded broadcast ring with the render bridge; a slow corpus writer that falls behind a burst gets RecvError::Lagged and those JSONL lines are gone from the corpus with no replay source (spawn.rs:375-383). The code correctly logs this as corpus loss, but a lossless substrate built on a lossy transport is a latent defect, and the per-record begin/commit design (spawn.rs:330-360) maximises the chance of falling behind. Ingested transcripts read the file directly and are genuinely lossless; spawned sessions are only best-effort lossless — an asymmetry the always-captured wording understates. Consider a small batching window or an unbounded/backpressured channel for the corpus consumer."
evidence = ["lumina/src/pty/spawn.rs:330-383"]
related = ["R3"]
dedup_id = "55f40cfdfa110ea5"
resolved = 2026-06-05
resolution = "Decoupled the spawned corpus from the bounded render broadcast (previously deferred): a cheap drainer forwards each broadcast record into an UNBOUNDED mpsc buffer (O(1), no DB work, keeps pace with the producer), and a separate batched writer (drain_and_persist_corpus + persist_corpus_records, <=256 rows/tx) persists from it. The unbounded buffer, not the bounded broadcast, now backs the lossless corpus, so a slow writer costs memory not dropped lines; the per-record begin/commit that maximised lag risk is gone. tail/producer and the render bridge untouched. Added unit tests for batch idempotency and lossless drain across batch boundaries."

