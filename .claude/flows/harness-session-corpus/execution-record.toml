summary = "Dropped the pty_sessions.sprint_id FK in migration 0015 — harvested sprint ids are sprints.id not work_items.id, and a hard FK would abort the lossless ingest"
original_intent = "Plan T1 and migration 0015 declared pty_sessions.sprint_id TEXT REFERENCES work_items(id)."
rationale = "A harvested sprint_id (from claim_next_task input) is a sprints.id (migration 0011), NOT a work_items.id, so the work_items FK could never be satisfied and every sprint-correlated ingest aborted (surfaced by T6's e2e: SQLite error 787 FOREIGN KEY constraint failed on the parent pty_sessions INSERT). Retargeting the FK to sprints(id) was also rejected: a hard FK on a best-effort harvested correlation scalar contradicts the plan's lossless-at-rest constraint and Q4 (last-wins scalar + lossless detail) — a deleted or cross-instance sprint would abort the entire capture. Orchestrator dropped the FK: sprint_id is now plain nullable TEXT, a correlation hint mirroring agent_id, with full multi-sprint detail preserved in session_records. Migration 0015 was amended in place (unreleased this run; dev + in-memory test DBs recreate from the embedded migration set). Also corrected the migration's line_ordinal comment from 0-based to the 1-based T4 contract."
commits = ["ad4981e"]
dedup_id = "178c03a8ead04422"

