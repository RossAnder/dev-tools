plan_section = "## Approach"
summary = "A large transcript ingests as one unbounded BEGIN IMMEDIATE txn holding the writer lock (5s busy_timeout); 4 concurrent ingests worsen it — chunk or cap"
description = "lumina uses BEGIN IMMEDIATE (RESERVED lock at begin-time, 5s busy_timeout). A multi-MB orchestrator transcript = one large txn (one row per JSONL line) blocking ALL other writers (MCP tool calls, live-tail session_records writes) for the insert duration; the 4-permit semaphore bounds concurrency but not per-txn size. The Volume risk only addresses disk growth. Mitigation: chunk the bulk insert (~500-row short txns — ON CONFLICT DO NOTHING makes partial progress safe) OR cap ingested line count."
dedup_id = "877aeeaeae773d56"

