severity = "critical"
category = "feasibility"
plan_section = "#### T7"
summary = "Live-tail broadcast carries no line_ordinal and is lossy (Lagged) — T4/T7 dedup contract is unsatisfiable as written"
description = "jsonl_tail/mod.rs broadcasts a bare JsonlRecordParsed (broadcast::Sender<JsonlRecordParsed>, mod.rs:179/319); line_ordinal is a local lines_read counter (mod.rs:324) never sent. A T7 second consumer cannot reconstruct '1-based among non-empty lines', need_rescan re-delivers from offset 0, and Lagged silently drops records — so l<ordinal> dedup keys for uuid-less rows (summary/mode/system) are unstable AND lossless capture is violated under lag. Convergent: Agent1-F2, Agent3-F3/F4. Fix: widen the broadcast to carry (line_ordinal, raw) (ripples to every existing jsonl_rx consumer in spawn.rs) OR have T7 re-read from offset 0 like ingest; widens T4 scope and T7 Blocked-by."
anchor_old = "Subscribe a **second, lightweight broadcast consumer** in `spawn_pty_session_internal`"
anchor_new = "The broadcast channel carries only `JsonlRecordParsed` with NO ordinal and is lossy on `Lagged`, so a second consumer cannot reconstruct `l<ordinal>` dedup keys (and `need_rescan` re-delivers from line 0). T4 must therefore change `tail`/`drain_and_broadcast` to broadcast `(line_ordinal, JsonlRecordParsed)`; then subscribe a second, lightweight consumer in `spawn_pty_session_internal`"
dedup_id = "e27fe2f5676a635a"

[[items]]
review_round = 1
status = "merged"
id = "P2"
severity = "critical"
category = "risk"
plan_section = "#### T9"
summary = "POST /api/sessions/ingest is an unauthenticated arbitrary-file-read: caller-supplied transcript_path is read and stored verbatim"
description = "lumina's HTTP API is unauthenticated (loopback by default; lumina/CLAUDE.md Security warns a non-loopback bind lets any caller drive arbitrary tool execution). The handler reads whatever transcript_path the caller supplies and stores it verbatim (redaction deferred to layer 3), then serves it back via the read path. Any local process can exfiltrate /etc/passwd, ~/.aws/credentials, ~/.claude.json into session_records. The harvest drop-gate is only a partial accidental mitigation — one synthetic mcp__lumina__ line defeats it. Fix: canonicalise transcript_path and constrain to the ~/.claude/projects/** transcript root (reject ../symlinks) before ingest; name the trust boundary in ## Risks."
anchor_old = "Handler returns `202 Accepted` (empty body) immediately, then `tokio::spawn`s a task that `let _permit = state.session_ingest_sem.clone().acquire_owned().await` then calls `repo::ingest_transcript`."
anchor_new = "Handler validates `transcript_path` canonicalises within the `~/.claude/projects/` transcript root (reject `..`, symlinks, out-of-root) BEFORE accepting, returns `202 Accepted`, then `tokio::spawn`s a task that `let _permit = state.session_ingest_sem.clone().acquire_owned().await` then calls `repo::ingest_transcript`. The endpoint is unauthenticated — inherits the loopback-only deployment rule; never expose lumina non-loopback."
dedup_id = "4bdde6d6b9f634c3"

