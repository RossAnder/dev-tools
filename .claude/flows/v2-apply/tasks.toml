action = """
F103: apply-v2-engine steps 7-8 hand-copy approve.md's commit/approve/record procedure and drop its mandatory v1-carrier warning
F107: Re-entry reuses an empty apply-<n> with no settle-<n>, so an evidence-blocked pick in the rerun is refused for lack of --settle-checkpoint
F132: An /apply-v2 --all rerun after step 6 stops at 'Nothing to schedule': --all skips scheduled findings silently, so Re-entry never sees them
F133: Step 7 says the engine's clean-tree check refuses the review store, but linked review stores are exempt from that check"""
detail = """
F103:
Fix: Replace the bodies of steps 7 and 8 with a pointer to plan-v2-engine references/approve.md sections 4 to 7 and this skill's deltas only: a dirty registry stops rather than offering options; <store> and <store>.sha256 join the first commit's listing; no gate screen, plan check then plan approve --review skipped-flag --reason 'triage of <store> selected these findings'; the record carries agent=apply-v2. Then print approve.md's v1-carrier warning block verbatim with <flow> filled in, in step 10's close summary, as approve.md section 8 does.
Failure scenario: /apply-v2 --scope auth opens and approves auth-apply; plan approve writes the registry entry, so bare v1 carriers now pick auth-apply. approve.md requires printing its verbatim warning (v1 carriers cannot run the flow, /review-plan falls back to plan mode and can overwrite brief.md, clear it with flow active remove). The apply skill's copy of the procedure omits it, so a later bare /review-plan or /implement hits the apply flow with no warning given.

F107:
Fix: In Re-entry's 'A fix milestone already added', add: when a selected finding is blocked on evidence with no proposal and the empty apply-<n> has no settle-<n> beside it, do not reuse it; step 5 adds settle-<m> and apply-<m> with a fresh n, so the settle milestone precedes its fix milestone.
Failure scenario: Run 1 adds apply-1 alone (no evidence-blocked pick) and schedules nothing, e.g. every pick lands under skipped_stale; step 6 says a rerun with another selection reuses it. Rerun picks F9 blocked on evidence: Re-entry reuses empty apply-1 and skips step 5, no settle-1 exists, so step 6 runs without --settle-checkpoint and review schedule refuses F9 naming the flag; no settle milestone can be added before apply-1.

F132:
Fix: In step 2, when the arguments are --all, also find the findings already scheduled into the home from the home's links (tomlctl items list .claude/flows/<flow>/tasks.toml --array finding_links --select ref,store,fixes,settles --lines, kept to rows whose store is <store>; for --scope, the home is the flow Re-entry's 'A new flow already opened' finds by its brief). Treat those as the 'Already scheduled' set, so 'Nothing to schedule' stops only when that set is empty too, and Re-entry's 'Findings already scheduled' sends the run on to step 7 or step 9. Say in 'Already scheduled' that --all reports no refused row for them.
Failure scenario: /apply-v2 --scope S --all opens S-apply and schedules every finding, then step 7 stops on a dirty .claude/active-flow.toml and tells the user to rerun. The rerun with the same arguments previews with review schedule --all, which skips non-open findings without a refused row. No row reads 'status is scheduled, not open', so step 2's 'Nothing to schedule' stops: steps 7 to 9 never run and S-apply stays an unapproved draft holding the scheduled findings. On a reviewed flow interrupted at step 9, the same rerun stops instead of resuming the engine.

F133:
Edit (change): Replace the clause with a reason that holds: 'and the review store, which sits outside the flow, holds the `scheduled` marks those rows answer, so the two land in one commit. Commit both first.' The engine's pre-flight exempts every store the flow's [[finding_links]] name (run-milestone.md step 1, findings.md 'Linked review stores in the clean-tree and lane checks'), so the stated reason is false once step 6 has linked the store.
Old text: and the execution engine's clean-tree check refuses the review store, which sits outside the flow. Commit both first."""
