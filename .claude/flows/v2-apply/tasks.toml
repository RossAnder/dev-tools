action = "Add the Settle drain and Failure on an apply row sections to `references/findings.md` with their step-table row and drain.md pointers; add the settle note's form and the no-reclassification rule to the shared worker procedure in both worker files; add the settle milestone and its checkpoint flag to the apply skill; add the milestone C features to the capability checks of the apply skill and the `/implement-v2` carrier."
detail = "The worker procedure is the `plan-worker-procedure` shared block: both files must carry the same bytes. A settle task writes two files: its run note, which opens `Status:` like any other, and the proposal file its `files` names. The proposal file opens `Proposal:` or `Refuted:`, answers the finding's `blocked_missing`, cites what it read, and proposes an edit-level fix; one that asks for more investigation is a failed task. drain.md's Never-up-a-tier rule stays for plan rows and gains one pointer to the apply-row rule. The apply skill adds a settle milestone before the fix milestone when a selected finding is blocked on evidence and passes `--settle-checkpoint`. Both carriers' pre-flights gain `review_blocked_on`, `review_settle` and `review_triage_answer`."
