[[specs]]
ref = "export-v1-builds-the-v1-description-without-fix_sketch-or-decision_answer-so-an-unblocked-finding-exports-with-its-unblocking-answer-dropped-and-11-more"
outcome = """
F87: the failure no longer happens: A finding blocked on decision is answered with `review triage --answer-file` (decision_answer set, block cleared), or a verifier unblocks one with a fix_sketch, then `review export-v1 <id> --to .claude/reviews/x.toml` runs: refusal() passes it as unblocked, and candidate() writes description from description() alone (fix/edit/old/target_file/instances/failure_scenario). The v1 row carries the partial fix and no decision or sketch, so /review-apply implements without the answer the user gave.
F92: the failure no longer happens: A regression row (resolve set it open with outcome = regression and kept same_as = F0) is blocked on evidence, scheduled, and settled with `review settle F1 --refute --citation src/a.rs:1`. settle sets it open and calls orchestrator_verdict; apply_one skips the status step because same_as is non-empty, so the row stays open and still blocked on evidence while settle prints outcome refuted. A replay re-runs the same no-op, and any later verifier or audit verdict on the row is likewise ignored.
F96: the failure no longer happens: A finder submits a defect with blocked_on = decision, blocked_missing set and blocked_options = ["drop the cache, and two callers change", ""] (or ["", ""]). check_value's StrList arm counts list.len() = 2 against min_items, check_text accepts the empty entry, and is_absent only tests the array for emptiness, so the row lands as a decision block offering one real option or none, though the contract (review-v2-method Blocked table: blocked_options 2-6, each naming its consequence) needs two. A blank blocked_missing is refused; a blank option is not.
F97: the failure no longer happens: F1 scheduled to task 1 `fix-alpha` (apply_task_id = 1). Task 1 is retitled to `fix-alpha-bound` (tasks update --ref moves links and audit trail, freeing `fix-alpha`). Before reconcile runs, review schedule mints task 2 for F2 whose summary slugs to `fix-alpha`. Task 2 commits; reconcile finds row `fix-alpha` by ref, never checks its id or link, and marks F1 resolved with F2's commit while F1's own task is unfinished.
F117: the change is made: The Finding.rest string read is re-written as a private helper or closure in about ten places the change added, beside two older copies
F118: the change is made: The apply-link field set (apply_flow, apply_task, apply_task_id) is spelled out at five sites; adding apply_task_id took a separate edit at each
F119: the change is made: The review-store path keying [[finding_links]].store is computed separately in schedule, reconcile and export; the link match needs all three to agree
F120: the change is made: schedule::edited copies select's TestGlobs::is_test_removal extraction of a finding's instances and edit target verbatim
F121: the change is made: A reproduction's field list is written twice, as reproduce.rs KEYS and store.rs REPRODUCTION_CORE, and a new field needs both edited
F122: the change is made: What makes a verdict a settle refute (orchestrator, refuted, evidence block) is restated in stats and settle beside verdict::settle_refute
F123: the change is made: settle and triage each re-derive a field's cap through fields::spec and rebuild cover.rs's 'N characters; the cap is M' refusal, though fields::cap exists
F130: the failure no longer happens: A reproduce batch row with "task": "" (a finding fixed with no task ref to name) hits the closure's third arm, since the !needed arm matches only None/Null; the row is refused with the reason "`task` is required" although task is optional, and the reproduction is not recorded."""
