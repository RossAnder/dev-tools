schema_version = 2
last_updated = 2026-11-10
plan_path = ""
last_import_refs = []
audit = true

[policy]
checkpoints = "milestones"
max_parallel = 6
commit_granularity = "per-task"
origin = "plan"
note = ""

[[checkpoints]]
id = "A"
rationale = "Apply core: findings become linked task rows through review schedule and resolve at the stamped commit through review reconcile, with the /apply-v2 carrier and the engine reconcile step"

[[checkpoints]]
id = "B"
rationale = "Reproduce check: after a fix milestone drains, each fixed finding gets a recorded reproduce verdict, one that still reproduces blocks the milestone, and triage hands off to /apply-v2"

[[checkpoints]]
id = "C"
rationale = "Blocked findings: blocked_on with its burden of proof replaces fix_shape, verifiers can unblock, decisions are answered at triage, evidence is settled then fixed, and blocked use is measured"

