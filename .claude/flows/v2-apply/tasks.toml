detail = """The args and the return are fixed in the design section cited below: `mode`, `run_dir`, `store`, `flow`, `milestone`, `round` and `units` in; `{mode, units: [{task, status, reproductions, error}], errors, script_version}` out. The script holds the unit return schema itself, `{task, reproductions: [{finding, verdict}]}`, and takes no pack and no `schemas` in this mode. Each verifier's prompt names its unit, tells it to read the findings with `tomlctl review show <ids> <store flag> --for implementer`, to judge against the working tree whether each still reproduces, to write its rows with `tomlctl review reproduce --ndjson <path under run_dir>/payloads/`, and to change no other file. A unit whose agent returns nothing is `no-return`. The plan-review wrapper's `mode: "recheck"` launch is the precedent for a mode key with its own `run_dir`. Raise `SCRIPT_VERSION`. `node --check` cannot parse a Workflow script, whose body has a top-level `return`; the harness gate below is the syntax-independent check."""
acceptance = ""
agent = "plan-worker-deep"
