action = """
F87: export-v1 builds the v1 description without fix_sketch or decision_answer, so an unblocked finding exports with its unblocking answer dropped
F92: A verdict never decides the status of a regression row, so a settle refute on one reports refuted but leaves it open and blocked
F96: blocked_options min_items(2) counts blank entries, so a decision block with one real option, or none, passes review add
F97: reconcile follows apply_task by ref alone, so a freed ref reused by another finding's task resolves the wrong finding
F117: The Finding.rest string read is re-written as a private helper or closure in about ten places the change added, beside two older copies
F118: The apply-link field set (apply_flow, apply_task, apply_task_id) is spelled out at five sites; adding apply_task_id took a separate edit at each
F119: The review-store path keying [[finding_links]].store is computed separately in schedule, reconcile and export; the link match needs all three to agree
F120: schedule::edited copies select's TestGlobs::is_test_removal extraction of a finding's instances and edit target verbatim
F121: A reproduction's field list is written twice, as reproduce.rs KEYS and store.rs REPRODUCTION_CORE, and a new field needs both edited
F122: What makes a verdict a settle refute (orchestrator, refuted, evidence block) is restated in stats and settle beside verdict::settle_refute
F123: settle and triage each re-derive a field's cap through fields::spec and rebuild cover.rs's 'N characters; the cap is M' refusal, though fields::cap exists
F130: An optional reproduction `task` given as an empty string is refused as "`task` is required""""
detail = '''
F87:
Fix: In export.rs candidate(), after description(projected), append `Fix sketch: <fix_sketch>` and `Decision: <decision_answer>` lines read from the finding (trimmed, when non-empty), matching what schedule.rs's task builder adds beside description(); keep description() itself unchanged so schedule does not print the sketch twice. Add a review_export.rs test: an open defect with unblocked_by = "user" and decision_answer, and one with unblocked_by = "verifier" and fix_sketch, exported by id; assert the v1 description contains each.
Failure scenario: A finding blocked on decision is answered with `review triage --answer-file` (decision_answer set, block cleared), or a verifier unblocks one with a fix_sketch, then `review export-v1 <id> --to .claude/reviews/x.toml` runs: refusal() passes it as unblocked, and candidate() writes description from description() alone (fix/edit/old/target_file/instances/failure_scenario). The v1 row carries the partial fix and no decision or sketch, so /review-apply implements without the answer the user gave.

F92:
Fix: Gate the status step on whether the row still awaits resolution, not on same_as alone: replace `finding.same_as.is_empty() && finding.status().decided_by_verdict()` with `!super::resolve::awaits_resolution(finding) && finding.status().decided_by_verdict()` (awaits_resolution already excludes rows with an outcome). Add a review_settle test that seeds a scheduled, evidence-blocked row with same_as and outcome = regression, settles it with --refute, and asserts status refuted.
Failure scenario: A regression row (resolve set it open with outcome = regression and kept same_as = F0) is blocked on evidence, scheduled, and settled with `review settle F1 --refute --citation src/a.rs:1`. settle sets it open and calls orchestrator_verdict; apply_one skips the status step because same_as is non-empty, so the row stays open and still blocked on evidence while settle prints outcome refuted. A replay re-runs the same no-op, and any later verifier or audit verdict on the row is likewise ignored.

F96:
Fix: In check_value's Ty::StrList arm, refuse an element whose trim() is empty ("entry {i} is blank") before the min_items comparison, so blank entries can neither pad the count nor land. The same arm serves evidence (Required, 1-5), which today also accepts [""]; the one edit closes both. Add a unit case beside a_single_option_and_a_fix_shape_are_refused: blocked_options ["a real option", "  "] is refused naming blocked_options.
Failure scenario: A finder submits a defect with blocked_on = decision, blocked_missing set and blocked_options = ["drop the cache, and two callers change", ""] (or ["", ""]). check_value's StrList arm counts list.len() = 2 against min_items, check_text accepts the empty entry, and is_absent only tests the array for emptiness, so the row lands as a decision block offering one real option or none, though the contract (review-v2-method Blocked table: blocked_options 2-6, each naming its consequence) needs two. A blank blocked_missing is refused; a blank option is not.

F97:
Fix: In reconcile, when the finding carries apply_task_id, accept the ref-named row only if row.id equals that id (or a finding_links entry of this store ties that row to the finding); otherwise fall through to retitled(). Add a review_reconcile test: F1 apply_task = fix-alpha, apply_task_id = 1; task 1 fix-alpha-bound in-progress linked F1; task 2 fix-alpha done with a commit linked F2; assert F1 stays in_flight and apply_task becomes fix-alpha-bound.
Failure scenario: F1 scheduled to task 1 `fix-alpha` (apply_task_id = 1). Task 1 is retitled to `fix-alpha-bound` (tasks update --ref moves links and audit trail, freeing `fix-alpha`). Before reconcile runs, review schedule mints task 2 for F2 whose summary slugs to `fix-alpha`. Task 2 commits; reconcile finds row `fix-alpha` by ref, never checks its id or link, and marks F1 resolved with F2's commit while F1's own task is unfinished.

F117:
Edit (change): Add one accessor on Finding in store.rs, beside identity_links: `pub(crate) fn text(&self, key: &str) -> Option<&str> { self.rest.get(key).and_then(TomlValue::as_str) }`. Delete settle.rs `text`, anchor.rs `rest_str`, reconcile.rs `link_text` and the copies in apply.rs (`text`) and digest.rs (`rest_str`). Replace the inline `|key| finding.rest.get(key).and_then(..as_str)` closures in stats.rs (apply_state, block_of, settle_outcome, BlockTally::add), triage.rs (Mode::recorded), fields.rs (blocked_on, clear_block) and select.rs `text` with calls to it. Callers that want `&str` add `.unwrap_or_default()`, and ones that want trimmed or non-empty text add `.map(str::trim)` or `.filter(|s| !s.is_empty())`.
Old text: fn text<'f>(finding: &'f Finding, key: &str) -> Option<&'f str> {
    finding.rest.get(key).and_then(TomlValue::as_str)
}
Instances: tomlctl/src/review/anchor.rs, tomlctl/src/review/reconcile.rs, tomlctl/src/review/select.rs, tomlctl/src/review/stats.rs, tomlctl/src/review/triage.rs, tomlctl/src/review/fields.rs, tomlctl/src/review/apply.rs, tomlctl/src/review/digest.rs, tomlctl/src/review/store.rs

F118:
Edit (change): In fields.rs, beside LINK_FIELDS, add `pub(crate) const APPLY_LINK_FIELDS: &[&str] = &["apply_flow", "apply_task", "apply_task_id"];`. In store.rs add `Finding::clear_apply_link(&mut self)`, which removes each key in APPLY_LINK_FIELDS from `rest`. Replace the three `rest.remove` lines in settle.rs `settle` and in reconcile.rs `reopen` with that call. Have the fields.rs companion-disjointness test iterate APPLY_LINK_FIELDS instead of its inline list. In settle.rs `recorded`, test for an unlinked finding with `APPLY_LINK_FIELDS.iter().all(|k| text(finding, k).is_none())`.
