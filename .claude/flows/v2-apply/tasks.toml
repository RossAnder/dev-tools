action = "Add the reproduce check to the verifier: a section in `review-verifier.md` and its method in `verifying.md`, and admit the `reproduce` write in the store-writer contract the seven review agents share."
detail = "The check asks one question per finding: does it still reproduce in the working tree as it stands, with the milestone's uncommitted edits in place. The answer is `gone`, `reproduces` or `unsettled`, each with a file:line or command-output citation, written with `tomlctl review reproduce --ndjson <path>`; read the verb's row shape from its `--help` in a debug build or from its clap type. It is not refute-first, it records no `review verdict`, and the verifier changes no file. Two contracts in the agent file change to admit it. The `review-v2-store-writer` shared block lists the verbs a review agent may write as `add`, `cover` and `verdict`: add `reproduce` there, with the same bytes in all seven carriers. The Fetch section says never to read another role's projection: the reproduce section states its one exception, that a reproduce check reads `--for implementer`."
acceptance = ""
agent = "plan-worker-deep"
commit = "a3df45235ade34080e512e540ff776b520eb785e"

