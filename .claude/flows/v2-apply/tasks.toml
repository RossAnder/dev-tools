action = "F131: Re-entry on an unstamped apply milestone reruns the gate from step 7, skipping the reproduce check, the settle drain and the findings reconcile"
detail = """
F131:
Fix: In drain.md 'Stamping on re-entry', and the matching 'Unstamped milestones' sentence in SKILL.md Re-entry, send a milestone holding an apply row back through step 6's tail instead of straight to step 7: findings.md 'Reproduce check' when a row fixes a finding, then 'Settle drain' when a row settles one, then the gate. On the stamp-from-HEAD branch, run findings.md 'Reconcile' between the stamp and the flow-store commit. Re-running the settle drain is safe: it already skips a finding an earlier pass recorded (findings.md, the paragraph after its listing).
Failure scenario: A settle milestone's rows are all done and the session ends at the settle drain's AskUserQuestion, before any review settle call. The next invocation finds the milestone unstamped and, by SKILL.md Re-entry and this paragraph, reruns the gate from step 7: no gate, so it commits, and Reconcile reopens each settles finding with no recorded proposal. Accepted proposals never reach apply-<n> and the user is never asked. A fix milestone ended before its reproduce launch fails the gate on reproduce-status with no reproduction, spending a fix round."""
