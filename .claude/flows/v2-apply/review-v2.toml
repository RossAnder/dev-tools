    "tomlctl/src/tasks/add.rs:211-217,763: unique_ref treats only items' refs and trail_refs as taken, so a later add can mint the freed old ref",
    "tomlctl/src/review/schedule.rs:627-628: fix task titles are the finding summary, so two findings with the same summary derive the same ref",
]
