lens = "correctness"
route = "verifier"
file = "tomlctl/src/review/fields.rs"
line = 1091
symbol = "check_value"
summary = "blocked_options min_items(2) counts blank entries, so a decision block with one real option, or none, passes review add"
severity = "minor"
failure_scenario = """A finder submits a defect with blocked_on = decision, blocked_missing set and blocked_options = ["drop the cache, and two callers change", ""] (or ["", ""]). check_value's StrList arm counts list.len() = 2 against min_items, check_text accepts the empty entry, and is_absent only tests the array for emptiness, so the row lands as a decision block offering one real option or none, though the contract (review-v2-method Blocked table: blocked_options 2-6, each naming its consequence) needs two. A blank blocked_missing is refused; a blank option is not."""
