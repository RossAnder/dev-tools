file = "docs/flows/v2-apply/design/engine.md"
symbol = "settle-drain"
summary = "Settle drain records accepted and unanswered proposals but not a rejected one; reconcile reopens it with no proposal, so it gets a second settle round"
severity = "major"
failure_scenario = "Settle task for F9 commits a Proposal: note tiered user; at step 3 the user rejects it. Step 4 records only --accept and --defer, so nothing is written and F9 stays scheduled, linked by settles. Reconcile (verbs.md#review-reconcile) sees the settle task done with a commit and returns F9 to open, reopen_reason 'no recorded proposal'. F9 is still evidence-blocked with no proposal, so review schedule mints a second settle task, breaking stores.md's one-settle-round rule and losing the rejection."
fix = "In design/engine.md#settle-drain step 4, record rejected proposals as well: accepted ones --accept; unanswered and rejected ones --defer, so the proposal stays on the finding, review schedule refuses it a second settle round, and triage lists it with its age, where the user gives the disposition (dismiss, or the plan route). The alternative, a --reject call on review settle, needs a stores.md and task 20 change."
effort = "trivial"
counter = "Refuted if stores.md, verbs.md or a task spec (20, 21, 27) elsewhere defines how a rejected user-tier proposal is recorded; grep of the flow for 'reject' found only D-record rejected options."
grade = "high"
evidence = [
    "docs/flows/v2-apply/design/engine.md:71 step 4: 'accepted ones `--accept`, unanswered ones `--defer`' - no rejected case",
    "docs/flows/v2-apply/design/verbs.md:49 reconcile returns a still-scheduled settles-linked finding to open when its settle task is done with a commit",
    "docs/flows/v2-apply/design/stores.md Proposals: schedule refuses a settle task only for a finding that carries proposal; settle drain 'Every outcome takes it off scheduled'",
    "D10 decision: 'schedule only accepted proposals into the fix milestone, and defer the rest onto their findings' - rejected ones fall under 'the rest' but step 4 says only unanswered",
