seen_in = ["U1"]
family = "plan"
kind = "advisory"
lens = "contrarian"
route = "none"
file = "docs/flows/v2-apply/design/verbs.md"
symbol = "review-schedule"
summary = "Folding findings with overlapping files into one task loses per-finding granularity; the milestone Workflow already serialises same-file tasks"
angle = "alternative"
rationale = "Folding has no recorded rationale. The Workflow's nextWave already keeps tasks sharing a file in separate waves, and a missing needs edge is only a dag/unreachable-claim warning, so folding buys no safety. Its cost: a cleanup with `instances` (up to 50 paths) unions every finding touching any of them into one task, which D9's rule then sends to deep (D9's own evidence: lite trouble at 3+ files), one failure or park leaves every folded finding scheduled, and one reproduce unit judges them all. The brief only says findings 'can' share a task."
alternative = "One task per finding, with `needs` between tasks claiming the same file (or none, relying on file-disjoint waves); fold only findings that share an identical edit target and line range."
adoption_cost = "Change the Folding bullet and Task 6's accept test: one task per finding, optionally chained by needs on shared files as drain.md does for gate fix tasks; title and effort rows lose their folded cases."
target = "design/verbs.md#review-schedule"
tier = "advisory"
anchor = "plan|docs/flows/v2-apply/design/verbs.md|review-schedule"
status = "parked"
first_seen = 2026-11-10
park_reason = "The user chose folding findings that share files into one task, and left this alternative unpicked at triage."

