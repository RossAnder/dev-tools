file = "docs/flows/v2-apply/design/engine.md"
symbol = "the-apply-carrier"
summary = "Approval writes .claude/active-flow.toml outside the flow dir, so the engine's clean-tree pre-flight refuses a new apply flow"
severity = "major"
failure_scenario = "Flow-less /apply-v2: step 6 commits, step 7 runs `plan approve`, whose register() upserts the flow into the tracked .claude/active-flow.toml. Step 8 invokes implement-v2-engine; its pre-flight lists every uncommitted path outside the flow dirs except the backlog, so it names .claude/active-flow.toml and stops. The design says the approval's writes land in the flow directory, so no step commits them."
fix = "After `plan approve`, commit what the stamp wrote before invoking the engine, as plan-v2-engine's approve step 7 does: the paths git status lists under .claude/flows/<flow>/ plus .claude/active-flow.toml and its sidecar. Before step 6, stop when .claude/active-flow.toml already holds someone else's edits. Consider printing plan-v2's v1-carrier warning too, since the registry entry makes the apply flow the one bare v1 carriers pick."
effort = "small"
counter = "A step of plan approve that skips register() when it is called for an apply flow, or a drift skip list that already includes .claude/active-flow.toml; approve.rs calls register() whenever amend is false, and drift.rs skips only the two flow dirs."
grade = "high"
evidence = [
    "tomlctl/src/plan/approve.rs:256 register(&slug, ..) -> flow/active.rs:462 upsert_entry writes .claude/active-flow.toml",
    "git ls-files: .claude/active-flow.toml and .claude/active-flow.toml.sha256 are tracked",
    "claude/skills/implement-v2-engine/references/run-milestone.md:39-44: tree must be clean except backlog and started rows' files; any other path stops the engine",
    "tomlctl/src/plan/drift.rs:198-199 skips only .claude/flows/<slug>/ and docs/flows/<slug>/",
    "claude/skills/plan-v2-engine/references/approve.md:166-172 commits the registry in a second commit for this reason",
]
target = "design/engine.md#the-apply-carrier"
expect = """"What the approval writes lands in the flow directory, which the engine's flow-store commit picks up.""""
new = """"What the approval writes is committed at once, before step 8, as `plan-v2-engine`'s approve step 7 does: every path `git status` lists under `.claude/flows/<flow>/`, and `.claude/active-flow.toml` with its sidecar, since `plan approve` registers the flow there and the engine's clean-tree check refuses that path. When `.claude/active-flow.toml` is already modified before step 6, stop and name it.""""
