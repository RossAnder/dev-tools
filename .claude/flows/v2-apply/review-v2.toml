severity = "minor"
failure_scenario = "review schedule mints a deep apply row (three files, or a medium defect). Its worker returns failed, saying the fix needs a decision. findings.md has no rule for a deep row's first failure, so the engine falls to drain.md's 'A failed task: re-spec it', and the orchestrator rewrites the row's outcome or constraints, deciding the question itself, which the brief's 'goes up a tier first' and D11's 'spec unchanged' exist to prevent."
fix = "State the deep case: a row already `deep` has no tier to move to, so its first such failure parks it for the user with the worker's note, and the drain's re-spec rule never applies to an apply row's failure. Carry the same line into task 27's detail."
fix_shape = "edits"
effort = "trivial"
counter = "'A second failure' may be meant to count a row's failures whatever its tier, so a deep row's first failure is relaunched unchanged once; that reading still leaves 'unchanged' unstated for deep rows."
grade = "medium"
evidence = [
    "design/engine.md#failure-on-an-apply-row: 'The first such failure of a lite apply row moves it to deep... A second failure parks the row'",
    "design/verbs.md#review-schedule: executor is deep unless the task holds at most two files and only cleanups or trivial/small defects",
    "claude/skills/implement-v2-engine/references/drain.md:115: 'A failed task | Read its note. Re-spec it (outcome wording, accept, means, constraints)'",
    "plan.toml D11: 'On the first failure of a lite apply row, move it to deep with its spec unchanged; park it for the user on the second.'",
]
target = "design/engine.md#failure-on-an-apply-row"
expect = """"A second failure parks the row for the user with the worker's note.""""
new = """"A second failure parks the row for the user with the worker's note. A row minted `deep` has no tier to move to: its first such failure parks it the same way. The drain's re-spec rule never applies to an apply row's failure.""""
