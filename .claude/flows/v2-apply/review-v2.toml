rationale = "from_toml refuses a schema_version newer than SCHEMA_VERSION ('upgrade tomlctl to read this store', tomlctl/src/review/store.rs:374). Under 'written back as version 2', any 0.23 write to any store, including one with no rechecks or scheduled findings, makes it unreadable to 0.22. Stores are committed, so another clone or machine on 0.22, or a revert of milestone A after 0.23 has run, hits that refusal on every review verb. D8 marks the bump one-way but does not name who is affected."
