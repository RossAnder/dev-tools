[[contract]]
id = "C1"
kind = "interface"
claim = "The task store's `[[finding_links]]` array, keyed by task ref with `store`, `fixes` and `settles`, is the one link from a task to its findings; review schedule writes it, and review reconcile and the worker view read it."
check = "grep -q 'finding_links' tomlctl/src/review/schedule.rs && grep -q 'finding_links' tomlctl/src/review/reconcile.rs && grep -q 'finding_links' tomlctl/src/plan/view.rs"
tasks = [
    1,
    6,
    7,
    8,
]
provides = "tasks::schema finding_links"
consumes = "review schedule, review reconcile, plan view --for worker"

[[contract]]
id = "C2"
kind = "interface"
claim = "Every premise and accept command review schedule writes into a fix task's spec is an invocation review anchor or review reproduce-status accepts. A settle task's accept check is the one exception: a grep of its proposal note."
check = "cargo nextest run --manifest-path tomlctl/Cargo.toml -E 'binary(review_schedule) & test(emitted_checks_parse)'"
tasks = [
    4,
    5,
    6,
]
provides = "review anchor, review reproduce-status"
consumes = "review schedule"

[[contract]]
id = "C3"
kind = "interface"
claim = "Whether a stored finding is blocked, and on what, is answered by one catalogue helper that reads a legacy `fix_shape = needs-plan` row as blocked on design; selection, list, digest and schedule all ask it."
check = """! grep -q '"fix_shape") [!=]= "needs-plan"' tomlctl/src/review/select.rs tomlctl/src/review/export.rs tomlctl/src/review/digest.rs tomlctl/src/review/query.rs tomlctl/src/review/schedule.rs"""
tasks = [
    17,
    18,
    21,
]
provides = "review::fields blocked helper"
consumes = "review select, list, digest, schedule"

