original_intent = 'As shipped by the plan: review resolve treated a `converted` advisory as suppressing; finding file, run scope, cell slice and citation paths each had their own path-safety rules; review cover read --note-file raw (a BOM survived) with its own empty-note message; and a missing store reported a per-verb "review store not found", a "file does not exist", or a raw OS error depending on the verb.'
rationale = 'Review findings R21, R16, R17 and R36. Now: resolve follows converted_to like merged_into, so a repeat naming a converted advisory credits its replacement and a regression on a resolved replacement is caught. fields::path_problem refuses the strictest union of the old rules (whitespace-only, backslash, leading slash, any second-byte colon, `..`). io::read_prose strips the BOM and gives cover and run finish the shared "needs a non-empty value" wording. store::load/require report "review store not found at <path>" (kind not_found) for every verb, including review stats under --strict-read. Covered by new tests in review_resolve, review_cells and review_query; the full tomlctl suite passed (2076 tests).'
type = "deviation"
task_ref = "implement-review-resolve-for-identity-outcomes"
date = 2026-10-13
