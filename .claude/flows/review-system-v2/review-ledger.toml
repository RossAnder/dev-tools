file = "tomlctl/src/review/catalogue.rs"
line = 2172
symbol = "run_catalogue"
severity = "warning"
effort = "small"
category = "db"
summary = "A run is not pinned to its catalogue: it stores a machine-absolute builtin path and tree_sha/config_sha that nothing reads, so later verbs load whatever catalogue is on disk now"
description = "start_catalogue validates and hashes the catalogue only at run start and writes an absolute builtin path (std::path::absolute) into the git-tracked store. run_catalogue, used by add routing, plan/cover accounting, survey, show --for finder, triage --convert and export, reloads from those roots without re-validating or comparing tree_sha/config_sha. A pull, lens edit or project-layer edit mid-run (the surveyor holds Write+Bash) silently changes lens selection and verifier/checker routing while the run record claims the start-time hashes; on another machine the absolute path fails to load. Fix: recompute both shas in run_catalogue and refuse on drift; store the builtin root relative to the Claude config dir or fall back to default_builtin_root()."
evidence = [
    "tomlctl/src/review/runs.rs:218 std::path::absolute(&builtin)",
    "tomlctl/src/review/runs.rs:250-252 tree_sha/config_sha written, never read back",
    "tomlctl/src/review/catalogue.rs:2198 Catalogue::load with no validate or sha comparison",
    "tomlctl/src/review/add.rs:112 run_catalogue(...).routing().compile() decides routing",
]
dedup_id = "cd9183a0143ed3e6"
resolved = 2026-10-13
resolution = "Uncommitted (review-apply 2026-10-13): run_catalogue recomputes tree_sha/config_sha and refuses on drift (legacy runs without tree_sha unchecked); run start omits builtin for the default root and resolves it via default_builtin_root(), a missing recorded root falls back to the default. review_survey failed_detector_records_unknown reworked to pin its catalogue (bad-regex case dropped; run start now rejects it up front)."

