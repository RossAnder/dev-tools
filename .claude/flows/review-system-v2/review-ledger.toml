summary = "A change under review can configure its own review: the project lens layer is read from the reviewed tree and can disable floor/security lenses or add auto-run check commands, unflagged"
description = 'Without --project, start_catalogue loads <root>/.claude/review-lenses/ from the working tree whose base..HEAD diff is under review. Its config.toml can disable any built-in entry including correctness and security (disabled lenses need no waiver and `--lens +id` refuses them), override lens Question/Probes/Does-not-flag prose, add [[checks]] commands the orchestrator runs through the verification agent, and disable lenses per path. Verified: `review catalogue --check` with disable=[security,correctness] + an override + `[[checks]] command="echo pwned"` returns ok. Nothing tells the operator the config is part of the change. Fix: in run start, list paths under the project layer that base..HEAD changes (`git diff --name-only <base>..HEAD -- .claude/review-lenses`) as project_layer_changed and refuse unless --project was passed explicitly; surface them at engine stage 1.'
evidence = [
    "tomlctl/src/review/runs.rs:228 default project layer from the reviewed tree",
    "tomlctl/src/review/cells.rs:729-731 --lens +id refused for a project-disabled lens",
    "tomlctl/src/review/cells.rs:1189 disabled lenses need no waiver",
    "claude/skills/review-v2-engine/references/survey.md:107 check commands dispatched one per line",
]
dedup_id = "4c8adfe3b685a9d1"
resolved = 2026-10-13
resolution = "Uncommitted (review-apply 2026-10-13): run start without --project refuses when base..HEAD changes paths under .claude/review-lenses (git diff --no-renames, listed in the error); with --project they are recorded as catalogue.project_layer_changed and surfaced at engine stage 1 (review-v2-engine SKILL.md, tomlctl references/review.md). Tests in review_runs.rs."

