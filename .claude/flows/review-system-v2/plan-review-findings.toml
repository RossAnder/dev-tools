plan_section = "### v2 store and the tomlctl review group"
summary = "Anchor matcher treats (file, symbol)/(file, line±10) as identity, silently merging distinct defects"
description = 'Rows sharing an anchor collapse in one record call, a later find on the same anchor becomes a `repeat` overwriting line/evidence/description, and a dismissed/deferred/refuted anchor suppresses every later finding there; summary only breaks ties. Across v1 ledgers 161 of 1,039 symbol-bearing items (15.5%) share (ledger, file, symbol) with a different defect (e.g. Executor::merge_worktree has three). Plan family is worst: symbol = task ref, so all findings on one task merge and one dismissal suppresses the task. The tier-C ±10 window this borrows only lists candidates; it never auto-merges. Failure: a null-deref and an off-by-one in record::apply both CONFIRMED → one F-id, the second lost. Fix: anchor proposes candidates only; a match needs an explicit `same_as = "F<n>"` from finder/verifier (PRIOR fence lists priors), otherwise mint with candidates under `related`. Raised by Agent 4.'
anchor_old = "It matches `(file, symbol)` when `symbol` is non-empty; otherwise `(file, line)` within ±10 lines, the same window as the tier-C dedup. An exact `summary` breaks ties."
anchor_new = 'It proposes candidates by `(file, symbol)` when `symbol` is non-empty, otherwise `(file, line)` within ±10 lines (the tier-C candidate window, which never auto-merges). A candidate is a match only when the row declares `same_as = "F<n>"` (finders and verifiers see prior findings in the PRIOR fence); otherwise the row is minted with the candidates under `related`. Rows from one run are never collapsed by anchor alone.'
dedup_id = "9e6c45108acf3ca8"

