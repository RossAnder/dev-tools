[[items]]
id = "P13"
review_round = 1
status = "merged"
severity = "warning"
category = "risk"
plan_section = "### v2 store and the tomlctl review group"
summary = "review record outcome rules overlap, are not total, and leave a refuted re-find of an exported finding to be applied"
description = "(a) 'suppressed: … or one not re-confirmed' overlaps `repeat` (a PLAUSIBLE re-find of an open finding fits both). (b) A REFUTED re-find of an open/exported match is undefined; for exported, the v1 row stays open and /review-apply applies a finding the latest verifier refuted. (c) No outcome for a row failing validation, and batch atomicity is unstated (one bad row aborting the single write loses a whole run). Fix: suppressed = dismissed/deferred match, or refuted match not CONFIRMED this run; add `contested` (open/exported match REFUTED this run: keep status, append verdict, report the v1 id to defer) and `refused` (invalid row reported and skipped, rest lands); state evaluation order. Raised by Agent 4."
anchor_old = "  - `suppressed`: a dismissed, deferred or refuted match, or one not re-confirmed, is reported and not minted."
anchor_new = """
  - `suppressed`: a dismissed or deferred match (any verdict), or a refuted match this run did not CONFIRM, is reported and not minted.
  - `contested`: an open or exported match this run REFUTED keeps its status, gains the verdict, and is listed in the report (for an exported match, with the v1 id to defer).
  - `refused`: a row failing validation is reported with its reason and skipped; the rest of the batch still lands in the single write.

  Outcomes are evaluated in this order: refused, contested, reopened, regression, repeat, suppressed, minted."""
dedup_id = "5384e80e6f539dba"

