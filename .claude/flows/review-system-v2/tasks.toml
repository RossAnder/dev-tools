[[checkpoints]]
id = "A"
rationale = "The `tomlctl review` group, including detectors, proposal and accounting, identity resolution, v1 read-back and the catalogue loader and verb, complete, tested, documented and version-bumped. A buildable crate increment; every later markdown fence naming `tomlctl review` parses against it."

[[checkpoints]]
id = "B"
rationale = "The v2 harness foundation: method core, the full catalogue gated by `catalogue_validates` and the widened lint scan set (with the hook trigger and the vocabulary fixture tests), engine, six agents, workflow and deploy entry. Buildable because no carrier references it yet and task 20's output cases are in the tree; `verify-shared-blocks.sh` covers the new agents."

[[checkpoints]]
id = "C"
rationale = "`/review-v2` usable end to end, the first trial-ready carrier."

[[checkpoints]]
id = "D"
rationale = "`/optimise-v2`, `/review-plan-v2`, the gate rows, the ignore rule and CLAUDE.md."

