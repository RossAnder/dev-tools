[[items]]
id = "E63"
agent = "plan-update"
summary = "Both plan-v2 Workflows wrap each agent call so a thrown error becomes an entry with status `error` and an `error` message (also listed in `errors`); every entry now carries `error`, null unless it failed. SCRIPT_VERSION is 2. Applies to plan-v2-investigate.js and plan-v2-prove.js (task 7). Uncommitted."
original_intent = "Entries carried id/status/verdict/note (investigate) and milestone/status/unactionable/false_premises/note (prove); a thrown agent error resolved to null and was reported as no-return."
rationale = "/review found every agent failure read as no-return, which the engine attributes to an unregistered agent, so a schema or runtime fault was misdiagnosed. The plan's description of the return shapes is now out of date."
type = "deviation"
task_ref = "add-the-investigate-workflow"
date = 2026-11-09

[[items]]
id = "E64"
agent = "plan-update"
summary = "open-and-challenge.md: the fan-out check snapshots git config (compared first, before any git status/diff) and HEAD, and excludes only the note paths each launch asks for. plan run start passes --args-hash (sha256 of the args file); the digest's stage_inputs.runs now projects args_hash (tomlctl/src/plan/view.rs, plan_records test, tomlctl references/plan.md), and a relaunch requires the hash to match. Surface records a run step (skip when nothing survives, start+finish when items do). Each lens is written into the brief's Unknowns as `- <id>: <question>`; pending is recomputed from those ids minus finished notes. Investigate gained Prove's status table, dependency lens ids are normalised, and the no-agent-launched case is named. Uncommitted."
original_intent = "Fan-out check excluded all of notes/ and took three snapshots (status, diff, untracked); args lived only in a scratch file; Surface left no run row; pending lenses were recomputed from notes/ alone."
rationale = "/review found the check let stray or overwritten notes and planted git config through, and that a resumed session could not recover the lens list, the launch HEAD or the args. args_hash already existed on the [[run]] row (v2-planning.md asked for it at launch) but had no writer or reader; the user chose to wire it through rather than record it as dropped."
type = "deviation"
task_ref = "write-the-open-and-challenge-reference"
date = 2026-11-09

[[items]]
id = "E65"
agent = "plan-update"
summary = "SKILL.md Re-entry reads stage_inputs.runs after the open-run rule and resumes at the earliest step whose run step (investigate, challenge, surface, cold-read) has neither a finished nor a skipped row, then follows plan stage's next. Rule 5 no longer says plan stage alone is enough; --depth and --no-review are stated as session-only bindings. Uncommitted."
original_intent = "Re-entry followed plan stage's next, on the premise that stage alone says where a plan stands."
rationale = "plan stage reads brief, milestones, tasks, specs and findings but no [[run]] rows, so a session that ended after Open or after the probes resumed past Investigate, the structure challenge or the cold read."
type = "deviation"
