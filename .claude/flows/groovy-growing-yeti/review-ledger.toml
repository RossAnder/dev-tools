resolution = "mark_startup_timed_out now writes the diagnostic ended-row (update_pty_session_ended stamps ended_at + wedged last_error with elapsed), fails pending pty_queue entries, then cancels session.shutdown to hard-kill the wedged bypassPermissions child; reap_exit gained an ended_at-keyed preservation guard that evicts the registry without clobbering the diagnostic"

