    "supervisor.rs:537 (registry.remove only in reap_exit)",
    "session.rs:32-39 (shutdown token = explicit child-kill, does not cancel on drop)",
    "http/pty_sessions/mod.rs:419-429 (DELETE grace-then-cancel precedent)",
]
