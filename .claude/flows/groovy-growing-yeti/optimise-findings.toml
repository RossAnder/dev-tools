description = "tick_once walks sessions sequentially in the single supervisor task; per Idle/Ready session dispatch_one does up to 3 serial SQLite writes through the single writer, so a contended write (up to the 5s busy_timeout) blocks the readiness re-eval + dispatch of all later sessions that tick. Do NOT parallelise with per-session tasks/join_all: SQLite is single-writer (parallelising adds no throughput) and it would forfeit the documented one-task invariant and widen the R15 TOCTOU. Defensible move: insert_pty_message (343) and the status persist (391) are not needed before the next session readiness check (the input frame is already sent), so reorder/offload them so dispatch latency is independent of DB contention. Latency-tail concern, not steady-state; measure tick duration under a multi-session run first."
evidence = [
    "lumina/server/src/pty/supervisor.rs:218",
    "lumina/server/src/pty/supervisor.rs:343",
]
