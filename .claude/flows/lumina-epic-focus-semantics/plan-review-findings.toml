plan_section = "## Constraints"
summary = "SQLite Constraints prose is muddled — CHECK-on-ADD-COLUMN is legal since 3.37.0 (action is sound)."
description = "VERIFIED via Context7 + sqlite.org: ALTER TABLE ADD COLUMN ... CHECK is permitted (since 3.37.0, 2021-11-27); the only real restrictions are no PRIMARY KEY/UNIQUE and NOT-NULL-needs-default. The plan's nullable-column-+-CHECK engineering is correct; only the prose ('cannot add a CHECK retroactively to existing columns') risks misleading. Tighten the wording; keep the design."
status = "merged"

