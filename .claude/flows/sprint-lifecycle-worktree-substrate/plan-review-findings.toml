plan_section = "#### 8. Mirror the guard + freeze in `get_sprint_quiescence` [S]"
summary = "Task 8 is mis-scoped as a 'mirror' -- get_sprint_quiescence does not read sprints.status today, so this is a structural change"
description = "Verified (readiness.rs:61-138): get_sprint_quiescence computes claimable as a single COALESCE(SUM(CASE...)) over sprint_tasks JOIN work_items and never reads sprints.status at all; the done/stalled verdicts (L125-128) derive purely from those counts. Making claimable=0 when the sprint isn't 'active' or a checkpoint is in-flight therefore requires ADDING (a) a SELECT status FROM sprints read and (b) a checkpoint-in_progress EXISTS probe, then zeroing claimable in Rust -- not a CASE tweak. It also forces a semantics decision the plan omits: should a FROZEN sprint (claimable=0) report done=true (since done = claimable==0 && in_progress==0 && blocked==0)? That would emit a false 'sprint complete' signal to the lead's poll loop. The [S] sizing is optimistic; flag the done/stalled-during-freeze behaviour as an explicit design point in task 8's detail and a task-13 assertion."
dedup_id = "77942a5d6ab7b27c"

