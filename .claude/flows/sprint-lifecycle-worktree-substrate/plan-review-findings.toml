summary = "Backfill 'open'->'active' is an unremarked semantic choice; add a post-migration out-of-vocab assertion"
description = "The UPDATE sprints SET status='active' WHERE status='open' promotes every legacy sprint straight to runnable 'active' (vs the safer 'draft', which matches what create_sprint now writes). Verified 'open' is the only value any PRODUCTION path writes (create_sprint omits status -> DEFAULT 'open' at runs_sprints.rs:141; 'closed'/'merged' exist only in the NON_RUNNABLE const + a test fixture), so 'open'->'active' is a faithful map for real data and the choice is defensible to preserve layer-1's 'open was runnable' behaviour -- but it is currently unremarked. Two cheap hardenings: (1) document the 'active' vs 'draft' decision + rationale in task 1's detail and ADR-0005; (2) add a migration_0016 assertion that SELECT COUNT(*) FROM sprints WHERE status NOT IN ('draft','ready','active','review','done','cancelled') == 0 after 0016 applies -- this mechanically gates the backfill and converts the 'backfill is correct' assertion into a verified gate. Also have set_sprint_status map an unparseable current status to a clean Validation rather than a parse panic."
