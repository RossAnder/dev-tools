description = "The annotations test (mcp/mod.rs:569-673) asserts hardcoded membership: a read_only_hint list and an idempotent_hint list, and every tool's #[tool] annotation must match. Task 9 lumps these as 'the read/idempotent annotation lists' without distinguishing, which risks a guessed annotation reding the test. Per-tool: the 3 reads (get_worktree, list_worktrees, list_task_commits) -> read-only list (+ each must carry read_only_hint(true) in its def); set_task_checkpoint IS idempotent -> idempotent list; but set_sprint_status is NOT idempotent (a second review->done is an ILLEGAL transition -> 422) so it must be OMITTED from the idempotent list. Spell this out in task 9's detail."
