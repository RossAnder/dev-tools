plan_section = "#### 3. Thread `work_items.checkpoint` through the row mapping + export fixture [S]"
summary = "Task 3's 'BEFORE created_at to satisfy the tables-last gate' rationale rests on two false premises"
description = """Verified two facts that contradict task 3's stated rationale: (1) WorkItemRow's FromRow decodes columns by NAME via row.try_get("col") (shared.rs:84-99), so SELECT column ORDER is irrelevant to decoding -- checkpoint can sit anywhere in the SELECT. (2) The tables-last gate (export.rs:873-881, open_questions_round_trip_gates_tables_last_ordering) fails only when a scalar is declared AFTER a Vec/table field on the Rust struct, and its own comment says 'the fix belongs in domain.rs declaration order (NOT this file)'. WorkItem is entirely flat scalars (no Vec; see the literal at export.rs:886-913), so a new scalar cannot trigger the gate regardless of position. The real, load-bearing work task 3 understates: when task 2 adds WorkItem.checkpoint, the export.rs WorkItem struct LITERAL at export.rs:886-913 must gain checkpoint: None or the crate won't compile (and any other WorkItem struct literal in tests likewise). Reword to drop the false gate rationale and name the struct-literal compile fix."""
anchor_old = "add `checkpoint` to `LIST_WORK_ITEMS_SQL` + `GET_WORK_ITEM_DETAIL_SQL` (`reads.rs:54-66`) BEFORE `created_at` to satisfy the tables-last export-ordering gate; update the `export.rs` tables-last fixture if it pins the column set."
anchor_new = "add `checkpoint` to `LIST_WORK_ITEMS_SQL` + `GET_WORK_ITEM_DETAIL_SQL` (`reads.rs:54-66`) — column position is immaterial (`WorkItemRow`'s `FromRow` decodes by name via `try_get`). The tables-last gate is the `WorkItem` field-declaration order (task 2), and `WorkItem` is all-scalar so the gate cannot fire for `checkpoint` regardless. Add `checkpoint: None` to the `export.rs` `WorkItem` struct literal in `open_questions_round_trip_gates_tables_last_ordering` (export.rs:886-913) so the crate compiles after task 2 widens the struct."
