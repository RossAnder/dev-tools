plan_section = "#### 7. Tighten claim guard + add checkpoint-freeze in `repo/team_execution.rs` [M]"
summary = "Stricter guard breaks the IN-MODULE team_execution.rs claim tests the plan never enumerates for repair"
description = "Verified: the new runnable-iff-active rule breaks more than the two test files the plan repairs (tasks 12/13 name only e2e.rs + claim_concurrency.rs). team_execution.rs's own #[cfg(test)] suite seeds sprints via seed_sprint at the create-default status='open' (runs_sprints.rs:141 omits status -> column DEFAULT 'open'). Two in-module tests will FAIL: (a) claim_returns_open_status_task (team_execution.rs:1276) seeds an 'open' sprint and asserts the task IS claimed -- this is the very E5 'open'-status test task 7's Acceptance claims 'still passes'; under runnable<=>active the sprint is 'open' not 'active' so the claim returns None and the assertion fails; (b) claim_honours_sprint_status_guard (1245-1266) flips the sprint to 'open' and asserts it IS runnable (L1266) -- a direct contradiction of the new guard. Fix: task 7 must own repairing its own in-module tests (activate the seeded sprint draft->ready->active before each claim, and rewrite the 'open'-is-runnable assertion). The plan's claim that the E5 test 'still passes' is factually wrong as written. Note: the related 'closed'/'merged' statuses appear ONLY in the NON_RUNNABLE const (team_execution.rs:38) and this test fixture -- no production path writes them, so the 'open'->'active' backfill is correct for real data (see P10)."
dedup_id = "9367ed5a27fd2349"

