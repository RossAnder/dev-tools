plan_section = "### 6. Add the bytes-regex compile helper [S]"
summary = "crlf(true) changes . as well as $, diverging the two helpers with no note"
description = 'regex 1.13.1 bytes::RegexBuilder::crlf: $ matches before \n or \r, ^/$ never match between \r and \n, and . stops matching \r as well as \n (with multi_line the EndCRLF translation applies). compile_user_regex sets neither flag, so the same pattern is not portable between tomlctl sweep and items list --where-regex, and the two helpers sit side by side with no marker. One sentence beside the new helper settles it.'
anchor_old = "The comment currently calls `dfa_size_limit` a memory cap for adversarial patterns"
anchor_new = 'Note beside the new helper that `.multi_line(true).crlf(true)` gives the sweep line-oriented semantics its sibling lacks — `^`/`$` per line and `.` excluding `\r` as well as `\n` — so a pattern is not portable between `tomlctl sweep` and `items list --where-regex`. The comment currently calls `dfa_size_limit` a memory cap for adversarial patterns'
dedup_id = "d68e872b63c6b4b5"

