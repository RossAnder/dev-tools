plan_section = "## Approach"
summary = "items sweep --update deletes anchors in files the engine never searched"
description = "`gone` is 'recorded anchors whose file has no hit', but a file yields zero hits when it was skipped as binary, oversize or unreadable, or when --max-hits truncation stopped collection before reaching it (one literal pattern 'tomlctl' yields 3083 hits in this repo, so 5000 is one broad -e away). coverage_complete excludes binary skips by construction, and --update has no gate on truncated or coverage_complete, so a still-valid anchor is dropped from instances, which is the apply flow's file budget. Two repairs: refuse --update when truncated or any recorded file was skipped, reporting those anchors under `unverified`; and fold skipped_binary into coverage_complete."
anchor_old = "Report `new` (hits in files not recorded, as `file:line`), `gone` (recorded anchors whose file has no hit), `kept`."
anchor_new = "Report `new` (hits in files not recorded, as `file:line`), `gone` (recorded anchors whose file was searched and has no hit), `kept`, and `unverified` (recorded anchors whose file was skipped or lies past a `--max-hits` cut). `--update` refuses when `truncated` is true or `unverified` is non-empty, since absence of a hit is not evidence there."
dedup_id = "ddfc2fd166e5dab8"

