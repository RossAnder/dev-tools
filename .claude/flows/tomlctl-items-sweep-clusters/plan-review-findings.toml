severity = "suggestion"
category = "risk"
plan_section = "## Approach"
summary = "Hits are never deduplicated per file:line, so instances accumulates repeats"
description = "find_iter yields every non-overlapping match, and the engine runs one find_iter per pattern keyed {file, line, pattern}, so K overlapping -e forms of one defect (the normal research sweep) give K hits per line and repeated matches on one line give more; --update writes them all into instances and pre-analysis counts entries to report growth. Collapse to one hit per file:line before output; --max-hits then budgets distinct sites."
anchor_old = "a `--max-hits` cap (default 5000) sets `truncated: true` rather than erroring"
anchor_new = "hits collapsing to the same `file:line` across patterns and repeated matches on one line are emitted once; a `--max-hits` cap (default 5000) over distinct sites sets `truncated: true` rather than erroring"
dedup_id = "18ee5a8800bbb4d2"

[[items]]
review_round = 1
status = "merged"
id = "P34"
severity = "suggestion"
category = "risk"
plan_section = "## Approach"
summary = "No containment check on enumerated paths, and git's exit-0 warnings are discarded"
description = "orphans.rs:173 and io.rs:1541 path_under_root exist so a symlink out of root fails containment; the sweep applies no equivalent, so a symlinked directory pointing outside the repo is read and echoed. Probe: `git ls-files --others --exclude-standard` emits `warning: could not open directory '.github/skills/flow-contract-task-visibility/'` (a dangling symlink) and exits 0, so the non-zero-exit branch never sees the under-enumeration and coverage_complete stays true. Check each path through path_under_root before reading and fold a non-empty stderr into skipped accounting."
anchor_old = "Entries that are directories or unreadable at scan time (staged deletes, gitlinks) are counted under `skipped.unreadable`, never fatal."
anchor_new = "Entries that are directories or unreadable at scan time (staged deletes, gitlinks) are counted under `skipped.unreadable`, never fatal. Each path is checked through `io::path_under_root` (`tomlctl/src/io.rs:1541`) before it is read, so a symlink resolving outside the root is skipped rather than read and echoed; a non-empty git stderr at exit 0 (a dangling directory symlink makes git warn and continue) is surfaced as `skipped.unenumerated` and clears `coverage_complete`."
dedup_id = "1738d7408086354e"

