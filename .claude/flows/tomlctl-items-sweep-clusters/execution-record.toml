id = "E58"
task_ref = "bind-the-engine-to-ledger-items"
summary = "unverified entries carry {anchor, reason}; --update retains excluded anchors in listed order and refuses only for truncation or a non-excluded unverified anchor (review R8, user-confirmed)"
original_intent = "unverified is a bare anchor list for files skipped or past --max-hits; --update refuses whenever truncated or unverified is non-empty and rewrites as kept anchors followed by new sites"
rationale = "an anchor under a default-excluded path was permanently unverified and blocked --update forever with a count-only message; reasons (unparseable, outside-repo, truncated, missing, skipped, excluded) make the refusal actionable and let excluded anchors survive a rewrite"
dedup_id = "4657008cd0b51b9f"

