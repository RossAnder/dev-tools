summary = "a file:symbol anchor covers every hit in its indentation span, not only the symbol's line (review R6, user-confirmed rule)"
original_intent = "a hit is new when it lies outside every recorded file:symbol anchor's line"
rationale = "the first-line rule made --update write a drift-fragile file:line twin for every hit inside an anchored function body, defeating the purpose of symbol anchors; the span ends at the next non-blank line at <= indentation that is not a bare closing bracket, degrading to first-line-only for Markdown and TOML"
