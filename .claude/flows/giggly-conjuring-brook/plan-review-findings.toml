anchor_new = "`fields = {tier: value}`, or `{tier: null}` for `none` — the clear must stay in the map handed to `RowUndo::of`, whose `expect` becomes the restore precondition, and `ledgers::restore` refuses an empty one"
dedup_id = "418fe515210005cb"

