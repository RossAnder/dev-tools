plan_section = "### Focus queue semantics"
summary = "Add never says what focus value inserted rows get; with gaps, focus = at misorders, and --at 0 is unspecified"
description = "Gaps are by design (removals never renumber), so focus values and positions diverge. With focus [1, 2, 5], adding at the bottom (at = 4) and writing focus = 4 sorts before the row at 5. The Add bullet specifies only the shift. Specify: new rows take consecutive values from the focus of the row now at position `at` (max+1 at the bottom); refuse at = 0; planner tests include a gapped queue."
anchor_old = "every queued row at position ≥ `at` shifts its `focus` by +len."
anchor_new = "the new rows take consecutive `focus` values starting at the `focus` of the row now at position `at` (max `focus` + 1 at the bottom; never `at` itself, since gaps make position and `focus` differ), and every queued row at position ≥ `at` shifts its `focus` by +len. `at` = 0 is refused. Planner tests include a queue with a gap."
dedup_id = "8f9c4651b9a299d2"

