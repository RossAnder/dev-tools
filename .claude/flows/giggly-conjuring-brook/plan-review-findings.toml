plan_section = "### Focus queue semantics"
summary = "Facade abort comparison and result shapes are unspecified; glimpse drops non-StaleOp stale entries and undoes only applied ids"
description = """(1) Comparison: glimpse sends every live row's (id, focus) as expect, Nones included. Comparing the full live set aborts on any concurrent capture; comparing only focused rows against an expect with Nones always differs. Define it: an expected id no longer live, a differing stored focus, or an unlisted live row carrying focus. (2) Shapes: glimpse `WriteOutcome::from_result` (glimpse/src/writer.rs:108-113) keeps skipped_stale entries only if they deserialise as `Stale {id, field, expected, found}` (filter_map ... .ok()); "every expected id" as bare ids vanishes, leaving rows marked saving with no notice. (3) `Writes::undo_last` restores only rows in `entry.applied` (glimpse/src/writes.rs:191), so `applied` must list every changed id including shifted/renumbered neighbours; task 6's output `{ok, changed, queue}` has no `applied`. Raised by risk F4, completeness F4, feasibility F5."""
anchor_old = "writes nothing (reporting every listed row in `skipped_stale`) when the stored queue differs"
anchor_new = """writes nothing when the stored queue differs — an expected id is no longer live, its stored `focus` differs from the expected one, or a live row absent from `expect` carries `focus` (a row captured or triaged meanwhile without a rank is not a difference) — reporting each mismatching row in `skipped_stale` as a `{id, field: "focus", expected, found}` object (the `StaleOp::to_json` shape glimpse's `writer::Stale` deserialises); on success `applied` lists every id in `changed`, shifted and renumbered neighbours included, because glimpse's undo restores only `applied` ids"""
dedup_id = "2c2a9237ac69f1f1"

