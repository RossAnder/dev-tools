id = "R1"
file = "glimpse/src/app.rs"
line = 1209
symbol = "App::undo_last"
severity = "warning"
effort = "small"
category = "quality"
summary = "Undo after the surface switches ledger marks a same-id row of the new ledger saving, and nothing ever clears it"
description = "The undo stack is global and never pruned. apply_ledger replaces a surface's ItemsState when ledger.path changes (auto-flow can do this unprompted). undo_last then track()s the entry's ids onto whatever ledger the surface now shows; ids like R3 recur across flows, so an unrelated row gets the saving mark. apply_written keeps applied rows saving until a read shows them changed, which never happens because the restore landed in the old, off-screen ledger. Fix: carry the ledger path/LedgerRef in UndoEntry and only mark rows saving while ledger_paths[surface] still matches (or drop Rows entries whose ledger left the screen)."
evidence = [
    "glimpse/src/app.rs:1197 track extends the saving set with no ledger check",
    "glimpse/src/app.rs:829 ItemsState replaced on ledger.path change; self.undo untouched",
    "glimpse/src/app.rs:995 apply_written: applied rows stay saving until a ledger read shows them changed",
    'Grep undo\.(clear|retain|truncate) in glimpse/src: no matches',
]
dedup_id = "0f8d72164f986755"
resolved = 2026-10-02
resolution = "Undo marks rows saving only while the surface still shows the write's LedgerRef; otherwise the restore still goes to the original ledger and the notice says 'in another ledger'. Test added. (uncommitted; review-apply 2026-10-02)"

