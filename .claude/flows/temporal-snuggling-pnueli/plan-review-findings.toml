anchor_new = "  - The creation of a flow-less ledger dir gives a new `Wake::NewScope(LedgerScopeDir)`: the poller's `Mode` adds one NonRecursive watch for it on the held watcher and rescans that scope once. `Wake::Rewatch` keeps today's meaning."
