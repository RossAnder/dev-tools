summary = "inputs.toml only grows, and next_id's max-over-present-rows scheme would reuse ids if it were ever compacted"
description = "[needs-plan] Lens: serialization (also raised as tangentials by memory and queries). Every record is kept forever (withdraw sets a status; InputsOp has only list/add/ack/handle/withdraw/answer), so every glimpse woken read, every carrier Step-0 `inputs list --pending` (six carriers, converting every row before filtering) and every write parses, converts, hashes and rewrites the whole history. next_id mints I{max+1} over present rows, so trimming the highest closed records would re-mint ids referenced by answers, answered_by, handled_note and glimpse undo. Decisions for a plan: (1) persist a top-level id high-water mark read/written by next_id - cheap now, while no store exists; (2) an `inputs compact --older-than` moving closed records to an archive file so the hot file shrinks; (3) move a closed question with its answer; (4) which carrier runs it (probably /backlog). Today the store does not exist in this repo; the cost is future and linear."
