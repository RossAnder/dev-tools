[[items]]
first_flagged = 2026-10-02
rounds = 1
status = "applied"
flow = "temporal-snuggling-pnueli"
id = "O4"
file = "glimpse/src/writer.rs"
line = 127
symbol = "Writer"
severity = "warning"
effort = "small"
category = "concurrency"
summary = "Quitting never drains or joins the writer thread, dropping queued writes and able to kill a write between the sidecar and TOML renames"
description = "Lens: async (cross-cutting with tomlctl write order and carrier integrity reads). Writer holds only a Sender and is documented as never joined; runtime::run (runtime.rs:112-119) saves state, restores the terminal, detaches the poller and returns, and process exit kills the writer thread. Queued requests are lost silently, and an in-flight facade write can die after write_sidecar_for and before the TOML atomic_write (io.rs write_serialized_with_sidecar persists the sidecar first), leaving NEW sidecar + OLD TOML plus stray .tmp files; carriers reading with --verify-integrity (/optimise Step 1, the apply pipeline) then fail until the next write or `tomlctl integrity refresh`. A write takes ~12-16 ms on the 256 KB backlog, and an N-row undo (O10) queues N of them, so `u` then `q` can land inside the window. Fix: bounded drain that keeps the never-wait-out-a-lock intent - `struct Writer { requests: Sender<WriteRequest>, done: Receiver<()> }`, the thread sends on done after its loop, `fn finish(self, within: Duration) -> bool { drop(self.requests); self.done.recv_timeout(within).is_ok() }`; call writer.finish(Duration::from_secs(2)) in runtime::run before ratatui::restore() and print one line after restore when it returns false. A call still running at 2 s is inside the lock retry loop holding nothing, so exiting then is safe."
evidence = [
    "https://doc.rust-lang.org/std/thread/index.html - Rust std, fetched 2026-10-02: when main terminates the program shuts down and destructors on other threads may not run",
    "tomlctl/src/io.rs:2019 write_serialized_with_sidecar (sidecar persist, then TOML persist)",
    "glimpse/src/runtime.rs:112-119 (no writer handling between run_loop and return)",
    "scratch backlog timing: 8 single in-process writes 849 ms vs 8 spawns 752 ms (~12-16 ms per write)",
]
related = ["O10"]
dedup_id = "7d65dfa36d85ae69"
resolved = 2026-10-02
resolution = "Uncommitted: Writer::finish closes the queue and waits up to WRITE_DRAIN (2 s) for it to drain; runtime::run calls it before restore and prints one stderr line on timeout; the thread keeps performing queued writes when the event channel is closed. A write that only acquires the lock after the bound can still race exit (window narrowed, not closed)."

