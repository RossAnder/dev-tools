summary = "sort_by_key re-invokes the allocating entry_sort_key O(n log n) times; sort_by_cached_key computes each key once"
description = "Both sort sites (`sorted_by_type` :374, `render_session_log` :601) call `rows.sort_by_key(|it| entry_sort_key(it))`. std `sort_by_key` invokes the key fn once per comparison (~O(n log n) calls); `entry_sort_key` (:343) allocates a String via `date_key` and a second via `id_order`'s `Other` arm (:365), so one sort does ~n*log n key calls * up to 2 String allocs. Switch both sites to `sort_by_cached_key` (key computed once per element, n calls; both are stable sorts so ordering is identical). Independently flagged by all four active lenses (memory/serialization/query/algorithm) — highest-signal item, cleanest win. Risk: confirm the golden/idempotency tests still render byte-identical output."
evidence = [
    "https://doc.rust-lang.org/std/primitive.slice.html#method.sort_by_cached_key",
    "rust-lang/rust PR #48639 (add slice::sort_by_cached_key)",
    "rust-lang/rust PR #55821 (rustc switched to sort_by_cached_key for non-trivial key fns)",
]
dedup_id = "a6109cf4fe15af88"
resolved = 2026-06-22
resolution = "sort_by_key -> sort_by_cached_key at both sort sites (sorted_by_type :374, render_session_log :613); stable sort, golden byte-identical (no commit)"

