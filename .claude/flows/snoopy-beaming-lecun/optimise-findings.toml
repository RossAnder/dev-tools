evidence = [
    "render_progress_log.rs:226 four independent passes/sorts",
    "filtering a sorted slice preserves the sort order",
]
related = ["O1"]
dedup_id = "df82a8e53334c356"
wontapply_rationale = "requires deliberate refactor - marginal constant-factor gain at n=~100 does not justify fusing the passes; the typed tables are not pure type-splits of one sort (render_completed also filters status==done, render_deviations runs supersession_tips over its subset), and sorted_by_type stays self-documenting."

