summary = "T3 Files omit init.rs (execution_record_path_for is private) and query.rs (apply_sort is private)"
description = "execution_record_path_for (init.rs:82) is a private fn, not pub(crate); sharing it needs an init.rs edit T3 does not list. apply_sort (query.rs:1331) is also private while apply_filters/apply_aggregation_group_by are pub(crate). Fix: fold the execution_record_path_for pub(crate) promotion into T1 (which already owns the optional init.rs touch), and have render use a self-contained deterministic (date,id) sort rather than reaching into query.rs -- safer for the byte-identity invariant and avoids touching query.rs. Then T3 only consumes pub fns."
