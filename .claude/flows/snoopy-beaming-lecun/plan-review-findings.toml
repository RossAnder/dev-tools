summary = "seed_doc_for must return Result (today_toml_date is fallible); schema_version must be Integer(1); auto-created files must byte-match flow-init output"
description = "flow::time::today_toml_date returns Result<Datetime> (time.rs:70), so the plan signature seed_doc_for(path) -> TomlValue is wrong; it must be -> Result<TomlValue>. bootstrap_execution_record (init.rs:284) builds the skeleton via a raw format string (schema_version = 1 / last_updated = today_iso); seed_doc_for building a TomlValue and serialising could diverge byte-wise (schema_version must be TomlValue::Integer(1) not a string; last_updated a bare date). Promote the optional tidy (route bootstrap_execution_record through seed_doc_for) to REQUIRED, or add a unit test asserting the two seed paths are byte-identical."
