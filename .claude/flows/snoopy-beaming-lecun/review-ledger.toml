severity = "warning"
effort = "small"
category = "security"
summary = "render-progress-log never validates --slug, so a traversal slug escapes .claude/ for both the read and the unguarded write"
description = "dispatch passes the raw CLI slug straight to execution_record_path_for(slug) (init.rs joins .claude/flows/<slug>/...) with no validate_slug call — every other slug entrypoint (init, ensure_artifact, active) validates against the ^[a-z0-9][a-z0-9-]{0,63}$ regex first. A slug like ../../../../tmp/x resolves the record path outside .claude/: the read_toml at line 72 becomes a file-existence + parse-error-snippet oracle for arbitrary paths, and the write at line 92 is a bare atomic_write with NO guard_write_path and NO recheck_claude_containment, so a PROGRESS-LOG.md is written into the traversed dir with no --allow-outside opt-out. The write primitive is bounded (it only fires where a sibling execution-record.toml already exists), but the read oracle is general. Fix: validate_slug at the top of dispatch and route the write through the guarded pipeline."
evidence = [
    "tomlctl/src/flow/render_progress_log.rs:57",
    "tomlctl/src/flow/render_progress_log.rs:72",
    "tomlctl/src/flow/render_progress_log.rs:92",
    "tomlctl/src/flow/init.rs:338",
]
related = ["R19"]
dedup_id = "a8599d7d0f5f9fab"
resolved = 2026-06-22
resolution = "Validate --slug via init::validate_slug before path resolution + plan_path containment check; closes the traversal read-oracle and unguarded write (a5da8e5)"

