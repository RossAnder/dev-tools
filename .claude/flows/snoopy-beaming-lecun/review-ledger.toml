severity = "suggestion"
effort = "trivial"
category = "quality"
summary = "seed_doc_for eagerly computes today_toml_date() on every write even when the target exists and the seed is discarded"
description = "on_missing_for builds OnMissing::Create(seed_doc_for(file)?) before mutate_doc* knows whether the file exists, so for the common case (file present) the seed — including the fallible today_toml_date() clock read — is computed and dropped. Because today_toml_date is fallible, a clock failure could abort a write to an EXISTING file that never needed a date. Impact is negligible (the read is cheap and rarely fails); the clean fix is lazy seed computation (compute-on-miss). Flagged as a correctness-surface nit, not a perf problem."
evidence = ["tomlctl/src/cli/dispatch.rs:322"]
dedup_id = "4d548fbd49d8e0a2"
wontfix_rationale = "Lazy-seed requires reworking the OnMissing enum + the three mutate_doc* variants in io.rs for negligible benefit (today_toml_date is cheap and rarely fails) — a deliberate refactor, not a point-fix. Out of the cluster's file scope."

