agent = "implement"
task_ref = "phase-2-per-family-routes"
summary = "Phase-2 per-family smoke tests written as in-file mod tests rather than lumina/tests/e2e.rs extensions"
original_intent = "Per the plan, each Phase-2 task (T2-T5) was to extend lumina/tests/e2e.rs with one tokio test per family."
rationale = "Four parallel implementer agents cannot safely append to the same e2e.rs file — file-ownership-is-absolute would have forced serialisation of T2/T3/T4/T5. Each agent instead wrote its smoke tests as a #[cfg(test)] mod tests block at the bottom of its own family file (the canonical pattern already used by lumina/src/http/work_items.rs). Test count unchanged (15 new tests across 11 files); coverage equivalent; parallelism preserved."
dedup_id = "14154cf7542d6b3c"

[[items]]
id = "E4"
type = "deviation"
date = 2026-05-27
agent = "implement"
task_ref = "phase-2-per-family-routes"
summary = "Folded pre-existing tier reader-path defect fix into Phase 2 (out of plan scope but blocked round-4 deliverable)"
original_intent = "Round-4 plan scoped HTTP and FE only; no Rust read-path edits planned beyond per-family route handlers. Specifically repo.rs was out of scope."
rationale = """T2's implementer surfaced that repo::list_work_items and repo::get_work_item_detail did NOT project the tier column added in migration 0006 — both hardcoded tier: None in their row->WorkItem mapping. PATCH /tier and PATCH /task-spec.tier would succeed on write but the re-fetch (which the FE PATCH return contract relies on) would silently return tier=null. Two-line fix per call site (project `tier AS "tier?"` in SELECT + read row.tier in mapping) directly unblocks the round-4 deliverable; deferring would propagate broken state into T7/T8a. Regenerated lumina/.sqlx/ offline cache to reflect updated query macros (cargo sqlx prepare -- --all-targets)."""
dedup_id = "26448fd56e55fcb9"

