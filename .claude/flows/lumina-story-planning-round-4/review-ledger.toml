dedup_id = "5452a5cb8c2ca46e"
resolved = 2026-05-27
resolution = "Per-family composables now call useHierarchy().refresh(workItemId) after successful mutations; refresh added to useHierarchy.ts. Open-question task-side mutators refresh the affected task id, not the bound story id."

