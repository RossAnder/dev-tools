category = "quality"
summary = "Supersede wrappers diverge across four families using identical URL shapes — copy-paste from one family to another will silently misbehave"
description = "All four supersede routes use /{family}/{old_id}/supersede/{new_id}. But wrappers split: supersedeFinding(oldId,newId) and supersedeResearchNote(oldId,newId) take two real ids and no body; supersedeRisk(oldId,body) and supersedeRejectedAlternative(oldId,body) pass 'placeholder' as new_id and have the server mint a fresh uuid from the body. Composable arities also diverge: useFindings.supersede(itemId,oldId,newId) vs useRisks.supersede(workItemId,oldId,body). A UI author who copies the findings pattern onto risks will pass two real ids and the new_id segment will be silently ignored. Either unify the wire (dedicated *-with-replacement endpoint for risks/RA) or rename the divergent wrappers to supersedeWithReplacement."
dedup_id = "14e3fb6616d193f3"
wontfix_rationale = "Backend semantics genuinely diverge: research-notes (lumina/src/http/research_notes.rs:166-171) and findings (lumina/src/http/findings.rs:198-203) chain by ID-only with NO request body (Path((old_id,new_id)) handler). risks (lumina/src/http/risks.rs:111-159) and rejected-alternatives (lumina/src/http/rejected_alternatives.rs:100-133) chain by inserting a new row with body (Path + Json<AddBody>). The TS wrappers correctly mirror these semantics. Unifying without backend handler changes (out of scope this round) would require either lying to the backend or accepting silent misbehaviour. Split into a backend-side handler-unification finding for a future round if convergence is desired."

