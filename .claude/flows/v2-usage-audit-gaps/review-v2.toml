expect = """"design/records.md#review-run-plan-digest is the contract. In plan/target.rs add a function mapping every plan target, in the target grammar of claude/skills/review-v2-method/references/plan-records.md, to the SHA-256 of its current value, and a delta function. review run start, on a flow with plan.toml and a plan-family run, stores plan_digest on the run row: add the optional field to the typed Run in review/store.rs, and to the run key list review/fields.rs validates against if it has one. Compute the delta in PlanReviewState (plan/store.rs), the one review view plan gate, approve and stage share, so they cannot disagree. plan stage reports review_delta (the targets), plan gate adds a risks row of kind review-delta, and plan approve --review ran refuses while the delta is non-empty unless --waive-review-delta <why> is given, which is stored as the approval's delta_waiver. A run with no plan_digest (older stores) yields no delta. Tests: in review_runs.rs a plan-family start stores a digest; in plan_approve.rs an edit after the run refuses approve, the waiver approves and is stored, and an unchanged plan approves.""""
