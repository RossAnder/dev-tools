severity = "major"
failure_scenario = "A plan-family run stamps plan_digest over every target. Re-check U2 is a targeted run (review recheck-targets), started after task 16 was added. Its digest therefore holds task 16's records. Once U2 finishes, 'the latest finished run' is U2, task 16 matches its digest, and the delta is empty. Approval passes with task 16 unreviewed, which is the incident the design exists to close."
fix = "Define coverage in records.md. A run with `rechecks` set records in plan_digest only the targets it re-checks: its recheck-targets, or the review_delta it was opened for. A full run records every target. A target's delta is measured against the latest finished run whose plan_digest holds that target. Task 12's delta function then follows the definition."
effort = "small"
counter = "Refuted if a re-check run were never a plan-family run with its own plan_digest. records.md digests every flow-mode plan-family run, and plan-flow.md section 10 opens re-checks as fresh runs."
