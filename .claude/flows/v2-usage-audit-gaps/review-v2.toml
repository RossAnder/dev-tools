summary = "The self-edit snapshot is placed 'at launch', which a drain relaunch re-enters, so a literal reading re-copies references the workers have edited"
severity = "minor"
failure_scenario = "A self-editing milestone launches, a row fails, and the drain relaunches through steps 3 and 4 (run-milestone.md:96, 'a relaunch from the drain goes back to step 3'). An executor who writes the snapshot into step 4 as the Detail says re-copies the references then, now holding the first round's edits, and the drain continues from the edited text the snapshot was meant to avoid."
fix = "State that the snapshot is taken once, before the invocation's first launch of the milestone, and reused unchanged by every relaunch from the drain."
effort = "trivial"
counter = "If the drain never relaunched, or relaunch skipped step 4, one snapshot would be all there is; run-milestone.md:96 sends a relaunch back to step 3, which flows into step 4."
grade = "high"
evidence = [
    "claude/skills/implement-v2-engine/references/run-milestone.md:96: 'a relaunch from the drain goes back to step 3 and does not run them again'",
