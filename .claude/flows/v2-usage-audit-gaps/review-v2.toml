    "plan.toml milestone A gates include cargo install --path tomlctl --locked as a held external gate",
]
fix_files = [".claude/flows/v2-usage-audit-gaps/tasks.toml"]
target = "design/records.md#base-rerun-mapping"
expect = """"the drain reruns every `fail` command of the round's latest run at the base, in the order that run lists them, a command with `failed_ids` narrowed to those ids and one without run whole.""""
