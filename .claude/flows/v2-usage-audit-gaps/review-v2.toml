symbol = "emit-outputs"
summary = "Stripping every ASCII whitespace byte counts token-merging and in-string edits as whitespace-only, and the significant list omits .sh, .toml and .json"
angle = "risk"
rationale = """gate-list --after-round treats a file as whitespace-only when its stripped digest is unchanged. That equates `a = b` with `a=b` in shell (an assignment against a command), `"a b"` with `"ab"` in any string literal, and `let a` with `leta`. The significant list covers .py, .yaml, .yml, Makefile and .md, but not .sh, .toml, .json, .js or .ts, so a fix round that changes semantics this way carries the commands that passed in round n without rerunning them. Example: a whitespace fix in a gate's own `scripts/*.sh`."""
adoption_cost = "Add .sh, .bash, .toml and .json to the significant list in records.md#emit-outputs and task 7's detail, or compare whitespace-collapsed rather than whitespace-stripped digests (runs of whitespace folded to one space) in task 3's whitespace_digest. Either way it is a few lines in tasks 3 and 7."
