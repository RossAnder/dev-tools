    "design/records.md: 'the `plan_digest` of the latest finished run that covered them'; the digest is 'a table from each plan target'",
    "tomlctl review.md: recheck-targets lists only applied targets and addressed entries, so a re-check is a targeted run",
    "plan-flow.md:306-316 the re-check is a fresh run that records the run it re-checks",
    "brief Background B-bd50caa8: U2 covered only targeted records, not new task 16",
]
