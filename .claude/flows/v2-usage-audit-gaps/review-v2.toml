symbol = "base-rerun-mapping"
summary = "An id-less whole-command failure at base is called pre-existing, but forward accept checks and unprovisioned worktrees always fail there"
severity = "major"
failure_scenario = "Two triggers. A gate-owned forward accept check such as `cargo test --test new_cli` hits a compile error at head and reports no ids. Rerun whole at base, where its target does not exist yet, it fails, so base_whole_failed marks it a base failure. In a bun repo, `bun run type-check` fails at head, and its rerun in a fresh `git worktree add` with no node_modules fails too. Either way, the milestone's own failure mints no fix and goes to the user labelled as pre-existing."
fix = "In the mapping, a whole-command base failure is a base failure only for a command in the milestone's `gates`. A forward accept check is never rerun at base, since it fails there by construction, and gets a skip block like a held command. Before the rerun, the drain provisions the worktree with the project's setup (its install step and ignored config the gate reads). When it cannot, it reports an id-less base failure to the user as unverified rather than pre-existing. Carry both rules into task 16's base-rerun step."
effort = "small"
counter = "Refuted if the verification agent or drain already provisions a worktree's dependencies. Neither verification.md nor task 16's Detail (`git worktree add --detach`, then the command) mentions any setup step, and a forward check is by its kind red before the task."
