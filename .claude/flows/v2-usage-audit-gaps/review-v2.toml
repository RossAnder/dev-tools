symbol = "base-rerun-mapping"
summary = "The base rerun reruns every failing command, held installs and deploys included, so a failed held command reruns at base and installs or deploys the base tree"
severity = "major"
failure_scenario = "The drain runs held commands only after every other block passes, and records them into the same run with --rerun. Take milestone A's external `cargo install --path tomlctl --locked` failing on a stale Cargo.lock. The base rerun must rerun every fail command, and a count mismatch is refused, so it runs `cd <worktree> && cargo install --path tomlctl --locked`. That installs the base 0.26.0 binary over PATH, and the command is classed as the milestone's own failure. In a consumer repo, an external deploy gate would ship the base tree."
fix = "Never rerun a held command at base. That means one the milestone's external_gates lists, an accept check with effect external, or one the drain held by judgement. Let a base call carry a `skip` block (or row) for such a command, kept in order so the count still matches, which leaves it `base_checked = false`. State this in records.md's mapping, and have task 16's drain step pass skip for every held command."
effort = "small"
counter = "Refuted if the drain never runs a base rerun for a round whose only failures are held commands. Neither records.md nor task 16's Detail ('rerunning every fail command of the round's latest run') makes that exception."
