[[findings]]
id = "F8"
run = "U1"
cell = "C4"
seen_in = ["U1"]
family = "plan"
kind = "defect"
lens = "test-gaps"
route = "verifier"
file = ".claude/flows/v2-usage-audit-gaps/tasks.toml"
symbol = "stamp-a-plan-digest-on-review-runs-and-gate-approval-on-the-delta"
summary = "Task 12 never tests that a recheck run clears the review delta, that an unfinished run does not, or plan stage's review_delta list"
severity = "major"
failure_scenario = "After a post-review edit, approve.md (task 28) runs a recheck and repeats until review_delta is empty. If the delta is measured against the first run, or against the latest run whether finished or not, the recheck never clears it (approval blocked, forcing a waiver every time) or a started-and-abandoned run hides it (edits approved unreviewed). Task 12's tests (edit refuses, waiver approves, unchanged approves) pass either way."
fix = "Extend task 12's tests in plan_approve.rs and review_runs.rs: an edit, then a second finished plan-family run, approves without a waiver; an edit, then a started but unfinished run, still refuses; plan stage reports exactly the edited target in review_delta; plan gate lists a review-delta risk."
effort = "small"
counter = "A test elsewhere in milestone A that drives a second review run against plan approve would cover it; no other task's files name plan_approve.rs or review_runs.rs."
grade = "high"
evidence = [
    "docs/flows/v2-usage-audit-gaps/design/records.md:102: the delta is measured against the latest finished run that covered the targets",
    "task 12 detail: Tests list digest stored, edit refuses, waiver approves, unchanged approves",
    "task 28 detail: repeat the recheck until review_delta is empty, taking targets from plan stage's review_delta",
]
