[[findings]]
id = "F3"
run = "U1"
cell = "C8"
seen_in = ["U1"]
family = "plan"
kind = "defect"
lens = "plan-executor"
route = "verifier"
file = ".claude/flows/v2-usage-audit-gaps/tasks.toml"
symbol = "give-the-verification-agent-a-run-directory-pid-files-and-runner-rerun-forms"
summary = "The vitest rerun form `-t {ids_regex}` filters by test name, but extract.sh records a vitest failure id as its file path, so it selects nothing"
severity = "minor"
failure_scenario = '''A vitest gate fails one test. extract.sh's `^ *FAIL(ED)? +[^ []` rule prints $2 of ` FAIL  src/a.test.ts > suite > renders`, so the .ids line is `src/a.test.ts`. The documented rerun `vitest ... -t 'src/a\.test\.ts'` matches no test name, runs nothing, PASSED_ANY stays no, and a flaky vitest failure is never recognised as flaky: the narrow rerun this task adds is dead for vitest.'''
fix = "Write the vitest example as a file filter, `vitest run {ids}` (the ids are file paths), and keep `-t {ids_regex}` for bun only after confirming bun's -t matches the `describe > name` form its `(fail)` lines give; otherwise state how the ids map to bun's full test name."
effort = "trivial"
counter = "If the agent's extractor emitted vitest test names rather than file paths, -t would match; verification.md:58 prints field 2 of the FAIL line, which is the file."
grade = "medium"
evidence = [
    """claude/agents/verification.md:58: grep -E '^ *FAIL(ED)? +[^ []' "$L" | awk '{print $2}' — the vitest FAIL line's second field is the file path""",
    "claude/agents/verification.md:60: bun ids come from `(fail) <name>` with the describe chain joined by ' > '",
    "task Detail: 'Add rerun: examples for bun test (`bun test -t {ids_regex}`) and vitest (`-t {ids_regex}`)'",
]
target = "task:give-the-verification-agent-a-run-directory-pid-files-and-runner-rerun-forms.detail"
expect = """"Read notes/gate-waiver-and-orphans.md. Step 0: when the prompt carries run_dir:, use it as <D> (create it) instead of mktemp. Step 1b: right after the nohup launch write cN.pid; under MSYS or Git Bash write the Windows pid from /proc/$!/winpid, which taskkill can reach, and on POSIX launch under setsid and write the process group id. Add a {ids_regex} placeholder beside {ids}: the failed ids, each regex-escaped, joined with | into one single-quoted pattern, a mechanical substitution like {ids}. Add rerun: examples for bun test (`bun test -t {ids_regex}`) and vitest (`-t {ids_regex}`) beside the nextest one. Say a command may run in another directory through its own `cd <dir> &&` prefix, which is how the drain's base rerun reaches its worktree.""""
new = """"Read notes/gate-waiver-and-orphans.md. Step 0: when the prompt carries run_dir:, use it as <D> (create it) instead of mktemp. Step 1b: right after the nohup launch write cN.pid; under MSYS or Git Bash write the Windows pid from /proc/$!/winpid, which taskkill can reach, and on POSIX launch under setsid and write the process group id. Add a {ids_regex} placeholder beside {ids}: the failed ids, each regex-escaped, joined with | into one single-quoted pattern, a mechanical substitution like {ids}. Add rerun: examples for bun test (`bun test -t {ids_regex}`) and vitest (`vitest run {ids}`, since the extractor records a vitest failure as its test file's path, which -t would not match) beside the nextest one. Say a command may run in another directory through its own `cd <dir> &&` prefix, which is how the drain's base rerun reaches its worktree.""""
tier = "cited"
