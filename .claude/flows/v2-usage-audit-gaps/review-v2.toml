[[findings]]
id = "F7"
run = "U1"
cell = "C4"
seen_in = ["U1"]
family = "plan"
kind = "defect"
lens = "test-gaps"
route = "verifier"
file = ".claude/flows/v2-usage-audit-gaps/tasks.toml"
symbol = "record-base-reruns-and-tree-digests-in-plan-run-gate"
summary = "Task 3's tests skip the whole-command base rerun, where records.md's equal-sets rule marks a base-passing command a base failure"
severity = "major"
failure_scenario = "Milestone gate: clippy (no failed_ids) fails on the milestone's own edit and passes at base. Per records.md, base_failed_ids stays empty, equal as sets to the empty failed_ids, so the command is a base failure: no fix round is minted and the milestone's own regression goes to the user to backlog or waive. Task 3's listed tests (id-narrowed base and partial failures, wrong count, tree) all pass on that implementation."
fix = "Add to task 3's test list: a whole command failing at base is a base failure with base_whole_failed = true; a whole command passing at base is not a base failure; base ids outside the command's failed_ids are ignored; a base call on a round with no run is refused. The classification must treat an empty failed_ids as base-failing only through base_whole_failed."
effort = "small"
counter = "If the implementation or records.md gated the equal-sets rule on a non-empty failed_ids, the misclassification could not arise; records.md#base-rerun-on-a-gate-command as written does not."
grade = "high"
evidence = [
    "docs/flows/v2-usage-audit-gaps/design/records.md:36: base failure when base_checked and base_failed_ids equals failed_ids as sets, or base_whole_failed",
    "docs/flows/v2-usage-audit-gaps/design/records.md:53: a whole-command rerun failing with no ids marks base_whole_failed; a base pass leaves both lists empty",
    "task 3 detail: Tests list only base and partial base failures, wrong count, failing and passing tree",
]
target = "task:record-base-reruns-and-tree-digests-in-plan-run-gate.detail"
expect = """"With `--base`, the rows (or `--blocks`, parsed as today) are the base rerun of the round's latest run's failing commands, mapped by order as design/records.md#base-rerun-mapping says: refuse a count that differs from the number of failing commands, and refuse when the round has no run, naming the command to record it first. For each failing command set `base_checked = true`, `base_failed_ids` to the base result's failed ids that are among the command's own, and `base_whole_failed` as records.md says. Without `--base`, when the recorded run's outcome is `fail`, compute `tree` per design/records.md#tree-digest-on-a-gate-round: every path in the files of the milestone's rows, read from disk with no git call, each with its raw and whitespace-stripped SHA-256, `deleted` for a missing path. Put the digest helper in run_gate.rs as `pub(super) fn whitespace_digest`, returning both digests, since plan emit gate-list reads it. Tests in plan_run_records.rs: a base rerun marks base and partial base failures; a base call with the wrong count is refused; a failing run records its tree; a passing run records none. Document `--base`, its order mapping and `tree` in plan-run.md.""""
new = """"With `--base`, the rows (or `--blocks`, parsed as today) are the base rerun of the round's latest run's failing commands, mapped by order as design/records.md#base-rerun-mapping says: refuse a count that differs from the number of failing commands, and refuse when the round has no run, naming the command to record it first. For each failing command set `base_checked = true`, `base_failed_ids` to the base result's failed ids that are among the command's own, and `base_whole_failed` as records.md says. Without `--base`, when the recorded run's outcome is `fail`, compute `tree` per design/records.md#tree-digest-on-a-gate-round: every path in the files of the milestone's rows, read from disk with no git call, each with its raw and whitespace-stripped SHA-256, `deleted` for a missing path. Put the digest helper in run_gate.rs as `pub(super) fn whitespace_digest`, returning both digests, since plan emit gate-list reads it. Tests in plan_run_records.rs: a base rerun marks base and partial base failures; a whole command (no failed_ids) that fails at base is a base failure with base_whole_failed = true; a whole command that fails in the round but passes at base is not a base failure, though its empty base_failed_ids equals its empty failed_ids; base ids outside the command's failed_ids are ignored; a base call on a round with no run is refused; a base call with the wrong count is refused; a failing run records its tree; a passing run records none. Document `--base`, its order mapping and `tree` in plan-run.md.""""
tier = "cited"
anchor = "plan|.claude/flows/v2-usage-audit-gaps/tasks.toml|record-base-reruns-and-tree-digests-in-plan-run-gate"
