fix = """Define the skip in records.md: a line `skip: <command>` in the --blocks text (an ndjson row {"skip": true}) holds a failing command's place and leaves it base_checked = false. Task 3: in run_gate.rs's --base path, read skip lines before gate_blocks::parse and keep their positions in the order mapping; test a held and a forward command skipped beside a rerun one. Task 16 step (1): leave held commands, forward accept checks and an unprovisioned whole command out of the verification call and write a skip line at each one's position in the base blocks file. Same edit covers task 16's constraint that an unprovisioned rerun is not recorded with --base."""
effort = "small"
counter = "A task outside the slice could add a skip outcome to gate_blocks.rs or schema.rs; tasks show 3 and 16 name none, and no task's files hold gate_blocks.rs."
grade = "high"
evidence = [
    "docs/flows/v2-usage-audit-gaps/design/records.md:53: held and forward commands take a `skip` block in the base call, count mismatch refused",
    "tomlctl/src/plan/schema.rs:197-202: CommandOutcome is pass, flaky, fail, timeout; tomlctl/src/plan/gate_blocks.rs:21-24 knows only pass lines, command/outcome blocks and not_run:",
