outcome = "Plan records changed after the last finished review run are listed before approval, and approval needs either a recheck that covers them or the user's recorded waiver."
constraints = [
    "Touch no file outside this task's files.",
    "Review runs on stores without plan.toml, and code-family runs, are unchanged.",
    "A run started with rechecks = <run> stores plan_digest for the targets review recheck-targets --run <run> yields at its start, plus, when started with --set recheck_scope=delta (a START_FIELDS key validated in review/fields.rs), every target in the review delta at its start; a run without rechecks stores every target. A target outside a recheck's set stays in the delta until a run that covered it. Test that a delta-scoped recheck clears a hand edit once finished and a plain recheck does not.",
    "The digest has one key per field-level target: each task and spec field as its whole value (no [n] entries), each decision, contract and handover key, each milestone field, and each brief section and design heading anchor hashed over its section text, read directly since target::current returns None for prose.",
]
premises = []
means = []
