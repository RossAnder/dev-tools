deps_note = ""
action = "Rewrite step 7's fix rounds so pre-existing failures cost no round, fix rows carry worker-run reproducers and are checked against decisions, and a whitespace-only round reruns only what failed."
detail = """Read notes/fix-rounds.md and notes/decisions-and-baseline.md first. (1) Base rerun: when the gate fails, make a detached worktree of HEAD in the scratchpad (git worktree add --detach), and dispatch one verification call rerunning every fail command of the round's latest run, in the order that run lists them: `cd <worktree> && <the command's rerun form with its failed ids>`, or the whole command when it has no failed ids. Record it with `tomlctl plan run gate --slug <slug> --milestone <id> --round <n> --base --blocks <file>`, which maps the blocks to the commands by that order. Remove the worktree after. (2) Mint fix rows only for the failed ids that pass at base, the milestone's own failures. Put the ids that also fail at base, a base failure or the base-failing part of a partial one, to the user through AskUserQuestion: fix them under a `base <id>:` reason prefix, which the round count does not match; capture them to the backlog; or waive the command through the gate acceptance. (3) Fix rows: a reproducer that builds is minted as an accept entry with run_by = "worker" (it may build), replacing the gate-owned reproducer; the pool runs such rows one at a time. (4) Before relaunching, read `tomlctl plan view --slug <slug> --for worker --task <id>` for each new fix row; when its outcome or constraints depart from a decision shown, ask the user before launch to amend the decision (plan decide on the same id, user-confirmed, binding the row) or reshape the fix; this replaces parking for fix rows. (5) Gate again with `tomlctl plan emit gate-list --slug <slug> --milestone <id> --after-round <n>`; when it prints narrowed = true, gate only those commands and report the carried ones. (6) Give each test gate command a rerun: option in the form verification.md documents for its runner (nextest, bun test, vitest), citing that file rather than restating the forms, so a timeout under load is reported flaky. Keep every existing rule this does not change. The waive option for a base failure is a gate acceptance of kind base (`--accept --json` with kind = "base", naming only the base-failing ids and a backlog id), which waives those ids in later rounds and does not by itself let the milestone commit. In the base call, a held command (the milestone's external_gates, an effect = "external" accept, or one the drain held by judgement) and a forward accept check are never rerun: their place is a skip entry in the form plan-run.md documents, so the order mapping still holds."""
