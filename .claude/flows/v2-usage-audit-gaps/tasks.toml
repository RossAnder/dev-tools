[[specs]]
ref = "record-base-reruns-and-tree-digests-in-plan-run-gate"
outcome = "A gate round records which failed tests also fail at the milestone's base, and a failing round records whitespace-stripped digests of the milestone's changed files."
constraints = [
    "Touch no file outside this task's files.",
    "A call without --base records exactly what it records today, plus tree on a failing run.",
    """In a --base call a held or forward-accept command's place is `skip: <command>` on its own line in --blocks text, or `{"command": "<command>", "skip": true}` in NDJSON; parse it in gate_blocks.rs, accept it only with --base, count it as one position of the order mapping, and leave that command base_checked = false. Test a base call with a skip between two reruns.""",
    "Write base_whole_failed = true only for a command that is one of the milestone's gates; an id-less non-gate command that fails at base keeps base_checked = true with base_whole_failed absent, so no reader takes it for a base failure. Test it.",
]
premises = []
means = []
