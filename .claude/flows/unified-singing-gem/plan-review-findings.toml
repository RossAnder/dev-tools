plan_section = "### 6. Add the promotion-target resolver [M]"
summary = "Resolver: refusals should be Unknown not Err; reuse join_under; index flows once; skip malformed"
description = "An Err on a refused path aborts reconcile for the whole store, contradicting 'reports a reason per row'. io::join_under (io.rs:1679) already handles Windows prefix/root forms that a hand-rolled is_absolute check misses. Scanning .claude/flows/*/context.toml per row is ~16 x 42 reads per reconcile, three reconciles per /implement; enumerate_flows skips unparsable files, a `?` here would let one bad context.toml fail every triage/reconcile. Build the index once and skip malformed entries."
anchor_old = "  - Refuse absolute paths and `..`."
anchor_new = "  - Join through `io::join_under`; an absolute, prefixed or `..`-bearing value resolves to `Unknown` (never `Err`). Build the `plan_path` index once per call and skip `context.toml` files that fail to parse, as `enumerate_flows` does."
