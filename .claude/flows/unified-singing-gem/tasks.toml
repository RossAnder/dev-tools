- `BacklogOp::Triage` (types.rs:1180) gets `#[arg(long, requires = "promote")] external: bool` and `#[arg(long, requires = "promote")] allow_closed: bool` on the variant, not in `TriageMode`. Update the `to` doc (:1185), which currently says "stored verbatim". Thread both through the dispatch arm in `backlog/dispatch.rs`.
