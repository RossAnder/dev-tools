task_ref = "execute-worktree-create-server-trigger-merge-hint-surfacing"
summary = "Sprint pre-flight reads issued via lumina_core::db::scalar_opt instead of a repo::* read"
original_intent = "execute_worktree_create_flow pre-flights (sprint exists + non-terminal; does not already own a worktree) composed from existing repo reads"
rationale = "No repo::* read exposes a sprint-by-id lookup (only set_sprint_status reads it, inside its write tx) and lumina/core was outside the task's file ownership. The flow issues three read-only scalar SELECTs through the public db::scalar_opt seam; the mcp/mod.rs no-new-SQL doc-invariant was reworded to scope to writes. Follow-up option: add repo::get_sprint_status in lumina/core/src/repo/runs_sprints.rs to restore the strict invariant."
