task_ref = "cross-plane-e2e-regression-create-scenario"
summary = "Create-scenario assertions adjusted: created worktree is branch-attached (not detached) and the literal duplicate-branch sequence yields 502 BranchInUse (not the 0018 422)"
original_intent = "Assert the created worktree has a detached HEAD at main's tip, and a second create for a different sprint with the same branch returns 422 via the migration-0018 index"
rationale = "ShellGit::create_worktree runs git worktree add -b <branch>, so the created worktree is ATTACHED to the new branch at the resolved base tip (only the merge-side integration worktree is detached); asserted HEAD commit == main tip == response head plus symbolic-ref == the branch. The companion's git runs before the record write, so a same-branch re-create fails in git first (502 BranchInUse); the 0018 422 path was covered separately via a record-only row holding the branch, then an execute-create hitting the partial UNIQUE index. Both mechanisms tested; a DB-side branch pre-flight in the flow would be needed to make the literal sequence a 422."
dedup_id = "c3ab0798a8959102"

