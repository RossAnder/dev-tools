[[items]]
id = "E3"
type = "deviation"
date = 2026-06-10
agent = "implement"
task_ref = "detached-integration-ref-cas-choreography-in-the-companion"
summary = "Fifth GitBackend trait method resolve_committish added beyond the plan's four"
original_intent = "Resolve CreateWorktree's committish base by reusing the existing resolve/resolve_commit method"
rationale = "resolve_commit is a private inherent helper on ShellGit and the trait's resolve is the conflict-resolution op; the executor consumes only Arc<dyn GitBackend>, so no existing trait surface could resolve a general committish (HEAD~2/tags/SHAs). Promoted as GitBackend::resolve_committish, ShellGit delegating to the private helper. Also: occupied-path attach maps to Failed{GitFailure} (not the plan's parenthetical Failed{Internal}) because the centralised kind_for table maps Engine->GitFailure; the explicit GitError::Engine instruction was honoured over the parenthetical."
dedup_id = "2317e0a3a4e2454c"

