summary = "First-word classifier marks additions to existing files as new; 'first' vs 'leading' parenthetical inconsistent"
description = "Corpus notes like `lumina/src/domain.rs` (new `Shape` enum …), `(new thread)`, `(new fns; …)`, `(new §o …)` describe additions to existing files; 9 such false positives vs 293 true across docs/plans. Approach says 'first parenthetical' (anywhere), task 5 'leading', Template 'opening with (new)'. Require the note to open with the parenthetical and `new` to close it or be followed by , ; : or a dash; replace the (new stub file) test case with a negative (new thread) case."
anchor_old = "its first word, case-insensitive, is `new` (→ new) or `delete`/`deleted` (→ delete). `(new stub file)`, `(NEW)` and `(new, generated)` all count as new."
anchor_new = "its first word, case-insensitive, is `new` (→ new) or `delete`/`deleted` (→ delete), and that word closes the parenthetical or is followed by `,`, `;`, `:` or a ` —` dash. Only a note that opens with the parenthetical is classified. `(NEW)`, `(new — generated)` and `(new, generated)` count as new; `(new thread)` and `(new `Shape` enum …)` describe an addition to an existing file and do not."
