plan_section = "Rollback of created files"
summary = "Rollback git clean deletes irreversibly on plan-note/agent-report evidence; no stash, no git-state split"
description = "The design cleans any untracked declared path the plan marks (new) or the agent reports (new), clamped only to the task's files (which an agent can widen via `escalate … cross-cut`). The apply-rollback protocol it claims to mirror stashes first (step 2) and requires git evidence AND declaration. Scratch-repo tests (git 2.55.0): `git clean -f -- <path>` is unrecoverable; a directory entry cleans every untracked file under it (sibling in-flight new files, user scratch); `[`/`*` paths glob. Also `git restore -- <tracked> <untracked>` exits 1 and restores NOTHING, so the restore set must be `git ls-files -- <files>`, not 'not in new_files'. Fix: record which declared paths exist at dispatch; on rollback stash (`git stash push -u -m implement-rollback-<ref> -- <existing paths>`) then remove only paths untracked now, absent at dispatch, regular files, and in new_files or reported (new); pass literal pathspecs; restore the `git ls-files` set."
dedup_id = "a26768e878cc0948"

