symbol = "Phase 2 step 6 rollback: stash then guarded removal"
severity = "warning"
effort = "medium"
category = "architecture"
summary = "Rollback step 2's stash push -u already removes every declared untracked path, so step 4's four-condition removal never fires and the report is wrong"
description = "git stash push -u -- <paths> stashes AND deletes each named untracked file. By step 4 every non-ignored declared new file is gone (fails test -f) and ignored ones survive git clean -f, so step 4 removes nothing; the absent-at-dispatch record (:112, :188) and the new_files fetch guard nothing. Worse, an untracked path that existed at dispatch (e.g. a file created by an earlier task in the same uncommitted milestones window) is swept into the stash too, and the Phase-4 report lists stashed files as 'left in place'. Recoverable from the stash, but the checkpoint train then commits without it. Fix (converged by four lenses): evaluate step 4's tests on the pre-stash state; build the stash pathspec from existing tracked paths plus only the untracked paths that pass the test (keep -u for a recovery copy); rewrite step 4 as 'the stash removed these; every other untracked path stays and is named'. Also reword the rollback sentences in flow-contract-plan-output-format SKILL.md:237 and flow-contract-task-store SKILL.md:194, and the plan's Risks mitigation."
evidence = [
    "claude/commands/implement.md:159",
    "claude/commands/implement.md:161",
    "claude/commands/implement.md:112",
    "scratch repo git 2.55: git --literal-pathspecs stash push -u -m r -- t.rs new.rs -> rc 0; ls -> t.rs only (reproduced by orchestrator and 4 lenses)",
]
instances = [
    "claude/commands/implement.md:112",
    "claude/commands/implement.md:159",
    "claude/commands/implement.md:161",
    "claude/commands/implement.md:163",
    "claude/commands/implement.md:188",
]
sweep = [
    "stash push -u",
    "absent at dispatch",
    "git --literal-pathspecs clean",
]
enumeration = "complete"
related = [
    "R2",
    "R4",
]
dedup_id = "b9e2e562dc2fbf0b"
resolved = 2026-09-29
resolution = "Uncommitted: implement.md step 6 classifies declared paths before stashing; stash pathspec is tracked paths plus only untracked paths passing the new-file test, so failing untracked files stay on disk; git clean removal replaced by reporting; empty pathspec skips the stash."

