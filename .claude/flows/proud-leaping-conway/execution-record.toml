summary = "tasks add and tasks update --ref drop orphaned file notes and backlog links keyed on the ref they claim"
original_intent = "Carry a row's file notes and backlog links across a ref rename"
rationale = "tasks remove leaves those entries until the next import, so a rename or same-slug add onto that ref inherited the removed row's notes and closes-links, which now feed new_files and implementer prompts."
