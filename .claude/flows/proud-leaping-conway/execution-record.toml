id = "E32"
type = "deviation"
date = 2026-09-29
agent = "review-apply"
task_ref = "define-the-implementer-preamble-and-run-success-and-rollback-steps-in-implement"
summary = "/implement rollback classifies declared paths before stashing, drops directory claims, records the stash by commit SHA, and runs no git clean"
original_intent = "Stash every existing non-ignored declared path, restore the tracked set, then remove declared new files with a four-condition guarded git clean; record the stash as stash@{0}"
rationale = "git stash push -u deletes every untracked path it names, so the guarded clean never fired and untracked files present at dispatch were swept into the stash. The guard now builds the stash pathspec; directory claims would capture a sibling's work because the scheduler compares claims as exact strings; a positional stash ref shifts under a later rollback."
dedup_id = "499d8a44e3fdccde"

