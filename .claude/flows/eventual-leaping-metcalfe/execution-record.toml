[[items]]
id = "E5"
type = "deviation"
date = 2026-06-03
agent = "implement"
task_ref = "t4-implement-claim-next-task"
summary = "Widened claim readiness predicate from status='todo' to status IN ('todo','open') at both the candidate-select and lease-UPDATE sites."
original_intent = "Plan §C pinned the claim readiness predicate to status='todo', reusing the documented Status enum (todo|in_progress|blocked|done|cancelled)."
rationale = "create_work_item stamps status='open' (repo.rs:1567) and the work_items column DEFAULT is 'open' (repo.rs:3570/3606), so freshly-created tasks AND the review/rework tasks spawned by complete_task (T6) and record_finding_decision (T8) all default to 'open'. A 'todo'-only claim would never see them, silently breaking the review-rework cascade. block_task_on_question (repo.rs:4299) already treats todo|open as the equivalent not-started set. The lease-UPDATE guard required the same widening or an 'open' candidate selects but leases 0 rows. Verified: 6/6 claim tests green incl. claim_returns_open_status_task."
commits = ["ecc2bd9"]
dedup_id = "9e4157ea49bc72c6"

