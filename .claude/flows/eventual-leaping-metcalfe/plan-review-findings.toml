summary = "The additive migration adds a self-FK (reviews_work_item_id) + a lane CHECK, which SQLite cannot cleanly DROP COLUMN - there is no rollback story; state that reverting 0013 is forward-fix-only."
description = "SQLite ALTER TABLE DROP COLUMN refuses columns used by an FK/CHECK/index without a full table rebuild, so reverting 0013 is not a one-liner. Dev impact is low (lumina.db is gitignored/rebuilt), but the plan should say rollback = a new 0014 that neutralises the columns, never a down-migration or manual DROP."
anchor_old = "- **Additive migration only** — forward-only, no down. Nullable columns per the ADD-COLUMN-REFERENCES rule (`lumina/migrations/0011_runs_sprints_findings_queue.sql:30-37`); FK columns take NULL default, CHECK columns must pass for existing rows (`lane IS NULL OR …`)."
anchor_new = "- **Additive migration only** — forward-only, no down. Nullable columns per the ADD-COLUMN-REFERENCES rule (`lumina/migrations/0011_runs_sprints_findings_queue.sql:30-37`); FK columns take NULL default, CHECK columns must pass for existing rows (`lane IS NULL OR …`). Rollback is forward-fix-only: a self-FK column + CHECK cannot be cleanly `DROP COLUMN`-ed under SQLite, so reverting 0013 means a new 0014 that neutralises the columns - never a down-migration or manual DROP."
dedup_id = "d01534bc2bd6eadc"

