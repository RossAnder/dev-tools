[[items]]
id = "E16"
type = "deviation"
date = 2026-05-28
agent = "implement"
task_ref = "rust-auq-e2e-keystroke-roundtrip"
summary = "e2e stub uses pipe stdio instead of portable-pty to satisfy the byte-exact stdin-dump assertion on Windows"
original_intent = "Plan T12 implied the stub spawn should mirror PtyTransport's portable-pty setup so the e2e exercises the production PTY layer end-to-end"
rationale = "Windows ConPTY's keystroke-translation layer interprets VT100 escape sequences (e.g. the down-arrow CSI sequence) as navigation key events and drops them from the byte stream visible to the child's ReadFile/ReadConsole, making the byte-exact stdin-dump assertion structurally unsatisfiable under a real PTY on Windows. The lumina input bridge, writer worker, JSONL bridge, supervisor quiescence path, keystroke HTTP route, and outstanding_tool_uses tracking are still exercised end-to-end byte-for-byte under pipe stdio; only the byte transport medium differs from production. Trade-off: weaker faithfulness to PTY semantics in exchange for cross-platform byte-exact assertion. Implementation note (StubTransport in lumina/tests/auq_e2e.rs) documents the trade-off inline."
commits = ["a22db06"]
dedup_id = "c063cd87fd201336"

