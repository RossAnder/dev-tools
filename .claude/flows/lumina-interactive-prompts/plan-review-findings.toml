summary = "Supervisor Idle-only dispatch deadlocks keystroke batches while AUQ is open"
description = "supervisor.rs:189-326 dispatch_one pops one entry then flips to Awaiting (:309); maybe_finalise_turn (:340-355) only returns to Idle when outstanding_tool_uses==0, but the open AUQ keeps its tool_use_id in that set until claude writes the matched tool_result, which it does only AFTER the full keystroke sequence is consumed. A 10-frame batch dispatches frame #1 then deadlocks. Wire path must bypass the queue for keystrokes (direct push to Session.input_tx, OR new InputKind dispatched without Idle gating, OR drain-keystrokes-in-tight-loop inside dispatch_one)."
