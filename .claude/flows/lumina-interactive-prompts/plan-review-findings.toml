plan_section = "## Approach > Backend Section 2"
summary = "text:<literal> DSL has no control-byte filter; user-typed ESC/CTRL bytes flow verbatim"
description = "DSL token text:<literal> is described as literal bytes (with newline-to-CR translation) with no whitelist. A user typing ESC+[+B+CR into Other/notes would inject picker-cursor-down + Enter. Same byte (0x1b) is also the cancel keystroke. Specify: reject 0x1b, 0x00-0x1f (sans tab/newline), 0x7f; cap payload length (4 KB); text: must be the terminal token of an InputFrame."
anchor_old = '`text:<literal>` → literal bytes (with `\n`→`\r` translation as the existing `Prompt` arm does).'
anchor_new = "`text:<literal>` → bytes of <literal> with these filters: reject 0x1b, 0x00-0x1f (sans tab/newline), 0x7f; cap 4 KB; newline-to-CR translation as in the Prompt arm; text: must be the terminal token of an InputFrame (subsequent DSL tokens emit separate frames)."
dedup_id = "f7f924879526e8d0"

