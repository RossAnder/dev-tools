description = "Lines 14 and 23 say CRLF copies convert on their next checkout. Commit 804dc62 says git sees such copies as unchanged, so they must be removed and checked out again, and its own stanza at lines 42-48 omits that remedy. Two scratch repos with core.autocrlf=true confirm it: git checkout -- <path> leaves i/lf w/crlf, a branch switch converts only the paths it rewrites, and rm then checkout gives w/lf. Line 38 ('rewritten in place') may only record what e728e7c did, so it can stay or be folded in. Fix: state the remedy once in the new stanza and correct lines 14 and 23. Comment-only."
