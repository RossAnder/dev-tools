[[items]]
id = "R3"
first_flagged = 2026-11-05
rounds = 1
status = "fixed"
flow = "v2-planning"
file = "tomlctl/src/tasks/schema.rs"
line = 363
symbol = "next_id"
severity = "warning"
effort = "medium"
category = "db"
summary = "A removed task's id is re-minted, so plan records that name it silently bind the new, unrelated task"
description = "Task ids are max + 1 over live rows. plan.toml refers to tasks by id (Decision.binds digits, Contract.tasks, Handover.source_task, Premise.at after:<id>). After tasks remove 3, plan check reports plan/decision-bind-unknown. After the next tasks add-many mints id 3, plan check is clean and plan view --for worker --task 3 hands the new task the old task's decision. PlanStore::mint_id keeps id_high_water for this reason, and B-b0357675 ruled the same class a bug for ledgers. Fix: persist a high-water mark on a v2 store, raised in retire and read by next_id, so a v1 store stays byte-identical. Files: tasks/schema.rs, tasks/remove.rs, tests/tasks_audit.rs, references/tasks-store.md, flow-contract-task-store."
evidence = [
    "re-run in a scratch repo: plan check ok=true after the re-mint, worker view count of the old decision = 1",
    "tomlctl/src/plan/schema.rs:213 mint_id",
    "backlog B-b0357675",
]
dedup_id = "e617aaf59770c9c8"
resolved = 2026-11-06
resolution = "Uncommitted. v2 task stores persist id_high_water, raised on every removal and read by next_id, so a removed id is never minted again; a v1 store gains no bytes. A store counts as v2 when its flow has plan.toml or it holds a v2 key."

