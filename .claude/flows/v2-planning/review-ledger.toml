    "tomlctl/src/plan/milestone.rs:update",
]
dedup_id = "baaa8bb322cb99fd"
resolved = 2026-11-06
resolution = "Uncommitted. Only plan open creates plan.toml; plan record verbs, plan milestone and plan approve go through store::require_open and refuse with kind=not_found naming plan open, writing nothing. --no-create is accepted but has no effect on these verbs; deviated: plan_milestone tests seed an empty plan.toml instead of calling plan open — their fixture records a foreign plan_path."

