summary = "No Agent-tool fallback passes opt-in, but Workflow rerun semantics are wrong for side-effecting implementers"
description = "Carrier-launched Workflows satisfy the opt-in rule. The exposure is execution: on a relaunch, a failed agent reruns and so does every agent started after it, even completed ones, and a run cannot stop for the user. Add three rules to the engine contract: one Workflow per milestone, so the drain replan is possible; never resumeFromRunId for writers, each launch taking the ready set in args from tasks ready; and Interrupt (plan line 262) means a parked branch plus needs_human at run end, not a mid-run stop. disableWorkflows also exists, so no fallback needs a pre-flight hard stop. Run review-v2-pipeline once before committing further to it."
evidence = ["https://code.claude.com/docs/en/workflows.md:352,378, fetched 2026-11-06"]
dedup_id = "af33af47be790e3f"
resolved = 2026-11-06
resolution = "448af31: v2-planning.md states one Workflow per milestone, no resumeFromRunId for writers, Interrupt as a parked branch plus needs_human at run end; v2-pipeline.md points to it. ; deviated: added that a writer's task must tolerate an earlier partial attempt — the runtime restarts a stalled agent with its file changes left in place."

