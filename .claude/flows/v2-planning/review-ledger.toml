summary = "Any plan record verb silently converts an existing v1 flow to v2, because every writer but plan open auto-creates plan.toml"
description = "v2-ness is the presence of plan.toml. plan open refuses a v1 flow for that reason (refuse_foreign_plan), but plan decide on the same flow succeeds and seeds the file. tasks import-plan and tasks render are then refused, and the import-field lock falls away. The plan's Context says nothing here may change how a v1 flow behaves. B-979cb5ce records the mistyped-slug symptom; this is the correct-slug case. Fix: force OnMissing::Error in plan::store::mutate so only plan open creates the store, and refuse plan milestone when the flow is not v2. tests/plan_records.rs and references/plan.md:38-40 rely on auto-create and change with it."
evidence = [
    "re-run: plan open refused, plan decide ok, then tasks import-plan refused with `does not apply to a flow with a plan.toml`",
    "tomlctl/src/plan/open.rs refuse_foreign_plan",
    "docs/plans/v2-planning.md:12",
]
instances = [
    "tomlctl/src/plan/records.rs:decide",
    "tomlctl/src/plan/records.rs:contract",
    "tomlctl/src/plan/records.rs:mutate_plan",
