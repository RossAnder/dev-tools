ref = "point-the-query-lists-at-the-global-select-limit-and-lines"
title = "Point the query lists at the global `--select`, `--limit` and `--lines`"
effort = "L"
status = "done"
checkpoint = "A"
phase = "Wave A — global output flags"
phase_depth = 4
heading_depth = 3
files = [
