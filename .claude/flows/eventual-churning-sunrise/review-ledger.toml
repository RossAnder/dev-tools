symbol = "dispatch"
severity = "warning"
effort = "small"
category = "completeness"
summary = "backlog check cuts candidates to --limit before print_report, so the limited header and stderr notice never appear"
description = "verdicts.cap(opts().limit.unwrap_or(DEFAULT_LIMIT)) truncates before emit sees the rows, breaking the User Decision 5 / SKILL.md:107 contract that any --limit cut reports limited:{shown,total} (only the three query lists are exempt). Fix: when opts().limit is Some, skip the local cap and let print_report cut and signal; apply DEFAULT_LIMIT locally only when the flag is absent. Decide whether the default cap of 5 also reports limited. Passing the limit in as a parameter restores the unit-test seam the range removed. Reported by quality, architecture, completeness and testability lenses."
evidence = [
    "tomlctl/src/backlog/check.rs:443",
    "tomlctl/src/backlog/check.rs:165",
    "tomlctl/src/output.rs:249",
    "tomlctl backlog check --summary ... --limit 2 --lines: header has no limited key, stderr empty (tomlctl 0.14.0)",
]
dedup_id = "a1b11be4e2a6ce86"
resolved = 2026-10-07
resolution = "uncommitted (review-apply 2026-10-07): backlog check leaves an explicit --limit to the output layer (limited header + notice); the default cap of 5 adds limited only when it cuts; limit passed as a parameter for tests"

