summary = "Unbounded batch size on add_findings/create_work_items/batch_update_findings enables a memory + long-write-lock DoS"
description = "None of the three batch-write repo fns (add_findings ~3241, create_work_items ~1544, batch_update_findings ~2756), their MCP handlers, or the HTTP routes enforce a row-count cap — the ~500-row note is advisory prose only. add_findings pre-computes a Vec<String> of sha256 hashes for EVERY element before the tx, then holds the BEGIN IMMEDIATE writer lock across N inserts; a multi-hundred-thousand-element payload forces large heap allocation and holds the RESERVED write lock for the whole loop, starving every other writer. The MCP/in-process path has no body bound at all, and per lumina/CLAUDE.md spawned PTY sessions auto-approve all tool calls. Fix: enforce a hard element cap (reject > N) in the repo or MCP/HTTP layer."
evidence = ["repo.rs:3248-3259 collects hashes for every item pre-tx; repo.rs:3261-3287 loops all items under one db.begin(); no DefaultBodyLimit layer on the router"]
dedup_id = "ca732c702a6486ae"
resolved = 2026-06-02
resolution = "Added const MAX_BATCH_ITEMS=500 + hard over-cap AppError::Validation guard at the top of add_findings/create_work_items/batch_update_findings (pre-allocation/tx); added add_findings_rejects_over_cap_batch test"

