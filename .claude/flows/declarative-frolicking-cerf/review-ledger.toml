summary = "Resolve verdict is cross-tx non-atomic: resolve_finding commits its own tx before the decision tx, so a crash between them leaves a resolved finding with no finding_decisions audit row"
description = "For FindingDecisionKind::Resolve, resolve_finding(db,..) runs and COMMITS its own tx + finding.resolved event (repo.rs:3607) BEFORE record_finding_decision opens its decision tx at 3613. If the second tx (triage UPDATE + finding_decisions INSERT + event) fails or the process dies between the two commits, the finding is durably resolved but the append-only finding_decisions audit row never lands — and the returned error misleads the caller. The doc-comment (3559-3563) frames this only as the 'two events' D9 exception, not as a partial-write/audit-gap window. Flagged independently by the quality, security, and architecture lenses. Fix: inline the resolve UPDATE into the decision tx for the Resolve path rather than delegating to the self-committing resolve_finding."
evidence = ["repo.rs:3606-3608 resolve_finding runs in its own tx; repo.rs:3613 db.begin() opens the second tx; resolve_finding commits independently"]
dedup_id = "1a957580d1cbf080"
resolved = 2026-06-02
resolution = "Inlined the Resolve arm's terminal UPDATE + finding.resolved event into the decision tx (dropped the self-committing resolve_finding call) so triage-UPDATE + finding_decisions-INSERT + resolve commit atomically; test renamed record_finding_decision_resolve_is_atomic"

