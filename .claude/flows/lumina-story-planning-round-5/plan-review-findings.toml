description = "T3's stated filter (line 218) is incomplete/inconsistent across the five child tables. (a) open_questions ALREADY has a status lifecycle open|answered|cancelled (0003:132,146); a question cancelled via resolve_open_question keeps retired_at NULL, so the filter must ALSO require status!='cancelled'. (b) supersede_research_note and task-cancel do NOT delete rows (supersede sets superseded_by; cancel sets status), so task_research_links rows survive a rework — the dossier Grounding must fold ONLY links whose note is live AND whose task is not cancelled, OR rework must unlink (A.5 step 2 never calls unlink_task_research) — else the brief re-introduces the exact R52 stale-grounding symptom this plan exists to fix. (c) acceptance_criteria has NO liveness column (0003:83-93) and remove_acceptance_criterion is a hard DELETE (acceptance_criteria.rs:204), so the 'preserve work without stale noise' thesis fails for ACs and the AC plan_epoch stamp annotates live rows only. Decide: add acceptance_criteria.retired_at for symmetry, OR carve ACs out in §o as the one hard-delete exception and soften the preserve-work claim."
anchor_old = "- **Detail**: Dossier liveness filter = `not superseded/rejected/cancelled` AND (for open_questions) `retired_at IS NULL`. `compute_gating_tier` unit tests pin each branch, mirroring `compute_tier`'s tests at `task_graph.rs:649-703`."
anchor_new = "- **Detail**: Dossier liveness filter, applied PER child-table by its OWN signal (no single uniform predicate): `research_notes`/`risks`/`rejected_alternatives` ⇒ `superseded_by IS NULL`; child tasks ⇒ `status != 'cancelled'`; `open_questions` ⇒ `retired_at IS NULL` AND `status != 'cancelled'` (the pre-existing 0003 lifecycle — a `resolve_open_question`-cancelled question keeps `retired_at` NULL); `task_research_links` ⇒ folded ONLY for links whose note is live (`superseded_by IS NULL`) AND whose task is not `cancelled` (else the brief's Grounding re-introduces R52, so rework must also `unlink_task_research` or the fold must join-filter); `acceptance_criteria` ⇒ NO liveness column (hard-DELETE via `remove_acceptance_criterion`), so a removed AC is simply absent — §o must declare ACs the one hard-delete exception and note the AC `plan_epoch` stamp annotates live rows only (or add `acceptance_criteria.retired_at` for symmetry). `compute_gating_tier` unit tests pin each branch, mirroring `compute_tier`'s tests at `task_graph.rs:649-703`."
