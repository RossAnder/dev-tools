summary = "The 'export snapshot plan_epoch may lag' framing is misleading — the column self-heals on the next work_item event; T12 e2e must not assert exported epoch right after a bump"
description = "export_pending renders the work_item's CURRENT state via get_work_item_detail on ANY work_item-aggregate event. plan_epoch rides that row, so a bump (export-inert event) does not lag indefinitely — it self-heals on the next work_item event (a rework emits several: cancelled-task flips + per-stage activities). Reword §o + R-risk-6 to 'reflects the value as of the last work_item render; self-heals on the next work_item event'."
anchor_old = "- **R-risk-6 (low)** — Export-inert `plan_epoch` means the git-export snapshot's `plan_epoch` can lag a bump. *Mitigation*: deliberate, documented in §o; mirrors the `task_files`/`worktree` inert-event precedent; epoch is internal planning metadata, not exported audit semantics."
anchor_new = "- **R-risk-6 (low)** — Export-inert `plan_epoch`: a bump records a non-`work_item` event so it does NOT itself trigger a re-export — but the column rides the `work_item` snapshot and SELF-HEALS on the next `work_item`-aggregate event (a rework emits several). So the snapshot reflects the epoch as of the last `work_item` render, not a standing divergence. *Mitigation*: deliberate, documented in §o; mirrors the `task_files`/`worktree` inert-event precedent; epoch is internal planning metadata. **T12's e2e must NOT assert the exported snapshot's `plan_epoch` immediately after `bump_plan_epoch` without an intervening `work_item` event + drain.**"
