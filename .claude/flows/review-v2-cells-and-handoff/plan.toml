why = "U3's correctness+security+test-gaps cells mixed Cargo.lock, agent prose and tests; the orchestrator's rewrite kept correctness on prose but in separate cells"
provenance = "user-confirmed"
door = "two-way"
class = "structure"
binds = [
    "tomlctl/src/review/cells.rs",
    "claude/skills/review-v2-lenses/vocabulary.toml",
    "4",
    "5",
    "6",
]
rejected = []
