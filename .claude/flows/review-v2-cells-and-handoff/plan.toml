[[decision]]
id = "D1"
decision = "Make room for cells added after the proposal: --propose takes a reserve the carrier passes (its context-free correctness cells plus one cell per follow-up wave the depth allows), repeat passes fill only the ceiling minus that reserve, and anything beyond the reserve needs the user's override"
why = "Enforcing the ceiling on append would otherwise refuse the carrier's context-free cells on most standard runs and every follow-up wave, since the proposal fills the budget"
provenance = "user-confirmed"
door = "two-way"
class = "ux"
binds = [
    "tomlctl/src/review/cells.rs",
    "claude/commands/review-v2.md",
    "claude/skills/review-v2-engine/references/compose.md",
    "7",
    "18",
]
rejected = []
evidence = "cells.rs:1064-1069 budget = ceiling - planned; review-v2.md:49-56 adds cf cells to the wave-1 file after the proposal; U5 filled all 16 cells in wave 1 (B-f00449a1); notes/ceiling-append.md"
if_false = "Without a reserve the engine cuts repeats to fit cf cells, and every follow-up wave stops to ask you for an override"
revisit_if = ""
check = ""
surfaced = true
vetoed = false

[[decision]]
id = "D2"
decision = "At quick, drop the escalation probe cell: escalations go to triage, where the user picks fix (to apply's settle route) or a backlog capture"
why = "quick's ceiling (3 to 6) is always full after wave 1, so the probe would need an override on every quick run"
provenance = "user-confirmed"
door = "two-way"
class = "ux"
binds = [
    "claude/skills/review-v2-engine/references/compose.md",
    "claude/skills/review-v2-engine/SKILL.md",
    "18",
]
rejected = []
evidence = "compose.md:192 quick escalation probe counts against the ceiling; SKILL.md:231 promises it one Opus cell; notes/ceiling-append.md"
if_false = "Keep the probe and either reserve one cell for it at quick or ask for an override each quick run"
revisit_if = ""
check = ""
surfaced = true
vetoed = false

[[decision]]
id = "D3"
decision = "An escalation picked for fixing is minted as a blocked (evidence) finding and verified by one verifier dispatch before apply: the verifier may refute it, confirm it blocked (it goes to a settle task) or unblock it with a fix sketch (it goes straight to a fix task)"
why = "Same path as convert; a verifier already challenges blocked findings and can skip the settle round when the fix is writable"
provenance = "user-confirmed"
door = "two-way"
class = "compromise"
binds = [
    "tomlctl/src/review/triage.rs",
    "tomlctl/src/review/schedule.rs",
    "claude/skills/review-v2-engine/references/triage-and-close.md",
    "10",
    "19",
]
rejected = []
evidence = "schedule.rs:409-435 settle needs status open; triage.rs:1048-1076 convert mints unverified then a one-row verifier dispatch; review-verifier.md Unblock rule; notes/triage-to-settle.md"
if_false = "Mint it open with an orchestrator verdict and send it straight to settle: never refuted before apply, but no shortcut to a direct fix"
revisit_if = ""
check = ""
surfaced = true
vetoed = false

