[[decision]]
id = "D7"
decision = "Adopt the structure challenge's phased admission in review plan --propose: phase J admits judgement lenses and check cells in tier order counting first-pass cells only, phase M admits mechanical lenses into a pool of max(1, ceil(ceiling/4)) cells with one merge ladder (capped adjacent, capped any, uncapped) before any cut, phase R adds repeats from the room left after the reserve"
why = "Floor ripple is admitted before every signal-tier judgement lens and committed lens cells are never re-merged, so the four new budget rules cannot be met inside today's single greedy loop"
provenance = "agent-assumed"
door = "two-way"
class = "architecture"
binds = [
    "tomlctl/src/review/cells.rs",
    "7",
]
rejected = []
