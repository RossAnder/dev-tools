old = '''"`tomlctl review escalation fix <cell>:<n> --slug|--scope --ndjson <src>`: one JSON object, the finding row the orchestrator wrote from the escalation text (kind defect or cleanup, file, line, symbol, summary, and for a defect fix, failure_scenario, severity, effort, counter, grade, evidence; for a cleanup edit, direction, effort). The verb requires `blocked_on = \"evidence\"` and a non-blank `blocked_missing`, defaults `lens` to the cell's first concern (a given lens must be one of the cell's concerns), mints the row into the escalating cell and its run as `unverified` with an `orchestrator` verdict exactly as `review triage --convert` does, sets its `route` to `verifier` whatever the kind, and marks the escalation `status = \"fixed\"`, `finding = <new id>`. Refuse an escalation already fixed, an unknown id, or a finished run.\nGeneralise triage.rs's replacement_row and finish_row so convert and this leaf share one mint path keyed on a source (an advisory finding, or an escalation's cell); convert's behaviour stays the same. Add the leaf's case to tests/output_options.rs.\nTests in review_escalations.rs: fixing C:1 mints an unverified blocked finding in that cell with a verifier route and marks the escalation fixed; a second fix is refused; a lens outside the cell's concerns is refused; after a verifier confirms it, `review schedule --dry-run --settle-checkpoint` lists it as a settle row.\nNarrow check: `cargo nextest run --manifest-path tomlctl/Cargo.toml -E 'test(/^review_escalations::/) | test(/^review_triage::/) | test(/^output_options::/)'`."'''
