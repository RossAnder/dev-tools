id = "F22"
run = "U1"
cell = "C8"
seen_in = ["U1"]
family = "plan"
kind = "defect"
lens = "plan-executor"
route = "verifier"
file = ".claude/flows/review-v2-cells-and-handoff/tasks.toml"
symbol = "slice-judgement-lenses-by-subsystem-and-file-kind"
summary = "Compacting a kind group against same-kind tracked files emits dir/** globs that also cover other-kind files and lockfiles"
severity = "major"
failure_scenario = "Detail says compact_tree/compact_dir compare against tracked files of the slice's own kind only. A code group holding every tracked .rs under pkg/ compacts to `pkg/**`, but PathSet matches that glob against every file under pkg/ (cells.rs PathSet::matches, `within`), so pkg/README.md and pkg/package-lock.json fall into the code slice; Slice::of then rebuilds its files from the glob, the slice is mixed, and a lockfile sits in a correctness cell, the very outcome the task and task 16's replay assertions forbid."
