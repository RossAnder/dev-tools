[[findings]]
id = "F36"
run = "U2"
cell = "C17"
seen_in = ["U2"]
family = "plan"
kind = "defect"
lens = "plan-executor"
route = "verifier"
file = ".claude/flows/review-v2-cells-and-handoff/tasks.toml"
symbol = "admit-proposal-cells-in-phases-with-a-sweeper-pool-context-free-cells-and-a-reserve"
summary = "The whole-scope collapse is gated on the slice holding one FileKind, not the scope, so a code-only correctness slice collapses to a scope holding Cargo.lock"
severity = "major"
failure_scenario = "A code run over a few Rust subsystems plus Cargo.lock at a small ceiling: correctness gets code-kind slices (lockfile excluded), FloorFit merges them to one, that slice holds a single FileKind, so the collapse replaces it with scope.whole, the run's scope entries including Cargo.lock. The correctness cell then holds a lockfile, breaking D5 and the replay assertion. D9 says the collapse applies only to a single-kind scope, but D9 is not among task 7's bound decisions, so its worker sees only the slice wording."
fix = "Gate the collapse on the scope: collapse only when every scope file has the lens's single FileKind; otherwise keep the merged slice. Add an admission test: a code+lockfile scope at ceiling 3 never collapses correctness to a slice matching Cargo.lock."
effort = "trivial"
counter = "If the merged slice can never reach one entry when the scope holds a lockfile (it can: lockfiles form no correctness slice), or if scope.whole excluded lockfiles."
grade = "high"
evidence = [
    "tomlctl/src/review/cells.rs:800-808 FloorFit::fit replaces a lone merged slice with scope.whole when before > 1 and whole binds",
    "tomlctl/src/review/cells.rs:229-249 ScopeView.whole is the run's scope entries verbatim, or **",
    "plan view --for worker --task 7 binds D1, D6, D7, D16, D17, D19, not D9 ('the whole-scope collapse applies only to a single-kind scope')",
]
target = "task:admit-proposal-cells-in-phases-with-a-sweeper-pool-context-free-cells-and-a-reserve.detail"
expect = '''"Budget = ceiling(run) - planned_cells - reserve. The phases:\n- J: floor, forced, signal, always_at and candidate lenses that are judgement mode, plus the check cells, in today's tier order, counting first-pass cells only. Hold back one cell per floor mechanical lens. Floor lenses keep FloorFit with `measure` counting first-pass cells only; the whole-scope collapse applies only when the slice holds a single FileKind. Other lenses keep fit-or-cut with the `stopped` latch scoped to J. With --context-free (standard and deep only; refused at quick), right after the floor lenses add review-finder-cf cells with concerns [\"correctness\"] over the code-kind correctness slices, merged adjacent down to at most max(1, ceil(ceiling/6)) cells, each with question \"context-free variant: diff only, no pack, no prior findings\" and reason \"context-free correctness pass over the diff, independent of the pack\".\n- M: mechanical lenses (ripple, hygiene) into a pool of min(max(1, ceil(ceiling/4)), room left) cells. Start from split_to_cap at 40 files, then one merge ladder for every tier (capped adjacent, capped any, uncapped adjacent, uncapped any) until the pool holds them; a floor sweeper can always fall back to one whole-scope cell; a non-floor sweeper is cut for `ceiling` only when the uncapped merges cannot fit it.\n- R: repeats take(room) from what is left, judgement cells only (a mechanical or context-free cell never repeats), hotspot cells first, then floor cells; at deep, signal cells after those.\nFlags on ReviewPlanArgs, conflicting with --ndjson: `--context-free` (bool) and `--reserve <N>` (usize, default 0). The summary gains `reserve`, `mechanical_pool` (the pool size), `context_free` (the count) and keeps `over_cap`, now meaning sweeper cells the pool merged past 40 files.\nTests in review_propose_admission.rs: at standard with ceiling 16 and a 400-file scope, mechanical cells (pass 1 and 2 alike) are at most 4, no mechanical cell has pass 2, and a matched signal lens is never cut for `ceiling` while a pass-2 repeat is present; --reserve 2 leaves 2 cells unused; --context-free emits cf cells within ceil(16/6) and is refused at quick; repeats keep hotspot cells first. Update review_cells.rs's ceiling, merge, repeat and sweeper-cap tests (propose_caps_sweeper_slice_by_file_count, propose_merges_small_floor_slices_before_cutting_signal_lenses, propose_adds_reverse_order_repeat_cells_at_standard, propose_reports_over_cap_cells_at_a_small_ceiling and any other the change breaks) to assert the new rules, naming each changed test in the run note.\nNarrow check: `cargo nextest run --manifest-path tomlctl/Cargo.toml -E 'test(/^review_propose_admission::/) | test(/^review_cells::/) | test(/^review_propose_slices::/)'`."'''
