`--over-ceiling-file <PATH>` (conflicts with --propose; read with read_prose like run finish's --incomplete-file): when the wave exceeds the ceiling, append `{wave, ceiling, planned, added, reason}` to the run's `ceiling_overrides` in the same write (the edit closure of mutate_minting); when the wave fits, record nothing. The envelope gains `ceiling` and, when an override was recorded, `ceiling_override: true`.
