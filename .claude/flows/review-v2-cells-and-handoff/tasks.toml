ref = "slice-judgement-lenses-by-subsystem-and-file-kind"
title = "Slice judgement lenses by subsystem and file kind"
effort = "L"
status = "pending"
checkpoint = "A"
phase = ""
phase_depth = 0
heading_depth = 3
files = [
    "tomlctl/src/review/cells/slicing.rs",
    "tomlctl/src/review/cells/mod.rs",
