deps_note = ""
action = "Make slices_for and the merge rules kind-aware and implement the signal-evidence and changed-with-tests rules."
detail = """
- cells/mod.rs: ScopeView classifies each scope and tracked file with the run catalogue's compiled RoutingGlobs (`catalogue.routing().compile()`), built where ScopeView::new is called (propose and coverage_accounting). When the catalogue's routing has no executable globs (an older fixture or a project catalogue without [routing]), kind matching is off: every non-lockfile file counts as code, so such catalogues slice as before. Signals keeps, per active signal, its name, roots and evidence (today only churn-hotspot evidence survives), dropping a root of "." as stack_roots already does. pick_lenses treats a per-subsystem or per-file judgement lens as unmatched when the scope holds no file of its kinds, exactly as it treats unmet `paths`, so coverage_accounting agrees.
- cells/slicing.rs: slices_for takes the lens Entry, the scope and the signals. For a judgement lens under per-subsystem or per-file, group by (subsystem key, FileKind) and keep only the lens's kinds (absent kinds = code); lockfile files never enter such a slice. signal-evidence: the in-scope files that are an evidence path of one of the lens's matched active signals or lie under one of their roots (a "." root is dropped), every kind included, lockfiles too, since the lens reads what its signals point at; one slice per subsystem key; with no such file, fall back to per-subsystem. changed-with-tests: per subsystem key, the code-kind scope files plus the tracked test-kind files under the same key. Mechanical lenses slice as today, kinds ignored. Kinds, the kind-aware grouping and the two new rules apply to code and perf runs only: on a plan-family run slices_for treats signal-evidence and changed-with-tests as per-subsystem and ignores kinds, so security and test-gaps keep their slices over the plan documents. changed-with-tests iterates only the subsystem keys holding a code-kind scope file; a key with changed tests and no changed code gets no test-gaps slice. Slice carries `kind: Option<FileKind>` (None when its files mix kinds); merge_step never joins two slices with different Some kinds. compact_tree and compact_dir keep comparing against all tracked files of any kind: a group compacts to `dir/**` or `dir/*` only when every tracked file under that directory is in the group, so a glob never covers a file of another kind or a lockfile.
- cells/propose.rs: only the call site of slices_for changes; the admission logic is the next task's.
- tests/review_propose_slices.rs, on the shared harness with a catalogue carrying a `[routing]` table: a scope mixing src code, tests, a Cargo.lock and markdown gives correctness separate code and other slices and no slice holding Cargo.lock, with no `dir/**` entry covering a file of another kind; security under signal-evidence slices to the trust-boundary evidence file only, and to per-subsystem slices when the signal has no files; test-gaps under changed-with-tests holds the changed code and the subsystem's tests and no markdown; a lens with kinds = ["test"] is unmatched on a scope with no tests and absent from accounting's unselected; a catalogue with no [routing] table proposes the same cells as today; a plan-family run whose scope is markdown still proposes security and test-gaps cells over it.
