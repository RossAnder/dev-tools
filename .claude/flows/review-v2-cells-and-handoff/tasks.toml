[[items]]
id = 7
ref = "admit-proposal-cells-in-phases-with-a-sweeper-pool-context-free-cells-and-a-reserve"
title = "Admit proposal cells in phases with a sweeper pool, context-free cells and a reserve"
effort = "L"
status = "pending"
checkpoint = "A"
phase = ""
phase_depth = 0
heading_depth = 3
files = [
    "tomlctl/src/review/cells/propose.rs",
    "tomlctl/src/review/cells/args.rs",
    "tomlctl/tests/review_propose_admission.rs",
    "tomlctl/tests/review_cells.rs",
]
needs = [
    6,
    8,
]
coupling = []
deps_note = ""
action = "Rework propose into phase J (judgement lenses, context-free cells, checks), phase M (a mechanical pool) and phase R (repeats from leftover room), with --context-free and --reserve."
detail = """
Budget = ceiling(run) - planned_cells - reserve. The phases:
- J: floor, forced, signal, always_at and candidate lenses that are judgement mode, plus the check cells, in today's tier order, counting first-pass cells only. Hold back one cell per floor mechanical lens. Floor lenses keep FloorFit with `measure` counting first-pass cells only; the whole-scope collapse applies only when every scope file has one FileKind, the lens's own (a single-kind scope); otherwise the last merged slice stays as it is. Other lenses keep fit-or-cut with the `stopped` latch scoped to J, except that before J cuts a signal-matched lens (signal tier, or a candidate whose signals hit) for `ceiling` it first merges that lens's slices down toward the room left, by the same merge ladder, and cuts it only when one cell cannot fit. With --context-free (standard and deep only; refused at quick), right after the floor lenses add review-finder-cf cells with concerns ["correctness"] over the code-kind correctness slices, merged adjacent down to at most max(1, ceil(ceiling/6)) cells, each with question "context-free variant: diff only, no pack, no prior findings" and reason "context-free correctness pass over the diff, independent of the pack".
- M: mechanical lenses (ripple, hygiene) into a pool of min(max(1, ceil(ceiling/4)), room left) cells; when J cut any judgement lens for `ceiling`, the pool is only the held-back cells, one per floor mechanical lens, so sweepers merge down before a judgement lens loses room. Start from split_to_cap at 40 files, then one merge ladder for every tier (capped adjacent, capped any, uncapped adjacent, uncapped any) until the pool holds them; a floor sweeper can always fall back to one whole-scope cell; a non-floor sweeper is cut for `ceiling` only when the uncapped merges cannot fit it.
- R: no repeat at all while any signal-matched lens is in unselected with reason `ceiling`; otherwise repeats take(room) from what is left, judgement cells only (a mechanical or context-free cell never repeats), hotspot cells first, then floor cells; at deep, signal cells after those.
Flags on ReviewPlanArgs, conflicting with --ndjson: `--context-free` (bool) and `--reserve <N>` (usize, default 0). The summary gains `reserve`, `mechanical_pool` (the pool size), `context_free` (the count) and keeps `over_cap`, now meaning sweeper cells the pool merged past 40 files.
Tests in review_propose_admission.rs: at standard with ceiling 16 and a 400-file scope, mechanical cells (pass 1 and 2 alike) are at most 4, no mechanical cell has pass 2, and a matched signal lens is never cut for `ceiling` while a pass-2 repeat is present; --reserve 2 leaves 2 cells unused; --context-free emits cf cells within ceil(16/6) and is refused at quick; repeats keep hotspot cells first; a signal lens needing more new cells than the room left is merged down and admitted when one cell fits, and when even one cell cannot fit it is cut and no pass-2 cell is proposed; when a judgement lens is cut, each mechanical lens holds exactly one cell. Update review_cells.rs's ceiling, merge, repeat and sweeper-cap tests (propose_caps_sweeper_slice_by_file_count, propose_merges_small_floor_slices_before_cutting_signal_lenses, propose_adds_reverse_order_repeat_cells_at_standard, propose_reports_over_cap_cells_at_a_small_ceiling and any other the change breaks) to assert the new rules, naming each changed test in the run note.
Narrow check: `cargo nextest run --manifest-path tomlctl/Cargo.toml -E 'test(/^review_propose_admission::/) | test(/^review_cells::/) | test(/^review_propose_slices::/)'`."""
