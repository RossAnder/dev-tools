In store.rs: the Run keeps ceiling_overrides in its rest table (no struct field). The Cell struct gains `escalations: Vec<Escalation>`, parsed and written like `ruled_out`, an empty list writing nothing. `Escalation` has `n: u32` (1-based within the cell), `wave: u32`, `text: String`, `status: String` (`open` or `fixed`) and `finding: String` (empty while open).
