detail = """
`review stats --yield` (with --slug, --scope or --all, like the other sections). Each finding's arm is its cell's: `cf` when the cell's agent is review-finder-cf, `repeat` when its pass is 2, else `first`. Per run: build identity clusters as the connected components of the same_as and merged_into links between findings of that run (links are undirected for clustering). A finding is verified when its verifier call stands (not refuted). For each arm report `{cells, findings, verified, unique, applied, scheduled}`: unique counts clusters holding a verified member of this arm and no verified `first` member (for `first`, clusters holding a verified first member); applied counts those unique clusters in which any member's apply_state is `resolved` (fixed by apply); scheduled counts those in which a member is `scheduled` and none is resolved (in flight). A finding whose same_as or merged_into names a finding of an earlier run is left out of the clusters and counted per arm in `cross_run: {first, repeat, cf}`. Output `{"yield": {"runs": [{store, run, depth, first, repeat, cf, cross_run}], "pooled": {"<depth>": {first, repeat, cf, cross_run}}}}`, pooled summing the runs of each depth.
Tests in review_stats.rs: a run where a verified repeat-cell finding is same_as a verified first-pass finding adds nothing unique to repeat; one where a first-pass row is merged into a repeat row also adds nothing unique to repeat and credits first; a verified cf-only finding that apply resolved counts unique 1, applied 1, scheduled 0, and one only scheduled counts applied 0, scheduled 1; a refuted repeat finding counts in findings only; a same_as to an earlier run's finding counts in cross_run only.
Narrow check: `cargo nextest run --manifest-path tomlctl/Cargo.toml -E 'test(/^review_stats::/)'`."""
