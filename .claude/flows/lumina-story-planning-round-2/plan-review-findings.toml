plan_section = "#### 5. E2E tests — new tool coverage [L]"
summary = "Sub-table mutations emit events whose aggregate_id resolves to no work_item — export drain will silently no-op without dual-emit or render-side branching."
description = "T3 specifies record_event with `aggregate_type` values `risk` / `rejected_alternative` / `task_dependency` / `work_item.task_kind`. `export::render_work_item` (export.rs:111 + render dispatch ~:229) looks up the aggregate via `repo::get_work_item_detail(aggregate_id)` — for a sub-row the aggregate_id is the sub-row's PK, not a work_items.id, so the lookup returns NotFound and the drain treats it as a missing aggregate (skip). Net: the git-export audit trail does NOT capture sub-table mutations except incidentally when an unrelated parent event fires. T5(h) currently says `git-export trail picks up the new sub-tables` but does not specify the dual-emit contract. Fix: every sub-table mutation emits TWO events in one tx (one for the sub-aggregate, one `work_item.updated` on the parent), OR `render_work_item` gains an aggregate_type branch that resolves sub→parent work_item id."
anchor_old = "(h) git-export trail picks up the new sub-tables (verify TOML output via `export_pending`)."
anchor_new = "(h) git-export trail picks up the new sub-tables — verify TOML output via `export_pending` AFTER a sub-mutation alone (no parent-touching event). Requires T3 to either dual-emit (sub-aggregate event + `work_item.updated` on the parent in the same tx) or extend `export::render_work_item` with an aggregate_type branch resolving sub→parent."
