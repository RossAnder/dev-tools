summary = "PtySession/PtyMessage/PtyQueueEntry omit Deserialize + sqlx::FromRow + rename-all per domain.rs convention"
original_intent = "Dispatch spec listed derive(Debug, Clone, Serialize, Deserialize, sqlx::FromRow) with serde rename-all snake_case"
rationale = "Established domain.rs convention is Debug+Clone+Serialize only (no Deserialize/FromRow/rename-all) for read-only row structs; query_as! works without FromRow via macro-generated field-by-name assignment, and column names are already snake_case. The spec said to match conventions over the literal derive list. If T9/T10 need wire-Deserialize for HTTP request bodies they will define their own request structs."
