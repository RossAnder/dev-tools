description = "handle<T> casts JSON.parse result as T with no runtime validation. A server-side schema drift (e.g. checked emitted as boolean instead of 0/1, children missing on WorkItemNode) propagates silently into components and surfaces as opaque downstream errors. Adding zod schemas for the four response shapes (WorkItem, WorkItemNode, WorkItemDetail, error envelope) gives a single point of failure for contract drift and enables a contract test."
dedup_id = "067e6ad6a9f6f34a"
resolved = 2026-05-25
resolution = "Added zod 4 runtime contract guards at api.ts::handle (optional schema param) with WorkItem/WorkItemNode/WorkItemDetail/error-envelope schemas; recursive WorkItemNode via zod 4 getter idiom; fetchDetail wire-then-transform preserves the checked:number→boolean normalisation; safeParse used so all .issues aggregate into one diagnostic; zod ^4.0.1 added to runtime dependencies."

