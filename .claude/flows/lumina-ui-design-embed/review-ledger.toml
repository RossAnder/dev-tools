symbol = "statusToken"
severity = "critical"
effort = "small"
category = "quality"
summary = "Tailwind status-colour utilities text-in-flight/text-queued/text-done are never generated"
description = "statusToken returns `text-${entry.tokenName}` via template literal. Tailwind v4's source scanner only emits classes whose literal text appears in scanned files. Grep confirms text-blocked appears literally (HierarchySpine.vue:107, PortfolioEmpty.vue:44) but text-in-flight/text-queued/text-done appear nowhere as literals. Result: every StatusPill except blocked falls through to inherited colour, defeating the design's status colour-coding. Fix: replace function-mapped lookup with a literal class map, e.g. const TOKEN_CLASS = { todo:'text-queued', in_progress:'text-in-flight', blocked:'text-blocked', done:'text-done', cancelled:'text-[var(--muted)] line-through' } as const — or add a safelist comment in a scanned file."
dedup_id = "f074a5564ff2fd07"
resolved = 2026-05-25
resolution = "Replaced template-literal `text-${tokenName}` with literal STATUS_CLASS map in useDisplay.ts:statusToken; verified `text-in-flight`/`text-queued`/`text-done`/`text-blocked` now present in dist CSS."

