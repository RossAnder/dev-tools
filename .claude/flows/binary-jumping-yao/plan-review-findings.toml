summary = "The #1-risk CRLF mitigation is unactionable — there is NO .gitattributes to 'confirm'; one must be ADDED"
description = "VERIFIED via Glob: the only .gitattributes in the tree is vendored under lumina/web/node_modules; the repo has none at root or lumina/, and .git/config sets no core.autocrlf — so on Windows the unsafe default governs *.sql line endings. sqlx::migrate! hashes file CONTENT (confirmed db/mod.rs:100; sqlx#2659), so a CRLF re-normalisation silently changes the checksum and trips db::init against an existing dev DB while the build stays green. The mitigation 'confirm .gitattributes does not re-normalise' points at a file that does not exist. Fix: ADD a rule pinning migrations to LF before the move."
anchor_old = "*Mitigation*: `git mv` only, verify pure-rename diffs, confirm `.gitattributes` does not re-normalise `*.sql`. This is the highest-value single check in the carve (T1 acceptance)."
anchor_new = "*Mitigation*: there is currently NO repo `.gitattributes` (only a vendored one under `web/node_modules`) and no `core.autocrlf` set, so on Windows the unsafe default governs `*.sql`. ADD a repo rule (`lumina/migrations/*.sql text eol=lf`, or `migrations/** -text`) BEFORE the move so checksums are host-independent; `git mv` only; then verify `git diff --stat` shows R100 / zero content delta and `db::init` against an existing dev DB reports no checksum mismatch. This is the highest-value single check in the carve (T1 acceptance)."
