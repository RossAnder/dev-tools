anchor_new = "**Cut is ALMOST clean — one real back-edge to resolve** (re-verified against code). `db`/`domain`/`error`/`export`/`import` import nothing from `http`/`mcp`/`app`/`pty`, but `repo` DOES: `repo/sessions.rs:32` and `repo/sessions/harvest.rs:18,426` `use crate::pty::jsonl_tail::{…}`, and `jsonl_tail` itself depends on `crate::pty::protocol`. This is a core→server cycle the sed rewrite cannot fix. RESOLUTION (part of T2): `git mv` the DB-free `pty/jsonl_tail/` (+ `pty/protocol` if needed) into `lumina-core` (the conceptual sibling of `repo/sessions/harvest.rs` per lumina/CLAUDE.md), rewrite the two core files to `crate::jsonl_tail` and server refs to `lumina_core::jsonl_tail`, and fix the rustdoc link at `repo/pty.rs:308`. The forward edge `pty/spawn.rs` → `crate::app::AppState` stays server→server, fine."
