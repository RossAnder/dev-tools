summary = '"Clean cut — no back-edges" is FALSE: repo (→core) imports crate::pty::jsonl_tail, forming a crate cycle T2 cannot compile'
description = "VERIFIED via Grep: repo/sessions.rs:32 and repo/sessions/harvest.rs:18,426 carry `use crate::pty::jsonl_tail::{parse_line, record_index_fields, JsonlRecordParsed, SessionRecordIndex, AssistantContentBlock, JsonlRecord, UserContent, UserContentBlock}` plus is_corpus_blank at sessions.rs:373. The plan moves repo→core but keeps pty→server, so core would need lumina_server::pty while server already depends on core — a cycle Cargo rejects. The blanket import rewrite rewrites the wrong side and cannot fix it. T2's 'compile once at the end' checkpoint hits this with no remediation in the plan. Resolution (lumina/CLAUDE.md §Session corpus already calls jsonl_tail the conceptual sibling of harvest.rs, DbClient/AppState-free): git mv pty/jsonl_tail/ — confirm whether it drags pty/protocol, imported by jsonl_tail/parse.rs — into lumina-core; rewrite the two core files to crate::jsonl_tail and server pty refs to lumina_core::jsonl_tail; fix the rustdoc link at repo/pty.rs:308. This expands T2's module set beyond the six the Scope names and is the single most important fix for the carve."
