summary = "COALESCE(?, col) cannot clear body to NULL, contradicting body: Option<Option<String>> 'present+null clears'"
description = "Approach prescribes COALESCE(?, col) as the single-statement partial update; COALESCE returns col whenever the bind is NULL, so a present-null can never write NULL. This is mutually exclusive with Task 2's 'present+null clears'. Either drop clear-to-NULL (use plain Option<String>) or use a CASE/dynamic clause and retract the 'one COALESCE statement covers any combination' claim."
