[[items]]
id = "E8"
type = "deviation"
date = 2026-05-22
agent = "implement"
task_ref = "git-export-fold"
summary = "Export read deleted_at via a separate cache-safe query! rather than relying on get_work_item_detail to carry it"
original_intent = "Per the task LANDED-CONTEXT, get_work_item_detail returns soft-deleted rows with deleted_at populated so the whole-struct serialize would carry the tombstone for free."
rationale = "deleted_at is NOT a serialized field on WorkItem/WorkItemDetail, so the struct serialize cannot surface it. Reconciled in-cluster by reading deleted_at via a query! whose SQL string is byte-identical to an existing committed cache entry (hash 0915d3c2), injecting it at the TOML table top level. No .sqlx regen (verified cache byte-identical), no out-of-cluster domain.rs/repo.rs field addition needed."
commits = ["79cc128"]
dedup_id = "0e6dca45440d8e43"

