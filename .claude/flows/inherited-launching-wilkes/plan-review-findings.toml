description = "APG (grade H) lists role=dialog + aria-modal=true + a label as required; the plan wires only aria-labelledby. A native <dialog> opened with showModal() carries an implicit dialog role + top-layer modality, so explicit aria-modal is generally unnecessary (and some guidance discourages it). No anchor change — just confirm during T5 smoke that a screen reader announces the modal as a dialog. Advisory."
