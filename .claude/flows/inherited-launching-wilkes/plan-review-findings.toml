id = "P20"
severity = "suggestion"
category = "risk"
plan_section = "## Risks"
summary = "Native <dialog> focus-restore rationale is slightly wrong — restores to element focused at showModal() time"
description = "Per the HTML spec + APG (grade H), close() DOES restore focus, but to the element focused when showModal() ran — not always the intended trigger. In this app a list-row edit trigger can be re-keyed by the useHierarchy().refresh(id) a mutation fires (line 86), so the recorded element may be stale on close — exactly when defensive capture-and-restore matters. The plan's mitigation is correct; only the cause statement needs sharpening."
anchor_old = "**[L] Native `<dialog>` focus-restore.** Programmatic `close()` doesn't always restore focus. *Mitigation:* capture the trigger element and restore defensively in `Modal.vue` (per Research Notes)."
anchor_new = "**[L] Native `<dialog>` focus-restore.** The browser restores focus to the element focused when `showModal()` ran — not always the intended trigger (e.g. a list-row button later re-keyed by the `useHierarchy().refresh(id)` a mutation fires). *Mitigation:* capture the trigger explicitly at open time and restore it defensively in `Modal.vue` after `close()`; the APG assigns focus-restore to the author, so this defensive restore is correct, not redundant."
dedup_id = "c9bd1e24088e049a"

