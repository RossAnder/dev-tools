summary = "Beta-pin churn under-weighted — 3.6.0-beta.13 is officially 'unstable'"
description = "Release notes (grade H) state Vapor is 'feature-complete in 3.6 beta but still considered unstable'; the pin is beta.13 (package.json:18) so the API has already churned. The [M] Vapor risk frames it narrowly around KeepAlive but the substrate itself is unstable — compiler output/vapor SFC semantics can shift at the 3.6.0 stable cut."
anchor_old = "**[M] Vapor beta capability drift.** Tab mounting relies on `<component :is>` in Vapor (parity per beta.1) but `KeepAlive` specifics are M-grade. *Mitigation:* design depends only on `v-if` + composable-held state (no `KeepAlive`); smoke-test before adopting `KeepAlive` as optional polish."
anchor_new = '**[M] Vapor beta capability drift.** Tab mounting relies on `<component :is>` in Vapor (blanket parity claim per beta.1; not individually itemized) and `KeepAlive` specifics are M-grade. Vue 3.6 Vapor is officially "still considered unstable" and the pin is already at *beta.13*, so compiler output and `vapor` SFC semantics can shift between betas and again at the 3.6.0 stable cut. *Mitigation:* design depends only on `v-if` + composable-held state (no `KeepAlive`); keep the exact pin (no `^`/`~` — already in place); re-smoke the tab shell on ANY Vue bump, treating a beta→beta or beta→stable bump as a deliberate, separately-verified change.'
