[[changes]]
at = 2026-11-18T08:25:19Z
ref = "build-the-web-fixture-panel"
field = "detail"
old = ""
new = """
The page's first `<html` tag is written exactly `<html lang="en" data-state="web-01">`. Its script reads the state from `document.documentElement.dataset.state`, or from `location.hash` without the `#` when that names a state, so a person can open `panel.html#web-04` in a browser; the capture command (task 34) writes a copy per state with the attribute's value replaced. A fragment cannot select the state for a capture, because `render.sh` percent-encodes `#` in the file URL.

The state names are neutral on purpose: nothing a capture shows, and no state name, says which states carry a planted defect. Write no comment, class name, id or visible text in panel.html naming a planted defect or a control; name each state's variant by what it draws (`stretchTiles`, `heldBand`), never by the defect.

The states, in this order:

| State | Window | Draws | Clean or planted |
|---|---|---|---|
| web-01 | 640x480 | No series: the header, then `No series yet.` | clean |
| web-02 | 640x480 | One series, with the panel's height stretched to the window less the 48 px margin | planted: panel sized wrong for its content (rubric class 3) |
| web-03 | 640x480 | One series | clean |
| web-04 | 640x560 | Eight series and one notice | clean |
| web-05 | 640x480 | One series whose label is about 90 characters, drawn on one line with no ellipsis and running past the panel's right edge by at least a third of the panel's width | planted: overflowing content (class 4) |
| web-06 | 640x480 | Three series, one label about 90 characters, cut with an ellipsis | clean |
| web-07 | 640x560 | Eight series, no notice, and an empty 48 px band at the foot of the panel where the notices band would be | planted: reserved empty space (class 2) |
| web-08 | 1280x560 | Eight series and one notice | clean |
| web-09 | 1280x560 | Eight series and one notice, the five swatches of each row stretched to share the row's free width | planted: scaling with the container (class 1) |
| web-10 | 500x560 | Eight series and one notice | clean |
| web-11 | 640x480 | Four series whose fold glyphs are bold `+` and `−` in 16 px bordered squares in place of `▸` | planted: off-style glyph (class 7) |

Every clean state follows design/ui-B.md#web-panel exactly, and so does every planted state apart from its one planted defect. Use the mock design/ui-B/stacked-rows.html (beside design/ui-B.md under docs/flows/v2-ui-fidelity/) as the starting point for the tokens and the row markup, with the panel's max width at 480 px as the design file says. Series names and swatch colours are yours to choose, in the mock's palette: real-looking names such as Primary, Alternate, Accent warm, Neutral.

states.txt holds one line per state, in the table's order: the state's name, one space, its window as `<width>x<height>`, such as `web-04 640x560`."""
actor = "orchestrator"
reason = "elaborated: stacked-rows layout (D35), blind neutral state names (D37), states picked by a data-state attribute since render.sh percent-encodes '#', web sizes at 500 px or wider (D38)"

