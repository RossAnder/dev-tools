[[specs]]
ref = "add-an-optional-class-to-plan-decisions"
outcome = "A decision can carry a class from a fixed list; plan decide accepts and updates it, the store round-trips it, a store without classes is byte-identical to today's, and an older binary cannot silently strip it."
constraints = [
    "Touch no file outside this task's files.",
    "An unknown class value is refused with the list of accepted values.",
    "A store with no class anywhere keeps its present schema_version.",
]
means = []
design = []
precedent = ["tomlctl/src/plan/schema.rs"]
executor = "deep"

[[specs.accept]]
behaviour = "decisions have a class vocabulary"
check = """grep -q 'compromise' tomlctl/src/plan/schema.rs && grep -q '"class"' tomlctl/src/plan/records.rs"""
kind = "forward"
positive = ""
writes_build = false

[specs.accept.probe]
at = "52fe01b9a17c76c7068e241fa891e6cacd6fcbc6"
neg_rc = 1
verdict = "healthy"

[[specs.accept]]
behaviour = "a decision's class round-trips through plan decide, an unknown class is refused, and a classless store is unchanged"
check = "cargo nextest run --manifest-path tomlctl/Cargo.toml -E 'test(/decision_class/)'"
kind = "forward"
positive = ""
writes_build = true
run_by = "covered"
covered_by = "cargo nextest run --manifest-path tomlctl/Cargo.toml --no-fail-fast"

