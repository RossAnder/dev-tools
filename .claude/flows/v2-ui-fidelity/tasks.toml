[[items]]
id = 36
ref = "stop-telling-inspectors-which-states-are-controls"
title = "Stop telling inspectors which states are controls"
effort = "M"
status = "pending"
checkpoint = "B"
phase = ""
phase_depth = 0
heading_depth = 3
files = [
    "claude/workflows/implement-v2-visual.js",
    "claude/workflows/tests/visual.test.mjs",
]
needs = []
coupling = []
deps_note = ""
action = "Build each inspector's prompt in implement-v2-visual.js with no control flag, the group's states sorted by name, and a per-state list of look numbers in which a control carries every look of the milestone; update visual.test.mjs to the new prompt."
detail = """
Today `inspectorPrompt` prints each state as `- <state> (control: <bool>)`, lists the group's states in group order (controls first, since they are spread one per group before the clean states fill), and prints each look with its `states` list. Each of those tells the inspector which states are controls.

The new prompt's `states:` and `looks:` blocks, exactly:

```
states:
- <state>: looks <k>, <k>
- <state>: looks none
looks:
- <k>: {"task":<task>,"accept":<accept>,"behaviour":"<behaviour>"}
```

- `<k>` is the look's 1-based position in `a.looks` as passed in the args, so a number means the same look in every inspector's prompt.
- The `states:` lines list the group's states sorted by name (plain string order), whatever their order in the group.
- A clean state carries the numbers of the looks whose `states` include it.
- A control carries the numbers of the looks that name at least one clean state sharing the control's prefix, the prefix being the name up to its last `-` (`web-02` has prefix `web`; a name with no `-` is its own prefix). When no clean state shares the prefix, the control carries every look in `a.looks`. So in a milestone whose web looks name `web-*` states and whose terminal looks name `tui-*` states, `web-02` carries the web looks and `tui-05` the terminal looks.
- `looks none` is printed only when a state carries no look.
- The `looks:` block prints each look any state of the group carries, once, in number order, as compact JSON of `task`, `accept` and `behaviour` only: never its `states`. With no look carried it prints `- none`.

Keep everything else as it is: the args checks and their refusal messages, `GROUP_SIZE`, the grouping (controls spread one per group first, then clean states fill), the note path, and the index the Workflow returns, whose entries still carry `control` from the args. In `RETURN_SCHEMA`, take `control` out of `required` and keep it in `properties`, so an inspector return with or without a `control` key validates; the Workflow never reads it.

In visual.test.mjs, change `statesOf` and the `judging` helper to parse the new `states:` lines, and decide each state's verdict from the test's own args (a test knows its controls), not from the prompt. Fix the existing tests to the new shape without weakening what they assert, and add one test named exactly `implement-v2-visual: a control carries every look and no prompt says which states are controls`, for a launch with clean states `web-01`, `web-03`, `tui-01`, controls `web-02`, `tui-02` and `odd`, one look naming `web-01` and `web-03` and one naming `tui-01`. It asserts: no prompt contains `control`; each prompt's states are in name order; `web-02` carries the web look only, `tui-02` the terminal look only, `odd` both; each clean state carries only its own look; and no prompt's looks block contains `"states"`."""
acceptance = ""
agent = ""
commit = ""

