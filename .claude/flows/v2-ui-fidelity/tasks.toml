[policy]
checkpoints = "milestones"
max_parallel = 6
commit_granularity = "per-task"
origin = "plan"
note = ""

[[checkpoints]]
id = "A"
rationale = "The harness sees and judges the UI it builds, shows layout options before UI tasks are written, asks the user every hard-to-unwind or compromise call at plan time and during the build, and reviews UI changes and fidelity to intent, through a stack-agnostic capture contract."

[[checkpoints]]
id = "B"
rationale = "The visual pass is proven on two dev-tools fixtures, a web panel captured as images and a terminal panel captured as text grids, each with clean states the inspector passes and planted-defect controls it fails, and the catch rate is reported."

