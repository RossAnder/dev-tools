action = "Rewrite the inspector's input, Controls, note and return wording for prompts that carry no control flag, and say in the ui-capture skill that judges are not told which states are controls."
detail = """
The implement-v2-visual Workflow's prompt now gives the inspector, in place of `- <state> (control: <bool>)` lines and looks with their state lists:

```
states:
- <state>: looks <k>, <k>
- <state>: looks none
looks:
- <k>: {"task":<task>,"accept":<accept>,"behaviour":"<behaviour>"}
```

In claude/agents/ui-inspector.md:

- The input list's `states` line: the states you judge, each with the numbers of the look entries it is judged against; the `looks` line: the look entries those numbers name, each `{task, accept, behaviour}`, `behaviour` being the criterion.
- `## Judge each state`, pass 3 (Look entries): judge each look entry whose number the state's line carries, in place of "each look entry whose `states` names this state".
- `## Verdicts`, the `pass` bullet: "every look entry the state carries is met", in place of "every look entry naming the state is met".
- The `## Controls` section becomes: some states may carry a defect planted on purpose, and you are not told which. Judge every state the same way against the rubric and the looks it carries. Never guess which states are planted, never go easier on a state because another shows a defect, and never invent a defect.
- The note's first line drops the `, control showed no defect: <states>` clause: `Verdict: <n> states judged, <f> fail, <u> unsure, <p> pass`.
- The return shape drops `control`: `{"states": [{"state": "<name>", "verdict": "pass|fail|unsure", "defects": [...], "note": "<the note path>"}]}`.
- The frontmatter `description` drops "and says so when a planted control state shows no defect".

In claude/skills/ui-capture/references/defects.md, `## Controls`: replace "when the judge finds no defect in it, the judge says so, and its answers on the other states cannot be trusted" with: the judge is not told which states are controls; the orchestrator reads each control's verdict, and a control the judge passes means its answers on the other states cannot be trusted.

In claude/skills/ui-capture/SKILL.md, `## Controls`, add two sentences: the judge is not told which states are controls, so a control it fails is a defect it found without being told one was there; and a control is judged against the look entries of the clean states that share its name up to the last `-`, so a project names each state `<surface>-<n>`, such as `settings-03`, with a control taking its surface's prefix.

After editing, run `cargo test --manifest-path tomlctl/Cargo.toml --lib -- cli::dispatch::tests`, which gates every `claude/**/*.md` file."""
