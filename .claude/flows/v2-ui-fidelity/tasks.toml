deps_note = ""
action = "Create the ui-capture skill: SKILL.md states the stack-neutral project capture contract; references/defects.md is the visual defect rubric."
detail = "Contract (decisions D27 and D33): .claude/ui-capture.toml with `command` (run from the repo root), `out` and `paths` (UI source globs). The command accepts --out <dir>, repeated --only <state> and --list (one state name per line); per state it writes <state>.png, <state>.txt (a terminal cell grid, one line per row, no escape codes) or both, at a fixed viewport or terminal size and scale 1, never full-page, since the Read tool downsamples large images (notes/screenshot-capture.md). It writes geometry.json, an object keyed by state name whose value is an array of {kind, locator, detail}, kind overflow, clipping, overlap or offscreen: every state captured as an image has a key, its array empty when nothing is found, and a missing key is a capture failure; a text-grid-only state needs no key. Exit 0 means every asked state was captured. Give one paragraph per stack on how a project meets it: web (Playwright or headless Chrome, with the geometry probe this skill ships), QML and Quickshell (grabToImage or a screenshot of a fixed-size window, item bounds for geometry), terminal UIs such as ratatui (TestBackend buffer to text). Controls: a state whose name is listed as a milestone control carries a planted defect. The rubric lists defect classes, each a yes-or-no question with what counts and a worked example per stack where it applies: element scaling with its container where it should not, reserved empty space, a panel taller or shorter than its content needs, clipped or overflowing content, overlap, misalignment, a control or glyph in a style the project does not use, truncation without an ellipsis, a terminal column or border out of line, colour as the only signal. State that an observed defect is a fail and is never talked down (notes/critic-reliability.md), and that an unsure answer is reported as unsure."
acceptance = ""
agent = "plan-worker-deep"
commit = "882d343ff25e9810268821851f52c3fb51bd3de7"

