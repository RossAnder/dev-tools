s uncommitted to the user with each state's copied capture path. Never run the capture or judge a state yourself beyond reading an unsure one. A capture failure's fix task holds the files the capture command runs (from ui-capture.toml's command, and the milestone rows that edit them), and its reason opens `visual <id> round <n>: capture`, so it counts toward the same two rounds; when no file in the repo can be named, report it in needs_human instead of minting."
