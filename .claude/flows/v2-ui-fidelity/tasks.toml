at = 2026-11-18T08:25:19Z
ref = "build-the-terminal-fixture-panel"
field = "detail"
old = ""
new = """
Each file is `<state>.txt`, UTF-8, LF line endings, one line per terminal row, every line exactly 80 characters including its border characters, with no escape codes. The box-drawing characters are `╭ ╮ ╰ ╯ ─ │`; the status glyphs `✓ ● ○` and the ellipsis `…` are one cell each.

The state names are neutral on purpose: no grid's visible text, and no file name, says which grids carry a planted defect.

| State | Size | Draws | Clean or planted |
|---|---|---|---|
| tui-01 | 80x24 | No tasks: header, separator, `No tasks in this milestone.` from column 10 on row 3, hint line `0 tasks` | clean |
| tui-02 | 80x24 | Five tasks, the `FILES` value of the fourth task one column right of the others | planted: column out of line (class 9) |
| tui-03 | 80x24 | One task | clean |
| tui-04 | 80x24 | 25 tasks: 18 task rows on rows 3 to 20, then `… 7 more` on row 21 | clean |
| tui-05 | 80x24 | Five tasks, the third's title longer than 63 cells cut at column 72 mid-word with no ellipsis | planted: truncation without an ellipsis (class 8) |
| tui-06 | 80x24 | Five tasks, the third's title longer than 63 cells, ending `…` in column 72 | clean |
| tui-07 | 80x24 | Five tasks, the third's title running through the right border so that row has no `│` in column 79 | planted: clipped or overflowing content (class 4) |
| tui-08 | 80x12 | 20 tasks: six task rows on rows 3 to 8, `… 14 more` on row 9, the hint line on row 10 | clean |
| tui-09 | 80x24 | Five tasks, pushed down by five blank rows between the separator and the first task | planted: reserved empty space (class 2) |

Every clean grid follows design/ui-B.md#terminal-panel cell for cell, and every planted grid does too apart from its one planted defect. design/ui-B/single-table.txt beside design/ui-B.md is the model: copy its border, header, separator and hint line, and its column cells. Task ids, titles, statuses and file counts are yours to choose. A small throwaway script may draw the grids, but only the nine `.txt` files are committed."""
