detail = """
capture.sh, run from the repo root as `bash claude/skills/ui-capture/fixtures/capture.sh [--out <dir>] [--only <state>]... [--list]`, meets the contract in claude/skills/ui-capture/SKILL.md:

- The states are the web states, read from `fixtures/web/states.txt` in its order, then the terminal states, the stems of `fixtures/tui/*.txt` sorted by name: twenty in all.
- `--list` prints every state name, one per line, in that order, and captures nothing.
- `--only <state>` is repeatable; without it every state is captured. A name it does not know is reported on stderr and the command exits 1 having captured nothing.
- `--out <dir>` defaults to `.ui-capture`; the directory is created when absent.
- A web state: copy `fixtures/web/panel.html` into a temporary directory as `<state>.html`, with its `data-state="web-01"` attribute replaced by the state's name, then run `bash claude/skills/ui-capture/scripts/render.sh --size <its window> <copy> <out> <state>`, which writes `<out>/<state>.png` and merges the state's key into `<out>/geometry.json`. Remove the temporary directory on exit.
- A terminal state: copy `fixtures/tui/<state>.txt` to `<out>/<state>.txt`. It gets no geometry key.
- Capture every asked state before exiting, so one failure does not hide the others, and name each failed state with its exit code on stderr. Exit 0 only when every asked state was captured; otherwise exit with the highest code any state failed with, so a missing browser (render.sh's 2) is never reported as an ordinary render failure (1).
- Locate the fixtures and render.sh relative to the script's own directory, never the working directory.

Declare it with the tomlctl CLI, not the Write tool, and write no sidecar:

```
tomlctl set .claude/ui-capture.toml --set 'command=bash claude/skills/ui-capture/fixtures/capture.sh' --set out=.ui-capture --no-write-integrity
tomlctl set-json .claude/ui-capture.toml paths --json '["claude/skills/ui-capture/fixtures/**"]' --no-write-integrity
```

Add `/.ui-capture/` to `.gitignore`, under a one-line comment saying it is the UI capture command's output."""
