file = "claude/skills/ui-capture/scripts/geometry-probe.js"
line = 164
symbol = "uiCaptureGeometry"
summary = "A visibility:hidden ancestor marks its whole subtree skip, so a visibility:visible descendant that is drawn is never measured"
severity = "minor"
failure_scenario = """<div style="visibility:hidden"><div style="visibility:visible;width:100px;white-space:nowrap">long label</div></div>: the child is painted and overflows its box, but rendered() returns false for the parent (visibility !== 'visible') and mine.skip propagates to every descendant. geometry.json reports nothing, while an identical sibling outside the hidden parent is reported as overflow."""
fix = "Only display:none (getClientRects empty) and opacity 0 hide a subtree; visibility is inherited and overridable. In uiCaptureGeometry, when the element fails rendered() only because style.visibility !== 'visible', skip this element's own checks and items but do not set mine.skip, so descendants are judged by their own computed visibility. E.g. split rendered() into hidesSubtree(el, style) (SKIP_TAGS, display none, opacity 0, no client rects) and a per-element visibility test."
effort = "small"
counter = "If a hidden-parent/visible-child pattern were declared out of scope for the probe in the contract, this would be advisory; SKILL.md names no such exclusion."
grade = "high"
evidence = [
    "claude/skills/ui-capture/scripts/geometry-probe.js:78: rendered() returns false when style.visibility !== 'visible'",
    "claude/skills/ui-capture/scripts/geometry-probe.js:164-167: !rendered sets mine.skip = true, inherited by every descendant at line 147-152",
    "Ran render.sh on a page with #shown (visible child of a visibility:hidden div) and #plain (same markup, no hidden parent): PNG shows both labels; geometry.json reports overflow only for #plain",
]
anchor = "code|claude/skills/ui-capture/scripts/geometry-probe.js|uiCaptureGeometry"
