symbol = "Controls"
summary = "The recommended control, a clipped or overflowing label, is caught by reading geometry.json, so a sound control says nothing of the classes the eye must judge"
angle = "risk"
rationale = "A control exists to prove the inspector is looking. ui-layout.md step 5 and defects.md's Controls section both steer authors to an overflow or clipping control, yet geometry-probe.js measures exactly those (render.sh --self-test asserts the planted overflow is reported) and ui-inspector.md step 1 makes every geometry entry a defect and a fail. Such a control is failed by reading one JSON key, so a milestone meeting plan check's one-control floor with it certifies nothing about scaling, reserved space, panel size, misalignment, off-style glyphs or colour-only cues, the classes where the vision judge is the only check. This flow's own fixtures avoid this (plan.toml decision near line 705 plants tiles, a band, a glyph), but the generic guidance that real projects follow does not."
alternative = "Require each milestone's controls to include an unmeasured rubric class, so control soundness covers the judgement the inspector alone supplies."
adoption_cost = "Prose edits to ui-layout.md step 5 and defects.md's Controls section: require at least one control per milestone planting a class geometry-probe does not measure (rubric classes 1-3, 6, 7, 9 or 10) and drop the clipped-label example; optionally a plan check warning, which needs a control's class recorded, a schema change."
