decision = "Every plan opens with an interview about goals, constraints and what good looks like, before the brief is written, and presents two or three distinct directions with their trade-offs after investigation, before Design, for the user to choose or steer. Both scale in length with the plan's complexity and ambiguity. The aim is a clear flow-level direction, so tasks carry an overarching and task-specific vision rather than generic standalone implementations."
