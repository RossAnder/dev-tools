decision = "A state the capture command writes as an image must come with geometry.json entries for that state, which the capture records even when empty; a text-grid state is exempt, since clipping and overflow show in its text. A missing geometry record for an image state is a capture failure, not a pass."
why = "The user chose to require geometry for image states (plan review U1, F11): a vision judge is near chance on clipping and overflow (notes/critic-reliability.md)."
