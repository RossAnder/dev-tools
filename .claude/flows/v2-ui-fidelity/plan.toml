why = "The user, 2026-11-17: 'although web UI is the most common case, I want the capture strategy to be stack agnostic. E.g. qml/quickshell as well, TUI (ratatui), etc.'; at plan review U1 (F25) the user kept the globs beside the declared paths and reworded the rule."
provenance = "user-stated"
door = "one-way"
binds = [
