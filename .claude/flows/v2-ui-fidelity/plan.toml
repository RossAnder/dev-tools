[[decision]]
id = "D6"
decision = "Planning asks the user every ambiguous call that is hard to unwind or is a compromise, at any level from the abstract to a task's specifics, whether or not the plan's structure changes; Surface's test 1 becomes 'would getting it wrong be visible to the user, costly to undo, or a compromise the user has not made'. The budget is up to eight such questions a planning session and four an elaboration, asked in batches of up to four, and each decision records a class so veto rates are measured per class. A question an answer opens is asked, never assumed. The harness aims to build better than the user would specify, and holds consistency with the user's expectations as a key goal."
why = "The user, 2026-11-17: 'I expect that a plan-v2 will go through all ambiguous calls with me that are either difficult to unwind, are compromises. This could be at any levels from abstract to task level specifics if required. If an answer opens up new questions, these should not be assumed. I would like to trust the harness agents to build something better than I can imagine but I want a key goal of theirs to be that we build something consistent with my expectations.'"
