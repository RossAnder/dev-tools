[[decision]]
id = "D30"
decision = "Raise SCHEMA_VERSION to 4. write_version stamps 4 when any decision carries a class, 3 when the store holds attempts, gate rounds or reports and no class, and BASE_SCHEMA_VERSION (2) otherwise; from_toml still refuses anything above SCHEMA_VERSION, and the newer-version test moves to 5."
why = "Stamping SCHEMA_VERSION + 1 would write a store the same binary refuses (plan/schema.rs:556, test newer_schema_version_is_refused); a third tier keeps class-free stores at today's stamp."
