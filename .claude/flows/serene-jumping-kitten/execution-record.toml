summary = "GitBackend widened with attach_worktree between waves: the frozen create_worktree was new-branch-only, but User Decision 1 requires attaching a worktree to the EXISTING integration target branch."
original_intent = "Lazily create the integration worktree via the frozen GitBackend::create_worktree surface (11 methods, frozen at Task 2)."
