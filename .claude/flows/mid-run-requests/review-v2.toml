failure_scenario = 'Task 1 posts {"paths":[{"path":"src/./shared.rs","why":"x"}]} while unrelated pending task 2 holds src/shared.rs. normal_path only trims a leading `./` and swaps slashes, so fold_key gives `src/./shared.rs` != `src/shared.rs`: holder() finds no holder, the item stays open, and `rule` grants it (its holder recheck misses too), so two tasks edit one file. `docs/./flows/<slug>/x.md` likewise escapes forbidden(); `./` normalises to an empty path that is accepted.'
fix = "In parse_payload, canonicalise each path before use: split on `/`, drop empty and `.` segments, rejoin; refuse the item when the result is empty. Store the canonical form so fold_key, forbidden and holder all compare it. Alternatively make fold_key (holders.rs) collapse `.` and empty segments so every comparison site agrees, and add a test for `src/./a.rs` and `src//a.rs` against a held `src/a.rs`."
effort = "small"
counter = "A caller (the worker skill or drain) canonicalising paths before `plan request add`, or `rule` being always preceded by a human check, would make the variant unreachable in practice."
grade = "high"
evidence = [
