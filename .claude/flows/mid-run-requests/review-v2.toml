file = "tomlctl/src/plan/holders.rs"
line = 30
symbol = "forbidden"
summary = "fold_key keeps `.` and empty segments, so docs/./flows/<slug>/x or src//held.rs escapes the forbidden deny-list and the holder collision check"
severity = "minor"
failure_scenario = """A worker posts `plan request add` with path `docs/./flows/<slug>/brief.md` (or `docs//flows/<slug>/brief.md`), or `src/./x.rs` for a file an unrelated pending row holds. fold_key leaves the segments in place, so `under(key, "docs/flows/<slug>")` and the holder's `fold_key(file) == key` both miss; the item stays open instead of denied, and `rule --ruling granted` re-checks only holder (same miss), so the orchestrator can grant a path the contract says no task may hold, or one another row edits concurrently. On Windows `.claude./x` (trailing dot) likewise resolves to `.claude/x`. CWE-41."""
fix = "Canonicalise or refuse non-canonical request paths before ruling. In request.rs parse_payload, refuse a path with an empty segment, a `.` segment, or a segment ending in `.` or a space (Win32 strips those), naming the canonical spelling; or make the comparison key collapse empty and `.` segments so forbidden and holder see one spelling. Also call holders::forbidden in rule() before writing a granted path item, so a grant cannot land on a forbidden path. Add cases to holders.rs `paths_under_claude_or_the_flow_directory_are_forbidden` and request.rs payload tests for `docs/./flows/demo/x`, `docs//flows/demo/x` and `.claude./x`."
effort = "small"
counter = "If the drain's audited task update or lane check canonicalises and refuses such a path before it reaches a row's files, the grant is caught downstream; I did not read drain.md's update step or the tasks update path validator."
grade = "high"
evidence = [
    'tomlctl/src/tasks/schema.rs:714 normal_path only replaces `\` and trims leading `./`; no `.`/empty-segment collapse',
    "tomlctl/src/plan/holders.rs:22 fold_key = normal_path(..).to_lowercase(); holders.rs:47-48 flow-dir check is a raw prefix strip on that key",
    "tomlctl/src/plan/holders.rs:108 holder compares fold_key(file) == key by string equality",
    "tomlctl/src/plan/request.rs:369-377 rule() grants after holder() alone, never forbidden()",
    "tomlctl/src/plan/request.rs:223 parse_payload stores normal_path(path) with no segment validation",
]
fix_files = ["tomlctl/src/plan/request.rs"]
