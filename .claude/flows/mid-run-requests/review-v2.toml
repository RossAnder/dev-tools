    "tomlctl/src/plan/holders.rs fold_key = normal_path(path).to_lowercase(); forbidden() checks only absolute, `..`, .claude/ and the flow dir",
    "tomlctl/src/plan/holders.rs holder(): `row.files.iter().any(|file| fold_key(file) == key)` — a plain string compare of folded keys",
]
