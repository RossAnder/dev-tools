expect = '''"Create tomlctl/src/plan/check/case_collision.rs, declared `mod case_collision;` inside check.rs. A row creates a file when Store::file_note(ref, file) reads FileKind::New, or when the file's exact name is absent from fs::read_dir of its parent (never Path::exists, which folds case on Windows and macOS). For each created file of a pending row, compare its key, the path without its last extension lowercased, against (a) the exact names in the same directory and (b) every other row's planned files in that directory; a different name with an equal key is a collision, unless that existing file is marked (delete) by some row. Skip entries ending in `/`. Emit one Finding { class: \"plan/file-case-collision\", severity: WARNING, ids: the creating row and any planned row it collides with, detail naming both paths }. Call it from findings() beside ui_scope_findings, outside the plan.approvals.is_empty() block. Add the class to check.rs's header comment list of warning classes.\nThe finding-class gate: documented_plan_classes_match_the_source (tomlctl/src/cli/dispatch/tests/finding_classes.rs) builds its bodies with source_bodies(&plan_dir()), which reads only the top-level *.rs files of src/plan. Make that test also read the *.rs files of src/plan/check/ (append them to the bodies, sorted), leaving source_bodies and the tasks test unchanged, so classes built in check's child modules count as emitted.\nTests in tomlctl/tests/plan_check.rs with assert_reports_warning: ColourField.tsx on disk plus a (new) colourField.ts collides; an unannotated planned src/foo.ts beside an on-disk src/Foo.ts collides (it fails if creation is read through Path::exists on a case-insensitive filesystem); two rows planning Foo.ts and foo.tsx collide; colourField.test.ts beside ColourField.tsx does not; ColourField.tsx on disk marked (delete) by some row plus a (new) colourField.ts does not; the base fixture stays clean."'''
