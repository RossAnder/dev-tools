ning Foo.ts and foo.tsx collide; colourField.test.ts beside ColourField.tsx does not; Button.tsx on disk plus a (new) Button.css does not; ColourField.tsx on disk marked (delete) by some row plus a (new) colourField.ts does not; the base fixture stays clean."'''
