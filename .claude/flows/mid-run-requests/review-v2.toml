summary = "Task 11 flags any different name with an equal stem key, so Button.tsx beside a new Button.css warns, against the brief's case-only rule and C43"
severity = "major"
failure_scenario = "A plan in any project creates src/Button.css beside an existing src/Button.tsx (or index.css beside index.ts). Both keys are 'src/button' and the names differ, so task 11's rule ('a different name with an equal key is a collision') emits plan/file-case-collision, and task 20's Prove guidance tells the author to rename a legitimate file. The brief promises a warning only when stems differ by case, and C43, which D17 cites as its key, groups such pairs as not a violation."
fix = "In task 11's detail, report a collision only when the equal-key paths spell their stems (path without the last extension) differently; one stem under two extensions, or a new foo.rs beside an existing foo/ directory, is not a collision. Add the test 'Button.tsx on disk plus a (new) Button.css does not'. Align task 11's outcome and D17's wording the same way (user-owned records)."
effort = "small"
counter = "If the user wants same-stem, different-extension siblings flagged too, the brief's success criterion 7 (stem differs only by case) and D17's cited C43 evidence would both need revising; neither says so."
grade = "high"
evidence = [
    "task 11 detail: 'a different name with an equal key is a collision', key = path without its last extension lowercased",
    "docs/flows/mid-run-requests/brief.md:29: warns when a created file's stem differs only by case from an existing or planned file",
    "~/dev/reportdesignkit/scripts/boundaries/layer-rules.mjs:261-263: 'a violation only when its members spell that stem differently; one stem under two extensions is ... not the filesystem'",
]
target = "task:warn-on-a-planned-new-file-whose-stem-differs-from-a-neighbour-only-by-case.detail"
expect = '''"Create tomlctl/src/plan/check/case_collision.rs, declared `mod case_collision;` inside check.rs. A row creates a file when Store::file_note(ref, file) reads FileKind::New, or when the file's exact name is absent from fs::read_dir of its parent (never Path::exists, which folds case on Windows and macOS). For each created file of a pending row, compare its key, the path without its last extension lowercased, against (a) the exact names in the same directory and (b) every other row's planned files in that directory; a different name with an equal key is a collision, unless that existing file is marked (delete) by some row. Skip entries ending in `/`. Emit one Finding { class: \"plan/file-case-collision\", severity: WARNING, ids: the creating row and any planned row it collides with, detail naming both paths }. Call it from findings() beside ui_scope_findings, outside the plan.approvals.is_empty() block. Add the class to check.rs's header comment list of warning classes.\nThe finding-class gate: documented_plan_classes_match_the_source (tomlctl/src/cli/dispatch/tests/finding_classes.rs) builds its bodies with source_bodies(&plan_dir()), which reads only the top-level *.rs files of src/plan. Make that test also read the *.rs files of src/plan/check/ (append them to the bodies, sorted), leaving source_bodies and the tasks test unchanged, so classes built in check's child modules count as emitted.\nTests in tomlctl/tests/plan_check.rs with assert_reports_warning: ColourField.tsx on disk plus a (new) colourField.ts collides; an unannotated planned src/foo.ts beside an on-disk src/Foo.ts collides (it fails if creation is read through Path::exists on a case-insensitive filesystem); two rows planning Foo.ts and foo.tsx collide; colourField.test.ts beside ColourField.tsx does not; ColourField.tsx on disk marked (delete) by some row plus a (new) colourField.ts does not; the base fixture stays clean."'''
new = '''"Create tomlctl/src/plan/check/case_collision.rs, declared `mod case_collision;` inside check.rs. A row creates a file when Store::file_note(ref, file) reads FileKind::New, or when the file's exact name is absent from fs::read_dir of its parent (never Path::exists, which folds case on Windows and macOS). For each created file of a pending row, compare its key, the path without its last extension lowercased, against (a) the exact names in the same directory and (b) every other row's planned files in that directory; an equal key is a collision only when the two stems (each path without its last extension) are spelt differently, as reportdesignkit's C43 groups them: one stem under two extensions, such as Button.tsx beside a new Button.css, or a new src/foo.rs beside an existing src/foo/ directory, is not a collision. A collision is excused when that existing file is marked (delete) by some row. Skip entries ending in `/`. Emit one Finding { class: \"plan/file-case-collision\", severity: WARNING, ids: the creating row and any planned row it collides with, detail naming both paths }. Call it from findings() beside ui_scope_findings, outside the plan.approvals.is_empty() block. Add the class to check.rs's header comment list of warning classes.\nThe finding-class gate: documented_plan_classes_match_the_source (tomlctl/src/cli/dispatch/tests/finding_classes.rs) builds its bodies with source_bodies(&plan_dir()), which reads only the top-level *.rs files of src/plan. Make that test also read the *.rs files of src/plan/check/ (append them to the bodies, sorted), leaving source_bodies and the tasks test unchanged, so classes built in check's child modules count as emitted.\nTests in tomlctl/tests/plan_check.rs with assert_reports_warning: ColourField.tsx on disk plus a (new) colourField.ts collides; an unannotated planned src/foo.ts beside an on-disk src/Foo.ts collides (it fails if creation is read through Path::exists on a case-insensitive filesystem); two rows planning Foo.ts and foo.tsx collide; colourField.test.ts beside ColourField.tsx does not; Button.tsx on disk plus a (new) Button.css does not; ColourField.tsx on disk marked (delete) by some row plus a (new) colourField.ts does not; the base fixture stays clean."'''
