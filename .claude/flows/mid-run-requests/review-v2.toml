he newest tier and becomes 5; the decision-class tier keeps 4 under a new name such as CLASS_SCHEMA_VERSION. write_version returns SCHEMA_VERSION when requests is non-empty, otherwise today's rule with the renamed const. Keep the const asserts ordering the tiers. store.rs's tests use SCHEMA_VERSION + 1 as \"newer than newest\" and need no change.\nUpdate the existing schema.rs tests that pin the class tier to the renamed const, and add round-trip and minting tests for a request with both item kinds, each test fn named with `request` in it."'''
