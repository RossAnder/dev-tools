expect = '''"Put the Request types, their from/to TOML functions and the id minting in a new tomlctl/src/plan/schema_request.rs (declared `pub(crate) mod schema_request;` in plan/mod.rs). schema.rs gains the PlanStore `requests` field, the calls in from_toml/to_toml (TOML key \"request\", after \"report\"), the write_version tier and ReportKind::Request => \"request\". It may also widen the visibility of exactly what schema_request.rs uses: make the vocabulary! macro usable from the sibling module (#[macro_export] is not wanted; declare it with `macro_rules!` before `pub(super) use vocabulary;` or move the use behind `pub(crate) use`), and make the record read and write helpers it calls (the `records`/`insert_records` pair, the string, bool and datetime readers) pub(super). Change nothing else in schema.rs.\nMinting: do NOT add a RecordKind variant; RecordKind is matched exhaustively in plan/records.rs and plan/target.rs, which this task does not hold. Add `impl PlanStore { pub(crate) fn mint_request_id(&mut self) -> String }` in schema_request.rs, following mint_id's rule (the highest Q<n> among stored requests and id_high_water[\"Q\"], plus one, recording the new mark in id_high_water under \"Q\").\nRecord shape (TOML keys in this order):\n  id, run_id, milestone, task (u32), at (datetime), status (\"open\" | \"ruled\"), ruled_at (datetime, omitted while open), applied (bool, false until the drain applies it),\n  [[request.paths]] path, why, ruling, by, reason\n  [[request.changes]] field, what, evidence, ruling, by, reason\n`ruling` is a vocabulary: \"open\", \"granted\", \"denied\", \"needs-user\". `by` is \"\", \"tomlctl\" or \"orchestrator\". `field` is a vocabulary: \"accept\", \"means\", \"constraints\", \"detail\", \"files\". Use the vocabulary! macro.\nVersion: SCHEMA_VERSION stays the name of the newest tier and becomes 5; the decision-class tier keeps 4 under a new name such as CLASS_SCHEMA_VERSION. write_version returns SCHEMA_VERSION when requests is non-empty, otherwise today's rule with the renamed const. Keep the const asserts ordering the tiers. store.rs's tests use SCHEMA_VERSION + 1 as \"newer than newest\" and need no change.\nUpdate the existing schema.rs tests that pin the class tier to the renamed const, and add round-trip and minting tests for a request with both item kinds, each test fn named with `request` in it."'''
