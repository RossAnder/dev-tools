failure_scenario = "Writing apply-rows 'Failure on an apply row', the executor must say how the widening's audited reason reads. With drain.md's 'needs_files from task-N.md' reason the count command (--where-prefix 'reason=apply failure ') never sees it and a fix row can be widened every round; with an 'apply failure <n>: ' prefix the second widening parks the row. The Detail settles only that a granted request never counts."
fix = "State in the Detail which reason prefix the widening's tasks update carries, and so whether it counts toward the two-failure park."
effort = "trivial"
counter = "If drain.md's widening section already bounds repeated widenings of one row, the choice matters less; it parks only unjustified or forbidden paths."
grade = "medium"
evidence = [
    'claude/skills/implement-v2-engine/references/apply-rows.md Tier: count via `--where-prefix "reason=apply failure "`; second failure parks',
    'claude/skills/implement-v2-engine/references/drain.md:216 widening reason = "needs_files from task-11.md: ..."',
]
blocked_on = "decision"
blocked_missing = "Whether a needs_files widening of an apply row counts toward its apply-failure count, which decides when a repeatedly widened fix row parks."
blocked_options = [
    "Counts: reason opens 'apply failure <n>: ', so a second failure of any kind parks the row; bounded, but a second legit missing file parks",
    "Does not count: reason keeps drain.md's needs_files form; widening is unbounded by the apply count but each path must still be justified",
]
target = "task:fit-requests-into-the-apply-row-rules-the-task-store-writer-rule-and-the-question-loop.detail"
