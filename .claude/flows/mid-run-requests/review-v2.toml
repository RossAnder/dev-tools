file = "tomlctl/src/plan/holders.rs"
line = 140
symbol = "closure"
summary = "holder() exempts rows linked to the requester only by coupling, but the Workflow runs those concurrently, so a path an in-flight row holds can be granted"
severity = "major"
failure_scenario = "Milestone A has task 5 (needs [], files [src/a.rs]) and task 6 (coupling [5], files [tests/a.rs]). launch-args sends 6 with needs [] and no coupling, so the Workflow starts both together. Task 5 requests tests/a.rs: holder() puts 6 in 5's closure via the coupling edge, skips it, and returns None, so `add` leaves it open and `rule` grants it (or `add` grants it at once if it is a declared output). Both workers then edit tests/a.rs at the same time. D1 requires that no concurrent row holds a granted path."
fix = "In holders.rs `closure`, walk only the edges the milestone Workflow gates on: `needs`, plus, optionally, each row's spec `after:` premise targets, which is what `plan emit launch-args` sends as `needs` and `after`. Drop `coupling`. Fix the module header so it names the edges it really walks. Add a unit test showing that a pending row linked to the requester only by `coupling` and holding the path is returned as its holder. Do not add coupling to launch-args instead: the brief's Non-goals rule out changing how the Workflow chooses which task to start."
effort = "small"
counter = "If coupled rows are never dispatched in the same Workflow run (for example, launch-args filtered them out), they never run concurrently and the exemption is harmless. emit.rs Launch::build passes only `needs` (filtered to candidates) and `after`, so no such filter was found."
grade = "high"
evidence = [
    "holders.rs closure: `row.needs.iter().chain(row.coupling.iter())` builds both up and down walks; holder() filters `!related.contains(&row.id)`",
    "emit.rs Launch::build Dispatched: `needs: row.needs.iter().copied().filter(|need| candidates.contains_key(need))` — coupling is never sent",
    "claude/workflows/implement-v2-milestone.js: `const gates = (t) => [...t.needs, ...(t.after || [])]`; no `coupling` anywhere in the script",
    "request.rs rule_path: holder() None then `outputs.contains(&key)` auto-grants with RuledBy::Tomlctl; holders.rs tests set coupling: Vec::new() only",
]
related = [
    "F56",
    "F65",
]
anchor = "code|tomlctl/src/plan/holders.rs|closure"
