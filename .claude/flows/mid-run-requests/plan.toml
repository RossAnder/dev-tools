[[decision]]
id = "D17"
decision = "plan check reports plan/file-case-collision as a warning, before and after approval, when a row creates a file (a (new) note, or a path absent from its directory's listing) whose stem, the name without its last extension, equals ignoring case but is spelled differently from the stem of an existing or planned file in the same directory; one stem under two extensions is not a collision; existence is read from the directory listing by exact name, never exists()"
