[[decision]]
id = "D1"
decision = "A scope request for a path that .claude/generated.toml declares as an output of an input the task holds is granted by tomlctl the moment the worker posts it, when no concurrent row holds the path; every other scope request and every amend waits for the orchestrator's ruling"
why = "the generated-output rule is fully mechanical, so an orchestrator turn and a worker wait add nothing but latency"
provenance = "user-confirmed"
door = "two-way"
class = "architecture"
binds = [
    "claude/agents/plan-worker-lite.md",
    "claude/agents/plan-worker-deep.md",
    "4",
    "18",
]
rejected = []
evidence = "docs/flows/mid-run-requests/notes/generated-map.md (the outputs_of rule is a pure function of the config and the row's files); notes/live-run-holders.md (the holder test is computable from plan.toml and tasks.toml alone)"
if_false = "every generated-output request waits up to a full orchestrator turn, or, if all mechanical scope requests are self-granted, the orchestrator no longer judges whether a requested file is justified"
revisit_if = ""
check = ""
surfaced = true
vetoed = false

[[decision]]
id = "D2"
decision = "When an /apply-v2 fix row's scope request is denied and the worker returns failed with needs_files, the drain widens the row by drain.md's needs_files rules instead of apply-rows.md's lite-to-deep tier move"
why = "the tier move keeps the row's files unchanged, so the row fails again for the same missing file"
provenance = "user-confirmed"
door = "two-way"
class = "compromise"
binds = [
    "claude/skills/implement-v2-engine/references/apply-rows.md",
    "19",
]
rejected = []
evidence = "claude/skills/implement-v2-engine/references/apply-rows.md:225-242 replaces drain step 6 for failed apply rows, needs_files widening included; notes/drain-integration.md"
if_false = "a denied fix row keeps today's apply path: it moves lite to deep with unchanged files and fails again, costing an extra round"
revisit_if = ""
check = ""
surfaced = true
vetoed = false

[[decision]]
id = "D3"
decision = "Build worker requests as a store-backed tomlctl group: `plan request` writes a [[request]] record in the flow's plan.toml, settles the mechanical half of each rule itself, and takes the orchestrator's ruling through its own verb; the lane check reads grants and the drain applies them"
why = "every rule a command can settle is settled by one, and each grant is an auditable record beside the run record"
provenance = "user-stated"
door = "two-way"
class = "architecture"
binds = [
    "tomlctl/src/plan/schema.rs",
    "tomlctl/src/plan/lane.rs",
    "2",
    "4",
    "8",
    "16",
]
evidence = "docs/flows/mid-run-requests/notes/request-record.md, live-run-holders.md, drain-integration.md, structure-challenge.md (no restructure; a plan run leaf is the existing seam)"
if_false = "the holder and case-fold rule moves into the orchestrator's prose reading and grants are recorded as plan decide rows"
revisit_if = ""
check = ""
surfaced = true
vetoed = false

[[decision.rejected]]
option = "Prose loop on existing stores"
because = "the case-folded holder rule would live in the orchestrator's reading, the message text is untrusted, and the lane check needs new code to see grants either way"

[[decision.rejected]]
option = "Reserve files at launch"
because = "wider lanes cut the pool's parallelism and it cannot catch an arbitrary missing file such as task 6's README line"

[[decision]]
id = "D4"
decision = "Store worker requests as a [[request]] array in .claude/flows/<slug>/plan.toml, minted under prefix Q, never in .claude/inputs.toml"
why = "plan.toml is already writable during a live run and sits outside the lane and clean-tree checks; inputs.toml encodes user authority and glimpse shows its pending records live"
provenance = "agent-assumed"
door = "two-way"
class = "architecture"
binds = [
    "tomlctl/src/plan/schema.rs",
    "2",
    "4",
]
evidence = "notes/request-record.md; tomlctl/src/plan/drift.rs:197 skips the flow dirs; tomlctl/src/plan/lane.rs:47 digests tasks.toml only; flow-contract-user-inputs/SKILL.md:111 forbids a record widening scope"
if_false = "requests become a new inputs kind, with a new verdict verb, a trust-boundary carve-out and a glimpse filter"
revisit_if = ""
check = ""
surfaced = false
vetoed = false

[[decision.rejected]]
option = "A new inputs.toml kind"
because = "the inputs answer verb stamps the user as author, the contract forbids a record widening scope, and glimpse would show pending requests live"

[[decision.rejected]]
option = "A separate requests.toml"
because = "it needs its own store-guard class and a second reader in plan run report for no gain over a plan.toml array"

[[decision]]
id = "D5"
decision = "Stamp plan.toml schema_version 5 when it holds any request, keeping 4, 3 and 2 by content as today"
why = "an older binary drops unknown arrays on rewrite, so a store holding requests must make it refuse"
provenance = "agent-assumed"
door = "two-way"
class = "architecture"
binds = [
    "tomlctl/src/plan/schema.rs",
    "2",
]
rejected = []
evidence = "tomlctl/src/plan/schema.rs:33-43 version tiers and write_version; schema.rs unknown_keys_are_dropped test"
if_false = "a stale tomlctl rewriting the store would silently delete every request"
revisit_if = ""
check = ""
surfaced = false
vetoed = false

[[decision]]
id = "D6"
decision = "A scope request is denied when any other row of the requester's milestone holds the path, or was granted it in a still-unapplied request, compared by the folded key (slashes normalised, leading ./ dropped, case folded), and that row is pending, in-progress, failed or parked and outside the requester's needs closure up and down"
why = "the Workflow never runs a row of the requester's closure beside it and has released every done row's files, so only the remaining rows can edit the path at the same time; the folded key is the Workflow's fileKey with a leading ./ also dropped"
provenance = "agent-assumed"
door = "two-way"
class = "architecture"
binds = [
    "claude/workflows/implement-v2-milestone.js",
    "3",
    "4",
]
rejected = []
evidence = "claude/workflows/implement-v2-milestone.js:157 fileKey folds case, :269 canStart waits for every need to return done; notes/live-run-holders.md (a second grant and a case variant are the two holes); reportdesignkit package-design-tools rows 130/131 and 6/7, where the only other holder depends on the requester"
if_false = "a grant can put two in-flight workers on one file, or a dependent holder needlessly blocks the grant the brief's evidence needs"
revisit_if = ""
check = ""
surfaced = false
vetoed = false

[[decision]]
id = "D7"
decision = "A worker posts at most one request per run, separate from its one question, batching every path and amendment it needs; it posts once every edit inside its own files is done and edits no requested path before the grant"
why = "the wait is one blocking Bash call, so posting late lets one request cover everything at no cost"
provenance = "agent-assumed"
door = "two-way"
class = "cost"
binds = [
    "claude/agents/plan-worker-lite.md",
    "claude/agents/plan-worker-deep.md",
    "4",
    "18",
]
rejected = []
evidence = "notes/worker-protocol.md; claude/agents/plan-worker-lite.md:55 one question per run"
if_false = "a worker could post several requests, each costing an orchestrator turn and a wait"
revisit_if = ""
check = ""
surfaced = false
vetoed = false

[[decision]]
id = "D8"
decision = "A request still open when the worker's 590 s wait ends counts as denied: the worker takes today's path and never parks for it"
why = "a request can sit behind another worker's open question picker for the whole wait, and parking would turn a file grant into a user decision"
provenance = "agent-assumed"
door = "two-way"
class = "compromise"
binds = [
    "claude/agents/plan-worker-lite.md",
    "claude/agents/plan-worker-deep.md",
    "18",
]
rejected = []
evidence = "notes/worker-protocol.md; claude/skills/implement-v2-engine/references/questions.md:48 nothing times out while the picker is open"
