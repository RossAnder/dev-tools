id = 5
ref = "test-the-plan-request-verbs-end-to-end"
title = "Test the plan request verbs end to end"
effort = "M"
status = "pending"
checkpoint = "A"
phase = ""
phase_depth = 0
heading_depth = 3
files = [
    "tomlctl/tests/plan_request.rs",
    "tomlctl/tests/it.rs",
    "tomlctl/tests/output_options.rs",
]
needs = [4]
coupling = []
deps_note = ""
action = "Add an integration test module for plan request and an output-options case for each of its four leaves."
detail = """
tomlctl/tests/plan_request.rs, registered as `mod plan_request;` in tests/it.rs in sorted position. Seed flows with the helpers tests/plan_run_records.rs and tests/plan_check.rs use (an open implement:A run via plan run start --tasks). Cases, each a separate #[test]:
- the reportdesignkit task-130 shape: .claude/generated.toml maps packages/x/tokens.css to packages/x/canvas.generated.css; task 1 holds tokens.css; task 2 needs task 1 and also holds canvas.generated.css; a request from task 1 for the output is granted by tomlctl and the request is ruled at once;
- the same generator, but the output is also held by an unrelated pending row of the milestone: the request is denied by tomlctl naming that row, not granted;
- an unrelated pending row holding src/Foo.ts denies a request for src/foo.ts, naming that row;
- a path under .claude/ is denied as forbidden;
- a path already in the requester's files, in another case, is denied with reason "already held by this task";
- an ordinary path stays open; rule grants it; list shows ruling granted by orchestrator; a second task's later request for the same path is denied naming the grant's request id;
- rule refuses a grant after the path became held, and refuses an item already ruled;
- applied refuses an open request and marks a ruled one;
- a second add for the same task in the run is refused;
