commit = ""

[[items]]
id = 4
ref = "add-the-plan-request-verbs-a-worker-posts-with-and-the-orchestrator-rules-with"
title = "Add the plan request verbs a worker posts with and the orchestrator rules with"
effort = "L"
status = "pending"
checkpoint = "A"
phase = ""
phase_depth = 0
heading_depth = 3
files = [
    "tomlctl/src/plan/request.rs",
    "tomlctl/src/cli/types/plan.rs",
    "tomlctl/src/plan/dispatch.rs",
    "tomlctl/src/plan/mod.rs",
]
needs = [
    1,
    3,
]
coupling = []
deps_note = ""
action = "Add a `plan request` group with leaves add, rule, list and applied, wired like `plan handover`."
detail = """
CLI (cli/types/plan.rs): PlanOp::Request { op: PlanRequestOp } with leaves, each taking PlanTarget (--slug) and the integrity flags the other plan writers take:
- add --task <N> --json <SRC>: SRC is `@path`, `-` or inline JSON, a `.toml` path read as a record file the way other --json flags read one. Payload {"paths":[{"path","why"}], "changes":[{"field","what","evidence"}]}; at least one item; at most 16 paths. Refuse unless an open `implement:<milestone>` run (crate::plan::store::open_runs) lists the task in its tasks, and unless the task has no earlier request in that run. Inside the plan.toml write lock: mint Q<n>, record run_id, milestone, task, at; rule each path item mechanically — forbidden (holders::forbidden) -> denied by tomlctl; already in the task's files (fold_key) -> denied by tomlctl, reason "already held by this task"; held (holders::holder) -> denied by tomlctl naming the holder and, for a grant, the request id; a declared output of an input the task holds (generated::load at the repo root, outputs_of over the row's files, fold_key comparison) -> granted by tomlctl; otherwise open. Change items stay open. When no item is open, status is ruled and ruled_at is stamped. Prints {"ok":true,"id","status","items":[{"item","ruling","by","reason"}]} where item is p1, p2... for paths and c1, c2... for changes.
- rule <ID> --ndjson <SRC>: rows {"item","ruling","reason"}, ruling granted, denied or needs-user, reason non-blank. All-or-nothing: refuse an unknown item, an item already ruled, a request not open, or a grant of a path that holders::holder now finds held (naming the holder). Writes by = "orchestrator"; when no item is left open, status becomes ruled and ruled_at is stamped. Prints the same shape as add.
- list: every request as a row report, newest last, each row the record's fields with items flattened as `paths` and `changes` arrays; the global --where/--get options filter and shape it (a worker polls `--where id=<id> --where status=ruled --get id`).
- applied <ID>[,<ID>...]: set applied = true; refuse an open request or an unknown id.
Put all four in tomlctl/src/plan/request.rs; dispatch.rs gains one arm; plan/mod.rs one `mod request;`. Doc comments on the clap variants are the verbs' help text."""
acceptance = ""
agent = ""
commit = ""

