[[items]]
id = 16
ref = "write-the-orchestrators-side-of-worker-requests"
title = "Write the orchestrator's side of worker requests"
effort = "L"
status = "pending"
checkpoint = "B"
phase = ""
phase_depth = 0
heading_depth = 3
files = [
    "claude/skills/implement-v2-engine/references/requests.md",
    "claude/skills/implement-v2-engine/references/run-milestone.md",
    "claude/skills/implement-v2-engine/SKILL.md",
]
needs = [
    4,
    15,
]
coupling = []
deps_note = ""
action = "Write references/requests.md: how the orchestrator answers a REQUEST message during a live run, how the drain applies grants, and re-entry with grants outstanding; route REQUEST messages from run-milestone.md and link the reference from SKILL.md."
detail = '''
requests.md, modelled on questions.md's layout:
1. What a worker sends: one `plan request add`, then a SendMessage to main whose first line is `REQUEST <request-id> task <n>` (that literal). Only the first line is read; the record is the content.
2. Answer during the live run: read the record with `tomlctl plan request list --slug <slug> --where id=<request-id>`; check it belongs to the running milestone and the open run. Answer every pending REQUEST before opening any question picker (D10). For each open path item, grant when its `why` shows the task needs the file and the brief's Non-goals and the row's constraints do not rule it out; deny otherwise. For each change item, read the code its evidence cites first; grant within D11's limits (accept dropped or loosened only with cited code showing it wrong and its behaviour still holding; a means, constraint, detail, or a file the spec names with its file note); rule needs-user when granting would change the outcome, a success criterion or a decision. A `files` change that renames or adds a file is granted only together with a path item for its new path in the same request; deny a `files` change whose new path is not granted as a path item. Never rule on a question record. Stage rows in <scratch> and run `tomlctl plan request rule <request-id> --slug <slug> --ndjson <path>`; a refusal naming a holder means deny that item. End the turn; the worker polls.
3. The drain's Granted requests step (called from drain.md after step 5): first audit the run's worker transcripts with `tomlctl agents audit --transcripts <dir> --pattern 'plan\s+request\s+(rule|applied)'`, using the transcript directory drain step 3 already audits; every request a worker ruled or marked applied itself is treated as denied, never applied, and listed under audit: as a breach. A run with no kept transcript directory applies only items ruled by tomlctl, and says so in the report. Then list ruled, unapplied requests of the run; for each, build one audited `tasks update --ndjson` row per task (one row per task even with several requests, update.rs:232) with reason `granted <scope|amend> <request-id>: <why>`: granted paths appended to `files`, re-issued whole; granted changes applied to the spec fields they name, re-issuing each list whole after `tasks show <n> --with spec`; a renamed file moves in `files` and `file_notes`. A pending holder in a later milestone gains the granted row in its needs; a done holder of this milestone is needed by the granted row. Then `tomlctl plan request applied <ids> --slug <slug>`. For drain.md's relaunch-or-stop rule, a grant write on a done row is not a moved field; one on a failed or parked row is, so that row is relaunched once on its widened files or amended spec.
4. Report: each ruled item becomes a `request` report entry with needs_person false.
5. Re-entry: ruled, unapplied requests left by an ended session are applied by step 3 before the pick.
run-milestone.md: beside the QUESTION routing paragraph (near :252), route a first line opening `REQUEST ` to requests.md; add a clean-tree exemption bullet in the pre-flight (near :32) for paths of granted, unapplied requests.
SKILL.md: name requests.md (a) in the role rule bullet that says every user question comes from this conversation, adding that a worker's request is ruled by the orchestrator under requests.md and never put to the user unless ruled needs-user; (b) in the Reference column of the drain-and-replan row of the step table, for the Granted requests step; (c) in the Re-entry section beside the parked-rows paragraph, for ruled, unapplied requests; and (d) in the references list.'''
acceptance = ""
agent = ""
commit = ""

