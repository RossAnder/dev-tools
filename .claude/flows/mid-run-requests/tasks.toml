[[specs]]
ref = "load-the-projects-generated-file-map-from-claudegeneratedtoml"
outcome = "tomlctl can read a project's .claude/generated.toml and say which declared generators a set of task files touches and which outputs those generators produce."
constraints = [
    "A missing file loads as no generators; it is never an error.",
    "Every [[generators]] table needs id, inputs, outputs, regenerate and check; a missing or blank key, a duplicate id, an unknown key, or an output containing a glob character (*, ?, [, {) is an Err naming the generator id and the key.",
    "Input globs are compiled as ui_capture.rs compiles them: leading ./ trimmed, GlobBuilder literal_separator(true).",
    "Touch no file outside this task's files.",
]
means = []
design = ["design/direction.md#milestone-a"]
precedent = ["tomlctl/src/ui_capture.rs"]
executor = "lite"

[[specs.accept]]
behaviour = "the generated module exists and is declared in lib.rs"
check = "grep -q '^mod generated;' tomlctl/src/lib.rs && grep -q 'pub(crate) fn outputs_of' tomlctl/src/generated.rs"
kind = "forward"
positive = ""
writes_build = false

[specs.accept.probe]
at = "51fd3b2b88fa092fea7bfc510421e2a6c78f72b7"
neg_rc = 1
verdict = "healthy"

[[specs.accept]]
behaviour = "a declared generator's outputs are returned for a file matching its inputs, a missing config is empty, and a malformed config (missing key, duplicate id, glob output, unknown key) is refused with the generator id named"
check = "cargo nextest run --manifest-path tomlctl/Cargo.toml -E 'test(/generated::tests::/)'"
kind = "forward"
positive = ""
writes_build = true
run_by = "covered"
covered_by = "CARGO_INCREMENTAL=0 cargo nextest run --manifest-path tomlctl/Cargo.toml --no-fail-fast"

[[specs.accept]]
behaviour = "the generated module carries unit tests for the listed cases"
check = '''test "$(grep -c '#\[test\]' tomlctl/src/generated.rs)" -ge 3'''
kind = "forward"
positive = ""
writes_build = false

[specs.accept.probe]
at = "51fd3b2b88fa092fea7bfc510421e2a6c78f72b7"
neg_rc = 2
verdict = "healthy"

[[specs.premises]]
claim = "ui_capture.rs holds the loader pattern this module copies"
check = "grep -q 'pub(crate) fn load_paths' tomlctl/src/ui_capture.rs"
at = "base"

[specs.premises.probe]
at = "51fd3b2b88fa092fea7bfc510421e2a6c78f72b7"
neg_rc = 0
verdict = "holds"

