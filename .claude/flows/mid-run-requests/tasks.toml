action = "Add a holders module with the folded path key, the forbidden-path test and the concurrent-holder test the request verbs and the case-collision check share."
detail = """
pub(crate) items, unit-tested in the module:
- fn fold_key(path: &str) -> String: crate::tasks::schema::normal_path, then to_lowercase. It is stricter than the milestone Workflow's fileKey (claude/workflows/implement-v2-milestone.js:157), which keeps a leading ./.
- fn forbidden(slug: &str, path: &str) -> Option<String>: a reason when the path is absolute, has a `..` segment, or sits under `.claude/` or `docs/flows/<slug>/` (folded comparison).
- struct Holder { task: u32, status: String, grant: Option<String> } and fn holder(tasks: &Store, plan: &PlanStore, requester: u32, path: &str) -> Result<Option<Holder>>.
Holder rule (decision D6): consider every row of the requester's checkpoint other than the requester whose status is pending, in-progress, failed or parked and which is outside the requester's needs closure up and down (Graph::build over crate::tasks nodes, closure_up and closure_down, as tasks/closure.rs builds it). Such a row holds the path when one of its files has the same fold_key, or when an unapplied request for that row has a path item ruled granted with the same fold_key (grant = Some(request id)). Return the lowest-id holder. Declare `mod holders;` in plan/mod.rs."""
