[[items]]
id = 1
ref = "load-the-projects-generated-file-map-from-claudegeneratedtoml"
title = "Load the project's generated-file map from .claude/generated.toml"
effort = "M"
status = "pending"
checkpoint = "A"
phase = ""
phase_depth = 0
heading_depth = 3
files = [
    "tomlctl/src/generated.rs",
    "tomlctl/src/lib.rs",
]
needs = []
coupling = []
deps_note = ""
action = "Add a crate-level generated module, built like ui_capture.rs, that loads the [[generators]] tables and answers which generators a set of files touches and which outputs they declare."
detail = """
Model the module on tomlctl/src/ui_capture.rs (CONFIG const, NotFound reads as empty, Err(String) names the problem on one line). Public surface, all pub(crate):
- const CONFIG: &str = ".claude/generated.toml";
- struct Generator { id: String, inputs: GlobSet plus the raw input strings, outputs: Vec<String>, regenerate: String, check: String }
- fn load(root: &Path) -> Result<Vec<Generator>, String>
- fn touched<'a>(generators: &'a [Generator], files: &[String]) -> Vec<&'a Generator>: the generators with an input glob matching any file, the file taken through crate::tasks::schema::normal_path.
- fn outputs_of(generators: &[Generator], files: &[String]) -> BTreeSet<String>: the outputs of every touched generator, each through normal_path.
Build every input glob with GlobBuilder case_insensitive(true) as well as literal_separator(true), so `src/Tokens.css` matches an input written `src/tokens.css`: every other path comparison in this change folds case, and a case-sensitive input match would miss a generator on Windows and macOS. Callers compare an output against a requested path with the folded key, not here.
Add `mod generated;` beside `mod ui_capture;` in lib.rs. Unit tests live in the module, one #[test] per case: a matching input returns its outputs, a case-variant input still matches, a missing config is empty, and each malformed config (missing key, duplicate id, glob output, unknown key) is refused naming the generator id."""
acceptance = ""
agent = ""
commit = ""

[[items]]
id = 2
ref = "add-the-request-record-and-the-request-report-kind-to-the-plan-store"
title = "Add the request record and the request report kind to the plan store"
effort = "M"
status = "pending"
checkpoint = "A"
phase = ""
phase_depth = 0
heading_depth = 3
files = [
    "tomlctl/src/plan/schema.rs",
    "tomlctl/src/plan/schema_request.rs",
    "tomlctl/src/plan/mod.rs",
]
needs = []
coupling = []
deps_note = ""
action = "Add a [[request]] array to PlanStore, minted under prefix Q, stamped at schema_version 5, plus ReportKind `request`."
detail = """
Put the Request types, their from/to TOML functions and the id minting in a new tomlctl/src/plan/schema_request.rs (declared `pub(crate) mod schema_request;` in plan/mod.rs). schema.rs gains the PlanStore `requests` field, the calls in from_toml/to_toml (TOML key "request", after "report"), the write_version tier and ReportKind::Request => "request". It may also widen the visibility of exactly what schema_request.rs uses: make the vocabulary! macro usable from the sibling module (#[macro_export] is not wanted; declare it with `macro_rules!` before `pub(super) use vocabulary;` or move the use behind `pub(crate) use`), and make the record read and write helpers it calls (the `records`/`insert_records` pair, the string, bool and datetime readers) pub(super). Also bring the module doc (its record list and the sentence naming which content stamps which version) and the version consts' doc comments in line with the new tier; change nothing else in schema.rs.
Minting: do NOT add a RecordKind variant; RecordKind is matched exhaustively in plan/records.rs and plan/target.rs, which this task does not hold. Add `impl PlanStore { pub(crate) fn mint_request_id(&mut self) -> String }` in schema_request.rs, following mint_id's rule (the highest Q<n> among stored requests and id_high_water["Q"], plus one, recording the new mark in id_high_water under "Q").
Record shape (TOML keys in this order):
  id, run_id, milestone, task (u32), at (datetime), status ("open" | "ruled"), ruled_at (datetime, omitted while open), applied (bool, false until the drain applies it),
  [[request.paths]] path, why, ruling, by, reason
  [[request.changes]] field, what, evidence, ruling, by, reason
`ruling` is a vocabulary: "open", "granted", "denied", "needs-user". `by` is "", "tomlctl" or "orchestrator". `field` is a vocabulary: "accept", "means", "constraints", "detail", "files". Use the vocabulary! macro.
Version: SCHEMA_VERSION stays the name of the newest tier and becomes 5; the decision-class tier keeps 4 under a new name such as CLASS_SCHEMA_VERSION. write_version returns SCHEMA_VERSION when requests is non-empty, otherwise today's rule with the renamed const. Keep the const asserts ordering the tiers. store.rs's tests use SCHEMA_VERSION + 1 as "newer than newest" and need no change.
Update the existing schema.rs tests that pin the class tier to the renamed const, and add round-trip and minting tests for a request with both item kinds, each test fn named with `request` in it."""
acceptance = ""
agent = ""
commit = ""

