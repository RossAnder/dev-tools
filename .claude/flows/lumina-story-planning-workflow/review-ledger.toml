summary = "version: 0.1.0 pinning behavior counter-intuitive; README should note bump policy"
description = "Per plugins-reference §Metadata fields: 'Setting this pins the plugin to that version string, so users only receive updates when you bump it. If omitted, Claude Code falls back to the git commit SHA, so every commit is treated as a new version.' At 0.1.0 the plugin is pinned. For a locally-checked-in plugin loaded via --plugin-dir or plugin install --scope project this is benign. However if ever published to a marketplace, operators on the initial version won't receive updates until the version field is bumped. README should document this. Fix: no change required for current local-plugin use case. Add a note to README under Load mechanism: 'version in plugin.json controls update delivery — bump it when making breaking changes to skill bodies.'"
dedup_id = "r0061a9d3c1e1ac09"
resolved = 2026-05-26
resolution = "Added README Note (after Load mechanism, before Skill list) documenting that plugin.json version controls update delivery and bumping policy for breaking changes to skill bodies or convention contracts"

