summary = "Expanded /api write surface inherits the existing no-auth posture — operators setting HOST=0.0.0.0 expose all destructive ops to the LAN"
status = "merged"
description = """
Verified at lumina/src/app.rs:72-78 (verbatim): 'The JSON /api/* surface has no auth and no Host-header check (the MCP /mcp surface is separately protected by rmcp 1.7's allowed_hosts default — {localhost, 127.0.0.1, ::1} per GHSA-89vp-x53w-74fx — but that protection does NOT extend to /api/*). Set HOST=0.0.0.0 to opt in to LAN exposure of the REST surface.' Pre-plan, the SPA was ~1 inline form. Post-plan, ~18 modal forms write to the DB via unauthenticated POST/PATCH/DELETE. Two-step confirm mitigates accidental clicks, not remote actors. The default loopback bind keeps this safe; the risk is operator-flipped HOST.
"""
anchor_old = "- **Optimistic-update gap** — every mutation refetches the full detail. For frequent actions (check/uncheck AC), this is 1 round-trip per click. Acceptable for v1; optimistic updates are a future optimisation."
anchor_new = """- **Optimistic-update gap** — every mutation refetches the full detail. For frequent actions (check/uncheck AC), this is 1 round-trip per click. Acceptable for v1; optimistic updates are a future optimisation.
- **No-auth posture on /api/*** — the SPA's write surface grows ~18× post-plan (from 1 inline form to ~18 modal forms). The /api/* surface has no auth and no Host-header check (per lumina/src/app.rs:72-78). The default loopback bind keeps this safe; operators who set `HOST=0.0.0.0` for LAN access expose all destructive ops (delete work item, supersede risk, resolve open question with cascade) to unauthenticated LAN peers. This is a pre-existing backend concern out of scope for this plan, but the surface-area growth is worth flagging."""

