"""
anchor_old = "**Composables already cover every write** — `useAcceptanceCriteria`, `useResearchNotes`, `useRisks`, `useRejectedAlternatives`, `useRepoLinks`, `useOpenQuestions`, `useFindings`, `useTaskDependencies`, `useStoryPlan`, `useTaskSpec`, `useActivity`, `useContextBlocks`, `useScalars` all expose CRUD methods returning `Result<T, string>`."
anchor_new = "**Composables already cover every write** — but the names diverge from the obvious .add/.update/.remove pattern in several places. Verified signatures: `useAcceptanceCriteria.{add,check,uncheck,remove}`, `useResearchNotes.{add,update,supersede}`, `useRisks.{add,update,supersede,remove}`, `useRejectedAlternatives.{add,update,supersede,remove}`, `useRepoLinks.{add,remove,setPrimary}`, `useOpenQuestions.{add,addOption,blockTaskOnQuestion,setEnablingOption,resolve}`, `useFindings.{add,update,resolve,supersede}`, **`useTaskDependencies.{addEdge,removeEdge}` (NOT .add/.remove)**, `useStoryPlan.set`, `useTaskSpec.set`, **`useActivity.record` (NOT .append)**, `useContextBlocks.{create,link,unlink}`, `useScalars.{setRelevance,setEffort,setComplexity,setClosureGate,setTaskKind,setTier}`. **`useHierarchy` exposes only `createNode` + `changeStatus` + `refresh` — see P2 for the update/remove gap.** All return `Result<T, string>`. Note that `useHierarchy().refresh(id)` is a no-op unless `id === focusId.value` (useHierarchy.ts:189-196), so callers must pass the affected work-item id explicitly."

