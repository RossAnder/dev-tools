summary = "Severity vocab: keep existing Severity (review-finding categorisation) and RiskSeverity (risk severity) as DISTINCT enums; closure-gate severity-blocking applies to RISKS not findings"
task_ref = "phase-1-prep"
original_intent = "Plan T2 says: Add Severity::{Low, Medium, High, Critical} enum; tighten Finding.severity to typed Severity. T5(h) says closure-gate blocks on open FINDING with severity=high."
rationale = "User clarified: Severity::{Critical, Major, Minor, Suggestion} (existing domain.rs:471) is for review-finding categorisation; RiskSeverity::{Low, Medium, High, Critical} (existing domain.rs:650) is for risk severity. These are two distinct vocabularies, not one. AddFindingParams.severity is already typed (Option<Severity>) at mcp.rs:451. Closure-gate severity-blocking therefore applies to RISKS (the DB-CHECK-enforced low|medium|high|critical column on the parent story) — not findings. T2 reduces to: add Tier+Phase enums only (no new/changed Severity). T13 §k.2 documents both existing enums. T5(h) tests closure-gate blocking on a story with an open RISK at severity=high."
dedup_id = "906308d4d4a4e0fa"

