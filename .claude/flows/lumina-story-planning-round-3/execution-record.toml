original_intent = "T3 plan-detail line 235: add set_finding_tier_hint(tx, id, hint: Option<Tier>) (optional, attributes JSON merge)"
rationale = "No findings.attributes column exists; migration 0006 adds work_items.tier only. The work_items.attributes schema validator (validate_attributes_for_kind, repo.rs:108-197) does not admit a tier_hint key on any kind. The plan-detail itself flags this tool as (optional, attributes JSON merge), so the schema gap is plausibly intentional. Extending the schema to support per-finding tier hints would require either a new findings.attributes column (additional migration) or a new attributes-allow-list entry — neither in T3 scope. Deferred to round-4 follow-up if needed. T11 (set-task-spec) does NOT depend on set_finding_tier_hint; T4 will skip the corresponding MCP wrapper. compute_tier + get_task_dispatch_plan + set_task_tier (the load-bearing trio for tier dispatch) shipped clean. Separately, get_task_dispatch_plan.has_cross_repo is hardcoded false with a TODO — the brief s IMPORTANT note in Step C sanctioned this when primary_repo_id_for_project / repo_link_id_for_slug helpers do not exist (they don t). The other three Deep-triggering branches of compute_tier (complexity=high / effort=L / files>3) still fire correctly."
