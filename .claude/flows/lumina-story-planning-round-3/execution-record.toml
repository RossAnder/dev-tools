original_intent = "T3 Key design decisions §3: the closure-gates hard mode is extended to block on open critical/high findings/risks. T5(h): closure-gate hard mode blocks task -> done when an open finding has severity=high."
rationale = "T3 brief did not specify the closure-gate extension and the agent did not add it. Adding it now would require: (a) finding the closure-gate evaluation point in repo (likely transition_status), (b) wiring an open-risks query (post-E2 the gate should consider RISKS not findings since RiskSeverity has the high/critical vocab while finding-Severity has critical/major/minor/suggestion), (c) handling the closure_gate column being None vs hard semantics. This is a discrete next-pass best done in its own task. compute_tier + dispatch-plan + set_task_tier (the load-bearing scaffold for round-3) shipped clean and are independently useful. The closure-gate extension is deferred to a round-4 follow-up. T5 ships tests (d)(e)(f)(g) only; T5(h) is dropped with this deviation noted."
