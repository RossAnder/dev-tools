symbol = "connect_in_memory"
category = "test-isolation"
severity = "suggestion"
summary = '`connect_in_memory` calls `init("sqlite::memory:")` with no `max_connections(1)`; pool may open separate DBs per connection (R19 hazard).'
description = """SQLite in-memory databases are connection-scoped: each connection to `sqlite::memory:` opens a SEPARATE database. SqlitePool's default may spawn multiple connections lazily. Tests work today only because each creates an Arc<connect_in_memory()> and writes sequentially. A future `tokio::test(flavor="multi_thread")` or parallel-query path inside `export_pending` would silently corrupt. Fix: `SqliteConnectOptions::max_connections(1)` or `sqlite:file::memory:?cache=shared&mode=memory`."""
