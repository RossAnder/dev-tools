summary = "Flow resolution should present freshest-flow options when multiple flows are fresh"
description = "Flow detection has been painful with multiple active flows. Two concrete problems seen this run: (1) a bare arg that is itself a flow slug (harness-progressive-disclosure) was fed only as --path-arg, so bootstrap resolved via active-latest and silently picked the WRONG flow (precious-frolicking-steele); the orchestrator had to re-resolve manually with --flow-override. (2) active-latest auto-picks the most-recently-used flow with no user visibility. User preference (standing): when more than one flow is fresh (within the staleness threshold), the resolver MUST present the freshest candidates as options for the user to choose, rather than silently auto-picking one. Also: if a path token exactly matches a registered flow slug, treat it as --flow-override. This likely belongs in tomlctl flow resolve / flow-bootstrap (ties_broken / tie_candidates already exist in the envelope) and the carrier Step-0 prose."
flow = "harness-progressive-disclosure"
dedup_id = "2755b2294368e34d"
resolved = 2026-05-20
resolution = "review.md Step 1 routes an arg matching a registered flow slug to --flow-override; flow-bootstrap.md step 3 surfaces tie_candidates/ties_broken when >1 fresh flow and no override. tomlctl resolve-algorithm chooser deferred to propagation follow-up (tracked in R23 checklist)."

