type = "deviation"
date = 2026-09-29
agent = "optimise-apply"
id = "E100"
summary = "Poller sends Event::Flows / Event::FlowMtimes and lists flows on its own thread; the capabilities probe runs after the first failed fetch"
task_ref = "poll-the-flow-files-and-fetch-snapshots"
original_intent = "Poller sends a data-less FlowsChanged as the only trigger for flows::list, and runs capabilities once on start"
rationale = "FlowsChanged made the UI thread spawn tomlctl flow list (0.4-0.65 s freeze) on every tasks.toml write; the poller now relists only on a flow-set or context.toml change and otherwise sends mtimes. The eager probe cost a spawn before every first snapshot, and a successful fetch already proves the capability, so it runs only on failure and its message still wins"
dedup_id = "3e36426c100478e3"

[[items]]
type = "deviation"
date = 2026-09-29
agent = "optimise-apply"
id = "E101"
summary = "pane::ensure looks up an existing pane unlocked; the split path takes an OS File::try_lock and re-lists before splitting"
task_ref = "ensure-one-glimpse-pane-per-tab"
original_intent = "Take an exclusive File::create_new lock first (lock older than 10 s removed, wait 3 s), then look up the pane"
rationale = "Every SubagentStart serialised a read-only herdr pane list behind the global lock, so bursts hit the 3 s wait; and the stale takeover let a slow holder's Drop delete its successor's lock. Double-checked locking keeps the one-split guarantee, and an OS lock is released only by its holder or by the OS when the holder dies"
dedup_id = "d4fd47f0ab7a1fce"
