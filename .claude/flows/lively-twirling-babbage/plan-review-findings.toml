plan_section = "36. Ensure one glimpse pane per tab [M]"
summary = "herdr `pane run` types the line into the pane's pwsh shell; a leading quoted exe path is a pwsh parse error, so glimpse never starts"
description = """herdr pane_run (herdr/src/cli/pane.rs pane_run) sends args.join(' ') + Enter via PaneSendInput into the pane's default shell, which is pwsh here (%APPDATA%/herdr/config.toml default_shell). In PowerShell `"C:/.../glimpse.exe" --slug x` is a string expression followed by an unexpected token. Build the line in a pure tested launch_line(exe, slug): bare path when it has no whitespace, else `& '<exe>' --slug <slug>`. Raised by Agents 1 and 4."""
anchor_old = 'then `run` `"<current_exe>" --slug <slug>`.'
anchor_new = "then `run` the line built by a pure `launch_line(current_exe, slug)`. `herdr pane run` types the text plus Enter into the pane's default shell (pwsh on this machine), where a line opening on a quoted string is a parse error, so `launch_line` emits the bare path when it has no whitespace, else `& '<exe>' --slug <slug>`."
dedup_id = "30915b671dcea195"

