plan_section = "38. Install hooks and the herdr keybinding [M]"
summary = "Shell-form hook runs through Git Bash on Windows: one bash.exe per event in every session (MSYS stampede); use exec form"
description = "hooks.md 'Exec form and shell form': shell form (no `args`) runs via Git Bash on Windows; exec form (`args` set) spawns the exe directly with no shell. The hooks are user-level, so every SubagentStart/Stop/TeammateIdle in every repo spawns bash.exe; an /implement frontier of 8 starts ~8 concurrently, the documented trigger for this machine's MSYS poisoning. Exec form also removes the 'Git Bash strips backslashes' workaround. Idempotence check must recognise exec-form entries."
anchor_old = 'append a matcher-less group `{"hooks":[{"type":"command","command":"<exe> hook","async":true}]}`, unless a command containing `glimpse` and ` hook` already exists. `exe` is `current_exe()` with forward slashes, since Git Bash strips backslashes.'
anchor_new = 'append a matcher-less group `{"hooks":[{"type":"command","command":"<exe>","args":["hook"],"async":true}]}` — exec form, so no shell and no Git Bash process per event — unless a hook whose `command` contains `glimpse` and whose `args` (or `command`) contains `hook` already exists. `exe` is `current_exe()`.'
dedup_id = "2b21ef216eff66ce"

