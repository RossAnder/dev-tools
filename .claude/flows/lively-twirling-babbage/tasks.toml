title = "Correlate subagents with flow tasks from Claude Code's on-disk state"
effort = "M"
status = "done"
checkpoint = "A"
phase = "Phase A — tomlctl data layer (tomlctl/)"
phase_depth = 3
heading_depth = 3
files = [
    "tomlctl/src/agents/correlate.rs",
    "tomlctl/src/agents/mod.rs",
