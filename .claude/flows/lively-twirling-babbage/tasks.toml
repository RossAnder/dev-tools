ref = "poll-the-flow-files-and-fetch-snapshots"
title = "Poll the flow files and fetch snapshots"
effort = "M"
status = "done"
checkpoint = "B"
phase = "Phase B — glimpse core (glimpse/)"
phase_depth = 3
heading_depth = 3
files = ["glimpse/src/source.rs"]
