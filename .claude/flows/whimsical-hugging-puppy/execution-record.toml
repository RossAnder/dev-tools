[[items]]
id = "E26"
type = "deviation"
date = 2026-09-07
agent = "implement"
task_ref = "implement-the-tasks-parser"
summary = "The plans task-heading regex is wrong on em-dash titles and was replaced with a two-stage split"
original_intent = "Plan Approach and task 15 Detail both specify a single heading regex whose title group is lazy and whose optional trailing branch matches an em dash followed by anything"
rationale = "Em dashes in task titles are the corpus norm: of 375 numbered headings across 28 in-repo plans, dozens read like Repo part 1 - columns, acceptance criteria [L]. Under leftmost-first semantics the lazy title group stops at the dash, the effort group cannot match, and the trailing branch swallows the rest INCLUDING the bracket tag. Because derive_ref hashes the title into the stores primary key, every em-dash task would import under a truncated ref and render would rewrite its heading, breaking task_ref continuity for /implement. It also defeats the plans own M-leaning-L error requirement. Replaced with id-plus-rest, then locating the LAST bracket tag in rest: 364 of 375 headings carry exactly one bracket group and none carry two, so last-wins is unambiguous."
dedup_id = "ccc4f470f192a143"

[[items]]
id = "E27"
type = "deviation"
date = 2026-09-07
agent = "implement"
task_ref = "implement-the-tasks-parser"
summary = "Research note R9 is false: regex shorthand classes are accepted under cargo test, so the plans every_pattern_compiles falsifier is inert"
original_intent = "Plan Approach and research note R9 state that with unicode features off the shorthand classes are compile errors, and that placing one in any pattern makes every_pattern_compiles red"
rationale = "Verified by cargo tree -e features -i regex with and without no-dev: predicates, a dev-dependency via assert_cmd, pulls regex with its default feature, unifying unicode back on for every dev-dependency-needing target. Two consequences the plan misses: Regex::new is a RUNTIME api so a shorthand class is never a compile error in either configuration, and under cargo test and cargo clippy --all-targets unicode is ON so the shorthand is simply accepted. Measured directly: with a shorthand in the heading pattern and the plans prescribed test body, all 15 tests passed. every_pattern_compiles now also scans each patterns as_str() for the eight shorthands, restoring the intended guarantee. Task 16 landed the inert shape and needs the same repair; task 26 inherits the stale premise."
dedup_id = "dc0148ebfd4bcd0c"

