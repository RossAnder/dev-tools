plan_section = "### 14. Implement the markdown section scanner [S]"
summary = 'Every plan file is CRLF on disk (core.autocrlf=true, 68/68 in docs/plans); nothing in the scanner, parsers, renderer or drift check handles `\r`'
description = '''Measured: all 68 docs/plans/*.md carry CRLF including the plan under review; root .gitattributes does not pin docs/plans. Consequences: task 15's $-anchored regexes capture a trailing \r into titles/effort/Files (corrupting ref); task 14 preserves outside bytes and LF-normalises the replacement → mixed endings; check_render_drift byte-compares LF output against CRLF source → permanent drift, so task 32's `render --check` gate never passes; task 26 hits it on the whole corpus. Fix: sections() strips a trailing \r per line before matching; parsers see LF-only input; render_into_plan detects the source's dominant ending and re-applies it to replaced sections; drift check compares after normalisation; unit-test one CRLF and one LF input through parse → render → drift.'''
dedup_id = "c1b772f5c80fdb5a"

