flow = "whimsical-hugging-puppy"
id = "R16"
file = "tomlctl/src/tasks/update.rs"
line = 36
symbol = "IMPORTED"
severity = "warning"
effort = "small"
category = "quality"
summary = "--set coupling= is refused with a wrong reason, leaving coupling unremovable through the CLI"
description = "IMPORTED groups coupling with files and needs, and settable (update.rs:157) refuses it with '`coupling` is owned by `tasks import-plan`, not `--set`'. import-plan never sets coupling: merge_row (import_plan.rs:362) only reads it back off the existing row and narrows needs by it -- the sole writer is tasks add --coupling and the add-many row field. So a coupling edge added by hand can never be corrected or cleared through any verb; the only route is a hand-edit of the tool-owned store, which also staleness-breaks its .sha256. Either drop coupling from IMPORTED and let --set clear it, or give the message the true owner and a documented removal path."
dedup_id = "b5b76b5a15cfd9e4"
resolved = 2026-09-08
resolution = "coupling moved from IMPORTED to SETTABLE with a store-wide graph gate: --set coupling= clears it and a non-empty value rewrites it, with a dangling target or a cycle refused before the row moves - the same guard tasks add runs. The old refusal named the wrong owner: import-plan never writes the field, it only reads it back to narrow needs."

