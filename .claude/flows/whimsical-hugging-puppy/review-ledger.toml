file = "tomlctl/src/tasks/parse_tasks.rs"
line = 45
symbol = "parse_tasks"
severity = "warning"
effort = "small"
category = "quality"
summary = "parse_tasks is not fence-aware, unlike the scanner feeding it, so a # line inside a code block truncates a task"
description = "markdown::sections (markdown.rs:24-57) tracks backtick and tilde fences precisely so a '## ' inside a code block is not a heading. parse_tasks then treats any line starting with # as a heading: it closes the open field, flushes current, and calls open_heading, which returns Ok(None) for a non-numbered line. A fenced acceptance block at column 0 inside ## Tasks containing '#!/usr/bin/env bash' or '# builds clean' therefore ends the task there -- every field line after it is dropped by the 'if open.is_none() { continue }' guard, and no finding class reports the loss. Two scanners over the same bytes disagree on what a heading is. Thread the fence state sections already computes, or require heading_re / malformed_id_re to match before treating a # line as a boundary."
related = ["R2"]
dedup_id = "c8ccfcfe34a78c99"
resolved = 2026-09-08
resolution = "Extracted the fence tracker markdown::sections already computed as markdown::FenceState and threaded it through parse_tasks, so a hash-prefixed line inside a fenced block no longer closes the open task and drops every field after it. The two scanners now share one fence implementation rather than disagreeing about what a heading is."

[[items]]
first_flagged = 2026-09-08
