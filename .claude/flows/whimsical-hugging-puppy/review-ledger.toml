symbol = "resolve_plan_path"
severity = "suggestion"
effort = "trivial"
category = "security"
summary = "import-plan --plan <absolute> records an absolute plan_path that every later render and check refuses"
description = "--plan is deliberately exempt from containment ('a caller argument rather than file-controlled input'), but the value survives into store.plan_path via relativise, which returns the path unchanged when it cannot strip the root prefix. The store is then written with an absolute plan_path, and dispatch::contained -- which does apply -- refuses it forever. Verified: importing with an absolute --plan wrote an absolute plan_path, after which tasks render --file .. --stdout failed with 'must be repo-relative and stay under the repo root'; re-importing with a relative --plan fixed it. The write-side and read-side policies disagree, so a single mistyped invocation wedges the store's render path with no diagnostic at import time. Fix: refuse, or relativise-or-refuse, at import when the resolved plan is not under the root."
related = ["R17"]
dedup_id = "9eeda2bb47bc2f17"
resolved = 2026-09-08
resolution = "The import now canonicalises the resolved --plan, relativises it against the root, and puts the result through the read side's own containment validator, so an out-of-root or non-.md plan is refused at import with a validation envelope and no bytes written, instead of being recorded and then refusing every later render. Canonicalising first is what keeps an absolute in-root --plan working on Windows, where the repo root carries a long-path prefix a user-typed path would never strip. The write side and the read side can no longer disagree about what a valid recorded path is, because they now run the same validator."

