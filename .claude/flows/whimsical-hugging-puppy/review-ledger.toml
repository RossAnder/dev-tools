id = "R33"
file = "tomlctl/src/tasks/dispatch.rs"
line = 344
symbol = "under_root"
severity = "suggestion"
effort = "trivial"
category = "security"
summary = "a Windows drive-relative plan_path passes containment while discarding the repo-root anchor"
description = """PathBuf::from("C:pre.md") is not is_absolute() on Windows and holds no ParentDir, so both lexical guards pass; root.join() then replaces the root entirely because the candidate carries a Prefix component. under_root still returns true, because canonicalising the missing leaf walks up to the bare drive C:, which canonicalises to the drive's current directory. Verified: with plan_path = "C:pre.md" the guard accepted it and the error was 'reading plan `C:pre.md`' (unanchored) versus a fully-anchored path for the plain relative form. The escape is narrow today (a same-drive per-drive cwd usually still sits under the root, and D:.. is refused), but the check certifies a path it never resolved, and under_root returning true for a bare drive root is the general hazard. The same shape exists in the import_plan.rs and render_progress_log.rs copies. Fix: reject any candidate whose components are not all Component::Normal."""
related = ["R1"]
dedup_id = "0e9acce5aaef31ed"
resolved = 2026-09-10
resolution = "Replaced the is_absolute plus ParentDir lexical pair with an all-components-Normal scan (CurDir tolerated, so a dot-prefixed relative path still passes) and consolidated it as io::recorded_under_root. All three containment guards route through it while each keeps its own failure handling. Regression test verified against the pre-fix predicate as a falsifier."

[[items]]
first_flagged = 2026-09-08
rounds = 1
status = "fixed"
flow = "whimsical-hugging-puppy"
id = "R34"
file = "tomlctl/src/tasks/import_plan.rs"
