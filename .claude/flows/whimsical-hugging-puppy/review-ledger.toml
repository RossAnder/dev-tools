resolution = "phase, phase_depth and heading_depth are stored per row and re-emitted by render, both depths clamped to three-through-six as the containment guard. The rendered golden's Tasks section is now line-for-line identical to the source plan. store.checkpoints was evaluated first and disproved as a carrier: its spans disagree with the phase spans on the golden fixture, its rationale text is not the label, and it is derived from dependency closure rather than authored. Applied under an explicit user-authorised cross-file budget after an earlier pass correctly refused it at the default three-file cap."

