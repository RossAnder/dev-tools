resolved = 2026-09-08
resolution = "graph_findings now raises an error-class dag/unbuildable finding when the graph engine refuses for a reason the row scans did not already name, instead of swallowing the error into an empty Vec. import_plan's refuse_on_errors sees it, so an over-cap store no longer persists green. Pinned at the 256/257 boundary by a new integration test driven through real stores."

