summary = "tasks render overwrites any existing file under the repo root, not just a plan document"
description = """contained() only checks that the store's or context's plan_path stays under the repo root; nothing requires it to be a markdown plan. render then atomic_writes render_into_plan output over that file, preserving its existing bytes and appending the rendered sections. Verified: with plan_path = ".githooks/pre-commit", tomlctl tasks render --file .. returned {"ok":true,"path":".githooks/pre-commit"} and the hook on disk kept its shebang and gained the three rendered sections. Since this repo sets core.hooksPath .githooks, the next commit executes the result -- and rendered task fields are attacker-influenceable content landing in that script (a '- **Files**: `a.rs`' line is backtick command substitution in sh). Reaching it needs a hostile repo-local context.toml or tasks.toml, i.e. a poisoned branch or PR, which is exactly what the existing plan_path guard already treats as untrusted. Fix: require the target to end in .md, or route through guard_write_path, before the write."""
related = ["R17"]
dedup_id = "6913b65a05859319"
resolved = 2026-09-08
resolution = "The single resolver refuses any recorded plan_path that does not end in .md, closing the path by which a hostile repo-local context.toml or tasks.toml could have render append attacker-influenceable content to an executable file. Verified live that a plan_path of .githooks/pre-commit now exits validation with the hook byte-identical on disk, while a real plan still renders. The finding's alternative suggestion of routing through guard_write_path was rejected on inspection: it confines writes to the repo's .claude directory and would have refused every legitimate render under docs/plans."

[[items]]
