symbol = "RECORD_FILE"
severity = "suggestion"
effort = "small"
category = "completeness"
summary = "--reconcile-record hardcodes the sibling filename and ignores [artifacts].execution_record"
description = "The record path is flow_dir(slug)/execution-record.toml (verified at import_plan.rs:37,629), while every carrier resolves the record as [artifacts].execution_record with that path only as a fallback (implement.md:58), and flow resolve honours a recorded override (resolve.rs:607 plucks it). import-plan resolves plan_path from context.toml but the record path not at all, so a flow whose artifacts point the record elsewhere makes --reconcile-record hard-error (verified: deleting the sibling yields os error 2 and exit 1) rather than reading the recorded location. references/tasks.md:60 says only 'the flow's execution-record.toml', which does not disclose the divergence."
dedup_id = "4e1cc6c007023725"
resolved = 2026-09-08
resolution = "--reconcile-record resolves the record from the flow context's [artifacts].execution_record, falling back to the sibling filename when the key is absent, empty or the context is unreadable - matching how every carrier resolves it. The recorded override is held to root containment, because honouring it turns a previously-hardcoded filename into file-controlled input; without that a context could point the record at any file on disk and a parse error would echo its contents back through the error chain. The reference document already described this resolution order, so the code caught up to the contract rather than the other way round."

