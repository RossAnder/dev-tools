[[items]]
first_flagged = 2026-09-08
rounds = 1
status = "fixed"
flow = "whimsical-hugging-puppy"
id = "R10"
file = "tomlctl/src/tasks/graph.rs"
line = 343
symbol = "Graph::frontier"
severity = "critical"
effort = "small"
category = "architecture"
summary = "a non-pending predecessor empties the frontier with no channel to say why, so a stall is indistinguishable from completion"
description = """A row enters ready only if every predecessor is done, and enters next only if it is pending and every non-done predecessor is in wave; wave holds only pending positions (is_pending, graph.rs:343, compares status == "pending" exactly). A predecessor left in-progress, failed or deferred is therefore in neither bucket, and its whole dependent subtree disappears from ready, held and next alike. Verified: a 2-task store with task 1 in-progress returns {"ready":[],"held":[],"next":[]} while tasks check exits 0 with no error-class finding -- byte-identical to the all-done answer. /implement writes in-progress at dispatch (implement.md:96) before the agent returns, so a crashed run leaves exactly this state, and /implement's rollback path marks a row failed and then continues the frontier. The degradation halt does not fire because check is clean, no check class covers a non-terminal row with pending dependents, and Step 0.5's reconcile import is skipped on a populated store -- so there is no recovery short of a hand tasks update. held exists precisely to explain an exclusion; permanent dependency blocking has no such field. Found independently by three lenses."""
related = ["R35"]
dedup_id = "63bb63bd6c9ffc9c"
resolved = 2026-09-08
resolution = "Frontier gained a blocked bucket naming each stranded row with its blocking predecessor and that predecessor's status, and tasks ready now emits it as a fourth key. A predecessor declared via --in-flight never blocks, so a row genuinely being worked keeps its dependents in next while one left behind by a crashed run strands them. implement.md gained the consumer rule the fix exists for: an exhausted frontier with a non-empty blocked bucket is a stall, not completion."

