resolved = 2026-09-08
resolution = "Added tasks remove <ID> [--force], which hard-deletes the row. It refuses by default for a row past pending or one that other rows depend on, naming each; --force prunes the removed id from every dependent's needs and coupling and splices the removed row's own needs into them, so no dependent can dispatch ahead of work it still waits on. Hard delete rather than a retired status because render_tasks walks every row, so a retired row would keep rendering back into the Tasks section - the resurrection the finding is about."

