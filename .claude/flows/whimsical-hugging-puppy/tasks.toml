[[items]]
id = 4
ref = "build-the-graph-engine"
title = "Build the graph engine"
effort = "L"
status = "done"
checkpoint = "A"
phase = "Milestone A — store, schema, graph engine and the artifact registry (tomlctl core)"
phase_depth = 3
heading_depth = 3
files = ["tomlctl/src/tasks/graph.rs"]
needs = [1]
coupling = []
deps_note = ""
action = "Implement a self-contained `Graph` over `&[Node]` (`id`, `files`, `needs`, `coupling`, `status`, `checkpoint`) with `kahn_rounds()`, `cycle_members()`, `closure_up(id)`, `closure_down(id)`, `frontier(in_flight: &[u32]) -> Frontier{ready, held, next}`, `overlap_pairs()`, and `groups(order: &[String]) -> Vec<Group{id, members, maximal, valid_cut}>`."
detail = "In-degree edges = `needs ∪ coupling`. `closure_up(id)` = the transitive dependencies (ancestors) of `id`, inclusive; `closure_down(id)` = the transitive dependents (successors), inclusive. Deterministic Kahn per R13 (ascending seeds, sorted rounds, ascending successor decrement). Reachability via `Vec<[u64;4]>` bitsets OR-folded in reverse topological order; error `graph exceeds 256 tasks` above the cap (R12). `frontier`: `ready` = pending tasks whose in-degree set is all `done`; `held` = ready tasks sharing a file with an in-flight task (name the file and holder); `next` = pending tasks whose unsatisfied deps are all in `ready ∪ in_flight`. `groups`: for each checkpoint id in order, members = nodes with that `checkpoint`; `valid_cut` = the union of this and earlier groups is downward-closed under `closure_up` (R16); `maximal` = members with no successor inside the group. `overlap_pairs` = file-sharing pairs with no directed path either way. No `pub`; no new dependency."
acceptance = "inline unit tests over a 12-node fixture: rounds are ascending within each layer and the concatenation is a valid topological order; a 3-cycle reports exactly its three members; `closure_down(1)` on the fixture equals the hand-listed set; a group whose earlier prefix omits a dependency reports `valid_cut == false`; a 257-node input errors. Falsifier: flipping the tie-break to descending makes the rounds test red (predicted, unverified — `cargo test --manifest-path tomlctl/Cargo.toml --bin tomlctl tasks::graph`)."
agent = ""
commit = ""

