detail = '''A section runs from its heading to the byte before the next `^## ` (or EOF). Fenced code blocks are tracked so a `## ` inside a fence is not a heading. **Line endings**: `core.autocrlf` is `true` and `docs/plans/` is not pinned in `.gitattributes`, so the whole corpus is CRLF on disk — `sections()` strips one trailing `\r` from every line before matching, so the parsers (tasks 15/16) see LF-only input; `replace_section`/`insert_section_after` re-apply the source's dominant ending to the inserted body so a CRLF plan is not rewritten to mixed endings. Preserve every byte outside the replaced range.'''
acceptance = "inline unit tests: a document with a `## X` inside a fence yields the right count; replacing `## Tasks` leaves the bytes before and after identical (assert by slicing); a CRLF and an LF input both round-trip through `sections` → `replace_section` with their own ending preserved. Falsifier: dropping fence tracking makes the count test red (predicted, unverified)."
