acceptance = 'unit tests with `with_root`: importing a fixture plan twice yields `added: N` then `unchanged: N`; a record with `count-distinct` matched against title-derived `count_distinct` is adopted; a legacy plan whose marker closures leave two tasks uncovered imports them with `checkpoint = ""` and reports two `checkpoint/orphan-task` warnings; renaming one heading in the fixture reports one `removed_refs` and one `added_refs`. Falsifier: making the upsert a truncate-and-rewrite resets a seeded `done` status and the second-import test goes red (predicted, unverified).'
