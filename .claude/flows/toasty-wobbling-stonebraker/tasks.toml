Follow Approach, "Status owner and companions" and "Retired links". Refusal texts and their order stay unchanged: the reopen refusal keeps an ordered slice of the reopenable statuses for its message, because filtering `FindingStatus::ALL` yields enum order. The comment fix: io.rs commits the sidecar before the TOML, so a failed write leaves nothing behind. A retry finds the store unchanged, not its own earlier write. Add the test `reopen_retires_the_v1_link`, which:
