plan_section = "## Verification Commands"
summary = "clippy lint gate needs -D warnings — the wall-to-wall glob re-exports trigger warn-by-default lints that slip past a green build"
description = "The Approach re-exports every submodule with `pub use sib::*;`. That pattern is the trigger for ambiguous_glob_reexports (if two siblings export the same name, e.g. a shared enum_to_str), and a file->dir split routinely fires unused_imports / unreachable_pub from over-broad `use super::*` headers. clippy reports these as WARNINGS; the build stays green and nextest passes, so the Verification goal of `no new warnings` needs -D warnings to actually gate."
anchor_old = "lint:  cargo clippy --manifest-path lumina/Cargo.toml --all-targets"
anchor_new = "lint:  cargo clippy --manifest-path lumina/Cargo.toml --all-targets -- -D warnings"
dedup_id = "291c308b92b7349b"

