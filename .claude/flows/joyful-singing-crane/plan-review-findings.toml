plan_section = "## Risks"
summary = "No per-task commit cadence — a semantically-wrong-but-green mis-split has no clean task-granular revert"
description = "The plan relies on /implement running build+nextest+clippy after each task; that catches a task that BREAKS the build, not one that mis-assigns a pub(crate) helper to the wrong sibling while staying green. With no commit per task, rollback is only the working tree, not git revert <task-commit>. Recommend committing after each green R*/M*/D* task — this also makes the final moves-only git diff --stat review tractable per-task instead of one 40-file blob. (Note: clean-git preference — no harness trailers in those commit messages.)"
