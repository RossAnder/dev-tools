description = "Risk lens. `Bash(tomlctl *)` is pre-approved for subagents, and `status`, `agent` and `commit` writes leave no `[[changes]]` row, so a confused worker can mark a sibling done, stamp a commit or remove a row with no trace. The one-writer-per-row invariant stands in for compare-and-set (User Decisions 7), and nothing enforces it. A before/after snapshot at the drain makes a violation visible. Tasks 14 and 15 carry it."
anchor_old = "Each row therefore has one writer at a time: its worker during a run, the orchestrator between runs."
anchor_new = "Each row therefore has one writer at a time: its worker during a run, the orchestrator between runs. Nothing enforces this, since `Bash(tomlctl *)` approves every verb, so the orchestrator snapshots `tomlctl tasks list --slug <slug>` to scratch before each launch and, at the drain, reports any change other than `status` and `agent` on a dispatched row."
