category = "db"
summary = "A split or files-narrowing replan moves partial edits to rows with an empty `agent`, so the next pre-flight reads the flow's own edits as a stranger's; the note covering this was deleted"
description = """'Started' is recorded per row (`agent` set) but edits are owned per file. `tasks add-many` always mints `agent = ""`, so files a split hands to new rows are held by no started row; if the invocation ends before they run, the next pre-flight stops on them. The drain also never says what happens to the original failed row after a split. This diff removed SKILL.md's 'A pending row with partial edits' paragraph, the only guidance for the case. Fix: in step 6, when a split or narrowing moves a path holding uncommitted edits, set `agent` on the receiving row (or restore the gap note for the split case), and state the fate of the split row. Reported by the architecture and completeness lenses."""
evidence = [
    "tomlctl/src/tasks/add.rs:727",
    "claude/skills/implement-v2-engine/references/run-milestone.md:35",
    "claude/skills/implement-v2-engine/references/drain.md:113",
]
dedup_id = "a778e2a5d5eab176"
resolved = 2026-11-10
resolution = "Uncommitted. drain 'New tasks' gained 'Edits follow their files': a split keeps and re-specs the original row, and a row receiving a dirty path gets the original row's `agent`."

