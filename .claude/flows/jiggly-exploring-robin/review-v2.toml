rationale = "Counter fails. Pre-reshape reader (git show 0f385a84^:tomlctl/src/plan/schema.rs:755) stored a v1 handover's text only in `command`; the current reader (schema.rs:776-778) takes action/when/done_when and nothing maps `command` (grep of tomlctl/src/plan finds no read of it). The module header (schema.rs:14) and plan-store.md:80 drop unknown keys on every re-emit, and the schema_version 1 test (schema.rs:1136) shows v1 is rewritten at 2, not refused. A v1 undone handover thus loses its step on the next write. Minor stands: the only tracked plan.toml is v1 with no [[handover]]."
