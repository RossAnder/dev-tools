file = "claude/workflows/implement-v2-milestone.js"
line = 166
symbol = "toEntry"
summary = "A worker's wrong-root `error` return reaches the index with `error: 'wrote no note'`, not the root mismatch the drain reads to stop the engine"
severity = "minor"
failure_scenario = "A worker finds `git rev-parse --show-toplevel` differs from `root:`, changes nothing and returns {status:'error', note:''}. RETURN_SCHEMA has no field for the two paths, so toEntry takes the `!ret.note` branch and emits {status:'error', error:'wrote no note'}. drain.md says `error` names the root mismatch and a wrong root stops the engine, otherwise treat as no-return; the engine sees no mismatch, relaunches every task, then parks each on the second error. A wrong-root return that does carry a note gets error null and no fail(), so the run closes `ok`."
fix = "Add a `reason` string to RETURN_SCHEMA (required, '' unless status is error) and to the worker return contract in plan-worker-lite.md and plan-worker-deep.md (shared block, line 78). In toEntry, before the note check, map ret.status === 'error' to fail(`task N: worker returned error: ${ret.reason}`) and entry(t.id, 'error', {...fields, error: ret.reason || 'worker returned error with no reason'}). Update the prompt's return shape at workerPrompt and the index tables in run-milestone.md and drain.md if the field name changes."
fix_shape = "edits"
effort = "small"
counter = "Refuted if the Workflow runtime surfaces free text outside the schema to the script, or if the engine is documented to treat `error` + 'wrote no note' as the wrong-root signal; neither appears in run-milestone.md or drain.md."
grade = "high"
evidence = [
    "claude/agents/plan-worker-lite.md:24 — wrong root: change nothing and return `status: error` naming both paths; :78 return has only task/status/note/files_touched/deviations/handover",
    "claude/workflows/implement-v2-milestone.js:30-42 RETURN_SCHEMA additionalProperties:false, no reason field",
    "claude/workflows/implement-v2-milestone.js:166-169 empty note -> entry(ret.status, {error:'wrote no note'}); :176 error status with a note -> error null, no fail()",
    "claude/skills/implement-v2-engine/references/drain.md:35-38 — wrong root stops the engine; `error` names the root mismatch; drain.md:118 error/no-return relaunch once then park",
]
