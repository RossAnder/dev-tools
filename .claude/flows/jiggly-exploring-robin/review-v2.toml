severity = "minor"
failure_scenario = 'A plan.toml written at schema_version 1 holds an undone [[handover]] whose only text is `command = "..."`. Any writing plan verb (plan run start, plan decide, plan approve) reads it through handover_from_toml, which takes only action, when and done_when and drops unknown keys, then writes the store back at version 2 with the command gone. plan check then reports the handover as having no reason, action, when or done_when, and the step survives only in git history.'
fix = "In handover_from_toml, when `action` is absent and a string `command` is present, read `command` into `action`. Add a round-trip test over a schema_version 1 fixture carrying a handover `command`, asserting the text survives a plan write as `action`. Say in claude/skills/tomlctl/references/plan-store.md that a version 1 `command` is read as `action`."
fix_shape = "edits"
effort = "small"
counter = "Refuted if handover_from_toml or from_toml already maps `command` to `action`, or if a schema_version 1 store is refused on write rather than rewritten at 2."
