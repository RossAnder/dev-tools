line = 72
symbol = "Handovers"
summary = "v2 puts install/link landing work in milestone gates, but the gate always runs keep_going, so an install runs even after the tests before it fail"
severity = "major"
failure_scenario = "Milestone B of human-only-handovers gates `cargo test ... cli::dispatch::tests` then `cargo install --path tomlctl`. drain.md dispatches every gate with keep_going: true, so when the test gate fails the verification agent still runs the install: the PATH tomlctl is replaced by a binary from a tree that fails its tests (compiles, so install succeeds), before the writes_build accept checks even run. The engine's fix rounds then drive that binary, and an uncommitted milestone leaves it installed. v1's install: key runs last and only after every earlier command passed."
fix = "Decide how an install/link step is separated from the checks it must follow, then make write-and-prove.md:72, drain.md's gate section and v2-pipeline.md:162 agree. Options: a separate milestone field (e.g. installs) the drain runs in a second verification dispatch without keep_going, only once every gate and accept check passed; or a drain rule that runs gates naming an install verb last and only on a clean first dispatch."
fix_shape = "needs-plan"
effort = "medium"
counter = "Refuted if drain.md elsewhere withholds keep_going or reorders install-type gates after a passing run; I read drain.md:225-290 and found no such rule, and verification.md:21/117 runs every command under keep_going."
grade = "high"
evidence = [
    "claude/skills/plan-v2-engine/references/write-and-prove.md:72 — 'an install or link is a gate on the last milestone'",
    "claude/skills/implement-v2-engine/references/drain.md:254 — '`keep_going: true` is always passed'; :240 gates go before the writes_build accept checks",
    "claude/agents/verification.md:117 — under keep_going every outcome goes on to the next command",
    "tomlctl items list .claude/flows/human-only-handovers/tasks.toml --array milestones: B gates = [cargo test ... cli::dispatch::tests, cargo install --path tomlctl, cargo install --path glimpse]",
    "claude/commands/implement.md:256 — v1 contract: install: commands come last so they run only when every command before them passed",
]
anchor = "code|claude/skills/plan-v2-engine/references/write-and-prove.md|Handovers"
status = "superseded"
first_seen = 2026-11-10

