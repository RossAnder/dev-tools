file = "tomlctl/src/plan/drift.rs"
line = 60
symbol = "refuse_unresolved"
summary = "Drift accepts an approved commit that resolves but is no longer an ancestor of HEAD (pull --rebase), so the run's own rewritten commits read as drift"
severity = "minor"
failure_scenario = "Approve, run a milestone (stamped commit), then `git pull --rebase`: the approval and milestone commits are rewritten, the old approval still resolves from the reflog, so cat-file -e passes. `old..HEAD` then lists the rebased approval and milestone commits, whose new shas match no row's stamp, and their files land in changed_files and in `affected` for every pending row sharing a file. Reproduced in a scratch repo: cat-file rc=0, merge-base --is-ancestor rc=1, range lists work.rs from the rebased owned commit."
fix = "After the cat-file check, run `git merge-base --is-ancestor --end-of-options <commit> HEAD` and refuse with the same kind=validation message and `plan approve --amend` hint when it exits 1. Note in plan.md's `plan drift` section that a rewritten approval is refused, not only a gc'd one."
fix_shape = "edits"
effort = "small"
counter = "If flows never rebase (commits only on a branch that is never rewritten) the trigger is unreachable in practice; the repo history shows a 'Merge branch main of origin' pull, so merge, not rebase, may be the user's habit."
grade = "high"
evidence = [
    "tomlctl/src/plan/drift.rs:58-60 doc names 'A rebase' as the case refuse_unresolved catches, but it only tests that the object exists",
    "scratch repo: after rebase, `git cat-file -e --end-of-options <approved>^{commit}` rc=0; `git merge-base --is-ancestor <approved> HEAD` rc=1; `git log <approved>..HEAD --name-only` lists the rebased owned commit's work.rs under a new sha",
]
anchor = "code|tomlctl/src/plan/drift.rs|refuse_unresolved"
status = "exported"
first_seen = 2026-11-10
exported_as = "R39"
export_ledger = ".claude/flows/jiggly-exploring-robin/review-ledger.toml"

