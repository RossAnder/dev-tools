id = "E70"
type = "deviation"
date = 2026-09-02
agent = "implement"
task_ref = "promote-strict-read-check-to-a-single-shared-definition"
summary = "The task as written is not achievable in its three named files - pub(crate) alone cannot expose a helper living in a private module, so a fourth file was unavoidable"
original_intent = "Files: tomlctl/src/cli/dispatch.rs, tomlctl/src/json.rs, tomlctl/src/backlog/schema.rs. Action: make strict_read_check pub(crate) and call it from the two places that currently re-implement it."
rationale = "mod dispatch is private to cli, so pub(crate) does not make the path crate::cli::dispatch::strict_read_check resolvable from crate::json or crate::backlog::schema. Every variant of this task therefore needs a file the plan's Files line omits: either cli/mod.rs for a new re-export, or a new home in infrastructure. The re-export route is closed by cli/mod.rs's own module doc, which states that only clap-derived types and two named translators cross that boundary outward, and that a verb group needing a helper should have it moved down into crate::io rather than re-exported. The helper's signature is already all primitives, matching io.rs's stated contract that nothing in it reaches back into crate::cli, and all three consumers already import from crate::io, so each call site cost one added name in an existing use list. The definition now lives in tomlctl/src/io.rs, making four files. Behaviour is unchanged across all four strict-mode and file-presence combinations; read_store's empty-table fallback stayed in place and only the existence gate moved. The one observable difference is an extra stat call when strict-read is set and the file exists; the non-strict path short-circuits before touching the filesystem, so the common case is unchanged."
dedup_id = "697769a22f72bdfb"

