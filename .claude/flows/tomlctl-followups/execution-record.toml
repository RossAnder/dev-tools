original_intent = "Decide whether to express the at-least-one-of requirement with clap's ArgGroup(required = true) or a hand-rolled post-parse check, noting that types.rs already uses ArgGroup mutexes elsewhere and the file's existing idiom should be followed."
rationale = "The ArgGroup version was implemented first and parsed correctly - Context7 confirms required plus multiple gives exactly at-least-one semantics. It was rejected on measurement: the crate declares clap with default-features off and without error-context, so the group's refusal renders as a bare one-or-more-required-arguments message naming neither flag, which fails the task's own requirement that the error be actionable. Enabling error-context is a manifest change outside the task's Files line that would shift every clap error string in the CLI. The crate already solves this exact shape the other way - array-append declares its mutex at the parser but hand-rolls the at-least-one requirement as a bail in dispatch, with an integration test asserting the message names both flags - so ArgGroup is this file's idiom for mutexes only, and the hand-rolled check is its idiom for a required-one-of. A dispatch bail also flows through --error-format json as a proper envelope, which a clap parse error does not. Falsifier worth preserving: with the guard neutralised, an update naming neither flag exited 0 and round-tripped the TOML byte-identically, but still ran the write funnel and refreshed the integrity sidecar - a silent no-op write, which is what the guard refuses."
