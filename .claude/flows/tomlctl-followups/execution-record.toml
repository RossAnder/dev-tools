summary = "Unblinding placeholders surfaced one real-corpus failure that is a demonstrated false positive - clap-style usage-synopsis notation, not drift - plus an acceptance clause clap cannot satisfy"
original_intent = "Distinguish a placeholder from a redirection and substitute a parseable dummy so the remaining flags reach Cli::try_parse_from. Acceptance: a fixture line fails command_lint where today it passes, and any real-corpus failure is genuine drift to be reported, not silenced."
rationale = "Two findings. First, the corpus line at claude/commands/plan-new.md documents optional flags in clap usage-synopsis form with square brackets and a trailing ellipsis; clap rejected the literal bracketed token even though all three flags exist on flow init. That is notation, not a runnable invocation, so it is a false positive rather than drift. Handled by peeling a leading bracket, a trailing ellipsis and a trailing bracket before parsing, which preserves the check - a misspelt flag inside the brackets still fails - rather than silencing the fence. Second, the Acceptance implies the failure names the offending flag, which is impossible here: the crate builds clap with default-features off and without error-context, so every rejection renders as a bare unexpected-argument message with no token. The fixture asserts the reported line and the rejection text instead. Also noted: the dummy value chosen is the digit 1, because it parses as usize, u64, f64, String and PathBuf, so a placeholder in a typed flag's value slot cannot abort the parse and re-blind the very flags this task unblinds."
dedup_id = "ffaf3893827d8b36"

