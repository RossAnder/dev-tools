summary = "The plan's two accepted phrasings, applied literally, would still let a negated invocation satisfy the guard, contradicting the task's own acceptance criterion"
original_intent = 'Require either the "Invoke the <name> skill" phrasing the carriers already use, or a backtick-quoted name followed by the word "skill". Keep the existing cross-check that each required SKILL.md exists on disk.'
rationale = """Both specified forms are satisfied by the sentence "do NOT invoke the <name> skill", which is exactly the fixture the Acceptance requires to fail - so the plan's Detail and its Acceptance contradict each other. Resolved by adding a clause-scoped negation guard on top of the specified phrase match, scanning back to the previous sentence terminator or newline for cues such as do not, never, must not, rather than, instead of. It cannot cause a false negative because one qualifying phrase anywhere in the carrier suffices, and it does not fire on the current corpus. The rejected alternative was a literal phrase match with no guard, which would have shipped a gate that a prohibition still satisfies - the exact hole the task exists to close. Separately: the tightened check surfaced no drift, so all 11 command carriers and both lumina plugin carriers already write each required skill in an accepted invocation form."""
