[[items]]
id = "E5"
type = "deviation"
date = 2026-09-02
agent = "implement"
task_ref = "assert-non-empty-block-extraction-in-verify-shared-blocks-sh"
summary = "Task 25's stated acceptance reproduction (BINMODE=3 in the awk environment) does not reproduce the failure; an equivalent double-CR marker fixture was used instead"
original_intent = "Acceptance: running the script with BINMODE=3 in the awk environment reproduces the CR-preserving case, exits non-zero and names the empty block."
rationale = "Measured on GNU Awk 5.4.0 under Git Bash: gawk does not honour BINMODE from the environment, only from an explicit -v assignment, so BINMODE=3 bash scripts/verify-shared-blocks.sh is a no-op and exits 0 both before and after the change. Applying -v BINMODE=3 to every awk breaks the manifest parse first, so the described silent-pass state is unreachable that way. The delegate and the orchestrator independently reproduced the real failure shape with marker lines ending CR-CR-LF: grep -qF substring-matches them so the marker guards pass, while awk's whole-line equality does not, yielding zero extracted lines. With the guard the verifier exits 1 naming both files and the block; with the guard neutralised it prints shared-block parity: OK and exits 0."
dedup_id = "9f3cb3068215da8b"

