[[items]]
id = "E7"
type = "deviation"
date = 2026-05-27
agent = "implement"
task_ref = "drop-workaround-assert-assistant-message-persistence-fix-user-input-assertion"
summary = "T6 changes (a) drop workaround and (b) assert assistant_text persistence NOT applied; change (c) any() assertion applied as forward-looking shape. Pre-existing upstream Windows ConPTY plumbing issue blocks parser bridge from receiving child stdout."
original_intent = "Remove the test-side session.set_status(SessionStatus::Idle) workaround now that the production bridge in pty/spawn.rs flips Spawning -> Idle on the first MessageKind::Prompt; extend the /messages polling loop to await a row with kind=assistant_text; rewrite the index-0 user_input assertion to messages.iter().any(...) since the bridge now persists assistant_text/prompt rows before the dispatched user_input."
rationale = "Empirical diagnosis with eprintln traces: on Windows ConPTY the stub child's stdout never reaches the pty_transport reader (only ConPTY init escape sequences arrive then nothing for 10s). The parser-bridge in pty_transport.rs therefore emits zero TypedMessages, the bridge in pty/spawn.rs never sees a Prompt to flip Idle, and the supervisor never dispatches. T3's bridge wiring is verified correct by code review and will work on Linux/macOS; the Windows transport issue is upstream and out of scope for this flow. The workaround is retained with a fresh comment block citing this deviation; change (c) is applied as forward-looking so the test survives when the upstream is fixed."
commits = ["c0989e6106405356bc21d0217ccd30d1bd1ecd65"]
dedup_id = "02832ca223157c87"

