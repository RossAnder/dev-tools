id = "E13"
type = "deviation"
date = 2026-05-27
agent = "implement"
task_ref = "drop-workaround-assert-assistant-message-persistence-fix-user-input-assertion"
summary = "Root-caused and fixed the Windows ConPTY child-stdout delivery issue blocking T6 (a)+(b). Fix: pin portable-pty to =0.8.1 + keep slave handle alive on Windows. Verified end-to-end against real claude.exe via lumina manual smoke (6 assistant_text rows persisted including TUI box-drawing characters). T6 changes (a) drop workaround and (b) assert assistant_text persistence remain not re-applied to the e2e test because of an unrelated PATH-shim issue in 0.8.1 that causes the test to run real claude.exe instead of the pty_stub; the workaround stays for that reason but the underlying production fix is in place."
original_intent = "Diagnose and research a solution to the Windows ConPTY plumbing issue documented in E7."
rationale = "Followed the diagnose skill: built a minimal bare-API repro (lumina/tests/conpty_minimal_repro.rs), ran flow-research-deep-grade research that produced ranked hypotheses (Microsoft Learn docs + wezterm GitHub issues 4206/6783). Confirmed empirically: portable-pty 0.9.0 sets PSEUDOCONSOLE_INHERIT_CURSOR which emits DSR cursor-position query that the parent must answer; 0.8.1 does not. Drop(pair.slave) is also broken on Windows per wezterm/wezterm#4206. Both fixes applied to lumina/src/pty/pty_transport.rs. The conpty_minimal_repro test now passes in <100ms on Windows and serves as a regression guard."
commits = ["957c5c72b9c0e87dbee4450f5b1228be7d44de36"]
supersedes_entry = "E7"
