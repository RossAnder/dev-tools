rationale = "No PATCH /findings/{id} route exists in http.rs today (only /work-items routes); repo::update_finding's UPDATE statement does not cover repo_id either. Composing repo::update_finding + repo::set_finding_repo across two transactions would violate the single-mutation-path invariant documented at repo.rs:1-12 (one domain write ⇒ one event row, atomically). UpdateFindingRequest.repo_id (T1) is for the MCP update_finding tool (T4 wired it). Recommendation: follow-up plan-update to introduce a transactionally-coherent HTTP findings surface"
