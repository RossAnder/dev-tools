plan_section = "### Repo layer (`lumina/src/repo.rs`)"
summary = "set_primary_repo statement order is correctness-critical (SQLite checks partial UNIQUE per statement); plan does not pin it"
description = "SQLite enforces UNIQUE per statement (not at commit). Safe order: clear is_primary=0 for project FIRST, then set new is_primary=1. Inverted order fails with SQLITE_CONSTRAINT_UNIQUE on the first statement. Caller-facing errors should map to 409 Conflict for retry."
anchor_old = "- `set_primary_repo(pool, project_id, repo_link_id) -> ()` — atomically clears + sets within one txn; emits `repo_link.primary_changed` event."
anchor_new = "- `set_primary_repo(pool, project_id, repo_link_id) -> ()` — within one `pool.begin()` txn, FIRST `UPDATE repo_links SET is_primary=0 WHERE project_id=? AND is_primary=1` THEN `UPDATE repo_links SET is_primary=1 WHERE id=?` (order matters: SQLite checks the partial UNIQUE index per-statement, so the clear must precede the set or the second UPDATE fails with `SQLITE_CONSTRAINT_UNIQUE`). Concurrent calls are serialised by SQLite's single-writer lock; map any residual `SQLITE_CONSTRAINT_UNIQUE` to `AppError::Conflict(409)` so callers can retry. Emits `repo_link.primary_changed` event."
dedup_id = "2bcd8045a52c7513"

