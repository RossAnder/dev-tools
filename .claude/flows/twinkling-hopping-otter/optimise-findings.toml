category = "algorithm"
summary = "Batch backlog check --ndjson rebuilds rows, dedup index and every stored summary's trigram/word sets once per probe"
description = """
batch_report calls evaluate(doc, probe, t) per probe; each call rebuilds rows(doc), index_by_dedup, colliding_ids, and Probe::grade re-runs char_trigrams(row.summary) + word_tokens(row.summary) (a normalise pass plus ~100 heap Strings in a BTreeSet per row) for every row. Cost is O(probes x rows x summary length): measured ~3.6-4 ms CPU per non-exact probe on the 270-row .claude/backlog.toml (1/20/50/200 probes = ~0.05/0.13/0.28/0.8 s; 50 exact-duplicate probes cost the same as 1). Batch mode shipped in 6ddb746 and is the documented gate for /backlog capture sweeps and TANGENTIAL harvests.

Fix (check.rs only): build a Store once holding rows, by_dedup, colliding and a per-row OnceCell<(trigrams, words, area components)>; grade() reads the cached sets via get_or_init so all-exact batches still fold nothing; batch_report builds the Store once; keep evaluate(doc, probe, t) as a thin wrapper over evaluate_in(&Store::new(doc), ...) so the ~10 test call sites stay unchanged. Optionally memoise evidence_count by id across the batch. Expected: a 20-probe batch drops from ~75 ms to ~15 ms CPU; single-probe check unchanged.

Risks: verdicts, scores and candidate order must stay byte-identical (existing check.rs verdict tests pin this). Unprofiled split between folding and jaccard cost; if jaccard dominates the gain roughly halves. Optional follow-on (separate decision, touches normalise.rs and its BTreeSet<String>-shaped tests): store trigrams as a sorted Vec<u32> packed from the ASCII-folded bytes and merge-intersect, which would also speed the single-probe path.

Flagged independently by four lenses: memory, serialization, queries, algorithm."""
evidence = [
    "hyperfine -N tomlctl backlog check --ndjson against .claude/backlog.toml (270 rows) -> 1/10/30 near-match probes 50.0/95.1/164.0 ms; 30 exact-hit vs 30 near-match 57.6 vs 185.3 ms (2026-10-09)",
