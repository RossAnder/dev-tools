severity = "suggestion"
effort = "trivial"
category = "query"
summary = "flow resolve reads and section-scans the whole plan document even when tasks.toml exists"
description = """
expects_tasks = plan_declares_tasks(slug) is computed eagerly before the artifact loop, but is only consulted when the tasks artifact is missing. plan_declares_tasks re-reads context.toml (already parsed at :541) via tasks::context_plan_path, then reads the plan (up to ~130 KB) and runs markdown::sections. Every carrier bootstrap runs flow resolve. Cost ~1-3 ms per resolve (inferred from a 20 KB vs 130 KB plan comparison inside noise).

Fix: make it lazy: `let mut expects: Option<bool> = None;` and in the loop `if abs.exists() { continue; } if key == "tasks" && !*expects.get_or_insert_with(|| plan_declares_tasks(slug)) { continue; }`. Warnings stay identical."""
evidence = [
    "tomlctl/src/flow/resolve.rs:584-593 expects_tasks computed before the loop, read only for key == tasks",
    "hyperfine -r 100 flow resolve 20 KB vs 130 KB plan -> 7.8 vs 8.3 ms user, 7.8 vs 10.5 ms sys (2026-10-09)",
]
dedup_id = "17bfa0c52cf27d26"
resolved = 2026-10-09
resolution = "uncommitted: flow resolve computes expects_tasks lazily from the parsed context, only when the tasks artifact is missing; warnings unchanged. Verified: fmt, clippy, nextest 1877/1877."

