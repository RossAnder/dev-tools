line = 75
symbol = "dispatch"
severity = "warning"
effort = "small"
category = "concurrency"
summary = "Integrity-verifying readers that skip the shared lock report kind=integrity on healthy files during a concurrent write"
description = """
write_serialized_with_sidecar renames the sidecar before the TOML inside the exclusive lock, so an unlocked verify-then-read can land between the two renames and see NEW sidecar + OLD TOML. read_doc / read_doc_owned (io.rs) already document this window and take with_shared_lock when verify_on_read is set; these sites bypass that. Reproduced: render-progress-log --verify-integrity under 3 concurrent `tomlctl set` writer loops failed 1/50 with a spurious integrity error, while the locked `items list --verify-integrity` reader failed 0/50, and a final verify passed (file intact).

Fix: replace `maybe_verify_integrity(f)?; read_toml(f)` with read_doc_owned(f, opts), which locks only when verify is on, at render_progress_log, resolve (context), active::read_doc_or_default and backlog/schema::read_store; wrap verify+read in with_shared_lock for InputsOp::List and the resolve registry read; for doctor's always-on sidecar_state and ensure_artifact::sidecar_matches, re-check under with_shared_lock only on Mismatch/Malformed so the happy path stays lock-free. Cost: one lock-file open (<1 ms), only when verify is on or on the mismatch path.

Risk: doctor's instance is reasoned from code (0/100 false failures in the race run), not reproduced."""
evidence = [
    "scratchpad race bench, 3 `tomlctl set` writer loops vs readers x50 -> render-progress-log --verify-integrity 1/50 integrity failures; items list --count --verify-integrity 0/50; post-run verify ok (2026-10-09)",
    "tomlctl/src/io.rs:630-638 read_doc comment documents the two-persist interleave window and the shared-lock fix",
    "tomlctl/src/flow/render_progress_log.rs:75 maybe_verify_integrity then :80 read_toml with no lock",
]
instances = [
    "tomlctl/src/flow/render_progress_log.rs:dispatch",
    "tomlctl/src/flow/resolve.rs:272",
    "tomlctl/src/flow/resolve.rs:538",
    "tomlctl/src/flow/active.rs:read_doc_or_default",
    "tomlctl/src/backlog/schema.rs:read_store",
    "tomlctl/src/cli/dispatch.rs:321",
    "tomlctl/src/flow/doctor.rs:sidecar_state",
    "tomlctl/src/flow/ensure_artifact.rs:sidecar_matches",
]
sweep = [
    'maybe_verify_integrity\(',
    'sidecar_state\(',
    'sha256_hex_of_file\(',
    '[^_]verify_integrity\(',
]
enumeration = "complete"
dedup_id = "ee241b6504a1a676"
resolved = 2026-10-09
resolution = "uncommitted: integrity verify and its read share one with_shared_lock at render_progress_log, resolve (registry + context), active::read_doc_or_default, backlog read_store, inputs list; doctor sidecar_state and ensure_artifact compute_report re-check a failing probe once under the shared lock. Callers checked for same-process exclusive-lock nesting: none. Verified: fmt, clippy, nextest 1877/1877."

[[items]]
id = "O3"
first_flagged = 2026-10-09
rounds = 1
status = "applied"
flow = "twinkling-hopping-otter"
file = "tomlctl/src/io.rs"
line = 2258
symbol = "write_serialized_with_sidecar"
severity = "suggestion"
effort = "small"
category = "concurrency"
summary = "Sidecar write stages the TOML tempfile only after the sidecar rename, widening the new-sidecar/old-TOML window"
description = """
write_sidecar_for runs a full atomic_write (create, write, sync_data, rename) and only then does atomic_write(path) create, write and flush the TOML tempfile. The doc comment above write_toml_with_sidecar claims both tempfiles are staged before either persist, which has never been true. Measured (pwsh, 40 KB, 40 runs): create+write+flush median 3.89 ms / p90 5.03 / max 10.44; rename median 0.58 ms.

Fix: split atomic_write into stage(path, bytes) -> TempPath and commit(TempPath, path) (commit keeps the rename retry and the unix dir fsync); stage sidecar, stage TOML, commit sidecar, commit TOML, keeping the existing recovery on the second commit. Shrinks the inconsistent window ~4.5 ms -> ~0.6 ms, and a TOML tempfile-create failure (e.g. AV lock) then leaves OLD+OLD untouched instead of entering recovery. Correct the doc comment in the same edit.

Risks: two tempfiles open at once under AV is unmeasured; once the unlocked-reader item lands the gain is limited to the crash window and the staging-failure case. End-to-end window inferred from component timings, not instrumented."""
evidence = [
    "tomlctl/src/io.rs:2258-2259 write_sidecar_for(path, bytes)? then atomic_write(path, bytes)",
    "tomlctl/src/io.rs:2207-2209 doc comment claims both tempfiles are staged before persist",
    "pwsh 40 KB x40 -> create+write+Flush(true) median 3.89 ms, rename median 0.58 ms (2026-10-09)",
]
dedup_id = "ac53a520ea29cfb4"
related = ["O2"]
resolved = 2026-10-09
resolution = "uncommitted: atomic_write split into stage/commit; write_serialized_with_sidecar stages sidecar and TOML before committing sidecar then TOML, so the old-TOML/new-sidecar window is one rename and a staging failure renames nothing; doc comments corrected. Verified: fmt, clippy, nextest 1877/1877."

