title = "Declare the new global output flags"
effort = "M"
status = "done"
checkpoint = "B"
phase = "Phase B — Output options"
phase_depth = 3
heading_depth = 3
files = [
    "tomlctl/src/cli/types/mod.rs",
    "tomlctl/src/cli/dispatch.rs",
    "tomlctl/src/output.rs",
]
