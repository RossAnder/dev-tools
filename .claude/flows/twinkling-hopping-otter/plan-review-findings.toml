anchor_new = '`--set` values stay JSON strings; `DATE_KEYS` coercion happens where the merged payload is converted to TOML (`convert::maybe_date_coerce`, exactly as for `--json` payloads), so `build` does not call it. `--set-json` parses with `serde_json`. `--set-file` reads UTF-8, strips one leading U+FEFF and one trailing `\n` (or `\r\n`); `-` reads through `io::read_text_arg`, which claims stdin and enforces the 32 MiB cap.'
