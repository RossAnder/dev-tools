plan_section = "### 11. Add the shared field-flag parser [S]"
summary = "Task 11's Detail names a private io helper and a TOML-returning coercion that do not fit its two files"
description = "io::claim_stdin (io.rs:260) is private and only marks stdin claimed; the public reader is io::read_text_arg (pub(crate), io.rs:358, claims stdin and caps 32 MiB). convert::maybe_date_coerce (convert.rs:499) returns TomlValue while build returns JSON; date coercion already happens at the JSON->TOML step. Also strip one leading U+FEFF from --set-file text (io.rs read_at_file has no BOM handling; PowerShell 5.1 Out-File writes one)."
