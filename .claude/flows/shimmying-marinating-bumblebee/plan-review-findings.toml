summary = "Whole-entry expect on spec.accept cannot match a probed entry, and the reviewer views omit the stored fields"
description = 'Stored accept entries carry a tool-written `probe {at, neg_rc, pos_rc, verdict}` (`tasks/schema.rs`); `tasks show` emits it, a `new` carrying it is refused (`tasks/add.rs:555`), and `plan view` (the reviewer input the plan prescribes) omits `writes_build` and the probe fields. So an `expect` copied from either view fails "equals the current value", and the `already` test never matches while a probe is stored, on exactly the entries the flagship `probe` proof targets. `resolve`, `match_entry` and the `already` test should compare with `probe` removed, as `tasks/update.rs` `keep_probes` does, and `plan-records.md` should name `tasks show <id> --with spec` as the source of `expect`.'
