plan_section = "#### 1. Add the plan-record finding fields [M]"
summary = 'expect/new as Ty::Any cannot round-trip the TOML review store: null, "" and [] are dropped at mint and a nested null aborts the write'
description = """`review add` mints through `items::add_value_to`, which skips any top-level value `is_empty_json` accepts (`items.rs:495`: null, `""`, `[]`); `convert.rs:638` `json_to_toml` bails on null at any depth. So the Approach's "`new` null removes it" stores a row with no `new` (tiered advisory), clearing `deps_note`/`files`/`needs` loses `new`, an `expect` of `""` is lost, and a probed accept entry copied from `tasks show` carrying `pos_rc: null` aborts the cell's batch. `applied.old`/`applied.new` (task 11) hit the same limit. Separately, "`[+]` with no `expect` appends" contradicts the rule that `new` requires `expect`, which task 5 enforces with no exception. Store `expect`, `new` and `applied.old`/`.new` as JSON text and decode on read; state the `[+]` exemption. Touches tasks 1, 5, 7, 11 and Approach "Record targets"."""
anchor_old = "`Ty::Any` accepts any JSON value, including null."
anchor_new = '`Ty::Any` accepts any JSON value. The store cannot hold null or an empty value as-is (`items::add_value_to` drops a top-level null, `""` or `[]`; `convert::json_to_toml` refuses a nested null), so `expect`, `new` and `applied.old`/`applied.new` are stored as JSON text and decoded on read; a removal is `new` = the text `null`, and `[+]` with a `new` and no `expect` is the one row where `new` stands without `expect`.'
dedup_id = "9dc81a6d920350f3"

