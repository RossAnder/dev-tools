[[items]]
id = "P22"
review_round = 1
status = "merged"
severity = "warning"
category = "risk"
plan_section = "### review apply"
summary = "review apply is not crash-safe across its two stores, and re-runs of appends, removals and lost stamps go wrong"
description = "The target is written under its own lock, then the finding is stamped under the review lock. Before approval `audit` is false, so a failure between the two leaves an edit with no record anywhere; a re-run lists it under `already` without `applied`, so it reaches neither `review_edits` nor `--plan-outcomes`. A re-run `[+]` append appends twice; a re-run removal reports a false `skipped_stale`. `review add` validates `expect` but not `new`, so a `new` the target rejects (a `needs` cycle, a bad `effort`) fails mid-batch after earlier writes. State: stamp each finding right after its own target write; `already` still records `applied` (`old` from `expect`); append/removal idempotence rules; validate every `new` in the refusal pass."
dedup_id = "f43c9e5e9163daaa"

