plan_section = "### Tiers"
summary = "A mechanical proof licenses any replacement value, so silently applied edits can disable a failing check"
description = """Each proof kind validates the defect, not `new`. A `probe` fix may set `writes_build = true`, making the entry unprobeable (`plan/probes.rs:122`) and raising no `probe-absent`; a `check-class` finding carries only task ids (`tasks/finding.rs`), so it proves an edit to any field of the task; `path-missing` lets `new` rewrite the whole `files` list; a cited citation is any in-repo `path:line`, and `query.rs` `parse_citation` never opens the file, so "resolves inside the file" must be implemented in `tier.rs`. `expect`/`new` have no cap where v1's anchors were capped at 400/800. Risks says only tool-verified proof applies silently; as designed that does not hold."""
anchor_old = "`review add` refuses a `proof` that does not hold."
anchor_new = "`review add` refuses a `proof` that does not hold, and a mechanical `new` that changes more than its proof covers: a `probe` fix may change only the entry's `check` and `positive`; a `path-missing` fix may only replace or drop the missing path; a `check-class` proof binds only the fields a class-to-field table names. A citation must name the target's own file or a path the target names, and `tier.rs` checks its line range against the file. `expect` and `new` are capped at 800 serialised characters; anything outside these shapes caps at cited."
dedup_id = "d4f0764a17cfec0b"

