summary = "'Re-probed before approval' is not enforced: plan approve ignores the probe-absent warning"
description = '`plan/approve.rs:285` `refuse_check_errors` filters `severity == ERROR`; `plan/probe-absent` is a warning (`check.rs:471`), and only `plan stage` treats it as a blocker. Approach "/plan-v2 and /review-plan-v2" runs apply, re-check and finish, then the gate, with no probe step, so `plan approve --review ran` succeeds with an edited, unprobed accept entry. Add a probe step to `plan-flow.md` (task 29) and an approve refusal for an applied-but-unprobed entry (task 16).'
