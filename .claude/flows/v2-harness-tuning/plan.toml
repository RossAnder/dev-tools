[[decision]]
id = "D4"
decision = "Adopt the structure challenge's draft: give each accept entry an owner, `run_by` with `covered_by`, apart from `writes_build`, and put the launch-args, reproduce-units and gate-list projections in one module under `tomlctl/src/plan/`."
why = "`writes_build` decides probing, who runs a check and whether the gate lists it, so a gate-only store read has to claim it builds, and a boolean has no third state for a covered check."
provenance = "agent-assumed"
door = "one-way"
binds = [
    "tomlctl/src/tasks/schema.rs",
    "tomlctl/src/plan/probes.rs",
    "tomlctl/src/plan/view.rs",
    "tomlctl/src/review/schedule.rs",
    "docs/flows/v2-harness-tuning/design/shapes.md",
    "18",
    "21",
    "22",
    "23",
]
evidence = "Read probes.rs skip_reason (only writes_build = false is probed), schedule.rs Compose::accept (reproduce-status minted with writes_build absent) and notes/structure-challenge.md claims 1 to 3. The user decided on 2026-11-10 that a covered check is marked by an accept-entry field naming its gate, which `covered_by` is."
if_false = "The plan keeps `writes_build` as the owner, relabels the worker view line and adds `covered_by` alone; the accept-owner task shrinks and the schedule task sets no owner."
revisit_if = "a fourth owner appears, such as a check the reproduce step itself runs"
check = ""
surfaced = false
vetoed = false

