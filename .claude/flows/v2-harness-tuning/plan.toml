[[decision]]
id = "D1"
decision = "Widen the cited test so a citation holds when it is compound, names a path that appears in the finding's `new`, or names another document of the same flow; and let `review apply --user-accepted` write an advisory-tier defect or cleanup finding that carries `new`. Restate the B-cd288c8e success criterion as: a confirmed plan-review finding that carries an edit can be written by `review apply`."
why = "Finders already supply target and new; the edits are lost at tier stamping, where the verifier's citation fails the cited test, and apply refuses advisory tier outright."
provenance = "user-stated"
door = "two-way"
binds = [
    "tomlctl/src/review/apply.rs",
    "tomlctl/src/review/tier.rs",
    "9",
    "10",
    "16",
]
rejected = []
evidence = "Read tier.rs cited/citation_holds (the citation must name the target's own file or a path in its current value) and apply.rs (advisory tier is 'never applied'); notes/plan-review-outcomes.md measured 24 confirmed v2-apply rows with a full edit stamped advisory, all on their citation."
if_false = "The plan instead widens citation_holds (compound citations, paths named in `new`, other documents of the flow), which reaches 15 of the 24 measured rows, or changes the verifier's citation contract; the brief's criterion about finders supplying edit fields would stay and have no task that moves it."
revisit_if = ""
check = ""
surfaced = true
vetoed = true

[[decision]]
id = "D2"
decision = "Release an `after:<n>` task inside the launch by having its worker run its own after: premise checks first and return `failed` without editing when one is false; the worker records nothing, and the engine reviews those check commands at launch through a new emit mode."
why = "A Workflow script has no shell, so some agent must run the check; the worker is already there, and a worker that records nothing needs no exemption from the drain's spec-diff rule."
provenance = "user-confirmed"
door = "two-way"
binds = [
    "claude/workflows/implement-v2-milestone.js",
    "claude/skills/implement-v2-engine/references/run-milestone.md",
