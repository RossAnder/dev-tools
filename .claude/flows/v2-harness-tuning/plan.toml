    "claude/agents/plan-worker-deep.md",
    "21",
    "26",
    "27",
    "33",
]
rejected = []
evidence = "Read probes.rs (an after: premise's command reaches the script only once its task is done; tomlctl never runs a stored command) and run-milestone.md step 3 (the orchestrator reads the premise script before running it, and withholds the task); notes/wave-scheduling.md."
if_false = "Either a new Haiku checker agent runs and records each released premise mid-run, which adds an agent file, a `withheld` index status and a drain exemption for premise probe lines; or the plan ships the rolling pool alone and returns B-8f42ffc6 to the backlog."
revisit_if = ""
check = ""
surfaced = true
vetoed = false

