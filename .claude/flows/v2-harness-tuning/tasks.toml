detail = "`run` executes, in the hook's order and whatever is staged: `cargo fmt --manifest-path tomlctl/Cargo.toml -- --check`, `cargo test --manifest-path tomlctl/Cargo.toml --lib -- cli::dispatch::tests`, `cargo test --manifest-path tomlctl/Cargo.toml --test tasks_corpus -- --ignored`, `cargo fmt --manifest-path glimpse/Cargo.toml -- --check`, `cargo clippy --manifest-path glimpse/Cargo.toml --locked`; it stops at the first failure, removes any stamp, and exits non-zero. On a full pass it writes the digest to `$(git rev-parse --git-dir)/gate-stamp`. The digest: list files with `git ls-files -z --cached --others --exclude-standard` over the five roots, sort, and hash each path with its content hash into one SHA-256; a deleted tracked file contributes its path with a fixed marker. `check` recomputes and compares, exiting 1 when the stamp is absent or differs. In `.githooks/pre-commit`, compute once whether `check` passes, before the first cargo `gate` call, and when it does print one line, `pre-commit: cargo steps skipped, the gate stamp matches this working tree`, and skip the five cargo steps; the two verifiers, the documentation gate and the sidecar comparison run regardless. Both scripts are Bash under `set -euo pipefail`, use no tool the hook does not already use beyond `sha256sum`, `sort` and `git`, and work under Git Bash. In CLAUDE.md, Developer setup: one paragraph on the stamp after the description of the hook's steps, saying what `run` executes, that the stamp is void once any file under the five roots changes, that a commit train over a gated tree runs `bash scripts/gate-stamp.sh run` once, and that `--no-verify` is still never the answer; and add the script to the Supply chain gotcha's scrutiny. Check the scripts with `bash -n scripts/gate-stamp.sh` and `bash -n .githooks/pre-commit`."
