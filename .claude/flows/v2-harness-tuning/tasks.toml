deps_note = ""
action = "Replace the barrier waves of `implement-v2-milestone.js` with a rolling pool, gate a task on its `after` list, and carry `needs_files` through the return and the index, as `design/shapes.md#worker-return` states."
detail = "Today `nextWave` picks a wave and the main loop awaits `parallel()` over it, so every wave lasts as long as its slowest worker. Keep `results`, `pending`, `settleBlocked` and `toEntry`. Hold in-flight tasks in a Map from id to a promise of `{t, ret}` and the file keys they own in a Set; fill free slots, in args order and up to `max_parallel`, with tasks whose `needs` and `after` ids all have a `done` result and whose file keys are free; await `Promise.race` over the in-flight promises; record the entry, release its keys, run `settleBlocked`, repeat. The nothing-could-start failure fires only when nothing is in flight and nothing can start. A task behind an `after` id that did not return `done` settles as `blocked`, like one behind a failed need. Validate `after` with `needs`: ids must be in `tasks`, and the two together must not cycle. `siblings:` becomes the files of every other task that has not yet returned. A task with a non-empty `after` gets one more prompt line: `after-premises: check yours before editing`. Drop `wave N` from the labels and say pool, not waves, in the meta description, phase detail and header comment. Add optional `needs_files` to `RETURN_SCHEMA` and copy it to the index entry. Bump `SCRIPT_VERSION`. `agent()` promises started outside `parallel()` have a precedent in the checker pool of `claude/workflows/review-v2.js`. Check with `cargo test --manifest-path tomlctl/Cargo.toml --lib -- cli::dispatch::tests`."
acceptance = ""
agent = "plan-worker-deep"
