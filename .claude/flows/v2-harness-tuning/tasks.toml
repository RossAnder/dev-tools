detail = "Loading: read a script's source, rewrite `export const meta` to `const meta`, and build an AsyncFunction whose parameters are the stubbed globals `args`, `agent`, `parallel`, `pipeline`, `phase`, `log`, `workflow`; the script's top-level `return` becomes the resolved value. Stub semantics, which the tests state in comments: `agent(prompt, opts)` returns a canned object chosen by `opts.agentType` or `opts.label`, or null for a dead agent; `parallel(thunks)` resolves each thunk and turns one that throws into null, never rejecting; `pipeline(items, ...stages)` passes `(previous, item, index)` to each stage and turns an item whose stage throws into null; `workflow(name, args)` runs the loaded child script with the same stubs and throws on an unknown name; `phase` and `log` record. Cases for `review-v2.js`: the agent count of a wave with a cell, a panel, a minor batch and a checker pool with one reroute; the 300-character escalation cap; `batch_defects` sending two singles of one cell to one batch and keeping a `same_as` row single; reproduce mode sending a checker unit to the checker and its unsettled finding to a verifier; a null agent filling the error row. For `plan-v2-review.js`: baseline key matching, with an unknown key an error and a `none` line passed through; reverify skipping an id already unverified; the agent total adding the child's `agents`. For `implement-v2-milestone.js`: a short task starting while a long file-disjoint task is in flight; an `after` task starting only once its target is done, and blocked when the target fails; two tasks sharing a file never in flight together; `needs_files` reaching the index. The Rust test, named `workflow_scripts_logic_passes_under_node`, goes beside `command_lint_workflow_scripts` in `lint.rs`, runs `node --test claude/workflows/tests/` from the repo root, and fails with a message naming node when the binary is missing or the run exits non-zero. Run the suite yourself with `node --test claude/workflows/tests/`."
