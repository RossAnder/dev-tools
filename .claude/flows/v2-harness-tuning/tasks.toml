audit = true

[policy]
checkpoints = "milestones"
max_parallel = 6
commit_granularity = "per-task"
origin = "plan"
note = ""

[[checkpoints]]
id = "A"
rationale = "Standalone tomlctl and prose fixes: the verdict-return schema, replayed review add, plan drift own work, unreachable-claim noise, template path warnings, the apply-v2 role rule and the verification hand-back."

[[checkpoints]]
id = "B"
rationale = "Review store and plan-review outcomes: fix files, citations and advisory apply, the addressed disposition, digest counts, cap handling and the reproduce checker record."

[[checkpoints]]
id = "C"
rationale = "Accept owners, the milestone reproduce check, gate probes, the three plan emit verbs and the worker audit verb."

[[checkpoints]]
id = "D"
rationale = "Workflow scripts and agents: the rolling pool with in-launch after: release, reproduce checker routing, plan review batching, and a test of the review scripts logic."

[[checkpoints]]
id = "E"
rationale = "The engines adopt the new verbs, the pre-commit hook honours a gate stamp, and the findings reference is renamed."

