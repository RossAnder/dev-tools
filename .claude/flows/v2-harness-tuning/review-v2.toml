file = ".claude/flows/v2-harness-tuning/tasks.toml"
symbol = "honour-a-gate-stamp-in-the-pre-commit-hook"
summary = "No accept check pins that the gate stamp is voided by a change under its roots, the one property that keeps the hook from skipping cargo on an ungated tree"
severity = "major"
failure_scenario = "The worker writes gate-stamp.sh with a digest that misses untracked files (git ls-files without --others) or hashes paths only. All five accepts pass: the script exists, parses, check fails with no stamp, CLAUDE.md names it, the hook parses. Milestone E's gates never run the script. After one `run`, an edit to tomlctl/src or a new claude/ file leaves `check` at 0, so the hook skips fmt, the dispatch tests and glimpse clippy on an ungated tree."
fix = "Append an accept entry to the task that runs the script in a throwaway repo with a stub cargo on PATH: `run` stamps, `check` passes, then an edit and an untracked file each make `check` fail. It writes only under mktemp and builds nothing, so the worker can run it."
effort = "small"
counter = "A later task or milestone gate that runs gate-stamp.sh run then check against an edited tree would cover it; no gate of milestone E and no other task names the script."
grade = "high"
evidence = [
    "tasks show 38: accept entries are test -f/bash -n, grep gate-stamp.sh in the hook, no-stamp check fails, grep in CLAUDE.md, bash -n hook",
    "milestone E gates: verify-shared-blocks, verify-plan-story-blocks, nextest, cargo install glimpse; none runs gate-stamp.sh",
    "design/shapes.md Gate stamp: check exits 0 only when the stamp holds the digest of the tree as it now is, tracked or untracked",
]
target = "task:honour-a-gate-stamp-in-the-pre-commit-hook.spec.accept[+]"
new = '''{"behaviour":"a stamp is voided by an edit or a new untracked file under its roots","check":"( t=$(mktemp -d) && git -C \"$t\" init -q && mkdir -p \"$t/scripts\" \"$t/claude\" \"$t/bin\" && printf '#!/bin/sh\\nexit 0\\n' > \"$t/bin/cargo\" && chmod +x \"$t/bin/cargo\" && cp scripts/gate-stamp.sh \"$t/scripts/\" && echo a > \"$t/claude/x\" && cd \"$t\" && PATH=\"$t/bin:$PATH\" bash scripts/gate-stamp.sh run && bash scripts/gate-stamp.sh check && echo b > claude/x && ! bash scripts/gate-stamp.sh check && echo a > claude/x && echo c > claude/y && ! bash scripts/gate-stamp.sh check )","kind":"forward","positive":"","writes_build":false}'''
