fix = "Make reverify keep a same_as row single, as D10 states, or change D10. Whichever option is picked, edit together: this section's reverify sentence, Task 29's action and detail (its 'reverify keeps no single-dispatch exception' sentence and its 'settle phase unchanged' constraint), Task 31's 'reverify is one batch' clause, and D10's decision text if it moves. The lead reads same_as through `review show --for audit` (fields.rs MATRIX same_as row shows audit R), so it can mark which ids carry one."
effort = "small"
counter = "If the lead never names a same_as row under reverify (e.g. resolve marks it so ruled_out_hits skips it) the batch never meets one; digest.rs filters only Superseded, and plan-review-lead.md step 4 has no such exclusion."
grade = "high"
evidence = [
    "claude/agents/plan-review-lead.md:93-101: step 3 links duplicate pairs with `review resolve --same-as`, then step 4 names reverify ids from ruled_out_hits with no same_as exclusion",
    "tomlctl/src/review/digest.rs:61-65: the window drops only FindingStatus::Superseded, so merged same_as rows reach ruled_out_hits",
    "tomlctl/src/cli/types/review/verdicts.rs:75-80: --strike-same-as conflicts_with ndjson; verdict.rs:44-49 sets strike_same_as false on every batch row",
    "claude/agents/review-verifier.md:47: a batch verifier records its verdicts with one --ndjson call",
    "Task 29 detail: 'reverify keeps no single-dispatch exception'; D10 decision: 'Batch ... its reverify ids, keeping a row with same_as single'",
]
