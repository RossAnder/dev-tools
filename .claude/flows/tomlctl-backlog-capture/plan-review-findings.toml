summary = "Content-derived ids do not make a git merge converge — they produce same-id duplicate rows or a conflict"
description = '''`.gitattributes` carries only `*.sql text eol=lf` and `git config --get-regexp 'merge\.'` returns nothing, so `.claude/backlog.toml` merges as plain text with no TOML-aware driver. Git can auto-collapse two branch-side additions only when the added lines are BYTE-IDENTICAL. Two worktrees minting the same discovery agree on `dedup_id` and `id` but differ on `created`, `last_seen`, `origin`, `flow`, `evidence` and the agent-authored `context`, so the appended `[[items]]` blocks are not byte-identical and the merge yields either a conflict hunk or — for non-adjacent appends — two rows sharing one `id`. R8's beads guarantee is about ids not colliding between DIFFERENT issues, not about text merges. None of the eight verbs repairs this and `schema::validate` has no id-uniqueness rule. Fix: state what the scheme does and does not buy, enforce id-uniqueness across `[[items]]` union `[[compacted]]` in the validator, and give `check` a `duplicate-id` verdict so the condition is visible rather than silent.'''
