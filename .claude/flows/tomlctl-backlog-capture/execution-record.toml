[[items]]
id = "E17"
type = "deviation"
date = 2026-09-01
agent = "implement"
task_ref = "implement-the-evidence-directory-policy-module"
summary = "The no-backslash acceptance is unsatisfiable on Windows for an absolute PathBuf; replaced with a component-wise ends_with plus a full-literal relativised equality"
original_intent = "Task 28's Acceptance asserts that dir_for of B-a1b2c3d4 ends .claude/backlog-evidence/B-a1b2c3d4 and contains no backslash."
rationale = "TOMLCTL_ROOT canonicalises to a verbatim device prefix on Windows and PathBuf::join uses the platform separator, so an absolute path necessarily contains backslashes. Asserting the absence of a backslash on the relativised string instead would be VACUOUS, because io::relativise replaces every backslash unconditionally. Replaced with two falsifiable assertions: a component-wise ends_with following the schema.rs backlog_path test's precedent, and a full-literal equality on io::relativise output. The substantive guarantee is enforced in code instead - dir_for rejects any item_id that is not a single path component, which also blocks a merge-mangled parent-directory row from walking the join out of .claude/ before guard_write_path sees it."
dedup_id = "17112e3e60b2d34a"

