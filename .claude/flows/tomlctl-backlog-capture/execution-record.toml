[[items]]
id = "E15"
type = "deviation"
date = 2026-09-01
agent = "implement"
task_ref = "implement-content-derived-ids-and-the-backlog-fingerprint"
summary = "Task 4's Action and Detail specify contradictory id-widening tie-breaks; the total order was implemented and Task 6 gains a re-derive obligation"
original_intent = "Task 4's Action says derive_id widens when an existing item already holds that id with a different dedup_id, which means the incumbent keeps the short id. Its Detail and the Approach section instead say the widening tie-break is a total order over dedup_id, the lexicographically smaller keeping the short id, never insertion order."
rationale = "The two rules cannot both hold. If the larger fingerprint is minted first into an empty store it takes the short id, but by the total order a smaller fingerprint arriving later is the rightful owner; incumbent-keeps makes the pair's assignment depend on mint order, which is the cross-worktree divergence User Decision 1 exists to remove. The total order was implemented, since the Detail states it twice. Consequence and caller obligation: derive_id can now return an id an incumbent currently holds, so Task 6 (backlog add) MUST re-derive the id of any stored row whose dedup_id shares the new row's 8-hex prefix before writing, or the append trips schema::validate_ids_unique. The collision set is computable from existing_dedup_ids; the case is astronomically rare at 32 bits of prefix. Recorded in the ids.rs module doc and to be handed to Task 6's dispatch."
dedup_id = "96cc90f81cf81560"

