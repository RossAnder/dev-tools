summary = "The plan's curly-apostrophe acceptance case does not discriminate the byte pipeline from str::to_lowercase; an accented-letter case was added as the real guard"
original_intent = "Task 3's Acceptance asserts that a summary containing a non-ASCII character (a curly apostrophe) normalises identically under repeated application, described as pinning the ASCII byte path against str::to_lowercase."
rationale = """Falsified in-editor: swapping the byte pipeline for str::to_lowercase plus char::is_alphanumeric leaves the curly-apostrophe case PASSING, because U+2019 is non-alphanumeric under either reading and the whitespace collapse hides the byte-count difference. The plan's case is satisfiable by exactly the implementation the Detail forbids. The prescribed case was kept, and non_ascii_letters_are_dropped_not_lowercased (normalise("Cafe latte" with an accented e) == "caf latte") added alongside it - a char pipeline yields the accented form and fails. Task 4 should use the accented-letter case, not the apostrophe case, as the dedup_id regression guard, and references/backlog.md should state the rule as non-ASCII letters are dropped, not transliterated."""
