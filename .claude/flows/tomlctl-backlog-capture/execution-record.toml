date = 2026-09-01
agent = "implement"
task_ref = "implement-the-evidence-directory-policy-module"
summary = "referenced_names required a filename-shape rule the Action does not name, or every prose word in context would become a referenced-missing finding"
original_intent = "Task 28's Action describes referenced_names as extracting bare filenames from an item's context and evidence[], with two exclusions - a token containing / is a repo path and one matching ...:<digits> is the path:line source-pointer form."
rationale = "Those two exclusions alone accept every ordinary prose word in context (The, overlap, visible), and Task 29 turns each returned name into a referenced-missing finding, so the audit would emit a wall of false positives. Added a filename-shape requirement: non-empty stem, filename-safe charset, and a 2-8 character alphanumeric extension containing at least one letter. Two consequences Task 29's author must know: an extensionless evidence file cannot be detected as an inline reference (it is still flaggable in the directory via EVIDENCE_EXTENSIONS), and a prose token shaped like a filename such as Node.js is treated as a reference. Separately, EVIDENCE_EXTENSIONS membership was chosen from the artefact classes the plan's prose names, since the plan specifies only .pem as an example of what must be flagged."
