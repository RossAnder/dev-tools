task_ref = "implement-tomlctl-flow-stale"
summary = "T5 used jiff::civil::Date directly; convert::maybe_date_coerce was the wrong direction (JSON→TOML, not TOML→Date)"
original_intent = "Plan T5 detail said to parse the TOML date via the existing convert::maybe_date_coerce path"
rationale = "convert::maybe_date_coerce coerces a JSON string into a TOML datetime — wrong direction for staleness arithmetic, which needs to compare a TOML datetime against today as a Date. Plan explicitly named jiff's Date as an acceptable alternative (`or use jiff's Date`); T5 went with that. No semantic change."
commits = ["5ee8c9d"]
dedup_id = "27808441d299bb8a"

