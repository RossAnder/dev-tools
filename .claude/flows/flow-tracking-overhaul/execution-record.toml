[[items]]
id = "E11"
type = "deviation"
date = 2026-05-08
agent = "implement"
task_ref = "implement-tomlctl-flow-active"
summary = "T3 expanded io::mutate_doc inline in active.rs to add a missing-file branch"
original_intent = "Plan T3 detail said all upserts MUST go through io::mutate_doc or mutate_doc_conditional"
rationale = "mutate_doc calls read_toml which errors kind=not_found on a missing file, but the plan also requires `add` to bootstrap a fresh registry on the first invocation (.claude/active-flow.toml is gitignored — fresh clones never have it). T3 expanded mutate_doc inline with a missing-file branch (empty_doc() instead of read_toml(file)?); the rest of the pipeline — guard_write_path, with_exclusive_lock, in-lock recheck_claude_containment, write_toml_with_sidecar — is byte-identical to mutate_doc. The TOCTOU contract (lock-held read+write window) is preserved. No raw fs::write in the upsert path. Recommendation for a future task: factor a mutate_doc_or_bootstrap helper into io.rs."
commits = ["5ee8c9d"]
dedup_id = "a0c794a97ff93cb5"

