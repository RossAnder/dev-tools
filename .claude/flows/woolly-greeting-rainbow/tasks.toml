Behaviour as in Approach, **B-09e5fdea**. `except` is the `(session_id, agent_id)` the event targets. The closure persists when `persist` is true or `reap` returned more than 0. When the event itself changes nothing, `record()` still reports the event's own outcome. Tests (with `mtime_of` injected):
