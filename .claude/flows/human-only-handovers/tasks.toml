[[items]]
id = 1
ref = "reshape-the-handover-record-and-its-write-verb"
title = "Reshape the handover record and its write verb"
effort = "L"
status = "done"
checkpoint = "A"
phase = ""
phase_depth = 0
heading_depth = 3
files = [
    "tomlctl/src/plan/schema.rs",
    "tomlctl/src/plan/records.rs",
    "tomlctl/src/cli/types/plan.rs",
    "tomlctl/src/cli/mod.rs",
    "tomlctl/src/plan/dispatch.rs",
    "tomlctl/src/plan/approve.rs",
    "tomlctl/src/plan/view.rs",
]
needs = []
coupling = []
deps_note = ""
action = "Replace the handover's `command` with `reason`, `action`, `when` and `done_when`, raise the plan store's schema version to 2, and replace `plan handover add` with `plan handover set --ndjson`."
detail = """
The record shape, the six reasons and their meanings are design/handover.md#reasons and design/handover.md#shape (docs/flows/human-only-handovers/design/handover.md).

schema.rs: add a `HandoverReason` vocabulary (restart, permissions, attended, observe, credentials, external) with the `vocabulary!` macro the other enums use. `Handover` becomes `id`, `reason: Option<HandoverReason>`, `action`, `when`, `done_when`, `source_task`, `done`. On read, an absent or empty text key is an empty string and an absent `reason` is None, so `plan check` (task 2) reports it rather than the read refusing; an unknown `reason` value is refused, as for the other vocabularies. Write keys in the order id, reason, action, when, done_when, source_task, done, omitting an empty text key and an absent reason. Set `SCHEMA_VERSION` to 2 and make `to_toml` write `SCHEMA_VERSION`, not the version read from disk, so every write upgrades the store. Update the fixture and unit tests in this file (the required-key and quoted-flag cases, and the `Handover` literal in the id-reuse test) to the new shape, and add a test that a store read at version 1 is written back at 2.

records.rs, cli/types/plan.rs and cli/mod.rs: replace `PlanHandoverOp::Add` and `PlanHandoverAddArgs` with `Set` and `PlanHandoverSetArgs`, which take `--ndjson` exactly as `PlanContractArgs` does, and change the name in cli/mod.rs's `pub(crate) use types::{...}` re-export list. `handover_set` mirrors `contract`/`upsert_contract`: a row without `id` mints `H<n>` and needs a non-empty `action` and a `source_task`; a row with `id` updates only the keys it carries, refuses an empty `action` as `upsert_contract` refuses an empty `claim`, and is refused when no handover has that id. Accepted keys: id, reason, action, when, done_when, source_task. A `done` key is refused with a message naming `plan handover done`. Prints `{"ok":true,"ids":[...]}`. `handover_done` is unchanged. dispatch.rs routes `Set`.

approve.rs and view.rs: change each read of `h.command` / `handover.command` to `action` so the crate compiles; task 3 reshapes their output."""
acceptance = ""
agent = "plan-worker-deep"
commit = "0f385a846e66df3fab583805ba526591e70acc78"

