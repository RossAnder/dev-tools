vetoed = false

[[decision.rejected]]
option = "A new flow-contract-handover skill"
because = "no fence or carrier points at it, so review cells would never read it (format-contract.md reads only the format contract)"

[[decision.rejected]]
option = "Human steps as task rows with a human executor"
because = "rows feed tasks ready and dispatch, so a human row would block the frontier"

[[decision]]
id = "D3"
decision = "Reshape `[[handover]]` to `id`, `reason`, `action`, `when`, `done_when`, `source_task`, `done`, dropping `command`. `reason` takes one of restart, permissions, attended, observe, credentials, external; an unknown value is refused on read and write, and an absent or empty text field reads as empty so plan check reports it."
why = "A runnable command is the kind of step an agent should perform; what reaches a person needs what to do, when, how to tell it is done, and why only a person can do it."
provenance = "agent-assumed"
door = "two-way"
binds = [
    "tomlctl/src/plan/schema.rs",
    "1",
    "7",
    "11",
    "12",
]
evidence = "notes/after-merge-corpus.md: the human residue was session restarts, permissions or elevation, attended interactive checks and judgement over time; credentials and external systems are kept for repos outside this corpus"
if_false = "the record keeps `command` and the extra facts live in prose the check cannot read"
revisit_if = "a real human-only step fits none of the six reasons"
check = ""
surfaced = false
vetoed = false

[[decision.rejected]]
option = "Keep `command` and add fields beside it"
because = "the name invites a shell command, which is the agent-performable step the intent removes"

[[decision.rejected]]
option = "Free-text reason"
because = "a closed list is what makes the author justify the step; the corpus fits six reasons with none left over"

[[decision]]
id = "D4"
decision = "Raise the plan store's SCHEMA_VERSION to 2 and stamp the current version on every write."
why = "The store drops unknown keys on write, so an older tomlctl rewriting a plan.toml with the new handover keys would lose them silently; a newer version makes it refuse instead."
provenance = "agent-assumed"
door = "two-way"
binds = [
    "tomlctl/src/plan/schema.rs",
    "1",
]
rejected = []
evidence = "read schema.rs: to_toml rebuilds from the struct and writes the schema_version read from disk; the guard refuses only a newer version. No plan.toml in the repo holds a handover."
if_false = "the version stays 1 and an old binary can drop handover fields without error"
revisit_if = ""
check = ""
surfaced = false
vetoed = false

[[decision]]
id = "D5"
decision = "Replace `plan handover add` with `plan handover set --ndjson <src>`, an add-or-update keyed on `id` in the shape `plan contract` takes; keep `plan handover done <id>`, and refuse `done` as a key in a set row."
why = "Without an update path the only repair for a bad handover is add-new then mark-old done, which records a step the user never performed."
provenance = "agent-assumed"
door = "two-way"
binds = [
    "tomlctl/src/plan/records.rs",
    "tomlctl/src/cli/types/plan.rs",
    "1",
    "4",
]
evidence = "read records.rs handover_add/handover_done and upsert_contract; stage.rs HANDOVER_REPLACE"
if_false = "flags are added to `add` and a separate `update` verb is written"
revisit_if = ""
check = ""
surfaced = false
vetoed = false

[[decision.rejected]]
option = "Keep `add` with more flags"
because = "it still has no update, and stage.rs's add-then-done remedy would mark fixes as performed"

[[decision]]
id = "D6"
decision = "Add one error class, `plan/handover-incomplete`, raised for an undone handover with an empty reason, action, when or done_when and naming the empty keys; skip done handovers as today. Route it and `plan/handover-task-unknown` in plan stage to `plan handover set` with the handover's id."
why = "plan approve already refuses on any error-severity finding, so one class blocks approval with no change to approve.rs; done handovers stay skipped so `plan approve --amend` is not blocked by history."
provenance = "agent-assumed"
door = "two-way"
binds = [
    "tomlctl/src/plan/check.rs",
    "tomlctl/src/plan/stage.rs",
    "2",
    "5",
]
evidence = "read approve.rs refuse_check_errors (filters by severity), check.rs contract_findings (the Vec shape)"
if_false = "an incomplete handover reaches the approval screen unflagged"
revisit_if = ""
check = ""
surfaced = false
vetoed = false

[[decision.rejected]]
option = "One class per missing field"
because = "four classes to document and route for one fix"

[[decision]]
id = "D7"
decision = "Show undone handovers on the approval screen as their own `handovers` array carrying every field, leaving `stops` to milestone gates; carry every field in the digest's `open_items.undone_handovers` and the markdown view's handover line."
why = "A human step after landing is not something that stops the run, and the screen must show its reason, when and done-when."
provenance = "agent-assumed"
door = "two-way"
binds = [
    "tomlctl/src/plan/approve.rs",
    "tomlctl/src/plan/view.rs",
    "claude/skills/plan-v2-engine/references/approve.md",
