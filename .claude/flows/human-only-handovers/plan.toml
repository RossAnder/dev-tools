[[decision]]
id = "D1"
decision = "Apply the human-only rule to v1 as well: rewrite the After Merge template and Format rules in flow-contract-plan-output-format, and the restatements in /plan-new Phase 5 and /implement Phase 4, enforced by the format contract and the plan-review lenses rather than by a tomlctl parser."
why = "/plan-new is still how plans are written until the v2 pipeline is complete, so leaving v1 alone leaves every upcoming plan with the noisy list; a parser would be Rust spent on a format that is being retired."
provenance = "user-confirmed"
door = "two-way"
binds = [
    "claude/skills/flow-contract-plan-output-format/SKILL.md",
    "claude/commands/plan-new.md",
    "claude/commands/implement.md",
    "8",
    "9",
]
rejected = []
evidence = "notes/after-merge-corpus.md: 35 of 55 v1 bullets were agent work, seeded by the template examples at SKILL.md:206-211 and repeated at plan-new.md:108 and implement.md:330; no tomlctl code reads After Merge (structure-challenge note)."
if_false = "v2 only: the v1 template, /plan-new and /implement stay as they are, and only the review lenses change (they review v1 plans too); or v1 also gets a tasks import-plan check for After Merge bullets, adding Rust tasks."
revisit_if = ""
check = ""
surfaced = true
vetoed = false

[[decision]]
