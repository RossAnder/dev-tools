[[decision]]
id = "D8"
decision = "Give each agent-performable kind of post-landing work a home in the run, and say so in both plan contracts: an in-repo edit, deletion or housekeeping step is a task; an install, deploy or link into the Claude config dir is an `install:` key under v1 Verification Commands, or a gate on the last v2 milestone, run by the verification agent after the suite; a predicted criterion is a check run at the final pass; a memory note the work makes stale is updated by the orchestrator at its report step; follow-on work, trials and next plans are backlog captures, never post-landing steps."
why = "These are 35 of 55 past After Merge bullets; each kind already has an agent who can do it, and builds stay with the orchestrator's verification agent per the build-discipline rule."
provenance = "agent-assumed"
door = "two-way"
binds = [
    "claude/skills/flow-contract-plan-output-format/SKILL.md",
    "claude/commands/implement.md",
    "claude/skills/plan-v2-engine/references/write-and-prove.md",
    "8",
    "9",
    "11",
    "12",
]
evidence = "notes/after-merge-corpus.md class counts; CLAUDE.md Build discipline; implement.md Phase 3 runs the verification agent over an ordered command list and Phase 4 already harvests backlog"
if_false = "agent work keeps landing in After Merge"
revisit_if = "an install fails at the gate because a running glimpse holds its exe; then the residue is a restart handover"
check = ""
surfaced = false
vetoed = false

[[decision.rejected]]
option = "Installs as ordinary tasks"
because = "a sub-agent running cargo install is a full build, which CLAUDE.md's build discipline reserves for the orchestrator"

[[decision]]
