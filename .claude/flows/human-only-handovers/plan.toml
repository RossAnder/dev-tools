decision = "In v1, write each After Merge bullet as `- **<reason>**: <one action>. **When:** <trigger>. **Done when:** <observable result>.` with the same six reasons, `_None._` the expected case, and the rule stated in the Format rules block so the review fence reads it."
why = "One shape for v1 and v2 lets a person act on a bullet without reading the plan; the fence reads only Format rules."
provenance = "agent-assumed"
door = "two-way"
binds = [
    "claude/skills/flow-contract-plan-output-format/SKILL.md",
    "claude/skills/review-v2-lenses/checks/format-contract.md",
    "8",
]
rejected = []
evidence = "format-contract.md read line covers the Format rules block to end of file; notes/after-merge-corpus.md lists 12 bundled bullets and 14 with no trigger or done condition"
if_false = "v1 keeps free-form bullets"
revisit_if = ""
