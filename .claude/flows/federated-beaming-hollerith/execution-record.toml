id = "E18"
agent = "implement"
original_intent = "Classify via canonicalize_for_write when the file or its parent exists, else fold ./.. lexically"
rationale = "canonicalize_for_write is private to io.rs (outside the task files) and can fail on outside-.claude and symlink checks, which a pure classifier must never do. A local resolver canonicalises the file itself, else the deepest existing ancestor, and folds the remainder lexically, so a junctioned .claude is caught even when flows/<slug>/ does not exist yet."
