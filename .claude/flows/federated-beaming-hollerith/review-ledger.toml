[[items]]
id = "R1"
first_flagged = 2026-10-21
rounds = 1
status = "fixed"
flow = "federated-beaming-hollerith"
file = "tomlctl/src/store_guard.rs"
line = 71
symbol = "resolve"
severity = "warning"
effort = "small"
category = "security"
summary = "Owned-store guard is bypassed when .claude is a junction or symlink to a differently named directory"
description = '''refuse_owned_store classifies resolve(path), which canonicalises; when <repo>/.claude is a junction to e.g. D:\shared-data, the canonical path's trailing components are shared-data/backlog.toml, so classify (which matches the literal component `.claude`) lets the write through. The containment guard canonicalises .claude too, so no --allow-outside is needed. The module doc (store_guard.rs:3-5) and the plan's Owned-store guard section both claim a junctioned .claude cannot slip past. Fix: also classify the absolute, lexically folded path (the fold helper exists) and refuse when either matches; add a junction/symlink case to tests/store_guard.rs. Extra refusals are harmless since --raw-store bypasses. Found independently by the security and quality lenses, each with a probe.'''
evidence = [
    "tomlctl/src/store_guard.rs:55 classify(&resolve(path)); :72 path.canonicalize(); :118-148 literal .claude component match",
    'probe (tomlctl 0.16.0, scratch repo): real .claude dir -> `set .claude/backlog.toml probe x` refused; after `mklink /J .claude ..\shared-data` -> {"ok":true,...} and the store was written',
    "tomlctl/src/io.rs:1667-1673 containment root is claude_dir.canonicalize()",
    "docs/plans/federated-beaming-hollerith.md:113 claims a junctioned .claude cannot slip past",
]
dedup_id = "934f261f8f39e624"
resolved = 2026-10-21
resolution = "uncommitted: refuse_owned_store also classifies the lexically folded absolute path, so a junctioned/symlinked .claude is refused; module doc corrected; junction test added to tests/store_guard.rs"

