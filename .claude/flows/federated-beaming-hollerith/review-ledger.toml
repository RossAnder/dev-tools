summary = "backlog edit writes context/tags/evidence into the tracked backlog without the credential and machine-local-path advisories backlog add emits"
description = "add.rs advisories() scans context, tags and evidence for CREDENTIAL_MARKERS and machine-local paths and reports them on stderr and in the envelope's `advisories`; add_many calls it per row. run_edits/apply_to_row never scan, and the edit envelope has no advisories key. With the owned-store guard now blocking `items update --array backlog`, backlog edit is the only unscanned route to those fields of a public, tracked file. The scanner cannot be reused as-is because it takes &AddRequest. Fix: extract a per-value scanner from add::advisories, call it in run_edits over edited values (live and --dry-run), add `advisories` to the envelope, a test in tests/backlog_edit.rs, and a line in backlog-edit.md. Found by the security and architecture lenses."
evidence = [
    "tomlctl/src/backlog/add.rs:437 CREDENTIAL_MARKERS; :469-499 advisories; :240 result key",
    "tomlctl/src/backlog/dispatch.rs:118-165 run_edits: result keys ok, path, rows (dry_run)",
    'probe (tomlctl 0.16.0): add with context "token ghp_abc123" prints an advisory; edit --context "token ghp_zzz999 and C:\Users\..." prints none, exit 0',
    "claude/skills/backlog-capture/SKILL.md:216-218 documents the advisory for context, tag and evidence strings",
]
dedup_id = "ef5d91c4966345b0"
resolved = 2026-10-21
resolution = "uncommitted: add.rs field_advisory per-value scanner shared by add and edit; backlog edit emits advisories (stderr + envelope, live and dry-run); test and docs updated"

