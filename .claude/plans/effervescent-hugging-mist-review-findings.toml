anchor_old = "Stack — `vitest` (preferred for modern projects) + `fast-check` (property) + `@vitest/coverage-v8` + `stryker-mutator` (mutation, opt-in). Note jest fallback for legacy projects. CI snippet for both pnpm and npm."
anchor_new = "Stack — `vitest` (preferred for modern projects; **pin a target major in the scaffolded config** — recommend `vitest@^3` for stability or `^4` for greenfield. Vitest v4 removed `coverage.all` and rewrote V8 coverage remapping → coverage numbers shift between v3 and v4; v3 renamed `VITE_NODE_DEPS_MODULE_DIRECTORIES` → `VITEST_MODULE_DIRECTORIES`; v2 flipped pool default to `forks`; v1 dropped Node <18) + `fast-check` (property) + `@vitest/coverage-v8` (must match vitest major; **scaffolded config MUST set `coverage.include` explicitly** — mandatory in v4, otherwise coverage drops can flip the 80%/90% gates on a clean dependency upgrade) + `stryker-mutator` (mutation, opt-in). Note jest fallback for legacy projects. CI snippet for both pnpm and npm."
summary = "TS reference must pin a vitest major and pre-populate `coverage.include` — vitest v3→v4 changes flip CI gates without code changes"
description = "Vitest v4 (a) removed `coverage.all`, (b) defaults to 'include only covered files' — without `coverage.include` set, every project upgrading to v4 sees coverage numbers shift, potentially dropping below the 80% line / 90% changed-lines gates the bootstrap installs; (c) removed reporter callback APIs (onCollected/onSpecsCollected/onPathsCollected/onTaskUpdate/onFinished). Plan currently says only 'vitest (preferred for modern projects)' — version-agnostic, no coverage.include baseline."
