plan_section = "### Composition design (validated by Plan agent)"
anchor_old = "- **RED**: capture `red_test_fingerprint = sha256` over project test glob → invoke `test-author` skill → run tests → require `outcome=fail` for the new test → commit `red: <cycle-slug>`."
anchor_new = "- **RED**: capture `red_test_fingerprint = sha256` over project test glob (excluding generated snapshot artifacts: `**/__snapshots__/**`, `*.snap`, `*.snap.*`, `**/snapshots/**`, `*.snapshot`, `.snap.new`) — capture POST-COMMIT from the just-recorded `red:` commit's tree (via `git ls-tree -r red-commit -- <test-glob> | sha256sum`), NOT pre-commit from the working tree → invoke `test-author` skill → run tests → require `outcome=fail` for the new test → commit `red: <cycle-slug>`. Canonical fingerprint pipeline (single source of truth, cited from Task 7 Detail): `git ls-tree -r <red-commit> -- <test-glob> | sha256sum | awk '{print $1}'`. Per-language test-globs: rust `tests/**/*.rs` + `src/**/*.rs:#[cfg(test)]`; python `tests/**/*.py` + `**/test_*.py`; ts `**/*.test.{ts,tsx}` + `__tests__/**`; go `**/*_test.go`. Globs persisted in cycle sub-flow's context.toml so GREEN re-runs against the same set."
summary = "Anti-cheat fingerprint: glob undefined, snapshot artifacts not excluded (jest/vitest/insta will trip false positives), pre-vs-post-commit timing unspecified — three failure modes on the load-bearing mechanism"
description = "Compound finding from Agents 1 + 3 + 4. Agent 1 noted the glob is undefined. Agent 3 noted three valid pipelines have different rename-stability semantics — the choice belongs in the plan. Agent 4 noted snapshot artifacts (jest __snapshots__/, insta .snap.new, vitest inline) regenerate during normal test execution and would falsely trip anti-cheat. Combined: pick post-commit `git ls-tree`-based pipeline, exclude snapshot artifacts, persist the glob in cycle sub-flow."
status = "merged"

