anchor_new = "**/implement skip-list collision (post-copy-up variant)** — `/implement` Phase 2 (`claude/commands/implement.md:331-333`) builds the skip-list from the resolved flow's `execution-record.toml` via `tomlctl items list <record> --where type=task-completion --where status=done --pluck task_ref`. The current 'separate file' mitigation only holds during cycle execution; the moment Approach line 100 copies cycle entries up into the parent's record, copied `task_ref`s pollute the parent's skip-list AND cycle `E1..En` IDs collide with parent's already-minted `E*` IDs. **Mitigation**: on copy-up, /tdd MUST (a) prefix `task_ref` to `tdd-cycle-<NNN>-<original>` so no parent task slug collides; (b) re-mint `E`-prefix IDs against `tomlctl items next-id <parent-record> --prefix E` to avoid double-IDs (which would violate the schema's monotonic-ID contract). Documented in tdd.md."
summary = "Risk #3's 'separate file' mitigation collapses on copy-up to parent (Approach line 100); needs task_ref prefixing + E-ID re-minting"
description = "Approach line 100 explicitly copies cycle entries into parent's execution-record. That parent record is what /implement queries (implement.md:331). After copy-up, a parent /implement run whose plan has a task whose slug matches the cycle's task_ref silently skips it. Plus: next-id --prefix E is monotonic per file — cycle starts at E1, copying E1 into a parent that already has E1 produces duplicate IDs."
status = "merged"
dedup_id = "dcfd0c083886d710"

