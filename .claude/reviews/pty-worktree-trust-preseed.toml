category = "security"
summary = "Atomic rewrite recreates ~/.claude.json at umask default (0644 on Unix), downgrading a credential file's permissions"
description = "std::fs::write creates the sibling temp at the process umask default (~0644), then rename makes it the new ~/.claude.json (which holds OAuth tokens + MCP config, plausibly 0600). After the first per-worktree rewrite the file -- and the briefly-resident temp holding the same secrets -- is world-readable to other local users on a shared Unix host / Linux CI executor. Windows (USERPROFILE ACL) is unaffected, so this is Unix-with-other-local-users only. Fix: under cfg(unix), set the temp's mode to 0600 (or stat+copy the original's mode) before rename."
evidence = ["trust.rs:271-278 std::fs::write default perms, no set_permissions; Unix-only"]
dedup_id = "37f4916164970d55"
resolved = 2026-06-30
resolution = "write_temp_private creates the temp at mode 0600 under cfg(unix) before writing secret bytes (never world-readable); non-unix path unchanged"

