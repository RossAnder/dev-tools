file = "lumina/server/src/pty/trust.rs"
line = 134
symbol = "ensure_dir_trusted_at"
severity = "warning"
effort = "medium"
category = "security"
summary = "Lock-free read-modify-write of ~/.claude.json can lose concurrent writers' updates"
description = "ensure_dir_trusted_at reads the whole store (L104), mutates in memory, and renames a stale snapshot back over the file (L134) with no lock across the window. Two concurrent spawn_pty_session_internal calls into different fresh worktrees each read the same snapshot and the second rename drops the first's hasTrustDialogAccepted (re-surfacing the dialog the seed exists to suppress); against an external claude process refreshing OAuth/history/costs wholesale, lumina's rename silently reverts that write. The atomic rename prevents torn files, not lost updates. Fix: serialise read->write behind a process-global Mutex and re-read immediately before rename to narrow the external-claude window; document the residual cross-process race (claude itself does not lock)."
evidence = ["trust.rs:104,134 no lock across read->write; independently found by security + architecture lenses"]
dedup_id = "94e84b6e69e061f4"
resolved = 2026-06-30
resolution = "Added a process-global static Mutex held across the whole ensure_dir_trusted_at read-modify-write so concurrent spawns cannot lost-update the trust store; documented the residual cross-process race"

