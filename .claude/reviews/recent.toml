description = '''Phase 2 step 5b validates `files[]` paths (rules 1-3) but `task_ref`, `summary`, `rationale`, and similar free-text fields flow into the heredoc-fed JSON via tomlctl --json - / --ndjson - patterns. The single-quoted heredoc delimiter (`<<'EOF'`) prevents shell variable expansion (so shell injection is not the concern), but `}`, `\`, unescaped `"`, or raw newlines inside agent-produced strings could break the JSON structure of the payload. Spec doesn't mandate JSON-safe sanitisation. Add: `before assembling the heredoc payload, JSON-encode all free-text fields (escape \", \\, \n).`'''
