description = "In situ the binary is silent by design: a bad main payload renders Claude, a bad subagent payload renders nothing, and teamdata::load degrades quietly at seven points. A missing badge is therefore indistinguishable from no teammates, a wrong CLAUDE_CONFIG_DIR, a sanitize mismatch (R5), or the settings-snapshot gate that needs a Claude Code restart. --columns only helps once you already hold the payload, and there is no way to obtain it. Cheapest high-leverage affordance: a STATUSLINE_DUMP=<path> env var checked before rendering, writing stdin verbatim — two lines on a cold branch, no hot-path cost, and every field report becomes a deterministic offline repro. A --doctor flag printing the resolved subagents dir, claude dir, meta-parse count and column source to stderr (never stdout, which is the row protocol) is the natural companion."
evidence = [
    "main.rs:47 read_to_string result discarded, input unrecoverable",
    "main.rs:57 a subagent parse failure produces no output, no stderr, and exit 0",
    "teamdata.rs:107-131 seven silent degradation points, one observable outcome",
]
