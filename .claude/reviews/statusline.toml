summary = "Foreign-repo filter.<driver>.clean/.process is still an execution path that fixed-argument flags cannot neutralise"
description = "Surfaced while applying R3 and deliberately left outside its cited set. R3 closed diff.external, textconv and core.fsmonitor with fixed flags, but git diff HEAD runs worktree content through the configured clean filter, and the driver NAME comes from the target repo's own .gitattributes - so there is no fixed argument that disables it. Suppressing it properly means enumerating the foreign repo's config keys and overriding each, which is a scope expansion into config parsing. Only matters if the threat model includes pointing the statusline at untrusted trees. Note core.hooksPath was assessed and deliberately left alone: post-index-change is the only hook git diff can reach and --no-optional-locks already suppresses the index write that fires it."
first_flagged = 2026-08-18
rounds = 1
related = ["R3"]
status = "fixed"
dedup_id = "23a2f3d0dd553d9b"
