resolution = "Verified against current git diff-options documentation that no fixed argument can close the clean-filter path - only --no-ext-diff and --no-textconv exist and both are already passed - so the residual risk, its threat model and the core.hooksPath assessment are recorded on DIFF_ARGS_POST instead. Documentation-only: the execution path remains open, and closing it needs a config-enumeration layer"

