resolved = 2026-08-18
resolution = "inbox_count now reads through the same capped reader (new MAX_INBOX_BYTES = 256KB) and counts via Vec<serde::de::IgnoredAny>, so message bodies are discarded during parse instead of allocated once per member per tick"

