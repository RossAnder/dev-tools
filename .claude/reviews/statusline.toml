summary = "Untimed git subprocess on the default style's hot path — measured ~280ms per tick, ~15x the teamdata disk I/O"
description = "Merged from three lenses and confirmed by measurement. statusline min = 39.8ms/run, subagent (teamdata: readdir + 11 meta + inbox reads) = 59.1ms/run, full (spawns git) = 319.4ms/run in this repo. full is the unflagged default and show_changes is cols >= 100 against a default of 120, so this is the common path. Three separate problems: (a) Command::output() has no timeout anywhere in the crate, so a blocked git hangs the render with no fallback — the one failure mode that is a hang rather than an Err; (b) missing --no-optional-locks, so each tick refreshes the index and contends for index.lock with the user's own git; (c) git diff honours diff.external / diff.<driver>.textconv / core.fsmonitor from the target repo's own config, so pointing the statusline at a tree that ships its own .git executes a program that tree chose."
evidence = [
    'git.rs:45-47 Command::new("git").args([...]).output().ok()?',
    "full.rs:69 show_changes = cols >= 100",
    "measured: full 319.4ms vs min 39.8ms per run",
    "https://git-scm.com/docs/git --no-optional-locks",
]
dedup_id = "e7438c2d1516c6c6"
resolved = 2026-08-18
resolution = "Bounded diff_stats with a std-only 1s thread+mpsc timeout (kill/reap, silent None fallback) and hardened the invocation with --no-optional-locks, -c core.fsmonitor=, --no-ext-diff, --no-textconv; flag names and positions verified against current git docs and a live git 2.55 run. Residual filter.<driver>.clean exec path filed as R60"

