# Shared-block parity manifest.
# Each block must be byte-identical across all listed files.
# Consumed by scripts/verify-shared-blocks.sh.
#
# Migration policy (progressive-disclosure overhaul, started 2026-05-19):
#   Carriers are progressively externalising shared blocks into
#   claude/skills/flow-contract-*/SKILL.md. As each carrier migrates,
#   its entry is removed from the affected block's `files` list. When
#   a block's `files` list becomes empty, the entire `[[block]]` entry
#   is deleted — the verifier becomes vacuous for that contract.
#   Pilot carrier: claude/commands/review.md (removed from 4 blocks).
#
# Carrier-list scope rule (re asymmetry between flow-context and
# vet-flow-research below):
#   - flow-context covers ONLY flow-resolving carriers — commands that
#     read .claude/active-flow.toml and operate inside a flow lifecycle
#     (plan-new, plan-update, implement, review, optimise, review-plan,
#     review-apply, optimise-apply, tdd).
#   - vet-flow-research covers carriers that fan out research agents and
#     vet their output. test-bootstrap is intentionally a vet-flow-research
#     carrier (Phase 2.5 vets agent output) but is intentionally NOT a
#     flow-context carrier: /test-bootstrap is not flow-aware (see the
#     opening note in claude/commands/test-bootstrap.md — it does not read
#     .claude/active-flow.toml and does not participate in the plan/
#     implement/review lifecycle). The two lists are therefore not subsets
#     of each other by design; do not "rationalise" them by aligning
#     coverage.

[[block]]
name = "flow-context"
# Flow-resolving carriers only — see carrier-list scope rule at top of file.
# review.md migrated to claude/skills/flow-contract-flow-context/SKILL.md (2026-05-19).
files = [
  "claude/commands/optimise.md",
  "claude/commands/optimise-apply.md",
  "claude/commands/review-apply.md",
  "claude/commands/plan-new.md",
  "claude/commands/plan-update.md",
  "claude/commands/implement.md",
  "claude/commands/review-plan.md",
  "claude/commands/tdd.md",
]

