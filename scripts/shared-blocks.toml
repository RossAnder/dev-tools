# Shared-block parity manifest.
# Each block must be byte-identical across all listed files.
# Consumed by scripts/verify-shared-blocks.sh.
#
# Migration policy (progressive-disclosure overhaul, started 2026-05-19):
#   Carriers progressively externalised their shared blocks into
#   claude/skills/flow-contract-*/SKILL.md (and the apply-* skills). As each
#   carrier migrated, its entry was removed from the affected block's `files`
#   list; when a block's `files` list became empty, the entire `[[block]]`
#   entry was deleted — the verifier becomes vacuous for that contract.
#
#   Wave 2 (2026-05-20) migrated the final command carriers
#   (optimise, optimise-apply, review-apply, plan-update, test-bootstrap),
#   which emptied and removed every remaining command-block:
#   flow-context, ledger-schema, execution-record-schema,
#   apply-dependency-sort, apply-rollback-protocol, apply-constraints,
#   ledger-disposition-sweep, apply-vet-implement-lite,
#   vet-research, and plansdirectory-prompt.
#
#   No command carrier survived that wave. Every `[[block]]` below spans
#   files of another kind — implement agents, or Rust sources — which is why
#   they were untouched by the migration.

[[block]]
name = "forbidden-working-tree-ops"
files = [
  "claude/agents/implement-deep.md",
  "claude/agents/implement-lite.md",
]

[[block]]
name = "backlog-candidates"
files = [
  "claude/agents/implement-deep.md",
  "claude/agents/implement-lite.md",
]

# Rust carriers rather than markdown: the bin crate's `#[cfg(test)]` module and
# the integration-test helper cannot import from each other, so the fixture is
# duplicated and held byte-identical here instead. Markers sit inside `/* … */`
# so each is a whole line the verifier can match.
[[block]]
name = "shipped-gitignore"
files = [
  "tomlctl/src/test_support.rs",
  "tomlctl/tests/common/mod.rs",
]
